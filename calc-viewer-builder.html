            node.classList.toggle("cv-on", i === active);
            node.setAttribute("aria-selected", String(i === active));
          });
          if (active >= 0) {
            propertyInput.setAttribute("aria-activedescendant", nodes[active].id);
            nodes[active].scrollIntoView({ block: "nearest" });
          } else propertyInput.removeAttribute("aria-activedescendant");
        }
        function showSuggestions() {
          if (propertyInput.disabled) return;
          const found = ruleProperties(entries, propertyInput.value);
          items = found.items;
          const nodes = items.map((entry, i) => {
            const item = el("div", "cv-suggest-item");
            item.id = "cv-rule-suggest-" + uid + "-" + i;
            item.setAttribute("role", "option");
            item.setAttribute("aria-selected", "false");
            item.dataset.key = entry.key;
            item.append(el("span", "cv-suggest-label", entry.label));
            if (entry.group) item.append(el("span", "cv-suggest-group", entry.group));
            // pointerdown + preventDefault: picked before the input's blur hides the list (as the reference)
            item.addEventListener("pointerdown", (event) => {
              event.preventDefault();
              choose(entry);
            });
            return item;
          });
          if (found.more) nodes.push(el("div", "cv-suggest-more", "+" + formatCount(found.more) + " mehr"));
          suggestions.replaceChildren(...nodes);
          // no match: no list (as ref L708)
          suggestions.hidden = !items.length;
          propertyInput.setAttribute("aria-expanded", String(items.length > 0));
          active = -1;
          propertyInput.removeAttribute("aria-activedescendant");
        }
        propertyInput.addEventListener("focus", showSuggestions);
        propertyInput.addEventListener("input", () => {
          chosenKey = null;
          setInvalid(propertyInput, false);
          showSuggestions();
          const exact = findRuleProperty(entries, propertyInput.value);
          if (exact) refreshValues(exact.key);
        });
        propertyInput.addEventListener("blur", hideSuggestions);
        propertyInput.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            if (suggestions.hidden) showSuggestions();
            highlight(active + (event.key === "ArrowDown" ? 1 : active < 0 ? 0 : -1));
          } else if (event.key === "Enter" && !suggestions.hidden && active >= 0) {
            event.preventDefault();
            event.stopPropagation(); // picks the suggestion; does not apply the dialog
            choose(items[active]);
          }
        });
        valueInput.addEventListener("input", () => setInvalid(valueInput, false));
        function syncMode() {
          propertyInput.disabled = mode.value === "text";
          if (propertyInput.disabled) {
            setInvalid(propertyInput, false);
            hideSuggestions();
          }
        }
        mode.addEventListener("change", syncMode);
        syncMode();
        if (chosenKey) refreshValues(chosenKey);

        let open = true;
        function finish() {
          if (!open) return;
          open = false;
          document.removeEventListener("keydown", onKey, true);
          backdrop.remove();
          if (options.returnFocus && options.returnFocus.isConnected) options.returnFocus.focus();
        }
        function onKey(event) {
          if (event.key === "Escape") {
            event.preventDefault(); // handled: Escape closes the dialog only (not the panel, not the 3D selection)
            event.stopPropagation();
            finish();
          } else if (event.key === "Enter" && event.target && event.target.tagName === "INPUT") {
            if (event.target === propertyInput && !suggestions.hidden && active >= 0) return;
            event.preventDefault();
            ok.click();
          }
        }
        document.addEventListener("keydown", onKey, true);
        // pointerdown (as ref L593): the click that follows picking a suggestion may land on the backdrop once the
        // list is gone, and must not close the dialog
        backdrop.addEventListener("pointerdown", (event) => {
          if (event.target === backdrop) finish();
        });
        close.addEventListener("click", finish);
        cancel.addEventListener("click", finish);
        ok.addEventListener("click", () => {
          const isText = mode.value === "text";
          let key = null;
          if (!isText) {
            if (chosenKey) key = chosenKey;
            else {
              const exact = findRuleProperty(entries, propertyInput.value);
              if (exact) key = exact.key;
            }
          }
          const value = valueInput.value.trim();
          setInvalid(propertyInput, !isText && !key);
          setInvalid(valueInput, value === "");
          if ((!isText && !key) || value === "") {
            hideSuggestions();
            (!isText && !key ? propertyInput : valueInput).focus({ preventScroll: true });
            return;
          }
          const rule = { mode: mode.value, key: isText ? null : key, op: operator.value, value };
          finish();
          options.apply(rule);
        });
        mode.focus();
        return { close: finish, element: dialog };
      }

      /** Name shown as title while there is neither a title nor a model (REQ-011 default: first model's Modell). */
      const APP_NAME = "Calc Viewer Builder";

      /**
       * Dialog `Titel, Datum und Logo` (REQ-011, builder). current: { title (set title or null), titleDefault (first
       * model's Modell or ""), date (set date or null), dateDefault (today), logo (data URL or null) }. handlers:
       * { readLogo(file) -> Promise<{ dataUrl } | { error }>, apply({ title, date, logo }) }. An empty title or date
       * field gives null (the default); `Uebernehmen` applies, `Abbrechen` / Escape / the backdrop close unchanged.
       */
      function openHeaderDialog(host, current, handlers) {
        const backdrop = el("div", "cv-backdrop");
        const dialog = el("div", "cv-dialog cv-header-dialog");
        dialog.setAttribute("role", "dialog");
        dialog.setAttribute("aria-modal", "true");
        dialog.setAttribute("aria-labelledby", "cv-header-dialog-title");
        const head = el("div", "cv-dialog-head");
        const heading = el("div", "cv-dialog-title", "Titel, Datum und Logo");
        heading.id = "cv-header-dialog-title";
        const close = iconButton("close", "Schlie\u00dfen", "cv-dialog-close");
        head.append(heading, close);
        const body = el("div", "cv-dialog-body cv-form");

        const titleLabel = el("label", "cv-field");
        const titleInput = el("input");
        titleInput.type = "text";
        titleInput.id = "cv-hdr-title";
        titleInput.maxLength = 200;
        titleInput.value = current.title || "";
        titleInput.placeholder = current.titleDefault || "";
        titleLabel.append(
          el("span", "cv-field-label", "Titel"),
          titleInput,
          el("span", "cv-hint", "Leer: Name des ersten Modells" + (current.titleDefault ? " (" + current.titleDefault + ")" : "") + "."),
        );

        const dateLabel = el("label", "cv-field");
        const dateInput = el("input");
        dateInput.type = "date";
        dateInput.id = "cv-hdr-date";
        dateInput.value = current.date || "";
        dateLabel.append(
          el("span", "cv-field-label", "Datum"),
          dateInput,
          el("span", "cv-hint", "Leer: heute (" + germanDate(current.dateDefault) + ")."),
        );

        const logoField = el("div", "cv-field");
        const preview = el("div", "cv-logo-preview");
        preview.id = "cv-hdr-logo-preview";
        const logoInput = el("input");
        logoInput.type = "file";
        logoInput.id = "cv-hdr-logo";
        logoInput.hidden = true;
        logoInput.accept = ".png,.jpg,.jpeg,.svg,image/png,image/jpeg,image/svg+xml";
        const pick = el("button", "cv-btn cv-small", "Logo w\u00e4hlen");
        pick.type = "button";
        pick.id = "cv-hdr-logo-pick";
        const remove = el("button", "cv-btn cv-small", "Logo entfernen");
        remove.type = "button";
        remove.id = "cv-hdr-logo-remove";
        const logoRow = el("div", "cv-logo-row");
        logoRow.append(preview, pick, remove, logoInput);
        const error = el("p", "cv-field-error");
        error.id = "cv-hdr-error";
        error.setAttribute("role", "alert");
        logoField.append(
          el("span", "cv-field-label", "Logo"),
          logoRow,
          el("span", "cv-hint", "PNG, JPG oder SVG, h\u00f6chstens 1 MB."),
          error,
        );
        body.append(titleLabel, dateLabel, logoField);

        const foot = el("div", "cv-dialog-foot");
        const cancel = el("button", "cv-btn", "Abbrechen");
        cancel.type = "button";
        const ok = el("button", "cv-btn cv-primary", "\u00dcbernehmen");
        ok.type = "button";
        ok.id = "cv-hdr-apply";
        foot.append(cancel, ok);
        dialog.append(head, body, foot);
        backdrop.append(dialog);
        host.append(backdrop);

        let logo = current.logo || null;
        let reading = 0;
        function showLogo() {
          if (logo) {
            const image = el("img", "cv-logo-img");
            image.alt = "Logo";
            image.src = logo;
            preview.replaceChildren(image);
          } else preview.replaceChildren(el("span", "cv-hint", "Kein Logo"));
          remove.disabled = !logo;
        }
        showLogo();

        let open = true;
        function finish() {
          if (!open) return;
          open = false;
          document.removeEventListener("keydown", onKey, true);
          backdrop.remove();
        }
        function onKey(event) {
          if (event.key === "Escape") {
            event.preventDefault(); // handled: Escape closes the dialog only (it does not clear the 3D selection)
            finish();
          } else if (event.key === "Enter" && event.target && event.target.tagName === "INPUT" && !ok.disabled) {
            event.preventDefault();
            ok.click();
          }
        }
        document.addEventListener("keydown", onKey, true);
        backdrop.addEventListener("click", (event) => {
          if (event.target === backdrop) finish();
        });
        close.addEventListener("click", finish);
        cancel.addEventListener("click", finish);
        pick.addEventListener("click", () => logoInput.click());
        remove.addEventListener("click", () => {
          logo = null;
          error.textContent = "";
          showLogo();
        });
        logoInput.addEventListener("change", async () => {
          const file = logoInput.files && logoInput.files[0];
          logoInput.value = "";
          if (!file) return; // cancelled file dialog: nothing changes
          const ticket = ++reading;
          ok.disabled = true;
          error.textContent = "";
          const result = await handlers.readLogo(file);
          if (ticket !== reading || !open) return;
          ok.disabled = false;
          if (result.error) error.textContent = result.error;
          else {
            logo = result.dataUrl;
            showLogo();
          }
        });
        ok.addEventListener("click", () => {
          if (ok.disabled) return;
          const title = titleInput.value.trim();
          finish();
          handlers.apply({ title: title === "" ? null : title, date: dateInput.value || null, logo });
        });
        titleInput.focus();
        return { close: finish, element: dialog };
      }

      /**
       * Builds the one-screen layout of spec 2 User interface into root and returns the parts the app needs: header
       * (logo, title, date, builder buttons), filter area (~280 px), 3D view and table with a splitter (55 / 45 %),
       * details (~320 px, collapsible), status line `X von Y Elementen`.
       */
      export function renderLayout(root, options) {
        const mode = options.mode;
        const handlers = options.filterHandlers;
        const app = el("div", "cv-app");
        app.dataset.core = coreInfo().name;

        const header = el("header", "cv-header");
        const logo = el("div", "cv-logo");
        logo.id = "cv-logo";
        logo.title = "Logo";
        logo.append(icon("cube"));
        const brand = el("div", "cv-brand");
        const title = el("h1", "cv-title", options.title || APP_NAME);
        title.id = "cv-title";
        const date = el("span", "cv-date", new Date().toLocaleDateString("de-DE"));
        date.id = "cv-date";
        brand.append(title, date);
        const actions = el("div", "cv-actions");
        let headerEdit = null;
        if (mode === "builder") {
          // title, date and logo (REQ-011): edited in a dialog
          headerEdit = iconButton("edit", "Titel, Datum und Logo bearbeiten", "cv-header-edit");
          headerEdit.id = "cv-header-edit";
          headerEdit.addEventListener("click", () => options.headerHandlers.edit());
        }
        const fileInput = el("input");
        fileInput.type = "file";
        fileInput.accept = ".ifc";
        fileInput.multiple = true;
        fileInput.hidden = true;
        fileInput.id = "cv-file-input";
        const loadButton = el("button", "cv-btn cv-primary", "IFC laden");
        loadButton.id = "cv-load";
        loadButton.disabled = true;
        loadButton.addEventListener("click", () => fileInput.click());
        // configuration save / load (REQ-009) and `HTML exportieren` (REQ-010): builder only
        const configInput = el("input");
        configInput.type = "file";
        configInput.accept = ".json,application/json";
        configInput.hidden = true;
        configInput.id = "cv-config-input";
        const saveButton = el("button", "cv-btn", "Konfiguration speichern");
        saveButton.id = "cv-config-save";
        saveButton.type = "button";
        saveButton.disabled = true;
        const openButton = el("button", "cv-btn", "Konfiguration laden");
        openButton.id = "cv-config-load";
        openButton.type = "button";
        openButton.disabled = true;
        openButton.addEventListener("click", () => configInput.click());
        const htmlButton = el("button", "cv-btn", "HTML exportieren");
        htmlButton.id = "cv-html-export";
        htmlButton.type = "button";
        htmlButton.disabled = true;
        // drawer toggle of the filter area, shown below 1280 px only (CSS; CR-002: no `Details` drawer)
        const panelToggles = {};
        for (const [name, label, target] of [["filters", "Filter", "cv-filters"]]) {
          const button = el("button", "cv-btn cv-panel-toggle", label);
          button.type = "button";
          button.id = "cv-toggle-" + name;
          button.setAttribute("aria-controls", target);
          button.setAttribute("aria-expanded", "false");
          button.title = label + " ein- oder ausblenden";
          panelToggles[name] = button;
          actions.append(button);
        }
        if (mode === "builder") actions.append(fileInput, loadButton, configInput, saveButton, openButton, htmlButton);
        header.append(logo, brand);
        if (headerEdit) header.append(headerEdit);
        header.append(actions);

        const main = el("div", "cv-main");
        const filters = el("aside", "cv-panel cv-filters");
        filters.id = "cv-filters";
        const messages = el("div", "cv-messages");
        messages.id = "cv-messages";
        messages.setAttribute("role", "alert");
        const modelsTitle = el("h2", "", "Modelle");
        const modelList = el("ul", "cv-models");
        modelList.id = "cv-models";
        filters.append(messages, modelsTitle, modelList);
        let spacesToggle = null;
        if (mode === "builder") {
          const option = el("label", "cv-option");
          spacesToggle = el("input");
          spacesToggle.type = "checkbox";
          spacesToggle.id = "cv-opt-spaces";
          option.append(spacesToggle, document.createTextNode(" R\u00e4ume (IfcSpace) einbeziehen"));
          filters.append(option);
        }
        const filterBox = el("div", "cv-filter-area");
        filterBox.id = "cv-filter-area";
        filters.append(filterBox);
        const filterArea = createFilterArea(filterBox, handlers);

        const center = el("div", "cv-center");
        center.id = "cv-center";
        // model area: the canvas box (3D view with toolbar, panels and overlay on top). CR-002 (TASK-016): the legend is
        // in the colouring panel, so the 1.0.0 legend strip under the canvas (TASK-005 L1) is gone
        const viewport = el("div", "cv-viewport");
        viewport.id = "cv-viewport";
        const canvasBox = el("div", "cv-canvas-box");
        canvasBox.id = "cv-canvas-box";
        viewport.append(canvasBox);
        const overlay = el("div", "cv-overlay");
        overlay.id = "cv-overlay";
        const overlayBox = el("div", "cv-overlay-box");
        const overlayText = el("div", "cv-overlay-text");
        overlayText.id = "cv-overlay-text";
        const progressBar = el("progress", "cv-progress");
        progressBar.id = "cv-progress";
        progressBar.max = 100;
        progressBar.hidden = true;
        overlayBox.append(overlayText, progressBar);
        overlay.append(overlayBox);
        canvasBox.append(overlay);
        const viewControls = createViewControls(canvasBox, options.viewHandlers);
        // toolbar `Fokus` / `Filter` / `Faerben`, hint, title chip, filter panel and pills (REQ-005, REQ-012, CR-002)
        const viewTools = createViewTools(canvasBox, options.toolHandlers);
        // properties panel at the top right inside the 3D view (REQ-007, CR-002)
        const propsPanel = el("section", "cv-props-panel");
        propsPanel.id = "cv-props";
        propsPanel.setAttribute("role", "region");
        propsPanel.setAttribute("aria-label", "Eigenschaften");
        canvasBox.append(propsPanel);
        const detailsPanel = createDetails(
          propsPanel,
          options.propsHandlers || { clear: () => options.viewHandlers.clearSelection() },
        );
        const splitter = el("div", "cv-splitter");
        splitter.id = "cv-splitter";
        splitter.tabIndex = 0;
        splitter.setAttribute("role", "separator");
        splitter.setAttribute("aria-orientation", "horizontal");
        splitter.setAttribute("aria-label", "Aufteilung 3D-Modell / Tabelle");
        splitter.setAttribute("aria-valuemin", "15");
        splitter.setAttribute("aria-valuemax", "85");
        const table = el("section", "cv-panel cv-table");
        table.id = "cv-table";
        const tableHead = el("div", "cv-table-head");
        const tableTitle = el("h2", "", "Tabelle");
        const viewSeg = el("div", "cv-seg cv-table-view");
        viewSeg.setAttribute("role", "radiogroup");
        viewSeg.setAttribute("aria-label", "Tabellenansicht");
        const viewButtons = {};
        for (const [text, value] of [
          ["Einzelelemente", "single"],
          ["Gruppiert", "grouped"],
        ]) {
          const button = el("button", "cv-seg-btn" + (value === "single" ? " cv-on" : ""), text);
          button.type = "button";
          button.dataset.view = value;
          button.setAttribute("role", "radio");
          button.setAttribute("aria-checked", String(value === "single"));
          button.addEventListener("click", () => options.tableHandlers.view(value));
          viewButtons[value] = button;
          viewSeg.append(button);
        }
        // grouping controls (TASK-006b): level 1 and 2 (catalogue picker), remove level 2, expand / collapse all
        const groupTools = el("div", "cv-group-tools");
        groupTools.id = "cv-group-tools";
        groupTools.hidden = true;
        const groupButtons = [];
        for (let level = 1; level <= 2; level++) {
          const button = el("button", "cv-btn cv-small cv-group-pick");
          button.type = "button";
          button.id = "cv-group-" + level;
          button.append(icon("layers"), el("span", "cv-group-pick-text", ""));
          button.addEventListener("click", () => options.tableHandlers.pickGroup(level));
          groupButtons.push(button);
          groupTools.append(button);
        }
        const groupClear = iconButton("close", "Gruppe 2 entfernen", "cv-group-clear");
        groupClear.id = "cv-group-2-clear";
        groupClear.addEventListener("click", () => options.tableHandlers.clearGroup(2));
        groupTools.append(groupClear);
        const expandAll = iconButton("unfold", "Alle aufklappen", "cv-group-all");
        expandAll.id = "cv-expand-all";
        expandAll.addEventListener("click", () => options.tableHandlers.expandAll(true));
        const collapseAll = iconButton("fold", "Alle zuklappen", "cv-group-all");
        collapseAll.id = "cv-collapse-all";
        collapseAll.addEventListener("click", () => options.tableHandlers.expandAll(false));
        groupTools.append(expandAll, collapseAll);
        const tableTools = el("div", "cv-table-tools");
        const columnsButton = el("button", "cv-btn cv-small");
        columnsButton.type = "button";
        columnsButton.id = "cv-columns";
        columnsButton.append(icon("columns"), document.createTextNode("Spalten"));
        columnsButton.addEventListener("click", () => options.tableHandlers.chooser());
        tableTools.append(columnsButton);
        // exports of the shown table rows (TASK-008, REQ-008); enabled while a model is loaded and no action runs
        const exportButtons = [];
        for (const [label, format] of [
          ["Export CSV", "csv"],
          ["Export Excel", "xlsx"],
        ]) {
          const button = el("button", "cv-btn cv-small", label);
          button.type = "button";
          button.id = "cv-export-" + format;
          button.disabled = true;
          button.title = "Zuerst ein IFC-Modell laden.";
          button.addEventListener("click", () => options.tableHandlers.exportTable(format));
          exportButtons.push(button);
          tableTools.append(button);
        }
        tableHead.append(tableTitle, viewSeg, groupTools, tableTools);
        const tableBox = el("div", "cv-table-box");
        table.append(tableHead, tableBox);
        const tableView = createTable(tableBox, options.tableHandlers);
        center.append(viewport, splitter, table);

        main.append(filters, center);

        const statusline = el("footer", "cv-statusline");
        const status = el("span", "cv-status", "");
        status.id = "cv-status";
        const statusModels = el("span", "cv-status-models", "");
        statusModels.id = "cv-status-models";
        statusline.append(status, statusModels);

        app.append(header, main, statusline);
        root.replaceChildren(app);

        // Splitter between 3D model and table (default 55 / 45 %), pointer and keyboard.
        const layout = { split: 55 };
        function setSplit(percent) {
          layout.split = Math.round(Math.min(85, Math.max(15, percent)) * 10) / 10;
          center.style.gridTemplateRows = "minmax(0, " + layout.split + "fr) 6px minmax(0, " + (100 - layout.split) + "fr)";
          splitter.setAttribute("aria-valuenow", String(Math.round(layout.split)));
        }
        setSplit(55);
        splitter.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          splitter.setPointerCapture(event.pointerId);
          splitter.classList.add("cv-dragging");
        });
        splitter.addEventListener("pointermove", (event) => {
          if (!splitter.hasPointerCapture(event.pointerId)) return;
          const box = center.getBoundingClientRect();
          setSplit(((event.clientY - box.top) / box.height) * 100);
        });
        const endDrag = (event) => {
          if (splitter.hasPointerCapture(event.pointerId)) splitter.releasePointerCapture(event.pointerId);
          splitter.classList.remove("cv-dragging");
        };
        splitter.addEventListener("pointerup", endDrag);
        splitter.addEventListener("pointercancel", endDrag);
        splitter.addEventListener("keydown", (event) => {
          if (event.key === "ArrowUp") setSplit(layout.split - 5);
          else if (event.key === "ArrowDown") setSplit(layout.split + 5);
          else return;
          event.preventDefault();
        });

        // Drawer below 1280 px: the filter area over the model area
        function setDrawer(name) {
          for (const [key, button] of Object.entries(panelToggles)) {
            const open = key === name;
            main.classList.toggle("cv-show-" + key, open);
            button.setAttribute("aria-expanded", String(open));
          }
        }
        for (const [name, button] of Object.entries(panelToggles))
          button.addEventListener("click", () => setDrawer(button.getAttribute("aria-expanded") === "true" ? null : name));
        // A new message below 1280 px opens the filter drawer, where #cv-messages lives, so load errors and
        // configuration messages are seen and announced (testing INC-1 BUG-T1)
        const narrowQuery = window.matchMedia ? window.matchMedia("(max-width: 1279px)") : null;
        new MutationObserver((records) => {
          // only a message that arrives opens it, not one that goes (testing INC-1 cycle 2 BUG-T3)
          if (!records.some((r) => r.addedNodes.length > 0)) return;
          if (!narrowQuery || !narrowQuery.matches || !messages.textContent.trim()) return;
          if (panelToggles.filters.getAttribute("aria-expanded") !== "true") setDrawer("filters");
        }).observe(messages, { childList: true, subtree: true });

        let busy = false;
        let configLoadable = false;
        const removeButtons = [];

        /**
         * Header (REQ-011): { title (shown; "" -> app name), date ("YYYY-MM-DD", shown in German), logo (data URL or
         * null -> the app icon) }. The logo is an <img> (an SVG in an <img> runs no script).
         */
        function setHeader(state) {
          const text = state.title ? state.title : APP_NAME;
          title.textContent = text;
          title.title = text;
          title.classList.toggle("cv-title-default", !state.title);
          date.textContent = germanDate(state.date);
          date.dataset.date = state.date;
          if (state.logo) {
            const image = el("img", "cv-logo-img");
            image.alt = "Logo";
            image.src = state.logo;
            logo.replaceChildren(image);
            logo.classList.add("cv-logo-custom");
          } else if (logo.classList.contains("cv-logo-custom") || !logo.firstChild) {
            logo.replaceChildren(icon("cube"));
            logo.classList.remove("cv-logo-custom");
          }
        }

        return {
          /** Closes the filter drawer (below 1280 px; no effect above). */
          closeDrawer: () => setDrawer(null),
          fileInput,
          loadButton,
          configInput,
          saveButton,
          htmlButton,
          openButton,
          setHeader,
          /** Opens the dialog `Titel, Datum und Logo` (see openHeaderDialog). */
          openHeaderDialog(current, handlers) {
            return openHeaderDialog(app, current, handlers);
          },
          spacesToggle,
          viewport: canvasBox,
          layout,
          filters: filterArea,
          table: tableView,
          view: viewControls,
          tools: viewTools,
          details: detailsPanel,
          /** Opens the property catalogue dialog (title default `Filtersatz hinzufuegen`); onPick(key). */
          openCatalogue(entries, used, onPick, titleText) {
            return openCatalogue(app, entries, used, onPick, titleText);
          },
          /** Opens the dialog `Filter bearbeiten` (REQ-012; see openRuleDialog). */
          openRuleDialog(options) {
            return openRuleDialog(app, options);
          },
          /**
           * Table view switch and grouping controls (TASK-006b): view 'single' | 'grouped', levels [{ key, title } |
           * null, { key, title } | null].
           */
          setTableView(view, levels) {
            for (const [value, button] of Object.entries(viewButtons)) {
              const on = value === view;
              button.classList.toggle("cv-on", on);
              button.setAttribute("aria-checked", String(on));
            }
            groupTools.hidden = view !== "grouped";
            groupButtons.forEach((button, i) => {
              const level = levels[i] || null;
              const text = "Gruppe " + (i + 1) + ": " + (level ? level.title : "\u2013");
              button.querySelector(".cv-group-pick-text").textContent = text;
              button.title = level
                ? text + " \u2013 klicken zum \u00c4ndern"
                : "Gruppe " + (i + 1) + " w\u00e4hlen";
              button.setAttribute("aria-label", level ? "Gruppe " + (i + 1) + " \u00e4ndern: " + level.title : "Gruppe " + (i + 1) + " w\u00e4hlen");

            const entry = catalog.get(s.key);
            const unit = entry && entry.kind === "number" ? entry.unit : null;
            return { id: s.id, key: s.key, title: entry ? entry.label : s.key, unit, collapsed: s.collapsed };
          });
        }

        function publishSets() {
          const specs = setSpecs();
          ui.filters.setSets(specs);
          hook.filter.sets = specs.map((spec, i) => ({
            id: spec.id,
            key: spec.key,
            title: spec.title,
            collapsed: spec.collapsed,
            selected: filterSets[i].selected.slice(),
          }));
        }

        /**
         * Evaluates all filters once (evaluateFilters) and updates the filter sets, the status line and the hook. The
         * row set passing all filters (view.indices) is what 3D (TASK-005) and table (TASK-006a) show.
         */
        function refresh() {
          const t0 = performance.now();
          const filters = coreFilters();
          const evaluation = evaluateFilters(store, filters);
          const indices = filterRows(evaluation);
          const facets = facetCounts(evaluation, null, filterSets.map((s) => ({ id: s.id, key: s.key })));
          view = { evaluation, indices, facets };
          inside = new Uint8Array(store.size);
          for (const i of indices) inside[i] = 1;
          if (scheme) {
            // colour dots in the filter set of the colouring property (REQ-005-AC2)
            for (const set of filterSets) {
              if (set.key !== colourKey || !facets.get(set.id)) continue;
              for (const item of facets.get(set.id).values) item.colour = scheme.valueColour(item.value) || "";
            }
          }
          ui.filters.update(facets, anySource(evaluation));
          publishSources();
          sync3d();
          ui.status(indices.length, store.size, hook.modelCount);
          // in-viewer filter panel and pill (REQ-012): same X / Y as the status line; `Filter` dot and panel
          // `Zuruecksetzen` while the search (TASK-015b: or a rule) is active; the pill while any source is active
          if (!indexing) ui.tools.setStatus(indices.length, store.size);
          ui.tools.setFilterState({
            textActive: searchText.trim() !== "" || rules.length > 0,
            pill: anySource(evaluation),
          });
          ui.tools.setToolState({ hidden: hiddenKeys.size, isolating: isolatedKeys !== null });
          ui.tools.setRules(rules.map((rule) => ({ ...describeRule(rule, catalog), missing: ruleMissing(rule) })));
          hook.filter.search = searchText;
          hook.filter.rules = rules.map((rule) => ({ ...rule }));
          updateTable(t0);
          updatePopup();
          const rows = store.rows;
          let keys = null;
          let plainFacets = null;
          hook.filter.active = evaluation.filters.map((f) => ({
            ...f,
            values: f.values ? f.values.slice() : undefined,
            ...(f.keys ? { keys: [...f.keys] } : {}),
          }));
          hook.tools = { hidden: [...hiddenKeys], isolated: isolatedKeys ? [...isolatedKeys] : null };
          hook.filter.count = indices.length;
          hook.filter.total = store.size;
          // keys and facets are built only when read (tests, later tasks), not on every click
          Object.defineProperty(hook.filter, "keys", {
            configurable: true,
            enumerable: true,
            get() {
              if (!keys) keys = Array.from(indices, (i) => rows[i].key);
              return keys;
            },
          });
          Object.defineProperty(hook.filter, "facets", {
            configurable: true,
            enumerable: true,
            get() {
              if (!plainFacets) {
                plainFacets = {};
                for (const [id, f] of facets)
                  plainFacets[id] = { total: f.total, checkedCount: f.checkedCount, values: f.values };
              }
              return plainFacets;
            },
          });
          hook.filter.updates++;
          hook.filter.at = performance.now(); // filter sets updated (NFR-001 measurement, TASK-010)
          hook.filter.lastMs = hook.filter.at - t0;
          for (const listener of filterListeners) listener(view);
        }

        function changed() {
          publishSets();
          refresh();
        }

        const elementCount = (n) => n.toLocaleString("de-DE") + (n === 1 ? " Element" : " Elemente");

        /**
         * Entries of the active non-set filter sources above the filter sets (REQ-004, DEC-21; TASK-017a), in this
         * order: `Ausgeblendet: <n> Element(e)`, `Isoliert: <n> Element(e)`, `Filterregeln: <n>` (every rule, also
         * `Markieren` and rules whose property is not loaded) and `Suche: \u201e<text>\u201c`.
         */
        function publishSources() {
          const items = [];
          if (hiddenKeys.size) items.push({ id: "hidden", text: "Ausgeblendet: " + elementCount(hiddenKeys.size) });
          if (isolatedKeys) items.push({ id: "isolated", text: "Isoliert: " + elementCount(isolatedKeys.size) });
          if (rules.length)
            items.push({ id: "rules", text: "Filterregeln: " + rules.length.toLocaleString("de-DE"), opens: true });
          if (searchText.trim())
            items.push({ id: "search", text: "Suche: \u201e" + searchText.trim() + "\u201c", opens: true });
          ui.filters.setSources(items);
        }

        /**
         * `Ausblenden` (REQ-013, DEC-18): adds the elements (row keys of the current row set) to the hidden set. A
         * selected element that stops being shown is deselected (sync3d).
         */
        function hideElements(keys) {
          const known = keys.filter((key) => rowIndex.has(key));
          if (!known.length) return;
          hiddenKeys = new Set([...hiddenKeys, ...known]);
          refresh();
        }

        /** `Isolieren` (REQ-013, DEC-18): the first starts the isolated set, each further one adds to it. */
        function isolateElements(keys) {
          const known = keys.filter((key) => rowIndex.has(key));
          if (!known.length) return;
          isolatedKeys = new Set([...(isolatedKeys || []), ...known]);
          refresh();
        }

        /** Pills and filter-area entries: clears the hidden set and / or ends the isolation (DEC-18). */
        function clearTools(hidden, isolated) {
          const before = hiddenKeys.size > 0 || isolatedKeys !== null;
          if (hidden) hiddenKeys = new Set();
          if (isolated) isolatedKeys = null;
          if (before) refresh();
        }

        /** Row keys of the current selection (element or group), for the properties panel buttons. */
        const selectionKeys = () =>
          selectedGroup ? selectedGroup.keys.slice() : selectedKey !== null ? [selectedKey] : [];

        /**
         * Drops keys that left the row set (model removed, IfcSpace switched off) from the hidden and isolated sets; an
         * isolated set that becomes empty ends the isolation (DEC-18).
         */
        function pruneToolKeys() {
          if (hiddenKeys.size) hiddenKeys = new Set([...hiddenKeys].filter((key) => rowIndex.has(key)));
          if (isolatedKeys) {
            const kept = [...isolatedKeys].filter((key) => rowIndex.has(key));
            isolatedKeys = kept.length ? new Set(kept) : null;
          }
        }

        /** 1 for every row removed by the element tools (hidden, or not isolated while isolating), or null. */
        function toolMask() {
          if (!hiddenKeys.size && !isolatedKeys) return null;
          const rows = store.rows;
          const out = new Uint8Array(rows.length);
          for (let i = 0; i < rows.length; i++) {
            const key = rows[i].key;
            if (hiddenKeys.has(key) || (isolatedKeys !== null && !isolatedKeys.has(key))) out[i] = 1;
          }
          return out;
        }

        /** Keys of the cached columns still in use: filter sets, colouring, column filters, sort key and grouping. */
        const keysInUse = () =>
          filterSets
            .map((s) => s.key)
            .concat(
              colourKey ? [colourKey] : [],
              [...columnFilters.keys()],
              rules.filter((rule) => rule.mode !== "text").map((rule) => rule.key),
              sort ? [sort.key] : [],
              tableView === "grouped" ? groupBy : [],
            );

        // ---------- table (TASK-006a, REQ-006) ----------

        /** Header specs of the columns for the table component (grouping view: `Gruppe` and `Anzahl` first). */
        function columnSpecs() {
          const fixed =
            tableView === "grouped"
              ? [
                  { key: GROUP_COLUMN, title: "Gruppe", kind: "text", width: 260, sort: null, filtered: false, fixed: true },
                  { key: COUNT_COLUMN, title: "Anzahl", kind: "number", width: 90, sort: null, filtered: false, fixed: true },
                ]
              : [];
          return fixed.concat(columnSpecsOnly());
        }

        function columnSpecsOnly() {
          return columns.map((c) => {
            const entry = catalog.get(c.key);
            return {
              key: c.key,
              title: entry ? entry.header : c.key,
              kind: entry && entry.kind === "number" ? "number" : "text",
              width: c.width,
              sort: sort && sort.key === c.key ? sort.dir : null,
              filtered: columnFilters.has(c.key),
            };
          });
        }

        /** Configuration part of the table (REQ-006-AC6; saved by TASK-007): columns, sort, column filters. */
        function tableState() {
          return {
            columns: columns.map((c) => ({ key: c.key, width: c.width })),
            sort: sort ? { ...sort } : null,
            columnFilters: [...columnFilters].map(([key, f]) =>
              f.type === "range"
                ? { key, type: "range", min: f.min, max: f.max }
                : { key, type: "values", values: f.values.slice() },
            ),
          };
        }

        /** Grouping part of the configuration (REQ-009 "table view, grouping properties"; saved by TASK-007). */
        function groupingState() {
          return { view: tableView, groupBy: groupBy.slice() };
        }

        function groupTitle(key) {
          const entry = catalog.get(key);
          return entry ? entry.header : key;
        }

        function publishTable() {
          const state = tableState();
          hook.table.columns = state.columns;
          hook.table.sort = state.sort;
          hook.table.filters = state.columnFilters;
          hook.table.view = tableView;
          hook.table.groupBy = groupBy.slice();
          ui.setTableView(
            tableView,
            [0, 1].map((i) => (groupBy[i] ? { key: groupBy[i], title: groupTitle(groupBy[i]) } : null)),
          );
          ui.table.setColumns(columnSpecs());
          if (chooser) chooser.refresh();
        }

        /** Aggregation of each column in the grouping view: sums for numbers (not mixed units, DEC-2), else equal text. */
        function groupColumns() {
          return columns.map((c) => {
            const entry = catalog.get(c.key);
            if (entry && entry.kind === "number") return { key: c.key, mode: entry.unit === "gemischt" ? "none" : "sum" };
            return { key: c.key, mode: "same" };
          });
        }

        const isExpanded = (group) => expandDefault !== toggled.has(group.id);

        /** Display rows of the grouping view from the current tree and the expanded state; renders them. */
        function showGroups() {
          const rows = store.rows;
          const list = groupDisplayRows(tree, isExpanded);
          displayItems = list.map((item) =>
            item.type === "group"
              ? { type: "group", group: item.group, label: valueLabel(item.group.value), expanded: isExpanded(item.group) }
              : item,
          );
          ui.table.setGroups(
            rows,
            displayItems,
            tree.total,
            store.size ? "Keine Elemente im Filter." : "Keine Elemente.",
          );
          const items = displayItems;
          let keys = null;
          let display = null;
          hook.table.count = items.length;
          hook.table.groups = allGroups(tree).length;
          hook.table.total = { count: tree.total.count, cells: { ...tree.total.cells } };
          Object.defineProperty(hook.table, "keys", {
            configurable: true,
            enumerable: true,
            get() {
              if (!keys) keys = items.filter((it) => it.type === "element").map((it) => rows[it.index].key);
              return keys;
            },
          });
          Object.defineProperty(hook.table, "display", {
            configurable: true,
            enumerable: true,
            get() {
              if (!display)
                display = items.map((it) =>
                  it.type === "group"
                    ? {
                        type: "group",
                        level: it.group.level,
                        id: it.group.id,
                        key: it.group.key,
                        value: it.group.value,
                        label: it.label,
                        count: it.group.count,
                        cells: { ...it.group.cells },
                        expanded: it.expanded,
                      }
                    : { type: "element", key: rows[it.index].key, depth: it.depth },
                );
              return display;
            },
          });
        }

        /**
         * Table rows = the filter result (view.indices) in sort order; renders the visible part. Grouping view: the
         * groups of the sorted rows (groupRows), their display rows under the expanded state and the total row.
         */
        function updateTable(t0) {
          const start = t0 === undefined ? performance.now() : t0;
          order = sort ? sortRows(store, view.indices, sort) : view.indices;
          const rows = store.rows;
          if (tableView === "grouped") {
            tree = groupRows(store, order, { levels: groupBy, columns: groupColumns(), sort });
            showGroups();
          } else {
            tree = null;
            displayItems = [];
            const shown = order;
            ui.table.setRows(rows, shown, store.size ? "Keine Elemente im Filter." : "Keine Elemente.");
            let keys = null;
            hook.table.count = shown.length;
            hook.table.groups = 0;
            hook.table.total = null;
            Object.defineProperty(hook.table, "display", {
              configurable: true,
              enumerable: true,
              writable: true,
              value: [],
            });
            Object.defineProperty(hook.table, "keys", {
              configurable: true,
              enumerable: true,
              get() {
                if (!keys) keys = Array.from(shown, (i) => rows[i].key);
                return keys;
              },
            });
          }
          hook.table.updates++;
          hook.table.at = performance.now();
          hook.table.lastMs = hook.table.at - start;
        }

        /** Re-renders the grouping view after an expand / collapse (no regrouping). */
        function refreshGroups() {
          if (tableView !== "grouped" || !tree) return;
          const start = performance.now();
          showGroups();
          hook.table.updates++;
          hook.table.at = performance.now();
          hook.table.lastMs = hook.table.at - start;
        }

        /**
         * Applies a grouping state { view, groupBy } (UI switch, group pickers, TASK-007 configuration load). The
         * grouping view needs a level-1 property: without one it groups by `Kategorie`. A new grouping collapses all.
         */
        function setGroupingState(state) {
          const next = normaliseGrouping(state, catalog);
          if (next.view === "grouped" && !next.groupBy.length) next.groupBy = ["Kategorie"];
          const regroup = next.groupBy.join("\u0000") !== groupBy.join("\u0000");
          if (next.view === tableView && !regroup) return;
          tableView = next.view;
          groupBy = next.groupBy;
          if (regroup) {
            expandDefault = false;
            toggled.clear();
          }
          store.retain(keysInUse());
          publishTable();
          // a new view or grouping starts at its first row (TASK-006b follow-up)
          ui.table.scrollToTop();
          markTable();
          updateTable();
        }
        /** Spec of the column filter popup of key under the current filters (values / range under the others). */
        function popupSpec(key) {
          const entry = catalog.get(key);
          const kind = entry && entry.kind === "number" ? "number" : "text";
          const f = columnFilters.get(key) || null;
          const spec = {
            key,
            title: entry ? entry.header : key,
            kind,
            sort: sort && sort.key === key ? sort.dir : null,
            filter: f,
          };
          const evaluation = view.evaluation || evaluateFilters(store, coreFilters());
          if (kind === "number") spec.range = numberRange(store, key, evaluation.except(colId(key)));
          else spec.facet = facetCounts(evaluation, null, [{ id: colId(key), key }]).get(colId(key));
          return spec;
        }

        function updatePopup() {
          if (columnPopup) columnPopup.popup.update(popupSpec(columnPopup.key));
        }

        function setSort(key, dir) {
          sort = key && dir ? { key, dir } : null;
          store.retain(keysInUse());
          publishTable();
          updateTable();
          updatePopup();
        }

        function closePopup() {
          if (columnPopup) columnPopup.popup.close();
        }

        /** Changes the column filter of key (null removes it) and re-evaluates every filter (sets, table, 3D). */
        function setColumnFilter(key, filter) {
          if (filter) columnFilters.set(key, filter);
          else columnFilters.delete(key);
          store.retain(keysInUse());
          publishTable();
          refresh();
        }

        function addColumn(key) {
          if (columns.some((c) => c.key === key)) return;
          columns = columns.concat([{ key, width: defaultColumnWidth(key, catalog.get(key)) }]);
          publishTable();
          if (tableView === "grouped") updateTable(); // the group rows need the sums / common values of the new column
          else ui.table.render();
        }

        function removeColumn(key) {
          if (!columns.some((c) => c.key === key)) return;
          if (columnPopup && columnPopup.key === key) closePopup();
          columns = columns.filter((c) => c.key !== key);
          const hadFilter = columnFilters.delete(key);
          if (sort && sort.key === key) sort = null;
          store.retain(keysInUse());
          publishTable();
          if (hadFilter) refresh();
          else updateTable();
        }

        function moveColumn(key, to) {
          const from = columns.findIndex((c) => c.key === key);
          if (from === -1 || to < 0 || to >= columns.length || from === to) return;
          columns = moveItem(columns, from, to);
          publishTable();
        }

        const tableHandlers = {
          /** `Export CSV` / `Export Excel` (REQ-008). */
          exportTable(format) {
            exportTable(format);
          },
          /** Header click: ascending -> descending -> unsorted (REQ-006). */
          sort(key) {
            if (!sort || sort.key !== key) setSort(key, "asc");
            else if (sort.dir === "asc") setSort(key, "desc");
            else setSort(null);
          },
          filter(key, button) {
            const same = columnPopup && columnPopup.key === key;
            closePopup();
            if (same) return; // the filter button toggles its popup
            const spec = popupSpec(key);
            const popup = ui.openColumnFilter(button, spec, {
              toggle(value, checked) {
                const f = columnFilters.get(key);
                const values = f && f.type === "values" ? f.values.slice() : [];
                const at = values.indexOf(value);
                if (checked && at === -1) values.push(value);
                else if (!checked && at !== -1) values.splice(at, 1);
                else return;
                setColumnFilter(key, values.length ? { type: "values", values } : null);
              },
              range(min, max) {
                const f = columnFilters.get(key);
                const next = {
                  min: min === undefined ? (f ? f.min : null) : min,
                  max: max === undefined ? (f ? f.max : null) : max,
                };
                if (f && f.min === next.min && f.max === next.max) return;
                if (!f && next.min === null && next.max === null) return;
                setColumnFilter(key, next.min === null && next.max === null ? null : { type: "range", ...next });
              },
              reset() {
                if (columnFilters.has(key)) setColumnFilter(key, null);
              },
              sort(dir) {
                if (sort && sort.key === key && sort.dir === dir) setSort(null);
                else setSort(key, dir);
              },
              remove() {
                removeColumn(key);
              },
              close() {
                if (columnPopup && columnPopup.popup === popup) columnPopup = null;
              },
            });
            columnPopup = { key, popup };
          },
          move: moveColumn,
          resize(key, width) {
            const c = columns.find((col) => col.key === key);
            if (!c) return;
            const next = clampColumnWidth(width, c.width);
            if (next === c.width) return publishTable();
            columns = columns.map((col) => (col.key === key ? { key, width: next } : col));
            publishTable();
          },
          /**
           * Row click: selects the element (3D highlight, details; REQ-007-AC3); the camera stays. Then the listeners
           * from start().onRowClick.
           */
          rowClick(key) {
            select(key);
            for (const listener of rowClickListeners) listener(key);
          },
          /**
           * Group row click: selects all elements of the group (REQ-007 "clicking a group row highlights all its
           * elements"); then the listeners from start().onGroupClick (id, element keys of the group).
           */
          groupClick(id) {
            const group = allGroups(tree).find((g) => g.id === id);
            if (!group) return;
            const keys = Array.from(group.indices, (i) => store.rows[i].key);
            selectGroup(group, keys);
            for (const listener of groupClickListeners) listener(id, keys);
          },
          /** `Einzelelemente | Gruppiert` (REQ-006). */
          view(next) {
            setGroupingState({ view: next, groupBy });
          },
          /** Chooses the property of grouping level 1 or 2 from the catalogue. */
          pickGroup(level) {
            if (level === 2 && !groupBy[0]) return;
            const other = groupBy[level === 1 ? 1 : 0];
            const used = new Set(other ? [other] : []);
            ui.openCatalogue(
              [...catalog.values()],
              used,
              (key) => {
                const next = groupBy.slice();
                next[level - 1] = key;
                setGroupingState({ view: "grouped", groupBy: next.filter(Boolean) });
              },
              "Gruppieren nach (Ebene " + level + ")",
            );
          },
          clearGroup(level) {
            setGroupingState({ view: tableView, groupBy: groupBy.filter((_, i) => i !== level - 1) });
          },
          /** `Alle aufklappen` (true) / `Alle zuklappen` (false): every group of both levels. */
          expandAll(expanded) {
            expandDefault = Boolean(expanded);
            toggled.clear();
            refreshGroups();
          },
          /** Expands or collapses one group (by id). */
          toggleGroup(id) {
            if (toggled.has(id)) toggled.delete(id);
            else toggled.add(id);
            refreshGroups();
          },
          chooser() {
            if (chooser) return;
            chooser = ui.openColumnChooser([...catalog.values()], {
              columns: () => columnSpecsOnly().map((c) => ({ key: c.key, title: c.title })),
              add: addColumn,
              remove: removeColumn,
              step(key, delta) {
                moveColumn(key, columns.findIndex((c) => c.key === key) + delta);
              },
              close() {
                chooser = null;
              },
            });
          },
        };

        /**
         * Applies a table state (configuration part; TASK-007 loads it): { columns [{ key, width }], sort,
         * columnFilters [{ key, type, values | min, max }] }; filters and sort on keys that are no column are skipped.
         */
        function setTableState(state) {
          closePopup();
          columns = normaliseColumns(state && state.columns ? state.columns : DEFAULT_COLUMNS, catalog);
          const keys = new Set(columns.map((c) => c.key));
          sort = state && state.sort && keys.has(state.sort.key) ? { key: state.sort.key, dir: state.sort.dir === "desc" ? "desc" : "asc" } : null;
          columnFilters.clear();
          for (const f of (state && state.columnFilters) || []) {
            if (!f || !keys.has(f.key)) continue;
            if (f.type === "range") {
              const min = typeof f.min === "number" && Number.isFinite(f.min) ? f.min : null;
              const max = typeof f.max === "number" && Number.isFinite(f.max) ? f.max : null;
              if (min !== null || max !== null) columnFilters.set(f.key, { type: "range", min, max });
            } else if (Array.isArray(f.values) && f.values.length)
              columnFilters.set(f.key, { type: "values", values: f.values.slice() });
          }
          store.retain(keysInUse());
          publishTable();
          refresh();
        }

        /**
         * Sends the display plan for the current filter result to cv-3d (ghost / hide, colours) and updates the legend;
         * a selected element that left the filter (or the row set) is deselected.
         */
        function sync3d() {
          engine.display({
            rows: store.rows,
            inside,
            toolRemoved: toolMask(),
            isolating: isolatedKeys !== null,
            marked: markMask(),
            mode: viewMode,
            colourOf: scheme ? (i) => scheme.rowColour(i) : null,
            context: models.map((m) => ({ model: m.id, ids: m.contextIds })),
            // the context geometry follows the other filter sources; `Ausblenden` does not change it (REQ-013)
            filterActive: view.evaluation !== null && view.evaluation.filters.some((f) => f.type !== "keys"),
          });
          publishColouring();
          if (selectedKey !== null) {
            const at = rowIndex.get(selectedKey);
            if (at === undefined || !inside[at]) select(null);
          }
          if (selectedGroup !== null) {
            // group selection: elements that left the filter (or the row set) leave the selection (as TASK-005)
            const keys = selectedGroup.keys.filter((k) => {
              const at = rowIndex.get(k);
              return at !== undefined && inside[at] === 1;
            });
            if (!keys.length) select(null);
            else if (keys.length !== selectedGroup.keys.length) applyGroupSelection({ ...selectedGroup, keys });
          }
          publishView();
        }

        /**
         * `Markieren` (REQ-012-AC9, DEC-19; TASK-016): 1 for the rows matching any `Markieren` rule whose property is
         * loaded (a mark is no filter source; cv-3d paints only shown rows, selection > mark > colour), or null.
         */
        function markMask() {
          const marks = rules.filter((rule) => rule.mode === "mark" && !ruleMissing(rule));
          if (!marks.length) return null;
          const bits = markRows(store, marks);
          const out = new Uint8Array(store.size);
          for (let i = 0; i < out.length; i++) out[i] = (bits[i >>> 5] >>> (i & 31)) & 1;
          return out;
        }

        /**
         * Colouring panel and pill (REQ-005, DEC-15; TASK-016): property list (catalogue order), current property, the
         * last chosen mode and scale colour, gradient, repeat note and the legend of the shown elements (computed only
         * when the open panel renders it).
         */
        function publishColouring() {
          const entry = scheme ? catalog.get(colourKey) : null;
          const current = scheme;
          const indices = view.indices;
          ui.tools.setColouring({
            entries: hook.catalog,
            current: entry ? { key: entry.key, label: entry.header, group: entry.group } : null,
            mode: colourMode,
            colour: scaleColourHex,
            gradient: current ? current.gradient : null,
            repeats: current ? current.repeats : false,
            legend: () => (current ? legendRows(colourLegend(current, indices)) : { rows: [], more: 0 }),
          });
        }

        function publishView() {
          hook.view = {
            mode: viewMode,
            colourKey,
            colourMode,
            scaleColour: scaleColourHex,
            selected: selectedKey,
            selectedGroup: selectedGroup ? selectedGroup.id : null,
            selectedKeys: selectedGroup ? selectedGroup.keys.slice() : selectedKey !== null ? [selectedKey] : [],
            section: section ? { ...section } : null,
          };
        }

        /** Display position of the first table row of element row index at (or -1 when not shown). */
        function displayIndexOf(at) {
          if (tableView === "grouped") return displayItems.findIndex((it) => it.type === "element" && it.index === at);
          return order.indexOf(at);
        }

        /**
         * Shows the row of a selected element in the table (REQ-007-AC2): in the grouping view the groups containing it
         * are expanded first (several with a multi-valued grouping property, DEC-16); then it is scrolled into view.
         */
        function revealRow(at) {
          if (tableView === "grouped" && tree) {
            let opened = false;
            for (const group of groupsOfRow(tree, at)) {
              if (isExpanded(group)) continue;
              if (toggled.has(group.id)) toggled.delete(group.id);
              else toggled.add(group.id);
              opened = true;
            }
            if (opened) refreshGroups();
          }
          const index = displayIndexOf(at);
          if (index !== -1) ui.table.reveal(index);
        }

        /**
         * Selects one element by row key (REQ-007) or clears the selection (null, also a group selection): selection
         * highlight in 3D (elements with geometry), the marked table row(s) and the details panel. reveal (3D pick,
         * API): the table shows its row (groups expanded, scrolled); a table row click does not move the table. The
         * camera never moves (as the reference app).
         */
        function select(key, reveal) {
          const at = key === null || key === undefined ? undefined : rowIndex.get(key);
          if (at === undefined) {
            if (selectedKey === null && selectedGroup === null) return;
            selectedKey = null;
            selectedGroup = null;
            engine.select([]);
            ui.details.clear();
            ui.table.setSelection(null, null);
          } else {
            const row = store.rows[at];
            selectedKey = row.key;
            selectedGroup = null;
            engine.select(row.geometry ? [row.key] : []);
            ui.details.show({ row, catalog, order: catalogOrder });
            ui.table.setSelection([row.key], null);
            if (reveal) revealRow(at);
          }
          publishView();
        }

        /** Group path label of a group (level 2: parent value / value). */
        function groupPath(group) {
          if (group.level === 1) return valueLabel(group.value);
          const parent = tree ? tree.groups.find((g) => group.id.indexOf(g.id + "\u001f") === 0) : null;
          return (parent ? valueLabel(parent.value) + " / " : "") + valueLabel(group.value);
        }

        /** Selects all elements of a group (keys: its rows inside the filter); the group row is marked. */
        function selectGroup(group, keys) {
          if (!keys.length) return select(null);
          const kicker = "Gruppe: " + groupBy.slice(0, group.level).map(groupTitle).join(" / ");
          selectedKey = null;
          applyGroupSelection({ id: group.id, grouping: groupBy.join("\u0000"), keys, kicker, title: groupPath(group) });
          publishView();
        }

        /**
         * Marks the selection in the table: the selected element rows, and the selected group row while the table
         * still shows that grouping (a group id means the same group only under the same grouping properties).
         */
        function markTable() {
          if (selectedGroup) {
            const same = tableView === "grouped" && selectedGroup.grouping === groupBy.join("\u0000");
            ui.table.setSelection(selectedGroup.keys, same ? selectedGroup.id : null);
          } else ui.table.setSelection(selectedKey !== null ? [selectedKey] : null, null);
        }

        function applyGroupSelection(next) {
          selectedGroup = next;
          const withGeometry = [];
          for (const k of next.keys) if (store.rows[rowIndex.get(k)].geometry) withGeometry.push(k);
          engine.select(withGeometry);
          ui.details.showGroup({
            id: next.id,
            kicker: next.kicker,
            title: next.title,
            count: next.keys.length,
            withoutGeometry: next.keys.length - withGeometry.length,
          });
          markTable();
        }

        /** Colour scheme of the colouring property in the current mode and scale colour (DEC-15), or null. */
        function currentScheme() {
          return colourKey ? colourScheme(store, colourKey, { mode: colourMode, colour: scaleColourHex }) : null;
        }

        /** Colours by property key in the last chosen mode and scale colour (DEC-15), or removes colouring (null). */
        function setColouring(key) {
          colourKey = key && catalog.has(key) ? key : null;
          scheme = currentScheme();
          store.retain(keysInUse());
          refresh();
        }

        /** Mode or scale colour of the colouring panel (DEC-15): kept for the next property, applied at once. */
        function setColourOptions(mode, colour) {
          if (mode !== undefined) colourMode = mode === "scale" ? "scale" : DEFAULT_COLOUR_MODE;
          if (colour !== undefined) scaleColourHex = normaliseHexColour(colour) || scaleColourHex;
          scheme = currentScheme();
          refresh();
        }

        function setSection(next) {
          section = next;
          ui.view.setSection(section, section ? engine.axisRange(section.axis) : null);
          engine.setSection(section);
          publishView();
        }

        // ---------- header and configuration (TASK-007, REQ-011 / REQ-009) ----------

        // title / date set by the user or a configuration; null = default (first model's Modell / today)
        const headerState = { title: null, date: null, logo: null };

        /** Header as shown and saved: defaults applied (REQ-011). */
        function effectiveHeader() {
          return {
            title: headerState.title !== null ? headerState.title : models.length ? models[0].name : "",
            date: headerState.date !== null ? headerState.date : isoDate(new Date()),
            logo: headerState.logo,
          };
        }

        function publishHeader() {
          const header = effectiveHeader();
          ui.setHeader(header);
          ui.tools.setTitle(header.title, models.length); // title chip in the 3D view (REQ-005-AC10)
          hook.header = { ...header, titleSet: headerState.title !== null, dateSet: headerState.date !== null };
        }

        /** Sets title, date and logo ({ title?, date?, logo? }; null title / date = default). */
        function setHeader(next) {
          if (next.title !== undefined) headerState.title = next.title === null ? null : String(next.title);
          if (next.date !== undefined) headerState.date = isIsoDate(next.date) ? next.date : null;
          if (next.logo !== undefined) headerState.logo = next.logo || null;
          publishHeader();
        }

        /** The configuration a save writes now (REQ-009; buildConfig). */
        function configState() {
          return buildConfig({
            header: effectiveHeader(),
            filterSets: filterSets.map((s) => ({ key: s.key, collapsed: s.collapsed, selected: s.selected })),
            table: tableState(),
            grouping: groupingState(),
            display: { mode: viewMode, colourKey, colourMode, scaleColour: scaleColourHex, section },
          });
        }

        /**
         * Applies a parsed, valid configuration to the loaded models (REQ-009, tolerant: applyConfig). Parts the file
         * does not define keep their current state. Returns { notice (German text or null), skipped }.
         */
        function applyConfiguration(config) {
          const { apply, skipped } = applyConfig(config, {
            has: (key) => catalog.has(key),
            hasValue(key, value) {
              const col = store.column(key);
              return value === null ? col.empties : col.index.get(value) !== undefined;
            },
            columns: columns.map((c) => c.key),
            isNumber: (key) => {
              const entry = catalog.get(key);
              return Boolean(entry && entry.kind === "number");
            },
            hasGeometry: () => Boolean(engine.axisRange("Z")),
          });
          closePopup();
          // loading any configuration clears hidden and isolated elements (session state of the previous view, DEC-20)
          hiddenKeys = new Set();
          isolatedKeys = null;
          if (apply.header) setHeader(apply.header);
          if (apply.filterSets) {
            const sets = apply.filterSets.map((s) => ({
              id: s.key,
              key: s.key,
              collapsed: s.collapsed,
              selected: s.selected.slice(),
            }));
            filterSets.splice(0, filterSets.length, ...sets);
          }
          const t = apply.table || {};
          if (t.columns) columns = normaliseColumns(t.columns, catalog);
          const columnKeys = new Set(columns.map((c) => c.key));
          if (t.sort !== undefined) sort = t.sort && columnKeys.has(t.sort.key) ? { ...t.sort } : null;
          else if (sort && !columnKeys.has(sort.key)) sort = null;
          if (t.columnFilters) {
            columnFilters.clear();
            for (const f of t.columnFilters)
              columnFilters.set(
                f.key,
                f.type === "range"
                  ? { type: "range", min: f.min, max: f.max }
                  : { type: "values", values: f.values.slice() },
              );
          }
          for (const key of [...columnFilters.keys()]) if (!columnKeys.has(key)) columnFilters.delete(key);
          if (t.view !== undefined || t.groupBy !== undefined) {
            const next = normaliseGrouping(
              { view: t.view !== undefined ? t.view : tableView, groupBy: t.groupBy !== undefined ? t.groupBy : groupBy },
              catalog,
            );
            if (next.view === "grouped" && !next.groupBy.length) next.groupBy = ["Kategorie"];
            if (next.groupBy.join("\u0000") !== groupBy.join("\u0000")) {
              expandDefault = false;
              toggled.clear();
            }
            tableView = next.view;
            groupBy = next.groupBy;
          }
          const d = apply.display || {};
          if (d.mode !== undefined) {
            viewMode = d.mode;
            ui.tools.setMode(viewMode);
          }
          if (d.colourMode !== undefined) colourMode = d.colourMode;
          if (d.scaleColour !== undefined) scaleColourHex = d.scaleColour;
          if (d.colourBy !== undefined) colourKey = d.colourBy;
          if (d.colourBy !== undefined || d.colourMode !== undefined || d.scaleColour !== undefined)
            scheme = currentScheme();
          if (d.sectionPlane !== undefined) {
            // Interim (TASK-012 until TASK-014/018): the 1.0.0 3D view cuts along X / Y / Z only, so a plane is shown
            // as the axis section it equals; another plane is not applied and named `Schnitt`
            const axisSection = d.sectionPlane ? axisSectionOfPlane(d.sectionPlane) : null;
            if (d.sectionPlane && (!axisSection || !engine.axisRange(axisSection.axis))) {
              if (!skipped.invalid.includes("Schnitt")) skipped.invalid.push("Schnitt");
            } else setSection(axisSection);
          }
          store.retain(keysInUse());
          publishSets();
          publishTable();
          ui.table.scrollToTop();
          markTable();
          refresh();
          const notice = configNotice(skipped, (key) => {
            const entry = catalog.get(key);
            return entry ? entry.label : key;
          });
          return { notice, skipped };
        }

        /**
         * The 1.0.0 axis section { axis, offset, flipped } a section plane equals (normal +-X, +-Y or +-Z in the scene
         * frame of spec 4.4; inverse of planeFromAxisSection), else null. Interim for the 1.0.0 3D view (TASK-012).
         */
        function axisSectionOfPlane(plane) {
          const i = plane.normal.findIndex((x) => Math.abs(Math.abs(x) - 1) <= 1e-9);
          if (i < 0 || plane.normal.some((x, j) => j !== i && Math.abs(x) > 1e-9)) return null;
          return { axis: "XYZ"[i], offset: plane.point[i], flipped: plane.normal[i] > 0 };
        }

        /** Offers text, bytes or a Blob as a file download (works from file:// as well). */
        function download(text, fileName, type) {
          const url = URL.createObjectURL(new Blob([text], { type }));
          const link = document.createElement("a");
          link.href = url;
          link.download = fileName;
          link.hidden = true;
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        }

        /** `Konfiguration speichern` (REQ-009): JSON file `<Titel>_<YYYY-MM-DD>_Konfiguration.json`. */
        function saveConfiguration() {
          const config = configState();
          const text = JSON.stringify(config, null, 2) + "\n";
          const fileName = safeFileName(config.header.title, config.header.date, "_Konfiguration.json");
          download(text, fileName, "application/json");
          hook.config.saves++;
          hook.config.lastSaved = { fileName, text };
          return { fileName, text };
        }

        /**
         * The rows the table shows now as an export sheet (REQ-008, exportSheet): the visible columns with their
         * header titles (unit included); single view: the filtered rows in table order; grouping view: the shown
         * group and element rows (expanded groups only) and the total row last.
         */
        function exportSheetNow() {
          return exportSheet({
            rows: store.rows,
            columns: columns.map((c) => {
              const entry = catalog.get(c.key);
              return { key: c.key, title: entry ? entry.header : c.key };
            }),
            view: tableView,
            order,
            items: displayItems,
            total: tree ? tree.total : null,
          });
        }

        const EXPORT_FORMATS = {
          csv: { label: "Export CSV", suffix: ".csv", type: "text/csv;charset=utf-8" },
          xlsx: {
            label: "Export Excel",
            suffix: ".xlsx",
            type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          },
        };

        /**
         * `Export CSV` / `Export Excel` (REQ-008, REQ-011 file name `<Titel>_<YYYY-MM-DD>.csv|.xlsx`, NFR-004 progress):
         * the table rows at the click are written in steps with the progress overlay and offered as a download.
         * Needs a loaded model and no running action. Returns window.__calc.export.last or null when not started.
         */
        async function exportTable(format) {
          const spec = EXPORT_FORMATS[format];
          if (!spec || busy || !models.length) return null;
          const t0 = performance.now();
          const header = effectiveHeader();
          const fileName = safeFileName(header.title, header.date, spec.suffix);
          busy = true;
          ui.setBusy(true);
          hook.phase = "exporting";
          let result;
          try {
            progress(fileName, spec.label, 0);
            const sheet = exportSheetNow();
            const pause = async (fraction) => {
              progress(fileName, spec.label, fraction);
              await new Promise((resolve) => setTimeout(resolve, 0));
            };
            await pause(0);
            const data = format === "csv" ? await toCsv(sheet, { pause }) : await toXlsx(sheet, { pause });
            progress(fileName, spec.label, 1);
            download(data, fileName, spec.type);
            result = {
              ok: true,
              format,
              fileName,
              rows: sheet.rows.length,
              columns: sheet.headers.length,
              view: tableView,
              ms: performance.now() - t0,
            };
          } catch (error) {
            const message =
              "Der Export ist fehlgeschlagen" + (error && error.message ? " (" + error.message + ")." : ".");
            ui.addMessage(message);
            result = { ok: false, format, fileName, message, ms: performance.now() - t0 };
          } finally {
            settleOverlay();
            hook.progress = null;
            busy = false;
            ui.setBusy(false);
            hook.phase = "ready";
          }
          hook.export.count++;
          hook.export.last = result;
          if (queued.length) loadFiles([]);
          notifyFree();
          return result;
        }

        /**
         * `HTML exportieren` (REQ-010, TASK-009, builder): the loaded models (.frag bytes), their element table and the
         * current configuration (header with the date and title as shown) go into one offline viewer file
         * `<Titel>_<YYYY-MM-DD>.html` (options.buildViewer assembles it), with the progress overlay. Needs a loaded model
         * and no running action. Returns window.__calc.viewerExport.last or null when not started.
         */
        async function exportViewerFile() {
          if (busy || !models.length || !options.buildViewer) return null;
          const t0 = performance.now();
          const config = configState();
          const fileName = safeFileName(config.header.title, config.header.date, ".html");
          const label = "HTML exportieren";
          busy = true;
          ui.setBusy(true);
          hook.phase = "exporting";
          let result;
          try {
            const pause = async (fraction) => {
              progress(fileName, label, fraction);
              await new Promise((resolve) => setTimeout(resolve, 0));
            };
            await pause(0);
            const parts = await options.buildViewer(
              {
                title: config.header.title,
                config,
                includeSpaces: hook.options.includeSpaces,
                models: models.map((m) => ({
                  id: m.id,
                  name: m.name,
                  fileName: m.fileName,
                  rows: m.rows,
                  properties: m.properties,
                  spaceProperties: m.spaceProperties,
                  spaceIds: m.spaceIds,
                  contextIds: m.contextIds,
                  fragBytes: m.fragBytes,
                })),
              },
              pause,
            );
            const blob = new Blob(parts, { type: "text/html;charset=utf-8" });
            progress(fileName, label, 1);
            download(blob, fileName, "text/html;charset=utf-8");
            result = {
              ok: true,
              fileName,
              bytes: blob.size,
              models: models.length,
              rows: models.reduce((n, m) => n + m.rows.length, 0),
              ms: performance.now() - t0,
            };
          } catch (error) {
            const message =
              "Der HTML-Export ist fehlgeschlagen" + (error && error.message ? " (" + error.message + ")." : ".");
            ui.addMessage(message);
            result = { ok: false, fileName, message, ms: performance.now() - t0 };
          } finally {
            settleOverlay();
            hook.progress = null;
            busy = false;
            ui.setBusy(false);
            hook.phase = "ready";
          }
          hook.viewerExport.count++;
          hook.viewerExport.last = result;
          if (queued.length) loadFiles([]);
          notifyFree();
          return result;
        }

        /**
         * Starts the viewer file (REQ-010, TASK-009): shows the embedded models (.frag bytes, IfcSpace hidden unless the
         * builder showed them), takes the embedded element table instead of an extraction and applies the exported
         * configuration. Nothing is persisted; reopening the file shows this state again.
         */
        async function openViewer(data) {
          const VIEWER_QUIET_MAX_MS = 8000; // cap of the wait for the streamed tiles before the first frame
          busy = true;
          ui.setBusy(true);
          hook.phase = "loading";
          engine.holdFrames(true); // one frame for all models and the configuration (NFR-003, TASK-010)
          // until the payload is applied: the exported header, no empty default filter sets or model list
          // (cv-starting is set before the layout is built)
          if (viewerHeader) ui.setHeader(viewerHeader);
          try {
