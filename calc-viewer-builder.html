          if (dragId === null || !auto.scroller) return;
          const box = auto.scroller.getBoundingClientRect();
          const top = event.clientY - box.top;
          const bottom = box.bottom - event.clientY;
          let step = 0;
          if (top >= 0 && top < EDGE) step = -Math.ceil(((EDGE - top) / EDGE) * MAX_STEP);
          else if (bottom >= 0 && bottom < EDGE) step = Math.ceil(((EDGE - bottom) / EDGE) * MAX_STEP);
          auto.step = step;
          auto.last = performance.now();
          if (step !== 0 && !auto.frame) auto.frame = requestAnimationFrame(autoTick);
        }
        function stopAutoScroll() {
          if (auto.frame) cancelAnimationFrame(auto.frame);
          if (auto.scroller) auto.scroller.removeEventListener("dragover", autoScroll);
          auto.scroller = null;
          auto.step = 0;
          auto.frame = 0;
        }

        function wireDrag(set) {
          set.head.addEventListener("dragstart", (event) => {
            dragId = set.id;
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData(DRAG_TYPE, set.id);
            event.dataTransfer.setData("text/plain", set.id);
            set.root.classList.add("cv-dragging");
            stopAutoScroll();
            auto.scroller = scrollerOf(container);
            if (auto.scroller) auto.scroller.addEventListener("dragover", autoScroll);
          });
          set.head.addEventListener("dragend", () => {
            dragId = null;
            stopAutoScroll();
            clearDropMarks();
          });
          set.root.addEventListener("dragover", (event) => {
            if (dragId === null) return;
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
            const box = set.root.getBoundingClientRect();
            const before = event.clientY < box.top + box.height / 2;
            set.root.classList.toggle("cv-drop-before", before);
            set.root.classList.toggle("cv-drop-after", !before);
          });
          set.root.addEventListener("dragleave", (event) => {
            if (!set.root.contains(event.relatedTarget)) set.root.classList.remove("cv-drop-before", "cv-drop-after");
          });
          set.root.addEventListener("drop", (event) => {
            if (dragId === null) return;
            event.preventDefault();
            const box = set.root.getBoundingClientRect();
            const before = event.clientY < box.top + box.height / 2;
            const source = dragId;
            dragId = null;
            stopAutoScroll();
            clearDropMarks();
            if (source === set.id) return;
            const from = order.indexOf(source);
            let to = order.indexOf(set.id) + (before ? 0 : 1);
            if (from < to) to--;
            if (from !== to) handlers.move(source, to);
          });
        }

        return {
          /** Shows the sets [{ id, key, title, unit, collapsed }] in this order (components are kept, not rebuilt). */
          setSets(specs) {
            const keep = new Set(specs.map((s) => s.id));
            for (const [id, set] of sets)
              if (!keep.has(id)) {
                set.root.remove();
                sets.delete(id);
              }
            order = specs.map((s) => s.id);
            specs.forEach((spec, index) => {
              let set = sets.get(spec.id);
              if (!set) {
                set = createFilterSet(spec, handlers);
                wireDrag(set);
                sets.set(spec.id, set);
              } else {
                set.setTitle(spec.title, spec.unit);
                set.setCollapsed(Boolean(spec.collapsed));
              }
              set.setPosition(index, specs.length);
              if (list.children[index] !== set.root) list.insertBefore(set.root, list.children[index] || null);
            });
          },
          /** Values and counts per set (Map id -> facetCounts entry); anyActive enables the reset-all button. */
          update(facets, anyActive) {
            for (const [id, set] of sets) set.update(facets.get(id));
            resetAll.disabled = !anyActive;
          },
          /**
           * Entries of the active non-set filter sources above the filter sets (REQ-004, DEC-21; TASK-017a): items [{ id
           * ('hidden' | 'isolated' | 'rules' | 'search'), text, opens (the text is a button that calls
           * handlers.openSource(id), e.g. to open the in-viewer filter panel) }] in this order; each entry has a remove
           * button x that calls handlers.removeSource(id). Texts are set as text only. An entry that keeps its id keeps
           * its nodes (and the focus).
           */
          setSources(items) {
            const old = new Map([...sources.children].map((node) => [node.dataset.source, node]));
            const focusedAt = [...sources.children].findIndex((node) => node.contains(document.activeElement));
            const nodes = items.map((item) => {
              let node = old.get(item.id);
              if (!node || node.dataset.opens !== String(Boolean(item.opens))) {
                node = el("li", "cv-fa-source");
                node.dataset.source = item.id;
                node.dataset.opens = String(Boolean(item.opens));
                const text = item.opens ? el("button", "cv-fa-source-text") : el("span", "cv-fa-source-text");
                if (item.opens) {
                  text.type = "button";
                  text.title = "Filter anzeigen";
                  text.addEventListener("click", () => handlers.openSource && handlers.openSource(item.id));
                }
                const remove = iconButton("close", "", "cv-fa-source-remove");
                remove.addEventListener("click", () => handlers.removeSource && handlers.removeSource(item.id));
                node.append(text, remove);
              }
              node.firstChild.textContent = item.text;
              const remove = node.lastChild;
              remove.title = item.text + " entfernen";
              remove.setAttribute("aria-label", item.text + " entfernen");
              return node;
            });
            sources.replaceChildren(...nodes);
            sources.hidden = nodes.length === 0;
            // a removed entry took the focus with it: keep it in the list (next entry) or on `Alle Filter zuruecksetzen`
            if (focusedAt !== -1 && !sources.contains(document.activeElement)) {
              const next = nodes[Math.min(focusedAt, nodes.length - 1)];
              if (next) next.lastChild.focus();
              else if (!resetAll.disabled) resetAll.focus();
            }
          },
        };
      }

      const CATALOG_ROW_HEIGHT = 32;

      /** Name of a catalogue entry inside its group (the pset prefix is shown by the group header). */
      function entryName(entry) {
        const pset = entry.group.indexOf("Typ: ") === 0 ? entry.group.slice(5) : entry.group;
        return entry.label.indexOf(pset + ".") === 0 ? entry.label.slice(pset.length + 1) : entry.label;
      }

      /**
       * Property catalogue dialog (REQ-003): search, entries grouped (`Allgemein` first, then pset names, as the
       * catalogue orders them) with their element counts, virtualised for thousands of entries. entries: catalogue
       * entries in order; used: Set of keys that already have a filter set; onPick(key). extra (optional): { keepOpen
       * (picking an entry keeps the dialog open and refreshes the list, e.g. to add several columns), top (node shown
       * above the search field), usedNote (label of used entries), usedLabel (accessible suffix of used entries),
       * className, onClose() }.
       */
      function openCatalogue(host, entries, used, onPick, titleText, extra) {
        const opts = extra || {};
        const backdrop = el("div", "cv-backdrop");
        const dialog = el("div", "cv-dialog cv-catalogue" + (opts.className ? " " + opts.className : ""));
        dialog.setAttribute("role", "dialog");
        dialog.setAttribute("aria-modal", "true");
        dialog.setAttribute("aria-labelledby", "cv-catalogue-title");
        const head = el("div", "cv-dialog-head");
        const title = el("div", "cv-dialog-title", titleText || "Filtersatz hinzuf\u00fcgen");
        title.id = "cv-catalogue-title";
        const close = iconButton("close", "Schlie\u00dfen", "cv-dialog-close");
        head.append(title, close);
        const body = el("div", "cv-dialog-body");
        const search = el("label", "cv-search");
        const input = el("input");
        input.type = "search";
        input.placeholder = "Eigenschaft suchen";
        input.setAttribute("aria-label", "Eigenschaft suchen");
        search.append(icon("search"), input);
        const list = createVirtualList({
          className: "cv-cat-list",
          rowHeight: CATALOG_ROW_HEIGHT,
          maxRows: 0,
          createRow() {
            const row = el("button", "cv-cat-row");
            row.type = "button";
            row.append(el("span", "cv-cat-name"), el("span", "cv-cat-note"), el("span", "cv-cat-count"));
            return row;
          },
          updateRow(row, item) {
            const [name, note, count] = row.children;
            if (item.group !== undefined) {
              row.className = "cv-cat-row cv-cat-group cv-vrow";
              row.disabled = true;
              row.tabIndex = -1;
              delete row.dataset.key;
              row.removeAttribute("aria-label");
              row.removeAttribute("title");
              name.textContent = item.group;
              note.textContent = "";
              count.textContent = "";
              return;
            }
            const entry = item.entry;
            const isUsed = used.has(entry.key);
            row.className = "cv-cat-row cv-cat-entry cv-vrow" + (isUsed ? " cv-used" : "");
            row.disabled = isUsed;
            row.tabIndex = 0;
            row.dataset.key = entry.key;
            row.title = entry.header;
            row.setAttribute(
              "aria-label",
              entry.label +
                ", " +
                formatCount(entry.count) +
                " Elemente" +
                (isUsed ? ", " + (opts.usedLabel || "bereits als Filtersatz") : ""),
            );
            name.textContent = entryName(entry);
            note.textContent = isUsed ? opts.usedNote || "vorhanden" : "";
            count.textContent = formatCount(entry.count);
          },
        });
        const info = el("p", "cv-hint cv-cat-info");
        if (opts.top) body.append(opts.top);
        body.append(search, list.element, info);
        dialog.append(head, body);
        backdrop.append(dialog);
        host.append(backdrop);

        function build() {
          const query = input.value.trim().toLowerCase();
          const items = [];
          let group = null;
          let matches = 0;
          for (const entry of entries) {
            if (
              query &&
              entry.label.toLowerCase().indexOf(query) === -1 &&
              entry.group.toLowerCase().indexOf(query) === -1
            )
              continue;
            if (entry.group !== group) {
              group = entry.group;
              items.push({ group });
            }
            items.push({ entry });
            matches++;
          }
          list.setItems(items, !opts.keepOpen);
          if (!entries.length) info.textContent = "Keine Eigenschaften. Zuerst ein IFC-Modell laden.";
          else if (!matches) info.textContent = "Keine Treffer.";
          else info.textContent = formatCount(matches) + " von " + formatCount(entries.length) + " Eigenschaften";
        }

        function onKey(event) {
          if (event.key !== "Escape") return;
          event.preventDefault(); // handled: Escape closes the dialog only (it does not clear the 3D selection)
          finish();
        }
        let open = true;
        function finish() {
          if (!open) return;
          open = false;
          document.removeEventListener("keydown", onKey, true);
          backdrop.remove();
          if (opts.onClose) opts.onClose();
        }
        document.addEventListener("keydown", onKey, true);
        backdrop.addEventListener("click", (event) => {
          if (event.target === backdrop) finish();
        });
        close.addEventListener("click", finish);
        input.addEventListener("input", build);
        list.element.addEventListener("click", (event) => {
          const row = event.target.closest(".cv-cat-entry");
          if (!row || row.disabled) return;
          const key = row.dataset.key;
          if (opts.keepOpen) {
            onPick(key);
            build();
            return;
          }
          finish();
          onPick(key);
        });
        build();
        input.focus();
        return { close: finish, element: dialog, refresh: build };
      }

      /**
       * Interim 1.0.0 3D view control (REQ-005; top right of the model) until TASK-017c: `Schnitt` (axis X / Y / Z;
       * while a section is active a panel under it holds slider, flip and remove, so the bar stays one row at 1280 px,
       * TASK-005 L4). CR-002: `Elemente ausserhalb des Filters: Geist | Ausblenden` moved into the pill `Filter
       * entfernen` (ghost toggle) and `Ansicht einpassen` is replaced by `Fokus` in the 3D toolbar (TASK-015a);
       * `Faerben nach` and the legend under the model are replaced by the colouring panel `Faerben` (TASK-016,
       * createViewTools).
       * handlers: { section(axis | null), sectionOffset(value), flip() }.
       */
      function createViewControls(viewport, handlers) {
        const bar = el("div", "cv-view-bar");
        bar.id = "cv-view-bar";

        const sectionBox = el("div", "cv-view-group cv-section");
        const sectionLabel = el("span", "cv-view-label cv-section-label", "Schnitt");
        sectionLabel.id = "cv-section-label";
        sectionLabel.prepend(icon("scissors"));
        const axisSeg = el("div", "cv-seg");
        axisSeg.setAttribute("role", "radiogroup");
        axisSeg.setAttribute("aria-labelledby", "cv-section-label");
        const axisButtons = {};
        for (const axis of ["X", "Y", "Z"]) {
          const button = el("button", "cv-seg-btn", axis);
          button.type = "button";
          button.setAttribute("role", "radio");
          button.setAttribute("aria-label", "Schnitt " + axis);
          button.addEventListener("click", () => handlers.section(axis));
          axisButtons[axis] = button;
          axisSeg.append(button);
        }
        const slider = el("input", "cv-section-slider");
        slider.type = "range";
        slider.id = "cv-section-slider";
        slider.setAttribute("aria-label", "Schnittposition");
        slider.addEventListener("input", () => handlers.sectionOffset(Number(slider.value)));
        const flip = iconButton("flip", "Schnitt umkehren", "cv-section-flip");
        flip.id = "cv-section-flip";
        flip.addEventListener("click", () => handlers.flip());
        const sectionOff = iconButton("close", "Schnitt entfernen", "cv-section-off");
        sectionOff.id = "cv-section-off";
        sectionOff.addEventListener("click", () => handlers.section(null));
        const sectionPanel = el("div", "cv-section-panel");
        sectionPanel.id = "cv-section-panel";
        sectionPanel.append(slider, flip, sectionOff);
        sectionBox.append(sectionLabel, axisSeg, sectionPanel);

        bar.append(sectionBox);
        viewport.append(bar);

        return {
          element: bar,
          /** Section { axis, offset, flipped } | null with the slider range { min, max } of the axis. */
          setSection(section, range) {
            for (const [axis, button] of Object.entries(axisButtons)) {
              const on = Boolean(section) && section.axis === axis;
              button.setAttribute("aria-checked", String(on));
              button.classList.toggle("cv-on", on);
            }
            sectionBox.classList.toggle("cv-on", Boolean(section));
            sectionPanel.hidden = !section;
            if (section && range) {
              slider.min = String(range.min);
              slider.max = String(range.max);
              slider.step = String((range.max - range.min) / 1000 || 0.001);
              slider.value = String(section.offset);
              flip.setAttribute("aria-pressed", String(section.flipped));
              flip.classList.toggle("cv-on", section.flipped);
            }
          },
        };
      }

      /** Row height of the colouring panel's property list (label over group, as the reference's suggestion items). */
      const COLOUR_LIST_ROW_HEIGHT = 46;

      /** Debounce of the search field `Suchen nach Objekten` (REQ-012, ref SEARCH_DEBOUNCE_MS). */
      export const SEARCH_DEBOUNCE_MS = 250;
      /** The navigation hint fades this long after the first model is shown (REQ-005, ref HINT_DURATION_MS). */
      export const HINT_DURATION_MS = 6000;
      /** Text of the navigation hint pill above the toolbar (REQ-005-AC10, ref L872). */
      export const HINT_TEXT =
        "Ziehen: drehen \u00b7 Rechts ziehen: verschieben \u00b7 Mausrad: zoomen \u00b7 Klick: Eigenschaften und Werkzeuge";

      /**
       * In-viewer tools of the 3D view as the reference (REQ-005, REQ-012, CR-002; TASK-015a; ref L865-876,
       * L1306-1376, L1394-1430, CSS L1739-1766, L1796-1861): title chip (top left), navigation hint, the round glass
       * toolbar `3D-Werkzeuge` (bottom centre) with `Fokus`, `Filter`, `Faerben`, the filter panel (kicker, panel
       * `Zuruecksetzen`, search `Suchen nach Objekten`, rule list, `+ Filter hinzufuegen`, status `X von Y Objekten
       * sichtbar`), the colouring panel (TASK-016, see setColouring) and the pill stack (bottom right) with the pill
       * `Filter entfernen` (ghost toggle on its left, chevron `Filter anzeigen` on its right) and the pill `Einfaerbung
       * entfernen` (chevron `Faerben anzeigen`). `Filter` and `Faerben` panels exclude each other. Texts from the model
       * (title, search, property labels, values) are set as text only.
       * handlers: { focus(), mode('ghost' | 'hide'), search(text) (after the debounce), resetPanel() (panel
       * `Zuruecksetzen`), resetAll() (pill `Filter entfernen`), addRule(opener) (`+ Filter hinzufuegen`), editRule(index,
       * opener) and removeRule(index) (rule rows, TASK-015b), colour(key) (a property of the colouring list),
       * colourMode('distinct' | 'scale'), scaleColour('#rrggbb') (a swatch or `Eigene Farbe`), clearColour() (`Entfernen`
       * and the pill `Einfaerbung entfernen`; TASK-016), panel(name | null) (optional: a panel was opened or closed),
       * clearIsolation() and clearHidden() (pills `Isolierung entfernen` / `Ausblendung entfernen`, TASK-017a) }.
       */
      function createViewTools(box, handlers) {
        const titleChip = el("div", "cv-title-chip");
        titleChip.id = "cv-title-chip";
        titleChip.hidden = true;
        const titleText = el("span", "cv-title-chip-text");
        const titleSub = el("span", "cv-title-chip-sub");
        titleSub.hidden = true;
        titleChip.append(titleText, titleSub);

        const hint = el("div", "cv-hint", HINT_TEXT);
        hint.id = "cv-hint";
        hint.hidden = true;
        let hintStarted = false;

        const bar = el("div", "cv-toolbar");
        bar.id = "cv-toolbar";
        bar.setAttribute("role", "toolbar");
        bar.setAttribute("aria-label", "3D-Werkzeuge");
        bar.hidden = true;
        const toolButton = (name, label, id) => {
          const button = iconButton(name, label, "cv-tool-btn");
          button.id = id;
          bar.append(button);
          return button;
        };
        const focusButton = toolButton("focus", "Fokus", "cv-tool-focus");
        focusButton.addEventListener("click", () => handlers.focus());
        const filterButton = toolButton("filter", "Filter", "cv-tool-filter");
        const colourButton = toolButton("palette", "F\u00e4rben", "cv-tool-colour");
        for (const button of [filterButton, colourButton]) button.setAttribute("aria-pressed", "false");

        /** A floating glass panel above the toolbar: { panel, head, body, reset (red link, hidden) }. */
        function floatPanel(id, kicker, label) {
          const panel = el("section", "cv-float-panel");
          panel.id = id;
          panel.hidden = true;
          panel.setAttribute("role", "region");
          panel.setAttribute("aria-label", label);
          const head = el("div", "cv-float-head");
          const reset = el("button", "cv-link");
          reset.type = "button";
          reset.hidden = true;
          head.append(el("div", "cv-float-kicker", kicker), reset);
          const body = el("div", "cv-float-body");
          panel.append(head, body);
          return { panel, head, body, reset };
        }

        // filter panel (REQ-012)
        const filter = floatPanel("cv-filter-panel", "Filter", "Filter");
        filter.reset.textContent = "Zur\u00fccksetzen";
        filter.reset.id = "cv-filter-reset";
        filter.reset.title = "Filterregeln und Suche entfernen";
        filter.reset.addEventListener("click", () => handlers.resetPanel());
        const searchBox = el("label", "cv-float-search");
        searchBox.append(icon("search"));
        const searchInput = el("input");
        searchInput.type = "search";
        searchInput.id = "cv-object-search";
        searchInput.placeholder = "Suchen nach Objekten";
        searchInput.setAttribute("aria-label", "Suchen nach Objekten");
        searchInput.autocomplete = "off";
        searchInput.spellcheck = false;
        searchBox.append(searchInput);
        const rules = el("div", "cv-rules");
        rules.id = "cv-rules";
        const addRule = el("button", "cv-link cv-rule-add");
        addRule.type = "button";
        addRule.id = "cv-rule-add";
        addRule.append(icon("plus"), document.createTextNode("Filter hinzuf\u00fcgen"));
        addRule.addEventListener("click", () => {
          if (handlers.addRule) handlers.addRule(addRule);
        });
        const status = el("div", "cv-filter-status");
        status.id = "cv-filter-status";
        status.setAttribute("aria-live", "polite");
        filter.body.append(searchBox, rules, addRule, status);
        let searchTimer = 0;
        searchInput.addEventListener("input", () => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => handlers.search(searchInput.value), SEARCH_DEBOUNCE_MS);
        });

        /*
         * colouring panel (REQ-005 `Faerben`, DEC-15; TASK-016) as the reference (ref L1509-1631, CSS L1824-1846;
         * screenshots ref-08, ref-09): kicker `Faerben` with the red link `Entfernen` while colouring is active; step 1
         * the property list with the search `Parameter suchen` (label and group per entry, virtualised: catalogues
         * reach thousands of properties); step 2 the chosen property with `Aendern`, the modes `Unterschiedliche
         * Farben` | `Farbskala`, for `Farbskala` the swatches, `Eigene Farbe` and the gradient labelled with the first
         * and last value, and the legend of the shown elements (14 px swatch, value, count; at most COLOUR_LEGEND_LIMIT
         * rows, then `+<n> weitere Werte`; none: `Keine Werte vorhanden`) with the repeat note of DEC-15.
         */
        const colour = floatPanel("cv-colour-panel", "F\u00e4rben", "F\u00e4rben");
        colour.panel.classList.add("cv-colour-panel");
        colour.reset.textContent = "Entfernen";
        colour.reset.id = "cv-colour-reset";
        colour.reset.addEventListener("click", () => handlers.clearColour());
        // step 1: property list
        const colourChoose = el("div", "cv-colour-step cv-colour-choose");
        const colourSearchBox = el("label", "cv-float-search");
        colourSearchBox.append(icon("search"));
        const colourSearch = el("input");
        colourSearch.type = "search";
        colourSearch.id = "cv-colour-search";
        colourSearch.placeholder = "Parameter suchen";
        colourSearch.setAttribute("aria-label", "Parameter suchen");
        colourSearch.autocomplete = "off";
        colourSearch.spellcheck = false;
        colourSearchBox.append(colourSearch);
        const colourList = createVirtualList({
          className: "cv-colour-list",
          rowHeight: COLOUR_LIST_ROW_HEIGHT,
          maxRows: 0,
          createRow() {
            const row = el("button", "cv-suggest-item cv-colour-item");
            row.type = "button";
            row.append(el("span", "cv-suggest-label"), el("span", "cv-suggest-group"));
            return row;
          },
          updateRow(row, entry) {
            const [label, group] = row.children;
            row.dataset.key = entry.key;
            const on = Boolean(colourData && colourData.current && colourData.current.key === entry.key);
            row.classList.toggle("cv-on", on);
            row.setAttribute("aria-pressed", String(on));
            row.title = entry.header + (entry.group ? " (" + entry.group + ")" : "");
            label.textContent = entry.header;
            group.textContent = entry.group || "";
          },
        });
        colourList.element.id = "cv-colour-list";
        colourList.element.setAttribute("role", "group");
        colourList.element.setAttribute("aria-label", "Parameter");
        const colourNone = el("div", "cv-suggest-more", "Kein Parameter gefunden");
        colourNone.hidden = true;
        colourChoose.append(colourSearchBox, colourList.element, colourNone);
        // step 2: chosen property, modes, scale colours, gradient, legend
        const colourShow = el("div", "cv-colour-step cv-colour-show");
        const param = el("button", "cv-colour-param");
        param.type = "button";
        param.id = "cv-colour-param";
        param.title = "Anderen Parameter w\u00e4hlen";
        const paramText = el("span", "cv-colour-param-text");
        const paramLabel = el("span", "cv-suggest-label");
        const paramGroup = el("span", "cv-suggest-group");
        paramText.append(paramLabel, paramGroup);
        param.append(paramText, el("span", "cv-colour-change", "\u00c4ndern"));
        const modes = el("div", "cv-colour-modes");
        modes.setAttribute("role", "group");
        modes.setAttribute("aria-label", "Farbmodus");
        const modeButtons = COLOUR_MODES.map(([mode, label]) => {
          const button = el("button", "cv-colour-mode", label);
          button.type = "button";
          button.dataset.mode = mode;
          button.addEventListener("click", () => handlers.colourMode(mode));
          modes.append(button);
          return button;
        });
        const scaleBox = el("div", "cv-colour-scale");
        const swatches = el("div", "cv-swatches");
        swatches.setAttribute("role", "group");
        swatches.setAttribute("aria-label", "Skalenfarbe");

          handle.addEventListener("keydown", (event) => {
            const c = indexOfKey(cell.dataset.key);
            if (c === -1) return;
            let delta = 0;
            if (event.key === "ArrowRight") delta = RESIZE_STEP;
            else if (event.key === "ArrowLeft") delta = -RESIZE_STEP;
            else return;
            event.preventDefault();
            handlers.resize(cell.dataset.key, columns[c].width + delta);
          });
        }

        function clearDropMarks() {
          for (const cell of headCells) cell.classList.remove("cv-drop-before", "cv-drop-after", "cv-dragging");
        }

        function wireDrag(cell) {
          cell.addEventListener("dragstart", (event) => {
            if (resizing || event.target !== cell) {
              if (resizing) event.preventDefault();
              if (resizing || !cell.contains(event.target)) return;
            }
            dragKey = cell.dataset.key;
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("application/x-cv-column", dragKey);
            event.dataTransfer.setData("text/plain", dragKey);
            cell.classList.add("cv-dragging");
          });
          cell.addEventListener("dragend", () => {
            dragKey = null;
            clearDropMarks();
          });
          cell.addEventListener("dragover", (event) => {
            if (dragKey === null) return;
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
            const box = cell.getBoundingClientRect();
            const before = event.clientX < box.left + box.width / 2;
            cell.classList.toggle("cv-drop-before", before);
            cell.classList.toggle("cv-drop-after", !before);
          });
          cell.addEventListener("dragleave", (event) => {
            if (!cell.contains(event.relatedTarget)) cell.classList.remove("cv-drop-before", "cv-drop-after");
          });
          cell.addEventListener("drop", (event) => {
            if (dragKey === null) return;
            event.preventDefault();
            const box = cell.getBoundingClientRect();
            const before = event.clientX < box.left + box.width / 2;
            const source = dragKey;
            dragKey = null;
            clearDropMarks();
            if (source === cell.dataset.key) return;
            const from = movableIndex(source);
            let to = movableIndex(cell.dataset.key) + (before ? 0 : 1);
            if (from < to) to--;
            if (from !== -1 && from !== to) handlers.move(source, to);
          });
        }

        function createRow() {
          const node = el("div", "cv-tr");
          node.setAttribute("role", "row");
          node.style.height = TABLE_ROW_HEIGHT + "px";
          node.cvCells = [];
          node.cvIndex = -1;
          body.append(node);
          return node;
        }

        function cellAt(node, p) {
          let cell = node.cvCells[p];
          if (!cell) {
            cell = el("div", "cv-td");
            cell.setAttribute("role", "gridcell");
            cell.cvText = null;
            cell.cvGroup = null;
            cell.cvPad = "";
            node.cvCells[p] = cell;
            node.append(cell);
          }
          return cell;
        }

        /** Plain text cell (a former group cell loses its toggle). */
        function setCellText(cell, text) {
          if (cell.cvGroup !== null) {
            cell.cvGroup = null;
            cell.cvText = null;
            cell.replaceChildren();
          }
          if (cell.cvText !== text) {
            cell.cvText = text;
            cell.textContent = text;
            cell.title = text;
          }
        }

        /** `Gruppe` cell of a group row: expand toggle and the group value. */
        function setCellGroup(cell, item, expanded) {
          let parts = cell.cvGroup;
          if (parts === null) {
            const toggle = el("button", "cv-grp-toggle");
            toggle.type = "button";
            toggle.append(icon("chevron"));
            const label = el("span", "cv-grp-label");
            cell.replaceChildren(toggle, label);
            parts = { toggle, label, id: null, text: null, expanded: null };
            cell.cvGroup = parts;
            cell.cvText = null;
          }
          if (parts.text !== item.label) {
            parts.text = item.label;
            parts.label.textContent = item.label;
            cell.title = item.label;
          }
          if (parts.id !== item.group.id || parts.expanded !== expanded) {
            parts.id = item.group.id;
            parts.expanded = expanded;
            parts.toggle.dataset.group = item.group.id;
            parts.toggle.setAttribute("aria-expanded", String(expanded));
            const name = (expanded ? "Gruppe zuklappen: " : "Gruppe aufklappen: ") + item.label;
            parts.toggle.setAttribute("aria-label", name);
            parts.toggle.title = name;
          }
        }

        function setCellPad(cell, pad) {
          if (cell.cvPad !== pad) {
            cell.cvPad = pad;
            cell.style.paddingLeft = pad;
          }
        }

        function setCellNum(cell, numeric) {
          if (cell.cvNum !== numeric) {
            cell.cvNum = numeric;
            cell.classList.toggle("cv-num", numeric);
          }
        }

        /** Value of column col in a grouping-view item (group: aggregate; element: the row's value). */
        function itemValue(item, row, key) {
          if (item.type === "group") {
            if (key === COUNT_COLUMN) return item.group.count;
            return item.group.cells[key];
          }
          return key === COUNT_COLUMN ? null : row.values[key];
        }

        /** Total row `Summe` (grouping view): Anzahl and the sums of every column (all cells; one row). */
        function renderTotal() {
          const signature = columns.map((c) => c.key + ":" + c.width).join("|");
          if (foot.cvSignature !== signature) {
            foot.cvSignature = signature;
            foot.replaceChildren();
            foot.cvCells = columns.map((col, c) => {
              const cell = el("div", "cv-td");
              cell.setAttribute("role", "gridcell");
              cell.dataset.col = col.key;
              cell.setAttribute("aria-colindex", String(c + 1));
              cell.style.left = offsets[c] + "px";
              cell.style.width = col.width + "px";
              foot.append(cell);
              return cell;
            });
          }
          foot.style.width = offsets[columns.length] + "px";
          columns.forEach((col, c) => {
            const cell = foot.cvCells[c];
            let text = "";
            let numeric = false;
            if (col.key === GROUP_COLUMN) text = "Summe";
            else if (total) {
              const value = col.key === COUNT_COLUMN ? total.count : total.cells[col.key];
              numeric = typeof value === "number";
              text = numeric ? formatCell(value) : "";
            }
            if (cell.textContent !== text) cell.textContent = text;
            cell.title = text;
            cell.classList.toggle("cv-num", numeric);
          });
        }

        /** Hides an unused cell and drops its column and text, so no hidden cell carries a stale value (D-a). */
        function parkCell(cell) {
          cell.hidden = true;
          delete cell.dataset.col;
          cell.removeAttribute("aria-colindex");
          setCellText(cell, "");
          cell.removeAttribute("title");
        }

        /** Drops the cells beyond the column count of every row (after columns were removed, D-a). */
        function trimCells() {
          for (const node of pool) {
            while (node.cvCells.length > columns.length) node.cvCells.pop().remove();
          }
        }

        /** Renders the rows and columns near the visible window (on scroll, resize and every update). */
        function render() {
          const t0 = performance.now();
          const viewHeight = Math.max(0, (scroll.clientHeight || 300) - TABLE_HEAD_HEIGHT);
          const top = Math.max(0, scroll.scrollTop);
          const first = Math.max(0, Math.floor(top / TABLE_ROW_HEIGHT) - TABLE_OVERSCAN_ROWS);
          const last = Math.min(rowCount, Math.ceil((top + viewHeight) / TABLE_ROW_HEIGHT) + TABLE_OVERSCAN_ROWS);
          const left = scroll.scrollLeft - TABLE_OVERSCAN_PX;
          const right = scroll.scrollLeft + (scroll.clientWidth || 800) + TABLE_OVERSCAN_PX;
          // grouping view: the leading fixed columns (Gruppe, Anzahl) are pinned at the left edge (UX M3)
          let pinned = 0;
          if (grouped) while (pinned < columns.length && columns[pinned].fixed) pinned++;
          const shift = Math.max(0, scroll.scrollLeft);
          // scrolling an element into view (focus, find) keeps it clear of the pinned columns
          const padLeft = pinned ? offsets[pinned] + "px" : "";
          if (scroll.style.scrollPaddingLeft !== padLeft) scroll.style.scrollPaddingLeft = padLeft;
          let c0 = pinned;
          while (c0 < columns.length && offsets[c0 + 1] < left) c0++;
          let c1 = c0;
          while (c1 < columns.length && offsets[c1] <= right) c1++;
          const shown = [];
          for (let c = 0; c < pinned; c++) shown.push(c);
          for (let c = c0; c < c1; c++) shown.push(c);
          // head cells are written only when their place changes (a write during a column drag ends the drag)
          for (let c = 0; c < headCells.length; c++) {
            const cell = headCells[c];
            const pin = c < pinned;
            const leftPx = offsets[c] + (pin ? shift : 0) + "px";
            if (cell.style.left !== leftPx) cell.style.left = leftPx;
            if (cell.cvPin !== pin) {
              cell.cvPin = pin;
              cell.classList.toggle("cv-pinned", pin);
            }
            const edge = pin && c === pinned - 1;
            if (cell.cvPinEdge !== edge) {
              cell.cvPinEdge = edge;
              cell.classList.toggle("cv-pin-edge", edge);
            }
          }
          while (pool.length < last - first) pool.push(createRow());
          for (let p = 0; p < pool.length; p++) {
            const node = pool[p];
            const index = first + p;
            if (index >= last) {
              if (!node.hidden) {
                node.hidden = true;
                node.cvIndex = -1;
                delete node.dataset.key;
              }
              continue;
            }
            const item = grouped ? items[index] : null;
            const row = grouped ? (item.type === "element" ? rows[item.index] : null) : rows[order[index]];
            node.hidden = false;
            node.cvIndex = index;
            node.style.top = index * TABLE_ROW_HEIGHT + "px";
            node.style.width = offsets[columns.length] + "px";
            node.setAttribute("aria-rowindex", String(index + 2));
            node.classList.toggle("cv-odd", index % 2 === 1);
            const kind = item ? item.type : "single";
            const expanded = item && item.type === "group" ? item.expanded : false;
            if (node.cvKind !== kind || (item && item.type === "group" && node.cvLevel !== item.group.level)) {
              node.cvKind = kind;
              node.cvLevel = item && item.type === "group" ? item.group.level : 0;
              node.classList.toggle("cv-grp", kind === "group");
              node.classList.toggle("cv-grp-l1", kind === "group" && node.cvLevel === 1);
              node.classList.toggle("cv-grp-l2", kind === "group" && node.cvLevel === 2);
              node.classList.toggle("cv-tr-el", kind === "element");
              if (kind === "single") {
                node.removeAttribute("aria-level");
                node.removeAttribute("aria-expanded");
              }
            }
            if (row) {
              node.dataset.key = row.key;
              delete node.dataset.group;
              delete node.dataset.level;
            } else {
              delete node.dataset.key;
              node.dataset.group = item.group.id;
              node.dataset.level = String(item.group.level);
            }
            const atCursor = index === cursor;
            if (node.cvCursor !== atCursor) {
              node.cvCursor = atCursor;
              node.classList.toggle("cv-cursor", atCursor);
              if (atCursor) node.id = "cv-tr-cursor";
              else node.removeAttribute("id");
            }
            const on = row ? selKeys !== null && selKeys.has(row.key) : selGroup !== null && item.group.id === selGroup;
            if (node.cvSel !== on) {
              node.cvSel = on;
              node.classList.toggle("cv-sel", on);
              if (on) node.setAttribute("aria-selected", "true");
              else node.removeAttribute("aria-selected");
            }
            if (item) {
              const level = item.type === "group" ? item.group.level : item.depth + 1;
              if (node.cvAriaLevel !== level) {
                node.cvAriaLevel = level;
                node.setAttribute("aria-level", String(level));
                node.dataset.depth = String(level - 1);
              }
              if (item.type === "group") node.setAttribute("aria-expanded", String(expanded));
              else node.removeAttribute("aria-expanded");
            } else if (node.cvAriaLevel !== undefined) {
              node.cvAriaLevel = undefined;
              delete node.dataset.depth;
            }
            let q = 0;
            for (const c of shown) {
              const col = columns[c];
              const cell = cellAt(node, q++);
              cell.hidden = false;
              const pin = c < pinned;
              cell.style.left = offsets[c] + (pin ? shift : 0) + "px";
              if (cell.cvPin !== pin || cell.cvPinEdge !== (pin && c === pinned - 1)) {
                cell.cvPin = pin;
                cell.cvPinEdge = pin && c === pinned - 1;
                cell.classList.toggle("cv-pinned", pin);
                cell.classList.toggle("cv-pin-edge", cell.cvPinEdge);
              }
              cell.style.width = col.width + "px";
              cell.dataset.col = col.key;
              cell.setAttribute("aria-colindex", String(c + 1));
              if (col.key === GROUP_COLUMN && item) {
                // indentation by level: level-1 groups, level-2 groups, element rows below their group (REQ-006-AC3)
                const depth = item.type === "group" ? item.group.level - 1 : item.depth;
                setCellPad(cell, 4 + depth * GROUP_INDENT + "px");
                if (item.type === "group") setCellGroup(cell, item, expanded);
                else setCellText(cell, "");
                cell.classList.toggle("cv-td-el", item.type === "element");
                setCellNum(cell, false);
                continue;
              }
              if (cell.cvPad !== "") setCellPad(cell, "");
              if (cell.classList.contains("cv-td-el")) cell.classList.remove("cv-td-el");
              const value = item ? itemValue(item, row, col.key) : row.values[col.key];
              setCellText(cell, formatCell(value));
              setCellNum(cell, typeof value === "number");
            }
            // cells of columns outside the visible width (or of removed columns, D-a) keep no stale column or text
            for (; q < node.cvCells.length; q++) if (!node.cvCells[q].hidden) parkCell(node.cvCells[q]);
          }
          if (cursor >= first && cursor < last) scroll.setAttribute("aria-activedescendant", "cv-tr-cursor");
          else scroll.removeAttribute("aria-activedescendant");
          if (grouped) {
            renderTotal();
            foot.cvCells.forEach((cell, c) => {
              const pin = c < pinned;
              cell.style.left = offsets[c] + (pin ? shift : 0) + "px";
              cell.classList.toggle("cv-pinned", pin);
              cell.classList.toggle("cv-pin-edge", pin && c === pinned - 1);
            });
          }
          const ms = performance.now() - t0;
          stats.renders++;
          stats.lastMs = ms;
          if (ms > stats.maxMs) stats.maxMs = ms;
        }

        scroll.addEventListener("scroll", render, { passive: true });
        new ResizeObserver(() => render()).observe(scroll);
        body.addEventListener("click", (event) => {
          const toggle = event.target.closest(".cv-grp-toggle");
          if (toggle && toggle.dataset.group !== undefined) {
            event.stopPropagation();
            handlers.toggleGroup(toggle.dataset.group);
            return;
          }
          const node = event.target.closest(".cv-tr");
          if (node && node.cvIndex >= 0) cursor = node.cvIndex;
          if (node && node.dataset.key) handlers.rowClick(node.dataset.key);
          else if (node && node.dataset.group !== undefined && handlers.groupClick) handlers.groupClick(node.dataset.group);
        });

        /** The display row at index: { key } (element row) or { group, expanded } (group row). */
        function displayRow(index) {
          if (!grouped) return { key: rows[order[index]].key };
          const item = items[index];
          return item.type === "group" ? { group: item.group.id, expanded: item.expanded } : { key: rows[item.index].key };
        }
        // Keyboard (REQ-007 without a mouse): arrows / Page / Home / End move the row cursor, Enter or Space select
        // the row like a click, in the grouped view Right / Left expand / collapse a group row.
        scroll.addEventListener("keydown", (event) => {
          if (event.target !== scroll || !rowCount || event.altKey || event.ctrlKey || event.metaKey) return;
          const page = Math.max(1, Math.floor((scroll.clientHeight - TABLE_HEAD_HEIGHT) / TABLE_ROW_HEIGHT) - 1);
          const moves = { ArrowDown: 1, ArrowUp: -1, PageDown: page, PageUp: -page };
          let next = null;
          if (event.key in moves) next = cursor < 0 ? 0 : cursor + moves[event.key];
          else if (event.key === "Home") next = 0;
          else if (event.key === "End") next = rowCount - 1;
          if (next !== null) {
            cursor = Math.max(0, Math.min(rowCount - 1, next));
            event.preventDefault();
            api.reveal(cursor);
            return;
          }
          if (cursor < 0 || cursor >= rowCount) return;
          const target = displayRow(cursor);
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            if (target.key !== undefined) handlers.rowClick(target.key);
            else if (handlers.groupClick) handlers.groupClick(target.group);
          } else if ((event.key === "ArrowRight" || event.key === "ArrowLeft") && target.group !== undefined) {
            if (target.expanded !== (event.key === "ArrowRight")) handlers.toggleGroup(target.group);
            event.preventDefault();
          }
        });

        function setHeights(emptyText) {
          const height = rowCount * TABLE_ROW_HEIGHT;
          const footHeight = grouped ? TABLE_ROW_HEIGHT : 0;
          body.style.height = height + "px";
          inner.style.height = TABLE_HEAD_HEIGHT + height + footHeight + "px";
          scroll.setAttribute("aria-rowcount", String(rowCount + 1 + (grouped ? 1 : 0)));
          foot.setAttribute("aria-rowindex", String(rowCount + 2));
          foot.hidden = !grouped;
          scroll.setAttribute("role", grouped ? "treegrid" : "grid");
          scroll.setAttribute("aria-label", grouped ? "Tabelle gruppiert" : "Tabelle Einzelelemente");
          empty.hidden = rowCount > 0 && columns.length > 0;
          empty.textContent = columns.length ? emptyText : "Keine Spalten. \u00dcber \u201eSpalten\u201c hinzuf\u00fcgen.";
          const maxTop = Math.max(0, inner.offsetHeight - scroll.clientHeight);
          if (scroll.scrollTop > maxTop) scroll.scrollTop = maxTop;
          render();
        }

        const api = {
          element: scroll,
          /**
           * Columns [{ key, title, kind 'number' | 'text', width, sort 'asc' | 'desc' | null, filtered }] in display
           * order; header cells are rebuilt only when keys or titles change, else updated in place.
           */
          setColumns(specs) {
            const signature = JSON.stringify(specs.map((s) => [s.key, s.title]));
            columns = specs.map((s) => ({ ...s }));
            if (signature !== headSignature) {
              headSignature = signature;
              headCells = columns.map(headCell);
              head.replaceChildren(...headCells);
              scroll.setAttribute("aria-colcount", String(columns.length));
              trimCells();
            }
            columns.forEach((col, c) => setHeadState(headCells[c], col));
            layoutColumns();
            render();
          },
          /** Single-element view: rows (store rows) and the display order (row indices); emptyText when none shown. */
          setRows(rowList, displayOrder, emptyText) {
            rows = rowList;
            order = displayOrder;
            grouped = false;
            items = [];
            total = null;
            rowCount = order.length;
            if (cursor >= rowCount) cursor = rowCount - 1;
            setHeights(emptyText);
          },
          /**
           * Grouping view (TASK-006b): rows (store rows), display items [{ type: 'group', group, label, expanded } |
           * { type: 'element', index, depth }] and the total { count, cells } of the total row; emptyText when no
           * group is shown.
           */
          setGroups(rowList, displayItems, totalRow, emptyText) {
            rows = rowList;
            items = displayItems;
            total = totalRow;
            grouped = true;
            rowCount = items.length;
            if (cursor >= rowCount) cursor = rowCount - 1;
            setHeights(emptyText);
          },
          /**
           * Selection (REQ-007): keys (iterable of element row keys) whose rows are marked, and the id of a selected
           * group row (or null); the marks follow the rows through sort, scroll, column and view changes.
           */
          setSelection(keys, groupId) {
            selKeys = keys ? new Set(keys) : null;
            if (selKeys && !selKeys.size) selKeys = null;
            selGroup = groupId === undefined ? null : groupId;
            render();
          },
          /** Scrolls the least needed to show display row index fully between the sticky header and total row. */
          reveal(index) {
            if (!(index >= 0 && index < rowCount)) return;
            const footHeight = grouped ? TABLE_ROW_HEIGHT : 0;
            const view = Math.max(TABLE_ROW_HEIGHT, scroll.clientHeight - TABLE_HEAD_HEIGHT - footHeight);
            const top = index * TABLE_ROW_HEIGHT;
            if (top < scroll.scrollTop) scroll.scrollTop = top;
            else if (top + TABLE_ROW_HEIGHT > scroll.scrollTop + view) scroll.scrollTop = top + TABLE_ROW_HEIGHT - view;
            render();
          },
          /** Back to the first row (view switch `Einzelelemente` / `Gruppiert`, new grouping). */
          scrollToTop() {
            scroll.scrollTop = 0;
            render();
          },
          /** Header cell of a column (anchor of its filter popup). */
          headerCell: (key) => headCells[indexOfKey(key)] || null,
          /** Render statistics (perf tests): { renders, lastMs, maxMs, rowNodes, cellNodes }. */
          stats() {
            let cellNodes = 0;
            for (const node of pool) cellNodes += node.cvCells.length;
            return { ...stats, rowNodes: pool.length, cellNodes };
          },
          rowHeight: TABLE_ROW_HEIGHT,
          headHeight: TABLE_HEAD_HEIGHT,
          render,
        };
        return api;
      }

      /** Bound shown in a range input: German decimal comma, full precision, no grouping (REQ-006, D2). */
      function boundText(value) {
        return value === null || value === undefined
          ? ""
          : value.toLocaleString("de-DE", { maximumFractionDigits: 20, useGrouping: false });
      }

      /**
       * Column filter popup (REQ-006) anchored under a header cell. spec: { key, title, kind 'number' | 'text', sort,
       * filter ({ values } | { min, max } | null), facet (facetCounts entry, text columns), range ({ min, max } of the
       * column under the other filters, number columns) }. Text columns: value checklist with search (OR within the
       * column); number columns: `von` / `bis` (inclusive, empty = no bound; German decimal comma or point; invalid
       * input shows a hint and is ignored, D2). handlers: { toggle(value, checked), range(min, max) (undefined =
       * unchanged), reset(), sort(dir), remove(), close() }.
       */
      function openColumnFilter(host, anchor, spec, handlers) {
        const popup = el("div", "cv-popup cv-colfilter");
        popup.id = "cv-colfilter";
        popup.dataset.key = spec.key;
        popup.setAttribute("role", "dialog");
        popup.setAttribute("aria-label", "Spaltenfilter: " + spec.title);
        const head = el("div", "cv-popup-head");
        const title = el("div", "cv-popup-title", spec.title);
        title.title = spec.title;
        const close = iconButton("close", "Schlie\u00dfen", "cv-popup-close");
        head.append(title, close);

        const sortRow = el("div", "cv-colfilter-sort");
        const sortButtons = {};
        for (const [dir, text, name] of [
          ["asc", "Aufsteigend", "sortAsc"],
          ["desc", "Absteigend", "sortDesc"],
        ]) {
          const button = el("button", "cv-btn cv-small");
          button.type = "button";
          button.dataset.dir = dir;
          button.append(icon(name), document.createTextNode(text));
          button.setAttribute("aria-label", text + " sortieren");
          button.addEventListener("click", () => handlers.sort(dir));
          sortButtons[dir] = button;
          sortRow.append(button);
        }
        const body = el("div", "cv-popup-body");
        const foot = el("div", "cv-popup-foot");
        const reset = el("button", "cv-link", "Filter zur\u00fccksetzen");
        reset.type = "button";
        reset.addEventListener("click", () => handlers.reset());
        const remove = el("button", "cv-link cv-colfilter-remove", "Spalte entfernen");
        remove.type = "button";
        remove.addEventListener("click", () => handlers.remove());
        foot.append(reset, remove);
        popup.append(head, sortRow, body, foot);

        let current = spec;
        let api = null;
        if (spec.kind === "number") {
          const grid = el("div", "cv-range");
          const inputs = {};
          for (const [name, text] of [
            ["min", "von"],
            ["max", "bis"],
          ]) {
            const label = el("label", "cv-range-field");
            const input = el("input");
            input.type = "text";
            input.inputMode = "decimal";
            input.autocomplete = "off";
            input.spellcheck = false;
            input.dataset.bound = name;
            input.setAttribute("aria-label", text + ": " + spec.title);
            input.placeholder = "keine Grenze";
            label.append(el("span", "cv-range-name", text), input);
            inputs[name] = input;
            grid.append(label);
          }
          const hint = el("p", "cv-range-hint");
          hint.setAttribute("role", "status");
          hint.setAttribute("aria-live", "polite");
          const info = el("p", "cv-hint cv-range-info");
          body.append(grid, hint, info);
          const apply = () => {
            const bad = [];
            const out = {};
            for (const [name, text] of [
              ["min", "von"],
              ["max", "bis"],
            ]) {
              const parsed = parseNumberInput(inputs[name].value);
              inputs[name].setAttribute("aria-invalid", String(!parsed.valid));
              if (parsed.valid) out[name] = parsed.value;
              else bad.push("\u201e" + text + "\u201c");
            }
            hint.textContent = bad.length
              ? "Ung\u00fcltige Zahl in " +
                bad.join(" und ") +
                " \u2013 die Eingabe wird ignoriert. Beispiel: 2,5"
              : "";
            hint.hidden = !bad.length;
            place(); // the hint changes the height
            handlers.range(out.min, out.max);
          };
          for (const input of Object.values(inputs)) {
            input.addEventListener("input", apply);
            input.addEventListener("keydown", (event) => {
              if (event.key === "Enter") apply();
            });
          }
          const fill = (s) => {
            const f = s.filter || {};
            for (const name of ["min", "max"]) {
              const input = inputs[name];
              if (document.activeElement === input) continue; // keep what the user is typing
              const parsed = parseNumberInput(input.value);
              const applied = f[name] === undefined ? null : f[name];
              if (!(parsed.valid && parsed.value === applied)) {
                input.value = boundText(applied);
                input.setAttribute("aria-invalid", "false");
              }
            }
            info.textContent = s.range
              ? "Werte: " + formatCell(s.range.min) + " \u2013 " + formatCell(s.range.max) + ". Grenzen inklusive, leeres Feld = keine Grenze."
              : "Keine Werte.";
          };
          hint.hidden = true;
          fill(spec);
          api = { fill, focus: () => inputs.min.focus() };
        } else {
          const search = el("label", "cv-search");
          const input = el("input");
          input.type = "search";
          input.placeholder = "Werte suchen";
          input.setAttribute("aria-label", "Werte suchen: " + spec.title);
          search.append(icon("search"), input);
          const emptyHint = el("p", "cv-hint");
          const list = createVirtualList({
            className: "cv-fs-values cv-colfilter-values",
            rowHeight: VALUE_ROW_HEIGHT,
            maxRows: VALUE_MAX_ROWS,
            createRow() {
              const row = el("label", "cv-fs-value");
              const box = el("input");
              box.type = "checkbox";
              row.append(box, el("span", "cv-fs-label"), el("span", "cv-fs-count"));
              return row;
            },
            updateRow(row, item) {
              const [box, label, count] = row.children;
              const text = valueLabel(item.value);
              box.checked = item.checked;
              box.setAttribute("aria-label", text);
              row.classList.toggle("cv-checked", item.checked);
              row.classList.toggle("cv-zero", item.count === 0);
              label.textContent = text;
              label.title = valueTitle(item.value);
              label.classList.toggle("cv-empty-value", item.value === null);
              count.textContent = formatCount(item.count);
            },
          });
          body.append(search, list.element, emptyHint);
          let query = "";
          const fill = (s, resetScroll) => {
            const values = s.facet ? s.facet.values : [];
            let shown = values;
            if (query) shown = values.filter((item) => valueLabel(item.value).toLowerCase().includes(query));
            list.setItems(shown, resetScroll);
            list.element.hidden = !shown.length;
            emptyHint.hidden = shown.length > 0;
            emptyHint.textContent = values.length ? "Keine Treffer." : "Keine Werte.";
          };
          input.addEventListener("input", () => {
            query = input.value.trim().toLowerCase();
            fill(current, true);
          });
          list.element.addEventListener("change", (event) => {
            const item = list.itemOf(event.target);
            if (item) handlers.toggle(item.value, event.target.checked);
          });
          fill(spec, true);
          api = { fill, focus: () => input.focus() };
        }

        function setState(s) {
          current = s;
          for (const [dir, button] of Object.entries(sortButtons)) {
            button.classList.toggle("cv-on", s.sort === dir);
            button.setAttribute("aria-pressed", String(s.sort === dir));
          }
          const active = Boolean(s.filter);
          reset.disabled = !active;
        }
        setState(spec);
        host.append(popup);

        function place() {
          const hostBox = host.getBoundingClientRect();
          const box = anchor.getBoundingClientRect();
          const width = popup.offsetWidth;
          const left = Math.max(8, Math.min(box.right - width, hostBox.width - width - 8));
          let top = box.bottom - hostBox.top + 4;
          const maxTop = hostBox.height - popup.offsetHeight - 8;
          if (top > maxTop) top = Math.max(8, box.top - hostBox.top - popup.offsetHeight - 4);
          popup.style.left = left + "px";
          popup.style.top = top + "px";
        }
        place();
        api.focus();

        let open = true;
        function finish() {
          if (!open) return;
          open = false;
          document.removeEventListener("keydown", onKey, true);
          document.removeEventListener("pointerdown", onDown, true);
          popup.remove();
          handlers.close();
        }
        function onKey(event) {
          if (event.key !== "Escape") return;
          event.preventDefault(); // handled: Escape closes the popup only (not the 3D selection)
          finish();
        }
        function onDown(event) {
          if (popup.contains(event.target)) return;
          if (anchor.contains(event.target)) return; // the filter button toggles itself
          finish();
        }
        document.addEventListener("keydown", onKey, true);
        document.addEventListener("pointerdown", onDown, true);
        close.addEventListener("click", finish);
        return {
          key: spec.key,
          element: popup,
          close: finish,
          /** New state (facet values, filter, sort) after a refresh. */
          update(s) {
            setState(s);
            api.fill(s, false);
          },
          place,
        };
      }

      /**
       * Column chooser `Spalten` (REQ-006): the shown columns (move up/down, remove) above the property catalogue
       * (search, add; the dialog stays open). handlers: { columns() -> [{ key, title }], add(key), remove(key),
       * step(key, delta) }; refresh() re-reads the columns.
       */
      function openColumnChooser(host, entries, handlers) {
        const top = el("div", "cv-chooser");
        const heading = el("div", "cv-chooser-title", "Angezeigte Spalten");
        const list = el("ol", "cv-chooser-list");
        list.id = "cv-chooser-list";
        top.append(heading, list, el("div", "cv-chooser-title", "Spalte hinzuf\u00fcgen"));
        const used = new Set();
        let dialog = null;
        function refresh() {
          const cols = handlers.columns();
          used.clear();
          for (const c of cols) used.add(c.key);
          list.replaceChildren();
          cols.forEach((col, i) => {
            const item = el("li", "cv-chooser-item");
            item.dataset.key = col.key;
            const name = el("span", "cv-chooser-name", col.title);
            name.title = col.title;
            const up = iconButton("up", "Spalte nach links: " + col.title);
            up.disabled = i === 0;
            up.addEventListener("click", () => {
              handlers.step(col.key, -1);
              refresh();
            });
            const down = iconButton("down", "Spalte nach rechts: " + col.title);
            down.disabled = i === cols.length - 1;
            down.addEventListener("click", () => {
              handlers.step(col.key, 1);
              refresh();
            });
            const remove = iconButton("close", "Spalte entfernen: " + col.title);
            remove.addEventListener("click", () => {
              handlers.remove(col.key);
              refresh();
            });
            item.append(name, up, down, remove);
            list.append(item);
          });
          if (!cols.length) list.append(el("li", "cv-hint", "Keine Spalten."));
          if (dialog) dialog.refresh();
        }
        refresh();
        dialog = openCatalogue(
          host,
          entries,
          used,
          (key) => {
            handlers.add(key);
            refresh();
          },
          "Spalten",
          { keepOpen: true, top, usedNote: "angezeigt", usedLabel: "bereits als Spalte", className: "cv-columns-dialog", onClose: handlers.close },
        );
        return { close: dialog.close, refresh, element: dialog.element };
      }

      /** Text of a property value in the details panel: numbers in German format (up to 3 decimals) with unit. */
      function detailText(value, entry) {
        if (Array.isArray(value)) return value.map((v) => detailText(v, entry)).join(", ");
        if (typeof value === "number") {
          const text = value.toLocaleString("de-DE", { maximumFractionDigits: 3 });
          return entry && entry.kind === "number" && entry.unit && entry.unit !== "gemischt" ? text + " " + entry.unit : text;
        }
        if (value === null || value === undefined) return "";
        return String(value);
      }

      /** Rank of a details group: `Allgemein` first, then psets, then type psets (`Typ: ...`; REQ-007). */
      const groupRank = (group) => (group === "Allgemein" ? 0 : group.indexOf("Typ: ") === 0 ? 2 : 1);

      /**
       * Properties panel (REQ-007, CR-002; TASK-013): a floating panel at the top right inside the 3D view as the
       * reference (ref L884-939), hidden while nothing is selected. Header: kicker `Kategorie`, title `Name`, a chip with
       * the `Modell` value, the buttons `Ausblenden` / `Isolieren` (REQ-013) and `Schliessen`. Body: all properties of
       * the element grouped as the property catalogue (attributes and special properties, then psets, then type psets),
       * groups collapsible (state kept per group name); each property row carries the row tools `Nach Wert filtern`
       * (REQ-003) and `Farbe nach Wert` (REQ-005), shown on hover and keyboard focus. A group selection shows
       * `<n> Elemente ausgewaehlt` (and `Davon ohne 3D-Geometrie: <n>`) with the same buttons.
       * handlers: { clear(), hide(), isolate(), filterByValue(key, value), colourByValue(key) }; all but clear may be
       * absent (the control is then inert; `colourByValue` wired by TASK-016, the others by TASK-017b).
       */
      function createDetails(panel, handlers) {
        const collapsed = new Set();
        const call = (name, ...args) => {
          if (typeof handlers[name] === "function") handlers[name](...args);
        };
        const head = el("div", "cv-props-head");
        const body = el("div", "cv-props-body");
        body.id = "cv-props-body";
        panel.append(head, body);

        function clear() {
          panel.hidden = true;
          head.replaceChildren();
          body.replaceChildren();
          delete panel.dataset.key;
          delete panel.dataset.group;
        }

        /** Header: kicker, title, close; then the chip (if any) and the buttons `Ausblenden` / `Isolieren`. */
        function fillHead(kicker, title, chip) {
          const top = el("div", "cv-det-head");
          const text = el("div", "cv-det-head-text");
          const titleNode = el("div", "cv-det-title", title);
          titleNode.id = "cv-props-title";
          text.append(el("div", "cv-det-kicker", kicker), titleNode);
          const close = iconButton("close", "Schlie\u00dfen", "cv-det-close");
          close.id = "cv-props-close";
          close.addEventListener("click", () => handlers.clear());
          top.append(text, close);
          const meta = el("div", "cv-props-meta");
          if (chip) {
            const chipNode = el("span", "cv-props-chip", chip);
            chipNode.title = "Modell: " + chip;
            meta.append(chipNode);
          }
          const actions = el("div", "cv-props-actions");
          for (const [name, label, title] of [
            ["hide", "Ausblenden", "Auswahl ausblenden"],
            ["isolate", "Isolieren", "Auswahl isolieren"],
          ]) {
            const button = el("button", "cv-props-action");
            button.type = "button";
            button.id = "cv-props-" + name;
            button.title = title;
            button.append(icon(name), el("span", "", label));
            button.addEventListener("click", () => call(name));
            actions.append(button);
          }
          meta.append(actions);
          head.replaceChildren(top, meta);
          panel.setAttribute("aria-labelledby", "cv-props-title");
        }

        function open() {
          panel.hidden = false;
          body.scrollTop = 0;
        }

        /**
         * Group selection (REQ-007 "clicking a group row highlights all its elements"): info { id, kicker (grouping
         * properties), title (group path), count, withoutGeometry }.
         */
        function showGroup(info) {
          fillHead(info.kicker, info.title, null);
          const count = info.count.toLocaleString("de-DE");
          const parts = [el("p", "cv-det-count", (info.count === 1 ? "1 Element" : count + " Elemente") + " ausgew\u00e4hlt")];
          if (info.withoutGeometry) {
            const hint = el("p", "cv-det-nogeo", "Davon ohne 3D-Geometrie: " + info.withoutGeometry.toLocaleString("de-DE"));
            hint.setAttribute("role", "note");
            parts.push(hint);
          }
          body.replaceChildren(...parts);
          delete panel.dataset.key;
          panel.dataset.group = info.id;
          open();
        }

        /** One property row: name, value text and the row tools (REQ-007). */
        function propRow(prop, name) {
          const row = el("div", "cv-prop-row");
          row.dataset.key = prop.key;
          const dt = el("dt", "cv-det-name", name);
          dt.title = prop.key;
          const dd = el("dd", "cv-det-value");
          const text = detailText(prop.value, prop.entry);
          const textNode = el("span", "cv-prop-text", text);
          textNode.title = text;
          dd.classList.toggle("cv-num", typeof prop.value === "number");
          const tools = el("span", "cv-row-tools");
          const filterTool = iconButton("filter", "Nach Wert filtern", "cv-row-tool");
          filterTool.addEventListener("click", () => call("filterByValue", prop.key, prop.value));
          const colourTool = iconButton("palette", "Farbe nach Wert", "cv-row-tool");
          colourTool.addEventListener("click", () => call("colourByValue", prop.key));
          tools.append(filterTool, colourTool);
          dd.append(textNode, tools);
          row.append(dt, dd);
          return row;
        }

        /** info: { row (spec 4.3), catalog (Map key -> entry), order (Map key -> catalogue position) }. */
        function show(info) {
          const row = info.row;
          const values = row.values;
          fillHead(
            values.Kategorie || "Element",
            values.Name !== undefined ? String(values.Name) : values.Kategorie || "",
            values.Modell !== undefined && values.Modell !== null ? String(values.Modell) : null,
          );
          const parts = [];
          if (!row.geometry) {
            const hint = el("p", "cv-det-nogeo", "Dieses Element hat keine 3D-Geometrie.");
            hint.setAttribute("role", "note");
            parts.push(hint);
          }
          const groups = new Map();
          for (const key of Object.keys(values)) {
            const value = values[key];
            if (value === undefined || value === null || (Array.isArray(value) && !value.length)) continue;
            const entry = info.catalog.get(key);
            const dot = key.indexOf(".");
            const group = entry ? entry.group : dot > 0 ? key.slice(0, dot) : "Allgemein";
            if (!groups.has(group)) groups.set(group, []);
            groups.get(group).push({ key, value, entry });
          }
          const pos = (key) => (info.order.has(key) ? info.order.get(key) : Infinity);
          const ordered = [...groups.entries()].sort(
            (a, b) =>
              groupRank(a[0]) - groupRank(b[0]) ||
              Math.min(...a[1].map((p) => pos(p.key))) - Math.min(...b[1].map((p) => pos(p.key))) ||
              (a[0] < b[0] ? -1 : 1),
          );
          for (const [group, props] of ordered) {
            props.sort((a, b) => pos(a.key) - pos(b.key) || (a.key < b.key ? -1 : 1));
            const section = el("section", "cv-det-group");
            section.dataset.group = group;
            const toggle = el("button", "cv-det-group-head");
            toggle.type = "button";
            toggle.append(icon("chevron"), el("span", "cv-det-group-name", group), el("span", "cv-det-group-count", String(props.length)));
            const list = el("dl", "cv-det-props");
            const pset = group.indexOf("Typ: ") === 0 ? group.slice(5) : group;
            for (const prop of props) {
              const name = prop.key.indexOf(pset + ".") === 0 ? prop.key.slice(pset.length + 1) : prop.key;
              list.append(propRow(prop, name));
            }
            const setCollapsed = (on) => {
              section.classList.toggle("cv-collapsed", on);
              list.hidden = on;
              toggle.setAttribute("aria-expanded", String(!on));
              if (on) collapsed.add(group);
              else collapsed.delete(group);
            };
            toggle.addEventListener("click", () => setCollapsed(!section.classList.contains("cv-collapsed")));
            setCollapsed(collapsed.has(group));
            section.append(toggle, list);
            parts.push(section);
          }
          body.replaceChildren(...parts);
          panel.dataset.key = row.key;
          delete panel.dataset.group;
          open();
        }
        clear();
        return { show, showGroup, clear, element: panel };
      }

      let ruleDialogCount = 0;

      /**
       * Dialog `Filter bearbeiten` (REQ-012, TASK-015b) as the reference (ref L654-740, CSS L1890-1924; screenshots
       * ref-04, ref-05): one row of four fields - `Aktion` (select, RULE_MODES), `Eigenschaft` (combobox with a
       * suggestion list of the catalogue: label, below it the group in grey, at most RULE_PROPERTY_LIMIT entries then
       * `+<n> mehr`; disabled for `Freie Textsuche`), `Vergleich` (select, RULE_OPS) and `Wert` (text input with a
       * datalist of the property's display texts) - and the buttons `Abbrechen` and `Anwenden`.
       * options: { rule ({ mode, key, op, value } to edit, or null for a new one: `Isolieren`, `Enthaelt`), entries
       * (catalogue entries), valuesFor(key) -> display texts, apply(rule) }. `Anwenden` with a missing or unknown
       * property (except `Freie Textsuche`) or an empty value marks the field invalid (`cv-invalid`, aria-invalid) and
       * keeps the dialog open; a typed text that equals a label is accepted (findRuleProperty). `Abbrechen`, the close
       * button, `Esc` and the backdrop close it without change; focus returns to options.returnFocus. All texts from
       * the model or the user are set as text only.
       */
      function openRuleDialog(host, options) {
        const entries = options.entries || [];
        const current = options.rule || { mode: "isolate", key: null, op: "contains", value: "" };
        const uid = ++ruleDialogCount;
        const backdrop = el("div", "cv-backdrop");
        const dialog = el("div", "cv-dialog cv-dialog-wide cv-rule-dialog");
        dialog.id = "cv-rule-dialog";
        dialog.setAttribute("role", "dialog");
        dialog.setAttribute("aria-modal", "true");
        dialog.setAttribute("aria-labelledby", "cv-rule-dialog-title");
        const head = el("div", "cv-dialog-head");
        const heading = el("div", "cv-dialog-title", "Filter bearbeiten");
        heading.id = "cv-rule-dialog-title";
        const close = iconButton("close", "Schlie\u00dfen", "cv-dialog-close");
        head.append(heading, close);
        const body = el("div", "cv-dialog-body");

        const select = (choices, value, label, id) => {
          const node = el("select", "cv-select");
          node.id = id;
          node.setAttribute("aria-label", label);
          for (const [optionValue, text] of choices) {
            const option = el("option", "", text);
            option.value = optionValue;
            node.append(option);
          }
          node.value = value;
          return node;
        };
        const mode = select(RULE_MODES, current.mode, "Aktion", "cv-rule-mode");
        const combo = el("div", "cv-combo");
        const propertyInput = el("input", "cv-input");
        propertyInput.type = "text";
        propertyInput.id = "cv-rule-property";
        propertyInput.placeholder = "Eigenschaft";
        propertyInput.autocomplete = "off";
        propertyInput.spellcheck = false;
        propertyInput.setAttribute("aria-label", "Eigenschaft");
        propertyInput.setAttribute("role", "combobox");
        propertyInput.setAttribute("aria-autocomplete", "list");
        propertyInput.setAttribute("aria-expanded", "false");
        const suggestions = el("div", "cv-suggest");
        suggestions.id = "cv-rule-suggest";
        suggestions.setAttribute("role", "listbox");
        suggestions.setAttribute("aria-label", "Eigenschaften");
        suggestions.hidden = true;
        propertyInput.setAttribute("aria-controls", suggestions.id);
        combo.append(propertyInput, suggestions);
        const operator = select(RULE_OPS, current.op, "Vergleich", "cv-rule-op");
        const valueInput = el("input", "cv-input");
        valueInput.type = "text";
        valueInput.id = "cv-rule-value";
        valueInput.placeholder = "Wert";
        valueInput.autocomplete = "off";
        valueInput.spellcheck = false;
        valueInput.setAttribute("aria-label", "Wert");
        valueInput.value = current.value || "";
        const datalist = el("datalist");
        datalist.id = "cv-rule-values-" + uid;
        valueInput.setAttribute("list", datalist.id);
        const form = el("div", "cv-rule-form");
        form.append(mode, combo, operator, valueInput, datalist);
        body.append(form);

        const foot = el("div", "cv-dialog-foot");
        const cancel = el("button", "cv-btn", "Abbrechen");
        cancel.type = "button";
        const ok = el("button", "cv-btn cv-primary", "Anwenden");
        ok.type = "button";
        ok.id = "cv-rule-apply";
        foot.append(cancel, ok);
        dialog.append(head, body, foot);
        backdrop.append(dialog);
        host.append(backdrop);

        const byKey = new Map(entries.map((entry) => [entry.key, entry]));
        let chosenKey = current.key && byKey.has(current.key) ? current.key : null;
        propertyInput.value = chosenKey ? byKey.get(chosenKey).label : current.key ? String(current.key) : "";
        let valuesKey; // property whose display texts the datalist holds
        let items = []; // suggestion entries shown
        let active = -1; // keyboard-highlighted suggestion

        function setInvalid(input, invalid) {
          input.classList.toggle("cv-invalid", invalid);
          if (invalid) input.setAttribute("aria-invalid", "true");
          else input.removeAttribute("aria-invalid");
        }
        function refreshValues(key) {
          if (key === valuesKey) return;
          valuesKey = key;
          const texts = key ? options.valuesFor(key) : [];
          datalist.replaceChildren(
            ...texts.map((text) => {
              const option = el("option");
              option.value = text;
              return option;
            }),
          );
        }
        function hideSuggestions() {
          suggestions.hidden = true;
          propertyInput.setAttribute("aria-expanded", "false");
          propertyInput.removeAttribute("aria-activedescendant");
          active = -1;
        }
        function choose(entry) {
          chosenKey = entry.key;
          propertyInput.value = entry.label;
          setInvalid(propertyInput, false);
          hideSuggestions();
          refreshValues(entry.key);
        }
        function highlight(index) {
          const nodes = suggestions.querySelectorAll("[role=option]");
          active = nodes.length ? (index + nodes.length) % nodes.length : -1;
          nodes.forEach((node, i) => {
