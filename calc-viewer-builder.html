            for (const item of facet.values) if (valueLabel(item.value).toLowerCase().includes(query)) shown.push(item);
          }
          list.setItems(shown, resetScroll);
          empty.hidden = shown.length > 0;
          empty.textContent = facet.values.length ? "Keine Treffer." : "Keine Werte.";
          list.element.hidden = shown.length === 0;
        }

        function setTitle(text, unit) {
          title = text;
          titleNode.textContent = text;
          titleNode.title = text;
          unitNode.textContent = unit ? "(" + unit + ")" : "";
          const set = (button, label) => {
            button.title = label;
            button.setAttribute("aria-label", label + ": " + text);
          };
          set(reset, "Auswahl zur\u00fccksetzen");
          set(up, "Filtersatz nach oben");
          set(down, "Filtersatz nach unten");
          set(remove, "Filtersatz entfernen");
          searchInput.setAttribute("aria-label", "Werte suchen: " + text);
          setCollapsed(root.classList.contains("cv-collapsed"));
        }

        function setCollapsed(collapsed) {
          root.classList.toggle("cv-collapsed", collapsed);
          body.hidden = collapsed;
          toggle.setAttribute("aria-expanded", String(!collapsed));
          const label = collapsed ? "Filtersatz ausklappen" : "Filtersatz einklappen";
          toggle.title = label;
          toggle.setAttribute("aria-label", label + ": " + title);
          if (!collapsed) list.render();
        }

        list.element.addEventListener("change", (event) => {
          const item = list.itemOf(event.target);
          if (item) handlers.toggle(id, item.value, event.target.checked);
        });
        searchInput.addEventListener("input", () => {
          query = searchInput.value.trim().toLowerCase();
          applySearch(true);
        });
        toggle.addEventListener("click", () => handlers.collapse(id, !root.classList.contains("cv-collapsed")));
        reset.addEventListener("click", () => handlers.resetSet(id));
        up.addEventListener("click", () => handlers.step(id, -1));
        down.addEventListener("click", () => handlers.step(id, 1));
        remove.addEventListener("click", () => handlers.remove(id));

        setTitle(spec.title, spec.unit);
        setCollapsed(Boolean(spec.collapsed));

        return {
          id,
          root,
          head,
          setTitle,
          setCollapsed,
          setPosition(index, count) {
            up.disabled = index === 0;
            down.disabled = index === count - 1;
          },
          /** New values and counts of this set (facetCounts entry); keeps the search and the scroll position. */
          update(next) {
            facet = next || { values: [], checkedCount: 0, total: 0 };
            badge.textContent = facet.checkedCount ? String(facet.checkedCount) : "";
            badge.hidden = !facet.checkedCount;
            badge.title = facet.checkedCount + " ausgew\u00e4hlt";
            reset.disabled = !facet.checkedCount;
            applySearch(false);
          },
        };
      }

      /**
       * Filter area (REQ-003, REQ-004): "+ Filtersatz", "Alle Filter zuruecksetzen" and the filter sets in order.
       * handlers: { add(), toggle(id, value, checked), resetSet(id), resetAll(), move(id, toIndex), step(id, delta),
       * remove(id), collapse(id, collapsed) }.
       */
      function createFilterArea(container, handlers) {
        const head = el("div", "cv-fa-head");
        const heading = el("h2", "", "Filter");
        const add = el("button", "cv-link cv-fa-add");
        add.type = "button";
        add.id = "cv-add-filterset";
        add.append(icon("plus"), document.createTextNode("Filtersatz"));
        add.setAttribute("aria-label", "+ Filtersatz");
        add.title = "Filtersatz hinzuf\u00fcgen";
        head.append(heading, add);
        const resetAll = el("button", "cv-link cv-fa-reset", "Alle Filter zur\u00fccksetzen");
        resetAll.type = "button";
        resetAll.id = "cv-reset-all";
        resetAll.disabled = true;
        const list = el("div", "cv-fa-sets");
        list.id = "cv-filtersets";
        container.append(head, resetAll, list);
        add.addEventListener("click", () => handlers.add());
        resetAll.addEventListener("click", () => handlers.resetAll());

        const sets = new Map(); // id -> component
        let order = [];
        let dragId = null;
        const DRAG_TYPE = "application/x-cv-filterset";

        function clearDropMarks() {
          for (const set of sets.values()) set.root.classList.remove("cv-drop-before", "cv-drop-after", "cv-dragging");
        }

        function wireDrag(set) {
          set.head.addEventListener("dragstart", (event) => {
            dragId = set.id;
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData(DRAG_TYPE, set.id);
            event.dataTransfer.setData("text/plain", set.id);
            set.root.classList.add("cv-dragging");
          });
          set.head.addEventListener("dragend", () => {
            dragId = null;
            clearDropMarks();
          });
          set.root.addEventListener("dragover", (event) => {
            if (dragId === null) return;
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
            const box = set.root.getBoundingClientRect();
            const before = event.clientY < box.top + box.height / 2;
            set.root.classList.toggle("cv-drop-before", before);
            set.root.classList.toggle("cv-drop-after", !before);
          });
          set.root.addEventListener("dragleave", (event) => {
            if (!set.root.contains(event.relatedTarget)) set.root.classList.remove("cv-drop-before", "cv-drop-after");
          });
          set.root.addEventListener("drop", (event) => {
            if (dragId === null) return;
            event.preventDefault();
            const box = set.root.getBoundingClientRect();
            const before = event.clientY < box.top + box.height / 2;
            const source = dragId;
            dragId = null;
            clearDropMarks();
            if (source === set.id) return;
            const from = order.indexOf(source);
            let to = order.indexOf(set.id) + (before ? 0 : 1);
            if (from < to) to--;
            if (from !== to) handlers.move(source, to);
          });
        }

        return {
          /** Shows the sets [{ id, key, title, unit, collapsed }] in this order (components are kept, not rebuilt). */
          setSets(specs) {
            const keep = new Set(specs.map((s) => s.id));
            for (const [id, set] of sets)
              if (!keep.has(id)) {
                set.root.remove();
                sets.delete(id);
              }
            order = specs.map((s) => s.id);
            specs.forEach((spec, index) => {
              let set = sets.get(spec.id);
              if (!set) {
                set = createFilterSet(spec, handlers);
                wireDrag(set);
                sets.set(spec.id, set);
              } else {
                set.setTitle(spec.title, spec.unit);
                set.setCollapsed(Boolean(spec.collapsed));
              }
              set.setPosition(index, specs.length);
              if (list.children[index] !== set.root) list.insertBefore(set.root, list.children[index] || null);
            });
          },
          /** Values and counts per set (Map id -> facetCounts entry); anyActive enables the reset-all button. */
          update(facets, anyActive) {
            for (const [id, set] of sets) set.update(facets.get(id));
            resetAll.disabled = !anyActive;
          },
        };
      }

      const CATALOG_ROW_HEIGHT = 32;

      /** Name of a catalogue entry inside its group (the pset prefix is shown by the group header). */
      function entryName(entry) {
        const pset = entry.group.indexOf("Typ: ") === 0 ? entry.group.slice(5) : entry.group;
        return entry.label.indexOf(pset + ".") === 0 ? entry.label.slice(pset.length + 1) : entry.label;
      }

      /**
       * Property catalogue dialog (REQ-003): search, entries grouped (`Allgemein` first, then pset names, as the
       * catalogue orders them) with their element counts, virtualised for thousands of entries. entries: catalogue
       * entries in order; used: Set of keys that already have a filter set; onPick(key).
       */
      function openCatalogue(host, entries, used, onPick) {
        const backdrop = el("div", "cv-backdrop");
        const dialog = el("div", "cv-dialog cv-catalogue");
        dialog.setAttribute("role", "dialog");
        dialog.setAttribute("aria-modal", "true");
        dialog.setAttribute("aria-labelledby", "cv-catalogue-title");
        const head = el("div", "cv-dialog-head");
        const title = el("div", "cv-dialog-title", "Filtersatz hinzuf\u00fcgen");
        title.id = "cv-catalogue-title";
        const close = iconButton("close", "Schlie\u00dfen", "cv-dialog-close");
        head.append(title, close);
        const body = el("div", "cv-dialog-body");
        const search = el("label", "cv-search");
        const input = el("input");
        input.type = "search";
        input.placeholder = "Eigenschaft suchen";
        input.setAttribute("aria-label", "Eigenschaft suchen");
        search.append(icon("search"), input);
        const list = createVirtualList({
          className: "cv-cat-list",
          rowHeight: CATALOG_ROW_HEIGHT,
          maxRows: 0,
          createRow() {
            const row = el("button", "cv-cat-row");
            row.type = "button";
            row.append(el("span", "cv-cat-name"), el("span", "cv-cat-note"), el("span", "cv-cat-count"));
            return row;
          },
          updateRow(row, item) {
            const [name, note, count] = row.children;
            if (item.group !== undefined) {
              row.className = "cv-cat-row cv-cat-group cv-vrow";
              row.disabled = true;
              row.tabIndex = -1;
              delete row.dataset.key;
              row.removeAttribute("aria-label");
              row.removeAttribute("title");
              name.textContent = item.group;
              note.textContent = "";
              count.textContent = "";
              return;
            }
            const entry = item.entry;
            const isUsed = used.has(entry.key);
            row.className = "cv-cat-row cv-cat-entry cv-vrow" + (isUsed ? " cv-used" : "");
            row.disabled = isUsed;
            row.tabIndex = 0;
            row.dataset.key = entry.key;
            row.title = entry.header;
            row.setAttribute(
              "aria-label",
              entry.label + ", " + formatCount(entry.count) + " Elemente" + (isUsed ? ", bereits als Filtersatz" : ""),
            );
            name.textContent = entryName(entry);
            note.textContent = isUsed ? "vorhanden" : "";
            count.textContent = formatCount(entry.count);
          },
        });
        const info = el("p", "cv-hint cv-cat-info");
        body.append(search, list.element, info);
        dialog.append(head, body);
        backdrop.append(dialog);
        host.append(backdrop);

        function build() {
          const query = input.value.trim().toLowerCase();
          const items = [];
          let group = null;
          let matches = 0;
          for (const entry of entries) {
            if (
              query &&
              entry.label.toLowerCase().indexOf(query) === -1 &&
              entry.group.toLowerCase().indexOf(query) === -1
            )
              continue;
            if (entry.group !== group) {
              group = entry.group;
              items.push({ group });
            }
            items.push({ entry });
            matches++;
          }
          list.setItems(items, true);
          if (!entries.length) info.textContent = "Keine Eigenschaften. Zuerst ein IFC-Modell laden.";
          else if (!matches) info.textContent = "Keine Treffer.";
          else info.textContent = formatCount(matches) + " von " + formatCount(entries.length) + " Eigenschaften";
        }

        function onKey(event) {
          if (event.key === "Escape") finish();
        }
        function finish() {
          document.removeEventListener("keydown", onKey, true);
          backdrop.remove();
        }
        document.addEventListener("keydown", onKey, true);
        backdrop.addEventListener("click", (event) => {
          if (event.target === backdrop) finish();
        });
        close.addEventListener("click", finish);
        input.addEventListener("input", build);
        list.element.addEventListener("click", (event) => {
          const row = event.target.closest(".cv-cat-entry");
          if (!row || row.disabled) return;
          const key = row.dataset.key;
          finish();
          onPick(key);
        });
        build();
        input.focus();
        return { close: finish, element: dialog };
      }

      /**
       * Builds the one-screen layout of spec 2 User interface into root and returns the parts the app needs: header
       * (logo, title, date, builder buttons), filter area (~280 px), 3D view and table with a splitter (55 / 45 %),
       * details (~320 px, collapsible), status line `X von Y Elementen`.
       */
      export function renderLayout(root, options) {
        const mode = options.mode;
        const handlers = options.filterHandlers;
        const app = el("div", "cv-app");
        app.dataset.core = coreInfo().name;

        const header = el("header", "cv-header");
        const logo = el("div", "cv-logo");
        logo.id = "cv-logo";
        logo.title = "Logo";
        logo.append(icon("cube"));
        const brand = el("div", "cv-brand");
        const title = el("h1", "cv-title", options.title || "Calc Viewer Builder");
        title.id = "cv-title";
        const date = el("span", "cv-date", new Date().toLocaleDateString("de-DE"));
        date.id = "cv-date";
        brand.append(title, date);
        const actions = el("div", "cv-actions");
        const fileInput = el("input");
        fileInput.type = "file";
        fileInput.accept = ".ifc";
        fileInput.multiple = true;
        fileInput.hidden = true;
        fileInput.id = "cv-file-input";
        const loadButton = el("button", "cv-btn cv-primary", "IFC laden");
        loadButton.id = "cv-load";
        loadButton.disabled = true;
        loadButton.addEventListener("click", () => fileInput.click());
        if (mode === "builder") {
          actions.append(fileInput, loadButton);
          for (const label of ["Konfiguration speichern", "Konfiguration laden", "HTML exportieren"]) {
            const button = el("button", "cv-btn", label);
            button.disabled = true;
            actions.append(button);
          }
        }
        header.append(logo, brand, actions);

        const main = el("div", "cv-main");
        const filters = el("aside", "cv-panel cv-filters");
        filters.id = "cv-filters";
        const messages = el("div", "cv-messages");
        messages.id = "cv-messages";
        messages.setAttribute("role", "alert");
        const modelsTitle = el("h2", "", "Modelle");
        const modelList = el("ul", "cv-models");
        modelList.id = "cv-models";
        filters.append(messages, modelsTitle, modelList);
        let spacesToggle = null;
        if (mode === "builder") {
          const option = el("label", "cv-option");
          spacesToggle = el("input");
          spacesToggle.type = "checkbox";
          spacesToggle.id = "cv-opt-spaces";
          option.append(spacesToggle, document.createTextNode(" R\u00e4ume (IfcSpace) einbeziehen"));
          filters.append(option);
        }
        const filterBox = el("div", "cv-filter-area");
        filterBox.id = "cv-filter-area";
        filters.append(filterBox);
        const filterArea = createFilterArea(filterBox, handlers);

        const center = el("div", "cv-center");
        center.id = "cv-center";
        const viewport = el("div", "cv-viewport");
        viewport.id = "cv-viewport";
        const overlay = el("div", "cv-overlay");
        overlay.id = "cv-overlay";
        const overlayBox = el("div", "cv-overlay-box");
        const overlayText = el("div", "cv-overlay-text");
        overlayText.id = "cv-overlay-text";
        const progressBar = el("progress", "cv-progress");
        progressBar.id = "cv-progress";
        progressBar.max = 100;
        progressBar.hidden = true;
        overlayBox.append(overlayText, progressBar);
        overlay.append(overlayBox);
        viewport.append(overlay);
        const splitter = el("div", "cv-splitter");
        splitter.id = "cv-splitter";
        splitter.tabIndex = 0;
        splitter.setAttribute("role", "separator");
        splitter.setAttribute("aria-orientation", "horizontal");
        splitter.setAttribute("aria-label", "Aufteilung 3D-Modell / Tabelle");
        splitter.setAttribute("aria-valuemin", "15");
        splitter.setAttribute("aria-valuemax", "85");
        const table = el("section", "cv-panel cv-table");
        table.id = "cv-table";
        table.append(el("h2", "", "Tabelle"), el("p", "cv-hint", "Die Mengentabelle folgt."));
        center.append(viewport, splitter, table);

        const details = el("aside", "cv-panel cv-details");
        details.id = "cv-details";
        const detailsHead = el("div", "cv-details-head");
        const detailsToggle = iconButton("panelRight", "Details einklappen", "cv-details-toggle");
        detailsToggle.id = "cv-details-toggle";
        detailsHead.append(el("h2", "", "Element-Details"), detailsToggle);
        const detailsBody = el("div", "cv-details-body");
        detailsBody.append(el("p", "cv-hint", "Klick auf ein Element zeigt seine Eigenschaften."));
        details.append(detailsHead, detailsBody);
        main.append(filters, center, details);

        const statusline = el("footer", "cv-statusline");
        const status = el("span", "cv-status", "");
        status.id = "cv-status";
        const statusModels = el("span", "cv-status-models", "");
        statusModels.id = "cv-status-models";
        statusline.append(status, statusModels);

        app.append(header, main, statusline);
        root.replaceChildren(app);

        // Splitter between 3D model and table (default 55 / 45 %), pointer and keyboard.
        const layout = { split: 55, detailsCollapsed: false };
        function setSplit(percent) {
          layout.split = Math.round(Math.min(85, Math.max(15, percent)) * 10) / 10;
          center.style.gridTemplateRows = "minmax(0, " + layout.split + "fr) 6px minmax(0, " + (100 - layout.split) + "fr)";
          splitter.setAttribute("aria-valuenow", String(Math.round(layout.split)));
        }
        setSplit(55);
        splitter.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          splitter.setPointerCapture(event.pointerId);
          splitter.classList.add("cv-dragging");
        });
        splitter.addEventListener("pointermove", (event) => {
          if (!splitter.hasPointerCapture(event.pointerId)) return;
          const box = center.getBoundingClientRect();
          setSplit(((event.clientY - box.top) / box.height) * 100);
        });
        const endDrag = (event) => {
          if (splitter.hasPointerCapture(event.pointerId)) splitter.releasePointerCapture(event.pointerId);
          splitter.classList.remove("cv-dragging");
        };
        splitter.addEventListener("pointerup", endDrag);
        splitter.addEventListener("pointercancel", endDrag);
        splitter.addEventListener("keydown", (event) => {
          if (event.key === "ArrowUp") setSplit(layout.split - 5);
          else if (event.key === "ArrowDown") setSplit(layout.split + 5);
          else return;
          event.preventDefault();
        });

        // Details panel collapsible (spec 2 User interface).
        function setDetailsCollapsed(collapsed) {
          layout.detailsCollapsed = collapsed;
          main.classList.toggle("cv-details-collapsed", collapsed);
          detailsBody.hidden = collapsed;
          const label = collapsed ? "Details ausklappen" : "Details einklappen";
          detailsToggle.title = label;
          detailsToggle.setAttribute("aria-label", label);
          detailsToggle.setAttribute("aria-expanded", String(!collapsed));
        }
        setDetailsCollapsed(false);
        detailsToggle.addEventListener("click", () => setDetailsCollapsed(!layout.detailsCollapsed));

        let busy = false;
        const removeButtons = [];

        return {
          fileInput,
          loadButton,
          spacesToggle,
          viewport,
          layout,
          filters: filterArea,
          /** Opens the property catalogue dialog; onPick(key) adds a filter set. */
          openCatalogue(entries, used, onPick) {
            return openCatalogue(app, entries, used, onPick);
          },
          /** Shows a message over the 3D view (isError: error style); null hides it. */
          overlay(text, isError) {
            overlay.hidden = text === null;
            overlay.classList.toggle("cv-error", Boolean(isError));
            overlayText.textContent = text === null ? "" : text;
            progressBar.hidden = true;
          },
          /** Progress overlay with step and percentage: { file, step, fraction (0..1 or null) }. */
          progress(state) {
            const percent = typeof state.fraction === "number" ? Math.floor(Math.min(Math.max(state.fraction, 0), 1) * 100) : null;
            overlay.hidden = false;
            overlay.classList.remove("cv-error");
            overlayText.textContent = state.file + " \u2013 " + state.step + (percent === null ? " ..." : ": " + percent + " %");
            progressBar.hidden = percent === null;
            if (percent !== null) progressBar.value = percent;
            return percent;
          },
          /** Status line `X von Y Elementen` and the number of models. */
          status(shown, total, modelCount) {
            status.textContent = formatCount(shown) + " von " + formatCount(total) + " Elementen";
            statusModels.textContent = modelCount === 1 ? "1 Modell" : formatCount(modelCount) + " Modelle";
          },
          /** Adds a persistent message (error) to the filter area; the user can close it. */
          addMessage(text) {
            const item = el("div", "cv-message");
            const close = el("button", "cv-message-close", "\u00d7");
            close.title = "Meldung schlie\u00dfen";
            close.setAttribute("aria-label", "Meldung schlie\u00dfen");
            close.addEventListener("click", () => item.remove());
            item.append(el("span", "cv-message-text", text), close);
            messages.append(item);
          },
          /** Lists the loaded models [{ id, name, elements }] with a remove button each (builder). */
          renderModels(models, onRemove) {
            removeButtons.length = 0;
            modelList.replaceChildren();
            if (!models.length) {
              modelList.append(el("li", "cv-hint", "Keine Modelle geladen."));
              return;
            }
            for (const model of models) {
              const item = el("li", "cv-model");
              item.dataset.modelId = model.id;
              const name = el("span", "cv-model-name", model.name);
              name.title = model.name;
              const count = el("span", "cv-model-count", formatCount(model.elements));
              item.append(name, count);
              if (onRemove) {
                const remove = el("button", "cv-model-remove", "\u00d7");
                remove.title = "Modell entfernen";
                remove.setAttribute("aria-label", "Modell entfernen: " + model.name);
                remove.disabled = busy;
                remove.addEventListener("click", () => onRemove(model.id));
                removeButtons.push(remove);
                item.append(remove);
              }
              modelList.append(item);
            }
          },
          setBusy(value) {
            busy = value;
            loadButton.disabled = value;
            if (spacesToggle) spacesToggle.disabled = value;
            for (const button of removeButtons) button.disabled = value;
          },
          /** Calls onFiles(files) for files dropped anywhere on the page (builder). */
          onDropFiles(onFiles) {
            app.addEventListener("dragover", (event) => {
              if (event.dataTransfer && Array.from(event.dataTransfer.types || []).indexOf("Files") !== -1) {
                event.preventDefault();
                app.classList.add("cv-dragover");
              }
            });
            app.addEventListener("dragleave", () => app.classList.remove("cv-dragover"));
            app.addEventListener("drop", (event) => {
              app.classList.remove("cv-dragover");
              const files = event.dataTransfer ? Array.from(event.dataTransfer.files || []) : [];
              if (!files.length) return;
              event.preventDefault();
              onFiles(files);
            });
          },
        };
      }
    </script>

    <!-- Engine start and model display. ASCII only. -->
    <script type="text/plain" id="cv-3d-src">
      import * as THREE from "three";
      import * as FRAGS from "@thatopen/fragments";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const VIEW_DIRECTION = new THREE.Vector3(1, 0.75, 1).normalize();
      const FIT_PADDING = 1.2;

      /**
       * Starts three + Fragments in container. workerUrl: Blob URL of the classic Fragments worker (classic, because
       * module workers from Blob URLs fail under file:// and in opaque-origin frames; spec CON-002).
       */
      export function createEngine(container, workerUrl) {
        const scene = new THREE.Scene();
        scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f94, 2.2));
        const sun = new THREE.DirectionalLight(0xffffff, 1.6);
        sun.position.set(5, 10, 7);
        scene.add(sun);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10000);
        camera.position.set(30, 20, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        container.prepend(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const fragments = new FRAGS.FragmentsModels(workerUrl, { classicWorker: true });
        // Avoid z-fighting between coplanar faces (as the reference app and the That Open examples).
        fragments.models.materials.list.onItemSet.add(({ value: material }) => {
          if (!("isLodMaterial" in material && material.isLodMaterial)) {
            material.polygonOffset = true;
            material.polygonOffsetUnits = 1;
            material.polygonOffsetFactor = Math.random();
          }
        });
        controls.addEventListener("change", () => fragments.update());

        function resize() {
          const width = container.clientWidth;
          const height = container.clientHeight;
          if (!width || !height) return;
          renderer.setSize(width, height, false);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          fragments.update();
        }
        new ResizeObserver(resize).observe(container);
        resize();
        renderer.setAnimationLoop(() => {
          controls.update();
          renderer.render(scene, camera);
        });

        const models = new Map();

        function fit() {
          const box = new THREE.Box3();
          for (const model of models.values()) box.union(model.box);
          if (box.isEmpty()) return;
          const sphere = box.getBoundingSphere(new THREE.Sphere());
          const fov = THREE.MathUtils.degToRad(camera.fov / 2);
          const distance = (sphere.radius * FIT_PADDING) / Math.sin(Math.min(fov, Math.atan(Math.tan(fov) * camera.aspect)));
          controls.target.copy(sphere.center);
          camera.position.copy(sphere.center).addScaledVector(VIEW_DIRECTION, distance);
          camera.near = Math.max(distance / 1000, 0.01);
          camera.far = distance * 100;
          camera.updateProjectionMatrix();
          controls.update();
        }

        return {
          /**
           * Loads .frag bytes as model modelId and fits the camera; resolves to { modelId, model, withGeometry }
           * (model: the Fragments model for extraction; withGeometry: localIds of items with 3D geometry).
           */
          async loadModel(bytes, modelId) {
            const model = await fragments.load(bytes, { modelId });
            model.useCamera(camera);
            scene.add(model.object);
            models.set(modelId, model);
            await fragments.update(true);
            fit();
            await fragments.update(true);
            const withGeometry = await model.getItemsIdsWithGeometry();
            return { modelId, model, withGeometry };
          },
          /** Removes a model from scene and memory. */
          async removeModel(modelId) {
            const model = models.get(modelId);
            if (!model) return;
            models.delete(modelId);
            scene.remove(model.object);
            await fragments.disposeModel(modelId);
            // Not update(true): its fence waits for a tile FINISH at the last dispatched request number, which never
            // arrives when no model is left (observed: removing the last model hung intermittently).
            fragments.update();
          },
          /** Shows or hides items of one model (e.g. IfcSpace by option, DEC-13). */
          async setItemsVisible(modelId, localIds, visible) {
            const model = models.get(modelId);
            if (!model || !localIds.length) return;
            await model.setVisible(localIds, visible);
            await fragments.update(true);
          },
          modelCount() {
            return fragments.models.list.size;
          },
        };
      }
    </script>

    <!-- Entry: start({mode}) wires ui + 3d; holds models, rows and the property catalogue. ASCII only. -->
    <script type="text/plain" id="cv-app-src">
      import { renderLayout } from "calc-ui";
      import { createEngine } from "calc-3d";
      import {
        LoadError,
        buildCatalog,
        createColumnStore,
        evaluateFilters,
        facetCounts,
        filterRows,
        loadErrorMessage,
        modelNameFromFile,
        uniqueModelName,
        visibleRows,
      } from "calc-core";

      /** Filter sets of a new configuration (REQ-003). */
      export const DEFAULT_FILTER_SETS = ["Kategorie", "Geschoss", "Material"];

      /**
       * Test hook (read-only for tests except `test`): phase "starting" | "ready" | "loading" | "error"; error (fatal
       * start error only, else null; load errors are in loadErrors); models [{ id, name (file name), modell, elements,
       * withGeometry (visible rows with 3D geometry) }]; rows (visible element rows, spec 4.3); catalog (property
       * catalogue entries in order); loadErrors [{ fileName, loadClass, message }]; progress (last { file, step,
       * percent } or null); queued (files dropped during a running action, loaded after it); loads (number of
       * finished load, remove or option actions, for waiting; a batch with queued files counts once); options
       * { includeSpaces }. `test` holds test-only switches read by the
       * builder's conversion (crashNextConversion, neverStartNextConversion, startTimeoutMs).
       * filter (TASK-004): { sets [{ id, key, title, collapsed, selected }] in display order (the configuration part of
       * REQ-003-AC2), active (normalised core filters), count (rows passing all filters), total, keys (row keys passing
       * all filters, ascending row order; the set 3D and table follow), facets ({ id -> { total, checkedCount, values
       * [{ value, count, checked }] } }), updates (number of filter evaluations), lastMs (duration of the last
       * evaluation incl. filter-area update) }. layout: { split (model share in %), detailsCollapsed }.
       */
      const hook = {
        phase: "starting",
        models: [],
        modelCount: 0,
        elementCount: 0,
        rows: [],
        catalog: [],
        loadErrors: [],
        loads: 0,
        queued: 0,
        progress: null,
        error: null,
        options: { includeSpaces: false },
        filter: { sets: [], active: [], count: 0, total: 0, keys: [], facets: {}, updates: 0, lastMs: 0 },
        layout: null,
        test: { crashNextConversion: false, neverStartNextConversion: false, startTimeoutMs: null },
      };
      window.__calc = hook;

      /** Classifies any error of the load pipeline (REQ-001): LoadError keeps its class, the rest is unreadable. */
      function toLoadError(error, fileName) {
        if (error instanceof LoadError || (error && error.loadClass)) return error;
        const detail = error && error.message ? error.message : String(error);
        return new LoadError("unreadable", fileName, detail);
      }

      /**
       * options: { mode: "builder" | "viewer", root, workerUrl,
       *   convert(file, onProgress(fraction|null, step?)) -> Promise<{ bytes, elementClasses }> (builder),
       *   extract(model, { modelId, modelName, elementClasses, withGeometry }, onProgress(fraction))
       *     -> Promise<{ rows, properties, spaceProperties, spaceIds }> (builder) }.
       */
      export async function start(options) {
        // Filter state (REQ-003, REQ-004): filter sets in display order; one filter per set, id = property key.
        const filterSets = DEFAULT_FILTER_SETS.map((key) => ({ id: key, key, collapsed: false, selected: [] }));
        let catalog = new Map();
        let store = createColumnStore([]);
        let view = { evaluation: null, indices: new Uint32Array(0), facets: new Map() };
        const filterListeners = [];

        const setById = (id) => filterSets.find((s) => s.id === id);
        const coreFilters = () => filterSets.map((s) => ({ id: s.id, key: s.key, type: "values", values: s.selected }));

        function setSpecs() {
          return filterSets.map((s) => {
            const entry = catalog.get(s.key);
            const unit = entry && entry.kind === "number" ? entry.unit : null;
            return { id: s.id, key: s.key, title: entry ? entry.label : s.key, unit, collapsed: s.collapsed };
          });
        }

        function publishSets() {
          const specs = setSpecs();
          ui.filters.setSets(specs);
          hook.filter.sets = specs.map((spec, i) => ({
            id: spec.id,
            key: spec.key,
            title: spec.title,
            collapsed: spec.collapsed,
            selected: filterSets[i].selected.slice(),
          }));
        }

        /**
         * Evaluates all filters once (evaluateFilters) and updates the filter sets, the status line and the hook. The
         * row set passing all filters (view.indices) is what 3D (TASK-005) and table (TASK-006a) show.
         */
        function refresh() {
          const t0 = performance.now();
          const filters = coreFilters();
          const evaluation = evaluateFilters(store, filters);
          const indices = filterRows(evaluation);
          const facets = facetCounts(evaluation, null, filterSets.map((s) => ({ id: s.id, key: s.key })));
          view = { evaluation, indices, facets };
          ui.filters.update(facets, evaluation.filters.length > 0);
          ui.status(indices.length, store.size, hook.modelCount);
          const rows = store.rows;
          let keys = null;
          let plainFacets = null;
          hook.filter.active = evaluation.filters.map((f) => ({ ...f, values: f.values ? f.values.slice() : undefined }));
          hook.filter.count = indices.length;
          hook.filter.total = store.size;
          // keys and facets are built only when read (tests, later tasks), not on every click
          Object.defineProperty(hook.filter, "keys", {
            configurable: true,
            enumerable: true,
            get() {
              if (!keys) keys = Array.from(indices, (i) => rows[i].key);
              return keys;
            },
          });
          Object.defineProperty(hook.filter, "facets", {
            configurable: true,
            enumerable: true,
            get() {
              if (!plainFacets) {
                plainFacets = {};
                for (const [id, f] of facets)
                  plainFacets[id] = { total: f.total, checkedCount: f.checkedCount, values: f.values };
              }
              return plainFacets;
            },
          });
          hook.filter.updates++;
          hook.filter.lastMs = performance.now() - t0;
          for (const listener of filterListeners) listener(view);
        }

        function changed() {
          publishSets();
          refresh();
        }

        const filterHandlers = {
          add() {
            const used = new Set(filterSets.map((s) => s.key));
            ui.openCatalogue([...catalog.values()], used, (key) => {
              if (filterSets.some((s) => s.key === key)) return;
              filterSets.push({ id: key, key, collapsed: false, selected: [] });
              changed();
            });
          },
          toggle(id, value, checked) {
            const set = setById(id);
            if (!set) return;
            const at = set.selected.indexOf(value);
            if (checked && at === -1) set.selected.push(value);
            else if (!checked && at !== -1) set.selected.splice(at, 1);
            else return;
            changed();
          },
          resetSet(id) {
            const set = setById(id);
            if (!set || !set.selected.length) return;
            set.selected = [];
            changed();
          },
          /** Clears every filter (filter sets; the table's column filters join here in TASK-006a; REQ-004-AC4). */
          resetAll() {
            for (const set of filterSets) set.selected = [];
            changed();
          },
          move(id, to) {
            const from = filterSets.findIndex((s) => s.id === id);
            if (from === -1 || to < 0 || to >= filterSets.length || from === to) return;
            const [set] = filterSets.splice(from, 1);
            filterSets.splice(to, 0, set);
            publishSets();
          },
          step(id, delta) {
            filterHandlers.move(id, filterSets.findIndex((s) => s.id === id) + delta);
          },
          remove(id) {
            const at = filterSets.findIndex((s) => s.id === id);
            if (at === -1) return;
            filterSets.splice(at, 1);
            store.retain(filterSets.map((s) => s.key));
            changed();
          },
          collapse(id, collapsed) {
            const set = setById(id);
            if (!set) return;
            set.collapsed = collapsed;
            publishSets();
          },
        };

        const ui = renderLayout(options.root, { mode: options.mode, title: options.title, filterHandlers });
        hook.layout = ui.layout;
        ui.overlay("3D-Ansicht wird gestartet ...");
        const engine = createEngine(ui.viewport, options.workerUrl);
        const models = []; // { id, name, fileName, rows, properties, spaceProperties, spaceIds, fragBytes }
        const queued = []; // files dropped while an action runs; loaded right after it
        let nextId = 1;
        let busy = false;

        /**
         * Overlay when no action runs: the start hint while the builder has no model, else hidden. A load error
         * shown in the overlay does not stay over the 3D view; its message remains in #cv-messages.
         */
        function settleOverlay() {
          ui.overlay(options.mode === "builder" && !models.length ? "IFC-Datei laden, um zu beginnen." : null);
        }

        function publish() {
          const includeSpaces = hook.options.includeSpaces;
          const rows = [];
          for (const model of models) for (const row of visibleRows(model.rows, includeSpaces)) rows.push(row);
          hook.rows = rows;
          catalog = buildCatalog(rows, models);
          hook.catalog = [...catalog.values()];
          store = createColumnStore(rows); // new row set: new column store (TASK-003)
          hook.models = models.map((m) => {
            const visible = visibleRows(m.rows, includeSpaces);
            return {
              id: m.id,
              name: m.fileName,
              modell: m.name,
              elements: visible.length,
              withGeometry: visible.filter((row) => row.geometry).length,
            };
          });
          hook.modelCount = engine.modelCount();
          hook.elementCount = rows.length;
          ui.renderModels(
            hook.models.map((m) => ({ id: m.id, name: m.modell, elements: m.elements })),
            options.mode === "builder" ? removeModel : null,
          );
          publishSets();
          refresh();
          settleOverlay();
        }

        function progress(file, step, fraction) {
          const percent = ui.progress({ file, step, fraction });
          hook.progress = { file, step, percent };
        }

        async function loadOne(file) {
          const id = "m" + nextId++;
          const name = uniqueModelName(
            modelNameFromFile(file.name),
            models.map((m) => m.name),
          );
          let shown = false;
          try {
            progress(file.name, "Pr\u00fcfung", null);
            const converted = await options.convert(file, (fraction, step) =>
              progress(file.name, step || "Konvertierung", fraction),
            );
            progress(file.name, "Anzeige", null);
            const loaded = await engine.loadModel(converted.bytes, id);
            shown = true;
            progress(file.name, "Extraktion", 0);
            const data = await options.extract(
              loaded.model,
              { modelId: id, modelName: name, elementClasses: converted.elementClasses, withGeometry: loaded.withGeometry },
              (fraction) => progress(file.name, "Extraktion", fraction),
            );
            if (!hook.options.includeSpaces) await engine.setItemsVisible(id, data.spaceIds, false);
            models.push({
              id,
              name,
              fileName: file.name,
              rows: data.rows,
              properties: data.properties,
              spaceProperties: data.spaceProperties,
              spaceIds: data.spaceIds,
              fragBytes: converted.bytes,
            });
            publish();
            return true;
          } catch (error) {
            if (shown) await engine.removeModel(id).catch(() => {});
            const classified = toLoadError(error, file.name);
            const message = classified.message || loadErrorMessage(classified.loadClass, file.name, classified.detail);
            hook.loadErrors.push({ fileName: file.name, loadClass: classified.loadClass, message });
            ui.addMessage(message);
            ui.overlay(message, true);
            return false;
          }
        }

        /** Ends a busy action; files dropped meanwhile start loading at once (phase stays "loading"). */
        function finishAction() {
          settleOverlay();
          hook.progress = null;
          busy = false;
          ui.setBusy(false);
          hook.phase = "ready";
          hook.loads++;
          if (queued.length) loadFiles([]);
        }

        /**
         * Loads files one after another. While another action runs, the files are queued and loaded right after
         * it (a drop is never lost); files queued during this batch are loaded in the same batch.
         */
        async function loadFiles(files) {
          if (busy) {
            queued.push(...files);
            hook.queued = queued.length;
            return;
          }
          let batch = [...queued.splice(0), ...files];
          hook.queued = 0;
          if (!batch.length) return;
          busy = true;
          ui.setBusy(true);
          hook.phase = "loading";
          try {
            while (batch.length) {
              for (const file of batch) await loadOne(file);
              batch = queued.splice(0);
              hook.queued = 0;
            }
          } finally {
            finishAction();
          }
        }

        async function removeModel(id) {
          const index = models.findIndex((m) => m.id === id);
          if (busy || index === -1) return;
          busy = true;
          ui.setBusy(true);
          hook.phase = "loading";
          try {
            models.splice(index, 1);
            await engine.removeModel(id);
            publish();
          } finally {
            finishAction();
          }
        }

        async function setIncludeSpaces(include) {
          if (busy) return;
          busy = true;
          ui.setBusy(true);
          hook.phase = "loading";
          try {
            hook.options.includeSpaces = Boolean(include);
            for (const model of models) await engine.setItemsVisible(model.id, model.spaceIds, hook.options.includeSpaces);
            publish();
          } finally {
            finishAction();
          }
        }

        if (options.mode === "builder") {
          ui.fileInput.addEventListener("change", () => {
            const files = Array.from(ui.fileInput.files || []);
            ui.fileInput.value = "";
            loadFiles(files);
          });
          ui.onDropFiles((files) => loadFiles(files));
          ui.spacesToggle.addEventListener("change", () => setIncludeSpaces(ui.spacesToggle.checked));
          ui.loadButton.disabled = false;
        }
        publish();
        hook.phase = "ready";
        return {
          loadFiles,
          removeModel,
          setIncludeSpaces,
          /** Current filter result: { evaluation, indices (rows passing all filters), facets }. */
          filterView: () => view,
          /** Calls listener(view) after every filter evaluation (3D coupling and table, TASK-005 / TASK-006a). */
          onFilterChange(listener) {
            filterListeners.push(listener);
          },
        };
      }

      /** Shows a fatal start error (library loading, drift guard) in root. */
      export function fail(root, message) {
        hook.phase = "error";
        hook.error = message;
        root.textContent = message;
      }
    </script>

    <!-- Classic bootstrap of the viewer file (reads payloads, links, starts): TASK-009. ASCII only. -->
    <script type="text/plain" id="cv-viewer-bootstrap"></script>

    <script type="module" id="cv-builder">
      // Builder-only logic (spec \u00a74.2). Library versions are pinned; jsDelivr "+esm" resolves the dependency graph.
      const FRAGMENTS_VERSION = "3.4.7";
      const CDN = "https://cdn.jsdelivr.net";
      const FRAGMENTS_KEY = `/npm/@thatopen/fragments@${FRAGMENTS_VERSION}/+esm`;
      const WORKER_URL = `${CDN}/npm/@thatopen/fragments@${FRAGMENTS_VERSION}/dist/Worker/worker.min.mjs`;
      const NPM_IMPORT_RE = /(?:\bfrom\s*|\bimport\s*\(?\s*)["'](\/npm\/[^"']+)["']/g;
      const SOURCE_MAP_RE = /^\s*\/\/# sourceMappingURL=.*$/gm;

      /**
       * Links ES module sources (key -> source text) into Blob URLs without a server or bundler (ref L163-192).
       * Import specifiers are rewritten to the Blob URL of the dependency; a specifier resolves if it is a key of
       * `sources` or of `aliases` (alias -> key). Unknown "/npm/..." specifiers fail fast. Self-contained: its source
       * text is also prepended to the conversion worker (and later to the viewer file).
       */
      function tovLinkModules(sources, aliases) {
        const SPECIFIER_RE = /(\bfrom\s*|\bimport\s*\(?\s*)(["'])([^"'\n]+)\2/g;
        const has = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
        const urls = {};
        function toKey(specifier) {
          if (has(sources, specifier)) return specifier;
          if (has(aliases, specifier)) return aliases[specifier];
          return null;
        }
        function link(key, chain) {
          if (has(urls, key)) return urls[key];
          if (chain.indexOf(key) !== -1) throw new Error("Circular module import: " + chain.concat(key).join(" -> "));
          if (typeof sources[key] !== "string") throw new Error("Module source missing: " + key);
          const code = sources[key].replace(SPECIFIER_RE, function (match, prefix, quote, specifier) {
            const depKey = toKey(specifier);
            if (depKey) return prefix + quote + link(depKey, chain.concat(key)) + quote;
            if (specifier.indexOf("/npm/") === 0)
              throw new Error("Module " + key + " imports unknown module " + specifier);
            return match;
          });
          urls[key] = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
          return urls[key];
        }
        return function resolve(keyOrAlias) {
          const key = toKey(keyOrAlias);
          if (!key) throw new Error("Unknown module: " + keyOrAlias);
          return link(key, []);
        };
      }

      /**
       * Body of the classic IFC conversion worker (ref L1940-1981). Runs after tovLinkModules (prepended).
       * Input { sources, aliases, fragmentsKey, webIfcKey, wasmPath, file, extraClasses, simulateCrash };
       * output { type: "phase" | "progress" | "done" | "error", ... }; "done" carries the .frag bytes and the names of
       * the importer's element classes (the candidates for rows, spec 4.3).
       */
      function convertWorkerMain() {
        self.onmessage = async (event) => {
          const job = event.data;
          try {
            self.postMessage({ type: "phase", phase: "load" });
            if (job.simulateCrash) {
              // Test hook (REQ-001-AC2 `too-large`): an uncaught exception raises an `error` event on the Worker.
              setTimeout(() => {
                throw new Error("simulierter Absturz des Konverters (Testhaken)");
              }, 0);
              return;
            }
            const resolve = tovLinkModules(job.sources, job.aliases);
            const FRAGS = await import(resolve(job.fragmentsKey));
            const WEBIFC = await import(resolve(job.webIfcKey));
            self.postMessage({ type: "phase", phase: "read" });
            let bytes = new Uint8Array(await job.file.arrayBuffer());
            self.postMessage({ type: "phase", phase: "parse" });
            const importer = new FRAGS.IfcImporter();
            importer.wasm = { absolute: true, path: job.wasmPath };
            for (const name of job.extraClasses) {
              if (typeof WEBIFC[name] !== "number") throw new Error("Unbekannte IFC-Klasse " + name);
              importer.classes.abstract.add(WEBIFC[name]);
            }
            // IfcSpace is always converted (transparent); the option only shows/hides it (DEC-13).
            importer.geometryProcessSettings.forceTransparentSpaces = true;
            const codeNames = new Map();
            for (const key of Object.keys(WEBIFC)) {
              if (/^IFC[A-Z0-9]+$/.test(key) && typeof WEBIFC[key] === "number") codeNames.set(WEBIFC[key], key);
            }
            const elementClasses = [];
            for (const code of importer.classes.elements)
              if (codeNames.has(code)) elementClasses.push(codeNames.get(code));
            let lastSent = 0;
            const result = await importer.process({
              bytes,
              progressCallback(progress, data) {
                const now = Date.now();
                if (now - lastSent < 250) return;
                lastSent = now;
                self.postMessage({ type: "progress", progress, process: data && data.process });
              },
            });
            bytes = null;
            let output = result instanceof Uint8Array ? result : new Uint8Array(result);
            if (output.byteLength !== output.buffer.byteLength) output = output.slice();
            self.postMessage({ type: "done", bytes: output, elementClasses }, [output.buffer]);
          } catch (error) {
            self.postMessage({ type: "error", message: error && error.message ? error.message : String(error) });
          }
        };
      }

      async function fetchText(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Download fehlgeschlagen (${response.status}): ${url}`);
        return response.text();
      }

      /** Downloads the jsDelivr "+esm" module graph starting at rootKeys into `sources` (ref L2042-2053). */
      async function crawlModules(rootKeys, sources) {
        const queue = [...rootKeys];
        while (queue.length) {
          const batch = queue.splice(0).filter((key, i, all) => !(key in sources) && all.indexOf(key) === i);
          const texts = await Promise.all(batch.map((key) => fetchText(CDN + key)));
          batch.forEach((key, i) => {
            sources[key] = texts[i].replace(SOURCE_MAP_RE, "");
            for (const match of sources[key].matchAll(NPM_IMPORT_RE)) if (!(match[1] in sources)) queue.push(match[1]);
          });
        }
      }

      /** Turns the Fragments worker (ESM) into a classic worker script by removing its trailing export (ref L2055-2068). */
      function toClassicWorkerSource(moduleSource) {
        const TRAILING_EXPORT_RE = /export\s*\{[^}]*\}\s*;?\s*$/;
        const withoutMap = moduleSource.replace(SOURCE_MAP_RE, "").trimEnd();
        if (!TRAILING_EXPORT_RE.test(withoutMap)) throw new Error("Unerwartetes Format des Fragments-Workers.");
        const classic = withoutMap.replace(TRAILING_EXPORT_RE, "");
        if (/(^|[;}\s])(export|import)\s*[{*]/.test(classic))
          throw new Error("Der Fragments-Worker enth\u00e4lt noch ESM-Anweisungen.");
        return classic;
      }

      const blobUrl = (text) => URL.createObjectURL(new Blob([text], { type: "text/javascript" }));
      const block = (id) => document.getElementById(id).textContent;

      /** Crawls the library graph, applies the drift guard and links library + app modules (ref L2075-2113). */
      async function loadLibraries() {
        const libSources = {};
        await crawlModules([FRAGMENTS_KEY], libSources);
        const sources = {
          ...libSources,
          "cv-core": block("cv-core-src"),
          "cv-ui": block("cv-ui-src"),
          "cv-3d": block("cv-3d-src"),
          "cv-app": block("cv-app-src"),
        };
        const aliases = {
          "calc-core": "cv-core",
          "calc-ui": "cv-ui",
          "calc-3d": "cv-3d",
          "@thatopen/fragments": FRAGMENTS_KEY,
        };
        const resolve = tovLinkModules(sources, aliases);
        const core = await import(resolve("calc-core"));

        let versions = core.checkLibraryVersions(Object.keys(libSources));
        const orbitKey = `/npm/three@${versions.three}/examples/jsm/controls/OrbitControls.js/+esm`;
        await crawlModules([orbitKey], libSources);
        Object.assign(sources, libSources);
        versions = core.checkLibraryVersions(Object.keys(libSources)); // OrbitControls must not pull in another three
        aliases.three = `/npm/three@${versions.three}/+esm`;
        aliases["three/addons/controls/OrbitControls.js"] = orbitKey;
        const webIfcKey = `/npm/web-ifc@${versions.webIfc}/+esm`;

        // Kategorie spelling (IfcWallStandardCase) from the schema class names web-ifc exports.
        const webIfc = await import(resolve(webIfcKey));
        const classNames = core.classNameMap(
          ["IFC2X3", "IFC4", "IFC4X3"].map((schema) => Object.keys(webIfc[schema] || {})),
        );

        const worker = toClassicWorkerSource(await fetchText(WORKER_URL));
        const convertSource = tovLinkModules.toString() + "\n(" + convertWorkerMain.toString() + ")();";
        return {
          resolve,
          core,
          classNames,
          libSources,
          webIfcKey,
          aliases: { "@thatopen/fragments": FRAGMENTS_KEY, three: aliases.three },
          versions: { fragments: FRAGMENTS_VERSION, ...versions },
          fragmentsWorkerUrl: blobUrl(worker),
          convertWorkerUrl: blobUrl(convertSource),
          neverStartingWorkerUrl: blobUrl("/* test hook: a worker that never answers */"),
          wasmPath: `${CDN}/npm/web-ifc@${versions.webIfc}/`,
        };
      }

      const PHASES = { load: "Konverter wird geladen", read: "Datei wird gelesen", parse: "Konvertierung" };
      /** No message from the conversion worker within this time: it never started (e.g. blocked worker) -> unreadable. */
      const WORKER_START_TIMEOUT_MS = 30000;

      /** Reads the first and last bytes of a file and classifies it before conversion (REQ-001). */
      async function checkFile(lib, file) {
        const core = lib.core;
        const decode = async (blob) => new TextDecoder("latin1").decode(await blob.arrayBuffer());
        const head = file.size ? await decode(file.slice(0, core.HEADER_PROBE_BYTES)) : "";
        const readTail = (bytes) => decode(file.slice(Math.max(0, file.size - bytes)));
        let tail = file.size ? await readTail(core.TRAILER_PROBE_BYTES) : "";
        // A valid file may end with more blank space or comments than the short probe holds: read up to 64 KiB.
        if (file.size > core.TRAILER_PROBE_BYTES && !core.trailerComplete(tail))
          tail = await readTail(core.TRAILER_PROBE_MAX_BYTES);
        const problem = core.classifyIfcFile(file.size, head, tail);
        if (problem) throw new core.LoadError(problem.loadClass, file.name, problem.detail);
      }

      /**
       * Converts one IFC file to .frag bytes in its own classic Blob worker, terminated afterwards (ref L2186-2205).
       * A worker `error` event (crash, e.g. out of memory) -> too-large; an `error` message (parsing/conversion
       * failed) -> unreadable; no message within the start timeout -> unreadable.
       */
      function convertIfc(lib, file, onProgress) {
        const core = lib.core;
        const test = window.__calc.test || {};
        const neverStart = Boolean(test.neverStartNextConversion);
        const simulateCrash = Boolean(test.crashNextConversion);
        test.neverStartNextConversion = false;
        test.crashNextConversion = false;
        const startTimeout = test.startTimeoutMs || WORKER_START_TIMEOUT_MS;
        return new Promise((resolve, reject) => {
          const worker = new Worker(neverStart ? lib.neverStartingWorkerUrl : lib.convertWorkerUrl);
          let timer = setTimeout(() => {
            timer = null;
            finish(
              reject,
              new core.LoadError(
                "unreadable",
                file.name,
                `der Konverter ist nicht gestartet (keine Antwort nach ${Math.round(startTimeout / 1000)} s)`,
              ),
            );
          }, startTimeout);
          const finish = (callback, value) => {
            if (timer) clearTimeout(timer);
            timer = null;
            worker.terminate();
            callback(value);
          };
          onProgress(null, "Konverter wird gestartet");
          worker.onmessage = (event) => {
            if (timer) clearTimeout(timer);
            timer = null;
            const m = event.data;
            if (m.type === "phase") onProgress(m.phase === "parse" ? 0 : null, PHASES[m.phase]);
            else if (m.type === "progress") onProgress(m.progress, "Konvertierung");
            else if (m.type === "done") finish(resolve, { bytes: m.bytes, elementClasses: m.elementClasses });
            else if (m.type === "error") finish(reject, new core.LoadError("unreadable", file.name, m.message));
          };
          worker.onerror = (event) => {
            event.preventDefault();
            const error = new core.LoadError("too-large", file.name, event.message || null);
            finish(reject, error);
          };
          worker.postMessage({
            sources: lib.libSources,
            aliases: lib.aliases,
            fragmentsKey: FRAGMENTS_KEY,
            webIfcKey: lib.webIfcKey,
            wasmPath: lib.wasmPath,
            file,
            extraClasses: core.IMPORTER_EXTRA_CLASSES,
            simulateCrash,
          });
        });
      }

      const nextTask = () => new Promise((resolve) => setTimeout(resolve, 0));

      /**
       * Extraction (spec 4.3, REQ-002): element ids via getItemsOfCategories over the importer's element classes minus
       * spatial and type classes (IfcSpace kept; the option filters it), storeys via getSpatialStructure, units via
       * IfcUnitAssignment, then getItemsData in chunks of INDEX_CHUNK_SIZE ids with progress and yielding.
       */
      async function extractModel(lib, model, info, onProgress) {
        const core = lib.core;
        const classes = core.rowClasses(info.elementClasses, true);
        const [byCategory, tree, unitCategories] = await Promise.all([
          model.getItemsOfCategories([core.categoryPattern(classes)]),
          model.getSpatialStructure(),
          model.getItemsOfCategories([/^IFCUNITASSIGNMENT$/]),
        ]);
        const ids = [];
        const spaceIds = [];
        for (const [category, list] of Object.entries(byCategory)) {
          for (const id of list) ids.push(id);
          if (category === core.SPACE_CLASS) for (const id of list) spaceIds.push(id);
        }
        ids.sort((a, b) => a - b);
        const spatial = core.spatialIndex(tree);
        const storeyItems = spatial.storeyIds.length
          ? await model.getItemsData(spatial.storeyIds, core.ATTRIBUTES_ONLY_CONFIG)
          : [];
        const unitIds = Object.values(unitCategories).flat();
        const unitItems = unitIds.length ? await model.getItemsData(unitIds, core.UNIT_DATA_CONFIG) : [];
        const extractor = core.createExtractor({
          modelId: info.modelId,
          modelName: info.modelName,
          units: core.parseUnits(unitItems),
          storeyOf: core.storeyNames(spatial, storeyItems),
          withGeometry: new Set(info.withGeometry),
          className: (upper) => lib.classNames.get(upper) || upper,
        });
        for (let start = 0; start < ids.length; start += core.INDEX_CHUNK_SIZE) {
          const items = await model.getItemsData(
            ids.slice(start, start + core.INDEX_CHUNK_SIZE),
            core.ITEM_DATA_CONFIG,
          );
          for (const item of items) if (item && item._localId) extractor.add(item);
          onProgress(Math.min(1, (start + core.INDEX_CHUNK_SIZE) / ids.length));
          await nextTask();
        }
        const result = extractor.result();
        return { rows: result.rows, properties: result.properties, spaceProperties: result.spaceProperties, spaceIds };
      }

      const root = document.getElementById("cv-root");
      root.textContent = "Bibliotheken werden geladen ...";
      try {
        const lib = await loadLibraries();
        const app = await import(lib.resolve("cv-app"));
        try {
          await app.start({
            mode: "builder",
            root,
            workerUrl: lib.fragmentsWorkerUrl,
            convert: async (file, onProgress) => {
              await checkFile(lib, file);
              return convertIfc(lib, file, onProgress);
            },
            extract: (model, info, onProgress) => extractModel(lib, model, info, onProgress),
          });
          window.__calc.versions = lib.versions;
        } catch (error) {
          app.fail(root, error && error.message ? error.message : String(error));
        }
      } catch (error) {
        // Before cv-app is linked (CDN unreachable, drift guard): plain message, hook for tests.
        const message = error && error.message ? error.message : String(error);
        window.__calc = { phase: "error", error: message, models: [], modelCount: 0, elementCount: 0 };
        root.textContent = message;
        root.style.padding = "24px";
        root.style.color = "#D72622";
      }
      document.documentElement.dataset.cvReady = "builder";
    </script>
  </body>
</html>
