<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calc Viewer Builder</title>
    <!--
      Calc Viewer Builder (spec docs/spec.md §4.2). Blocks:
        cv-css               shared styles (builder + viewer file)
        cv-core-src          pure logic, no DOM, no imports (extracted for node:test by test/load-core.mjs)
        cv-ui-src            DOM: layout, filter area (virtualised value lists, catalogue dialog), status; imports calc-core
        cv-3d-src            engine start and model display; imports three, @thatopen/fragments, OrbitControls
        cv-app-src           entry: start({mode}) wires ui + 3d
        cv-viewer-bootstrap  classic bootstrap of the viewer file (TASK-009)
        cv-builder           builder-only real inline module: CDN crawl + drift guard, linking, conversion worker
      The text/plain blocks are embedded into the viewer file later: ASCII only, no closing script tag.
      TASK-001b walking skeleton: the builder needs internet access (jsDelivr) to load the libraries.
    -->
    <style id="cv-css">
      /* Light HTML Model Viewer style (spec 2 User interface, UI-02; reference CSS ref L1714-1938, L18-115). */
      :root {
        --cv-accent: #d72622;
        --cv-accent-dark: #b81f1c;
        --cv-accent-soft: rgba(215, 38, 34, 0.08);
        --cv-ink: #35383a;
        --cv-ink-2: #4e5355;
        --cv-muted: #6b6f73;
        --cv-faint: #a4a8ac;
        --cv-bg: #f4f5f6;
        --cv-bg-3d: #eceef0;
        --cv-line: #e1e3e5;
        --cv-err: #d72622;
        --cv-hover: rgba(23, 24, 26, 0.05);
        --cv-shadow: 0 12px 32px rgba(23, 24, 26, 0.16), 0 2px 6px rgba(23, 24, 26, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font:
          14px/1.5 "Segoe UI",
          system-ui,
          Roboto,
          Arial,
          sans-serif;
        color: var(--cv-ink);
        background: var(--cv-bg);
      }
      button,
      input {
        font: inherit;
      }
      #cv-root {
        height: 100%;
      }
      .cv-app {
        position: relative;
        display: grid;
        grid-template-rows: 56px minmax(0, 1fr) 28px;
        height: 100%;
      }
      .cv-icon {
        display: inline-flex;
        flex: none;
      }
      .cv-icon svg {
        width: 16px;
        height: 16px;
      }

      /* Header: logo, title, date, builder buttons */
      .cv-header {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 0 16px;
        background: #fff;
        border-bottom: 1px solid var(--cv-line);
        box-shadow: 0 1px 3px rgba(53, 56, 58, 0.06);
      }
      .cv-logo {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: var(--cv-accent);
        color: #fff;
      }
      .cv-logo .cv-icon svg {
        width: 22px;
        height: 22px;
      }
      .cv-brand {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding-left: 12px;
        border-left: 1px solid var(--cv-line);
        line-height: 1.25;
      }
      .cv-title {
        margin: 0;
        overflow: hidden;
        font-size: 16px;
        font-weight: 600;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .cv-date {
        color: var(--cv-muted);
        font-size: 12px;
      }
      .cv-actions {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }
      .cv-btn {
        font-size: 13px;
        padding: 6px 12px;
        border: 1px solid var(--cv-line);
        border-radius: 8px;
        background: #fff;
        color: var(--cv-ink);
        font-weight: 600;
        cursor: pointer;
      }
      .cv-btn:hover:not(:disabled) {
        border-color: var(--cv-muted);
      }
      .cv-btn:disabled {
        color: var(--cv-faint);
        cursor: default;
      }
      .cv-btn.cv-primary {
        background: var(--cv-accent);
        border-color: var(--cv-accent);
        color: #fff;
      }
      .cv-btn.cv-primary:hover:not(:disabled) {
        background: var(--cv-accent-dark);
        border-color: var(--cv-accent-dark);
      }
      .cv-btn.cv-primary:disabled {
        background: var(--cv-faint);
        border-color: var(--cv-faint);
      }
      .cv-icon-btn {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--cv-muted);
        cursor: pointer;
      }
      .cv-icon-btn:hover:not(:disabled) {
        background: var(--cv-accent-soft);
        color: var(--cv-accent);
      }
      .cv-icon-btn:disabled {
        opacity: 0.35;
        color: var(--cv-faint);
        cursor: default;
      }
      .cv-icon-btn:focus-visible,
      .cv-btn:focus-visible,
      .cv-link:focus-visible {
        outline: 2px solid var(--cv-accent);
        outline-offset: 1px;
      }
      .cv-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--cv-accent);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .cv-link:hover:not(:disabled) {
        background: var(--cv-accent-soft);
      }
      .cv-link:disabled {
        color: var(--cv-faint);
        cursor: default;
      }

      /* Three columns: filter area ~280 px, centre, details ~320 px (collapsible) */
      .cv-main {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr) 320px;
        min-height: 0;
      }
      .cv-main.cv-details-collapsed {
        grid-template-columns: 280px minmax(0, 1fr) 40px;
      }
      .cv-panel {
        min-height: 0;
        overflow: auto;
        background: #fff;
        padding: 12px 14px;
      }
      .cv-filters {
        border-right: 1px solid var(--cv-line);
      }
      .cv-details {
        border-left: 1px solid var(--cv-line);
      }
      .cv-details-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .cv-details-head h2 {
        flex: 1;
        margin: 0;
      }
      .cv-details-collapsed .cv-details {
        padding: 10px 8px;
        overflow: hidden;
      }
      .cv-details-collapsed .cv-details-head h2 {
        display: none;
      }
      .cv-panel h2 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--cv-ink-2);
        text-transform: uppercase;
      }
      .cv-hint {
        margin: 6px 0;
        color: var(--cv-muted);
        font-size: 13px;
      }
      .cv-center {
        display: grid;
        grid-template-rows: minmax(0, 55fr) 6px minmax(0, 45fr);
        min-height: 0;
        min-width: 0;
      }
      .cv-viewport {
        position: relative;
        min-height: 0;
        background: var(--cv-bg-3d);
        overflow: hidden;
      }
      .cv-viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .cv-splitter {
        position: relative;
        background: var(--cv-line);
        cursor: row-resize;
        touch-action: none;
      }
      .cv-splitter::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 2px;
        width: 36px;
        height: 2px;
        margin-left: -18px;
        border-radius: 2px;
        background: var(--cv-faint);
      }
      .cv-splitter:hover,
      .cv-splitter.cv-dragging,
      .cv-splitter:focus-visible {
        outline: none;
        background: var(--cv-accent);
      }
      .cv-table {
        min-height: 0;
      }
      .cv-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .cv-overlay-box {
        max-width: 80%;
        padding: 10px 16px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        border-left: 4px solid var(--cv-accent);
        box-shadow: var(--cv-shadow);
        font-size: 13px;
        pointer-events: auto;
      }
      .cv-overlay.cv-error .cv-overlay-box {
        color: var(--cv-err);
      }
      .cv-statusline {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        font-size: 12px;
        color: var(--cv-muted);
        background: #fff;
        border-top: 1px solid var(--cv-line);
      }
      .cv-status {
        color: var(--cv-ink);
        font-weight: 600;
      }

      /* Models and messages */
      .cv-models {
        margin: 0 0 6px;
        padding: 0;
        list-style: none;
      }
      .cv-model {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        font-size: 13px;
      }
      .cv-model-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .cv-model-count {
        color: var(--cv-muted);
        font-size: 12px;
      }
      .cv-model-remove,
      .cv-message-close {
        padding: 0 6px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--cv-muted);
        cursor: pointer;
      }
      .cv-model-remove:hover:not(:disabled),
      .cv-message-close:hover {
        background: var(--cv-accent-soft);
        color: var(--cv-accent);
      }
      .cv-option {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
        color: var(--cv-ink-2);
        font-size: 13px;
      }
      .cv-option input,
      .cv-fs-value input {
        accent-color: var(--cv-accent);
      }
      .cv-message {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        margin-bottom: 8px;
        padding: 6px 8px;
        border-left: 3px solid var(--cv-err);
        border-radius: 4px;
        background: #fdf3f2;
        color: var(--cv-err);
        font-size: 12px;
      }
      .cv-message-text {
        flex: 1;
        overflow-wrap: anywhere;
      }

      /* Filter area and filter sets (REQ-003, REQ-004) */
      .cv-filter-area {
        padding-top: 10px;
        border-top: 1px solid var(--cv-line);
      }
      .cv-fa-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .cv-fa-head h2 {
        margin: 0;
      }
      .cv-fa-reset {
        margin: 2px 0 8px -8px;
        font-weight: 400;
      }
      .cv-fa-sets {
        display: grid;
        gap: 8px;
      }
      .cv-fs {
        border: 1px solid var(--cv-line);
        border-radius: 10px;
        background: #fff;
      }
      .cv-fs.cv-dragging {
        opacity: 0.45;
      }
      .cv-fs.cv-drop-before {
        box-shadow: 0 -3px 0 var(--cv-accent);
      }
      .cv-fs.cv-drop-after {
        box-shadow: 0 3px 0 var(--cv-accent);
      }
      .cv-fs-head {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 5px 4px 5px 4px;
        border-radius: 10px 10px 0 0;
        background: var(--cv-bg);
        cursor: grab;
      }
      .cv-fs.cv-collapsed .cv-fs-head {
        border-radius: 10px;
      }
      .cv-fs-grip {
        color: var(--cv-faint);
      }
      .cv-fs-grip svg {
        width: 14px;
        height: 14px;
      }
      .cv-fs-toggle .cv-icon svg {
        transform: rotate(90deg);
        transition: transform 0.15s;
      }
      .cv-fs.cv-collapsed .cv-fs-toggle .cv-icon svg {
        transform: none;
      }
      .cv-fs-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--cv-ink);
      }
      .cv-fs-unit {
        flex: none;
        color: var(--cv-muted);
        font-size: 12px;
      }
      .cv-fs-unit:empty {
        display: none;
      }
      .cv-fs-badge {
        flex: none;
        min-width: 18px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--cv-accent);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        line-height: 18px;
        text-align: center;
      }
      .cv-fs-body {
        padding: 6px 6px 6px;
      }
      .cv-search {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--cv-faint);
        border-radius: 8px;
        background: #fff;
        color: var(--cv-muted);
      }
      .cv-search:focus-within {
        border-color: var(--cv-accent);
        box-shadow: 0 0 0 3px rgba(215, 38, 34, 0.12);
      }
      .cv-search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--cv-ink);
        font-size: 13px;
      }
      .cv-vlist {
        position: relative;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .cv-vspacer {
        width: 1px;
      }
      .cv-vrow {
        position: absolute;
        left: 0;
        right: 0;
      }
      .cv-fs-values {
        margin-top: 4px;
      }
      .cv-fs-value {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 6px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
      }
      .cv-fs-value:hover {
        background: var(--cv-hover);
      }
      .cv-fs-value input {
        flex: none;
        width: 14px;
        height: 14px;
        margin: 0;
      }
      .cv-dot {
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        visibility: hidden;
      }
      .cv-dot.cv-dot-on {
        visibility: visible;
        box-shadow: inset 0 0 0 1px rgba(23, 24, 26, 0.12);
      }
      .cv-fs-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .cv-fs-label.cv-empty-value {
        color: var(--cv-muted);
        font-style: italic;
      }
      .cv-fs-count {
        flex: none;
        color: var(--cv-muted);
        font-size: 12px;
      }
      .cv-fs-value.cv-zero .cv-fs-count {
        color: var(--cv-faint);
      }

      /* Dialogs: property catalogue */
      .cv-backdrop {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(53, 56, 58, 0.28);
      }
      .cv-dialog {
        display: flex;
        flex-direction: column;
        width: min(520px, 100%);
        max-height: 100%;
        border-radius: 14px;
        background: #fff;
        box-shadow: var(--cv-shadow);
        overflow: hidden;
      }
      .cv-dialog-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 12px 12px 20px;
        border-bottom: 1px solid var(--cv-line);
      }
      .cv-dialog-title {
        flex: 1;
        font-size: 17px;
        font-weight: 600;
      }
      .cv-dialog-close {
        width: 30px;
        height: 30px;
      }
      .cv-dialog-body {
        display: grid;
        gap: 8px;
        min-height: 0;
        padding: 14px 20px 10px;
      }
      .cv-cat-list {
        height: min(420px, 55vh);
        border: 1px solid var(--cv-line);
        border-radius: 8px;
      }
      .cv-cat-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 0 12px;
        border: 0;
        background: none;
        color: var(--cv-ink);
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      .cv-cat-entry:hover:not(:disabled) {
        background: var(--cv-accent-soft);
        color: var(--cv-accent);
      }
      .cv-cat-entry {
        padding-left: 24px;
      }
      .cv-cat-group {
        background: var(--cv-bg);
        color: var(--cv-ink-2);
        font-size: 12px;
        font-weight: 700;
        cursor: default;
      }
      .cv-cat-entry.cv-used {
        color: var(--cv-faint);
        cursor: default;
      }
      .cv-cat-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .cv-cat-note {
        font-size: 11px;
      }
      .cv-cat-count {
        flex: none;
        color: var(--cv-muted);
        font-size: 12px;
      }
      .cv-cat-info {
        margin: 0;
        font-size: 12px;
      }

      @media (max-width: 1279px) {
        .cv-main,
        .cv-main.cv-details-collapsed {
          grid-template-columns: 0 minmax(0, 1fr) 0;
        }
        .cv-filters,
        .cv-details {
          padding: 0;
          overflow: hidden;
          border: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="cv-root"></div>

    <!-- Pure logic, no DOM, no imports; extracted for node:test by test/load-core.mjs. ASCII only. -->
    <script type="text/plain" id="cv-core-src">
      export const CORE_NAME = "calc-core";

      /** Identifies the core module (schemaVersion is the configuration schema, TASK-007). */
      export function coreInfo() {
        return { name: CORE_NAME, schemaVersion: 0 };
      }

      /** Library versions the builder accepts from the jsDelivr +esm graph of fragments 3.4.7 (spec 4.1, DEC-10). */
      export const EXPECTED_THREE = "0.185.1";
      export const EXPECTED_WEBIFC = "0.0.77";

      /** Returns the sorted distinct versions of an npm package that occur in jsDelivr module keys ("/npm/<pkg>@<v>/..."). */
      export function packageVersions(moduleKeys, pkg) {
        const prefix = "/npm/" + pkg + "@";
        const found = new Set();
        for (const key of moduleKeys) {
          if (key.indexOf(prefix) !== 0) continue;
          const version = key.slice(prefix.length).split("/")[0];
          if (version) found.add(version);
        }
        return [...found].sort();
      }

      /**
       * Drift guard (spec 4.1): exactly one three version and the expected three and web-ifc versions must occur in
       * the crawled module graph. Returns { three, webIfc }; otherwise throws the German error message of the spec.
       */
      export function checkLibraryVersions(moduleKeys, expected) {
        const want = expected || { three: EXPECTED_THREE, webIfc: EXPECTED_WEBIFC };
        const checks = [
          ["three", packageVersions(moduleKeys, "three"), want.three],
          ["web-ifc", packageVersions(moduleKeys, "web-ifc"), want.webIfc],
        ];
        for (const [lib, versions, wanted] of checks) {
          if (versions.length !== 1 || versions[0] !== wanted) {
            const found = versions.length ? versions.join(", ") : "keine";
            throw new Error("Unerwartete Bibliotheksversion von jsDelivr: " + lib + " " + found + " statt " + wanted + ".");
          }
        }
        return { three: checks[0][1][0], webIfc: checks[1][1][0] };
      }

      // ---------------------------------------------------------------------------------------------------------
      // REQ-001: load errors, model names
      // ---------------------------------------------------------------------------------------------------------

      /** Accepted FILE_SCHEMA values (REQ-001). */
      export const SUPPORTED_SCHEMAS = ["IFC2X3", "IFC4"];
      /** Bytes read from the start and the end of a file for the header/trailer check. */
      export const HEADER_PROBE_BYTES = 65536;
      export const TRAILER_PROBE_BYTES = 1024;

      /** A classified load error (REQ-001): loadClass is one of LOAD_ERROR_CLASSES. */
      export class LoadError extends Error {
        constructor(loadClass, fileName, detail) {
          super(loadErrorMessage(loadClass, fileName, detail));
          this.loadClass = loadClass;
          this.fileName = fileName;
          this.detail = detail === undefined ? null : detail;
        }
      }
      export const LOAD_ERROR_CLASSES = ["empty", "not-ifc", "unsupported-schema", "unreadable", "too-large"];

      /** German message per load error class; always contains the file name (REQ-001). */
      export function loadErrorMessage(loadClass, fileName, detail) {
        const name = fileName;
        const cause = String(detail === undefined || detail === null || detail === "" ? "unbekannte Ursache" : detail)
          .trim()
          .replace(/[.\s]+$/, "");
        switch (loadClass) {
          case "empty":
            return name + " ist leer.";
          case "not-ifc":
            return name + " ist keine IFC-Datei.";
          case "unsupported-schema":
            return name + " verwendet das nicht unterst\u00fctzte Schema " + cause + ".";
          case "unreadable":
            return name + " konnte nicht gelesen werden: " + cause + ".";
          case "too-large":
            return name + " ist m\u00f6glicherweise zu gro\u00df f\u00fcr den Arbeitsspeicher des Browsers.";
          default:
            throw new Error("Unbekannte Fehlerklasse: " + loadClass);
        }
      }

      /** Upper bound of the trailer probe: read when the last TRAILER_PROBE_BYTES do not show the trailer. */
      export const TRAILER_PROBE_MAX_BYTES = 65536;

      /**
       * End of a STEP file as it matters for the trailer check: NUL bytes removed, then trailing whitespace and
       * complete trailing comments stripped repeatedly (a valid file may end with blank lines or a comment).
       */
      export function trailerText(tail) {
        let end = String(tail || "")
          .split(String.fromCharCode(0))
          .join("")
          .trimEnd();
        for (;;) {
          const stripped = end.replace(/\/\*(?:(?!\*\/)[\s\S])*\*\/$/, "").trimEnd();
          if (stripped === end) return end;
          end = stripped;
        }
      }

      /** True if the given end of a file closes with END-ISO-10303-21; (after trailing whitespace and comments). */
      export function trailerComplete(tail) {
        return /END-ISO-10303-21;$/i.test(trailerText(tail));
      }

      /**
       * Classifies a file before conversion from its size, the text of its first bytes (head) and of its last bytes
       * (tail). Returns null if the file looks like a complete IFC2X3/IFC4 STEP file, else { loadClass, detail }.
       */
      export function classifyIfcFile(size, head, tail) {
        if (!size) return { loadClass: "empty", detail: null };
        const start = String(head || "")
          .replace(/^(\u00ef\u00bb\u00bf|\ufeff)/, "")
          .replace(/^\s+/, "");
        if (start.slice(0, 13).toUpperCase() !== "ISO-10303-21;") return { loadClass: "not-ifc", detail: null };
        const schema = /FILE_SCHEMA\s*\(\s*\(\s*'([^']*)'/i.exec(start);
        if (!schema) return { loadClass: "unreadable", detail: "FILE_SCHEMA fehlt im Dateikopf" };
        const name = schema[1].trim().toUpperCase();
        if (SUPPORTED_SCHEMAS.indexOf(name) === -1) return { loadClass: "unsupported-schema", detail: schema[1].trim() };
        if (!trailerComplete(tail))
          return { loadClass: "unreadable", detail: "die Datei ist unvollst\u00e4ndig (END-ISO-10303-21 fehlt)" };
        return null;
      }

      /** Model name of a file: the file name without its extension (REQ-001 `Modell`). */
      export function modelNameFromFile(fileName) {
        const base = String(fileName).split(/[\\/]/).pop();
        const dot = base.lastIndexOf(".");
        return dot > 0 ? base.slice(0, dot) : base;
      }

      /** name, or name + " (2)", " (3)", ... so it differs from every name in `taken` (DEC-12). */
      export function uniqueModelName(name, taken) {
        const used = new Set(taken);
        if (!used.has(name)) return name;
        for (let n = 2; ; n++) {
          const candidate = name + " (" + n + ")";
          if (!used.has(candidate)) return candidate;
        }
      }

      // ---------------------------------------------------------------------------------------------------------
      // REQ-002: extraction rules (pure; the engine calls live in cv-builder)
      // ---------------------------------------------------------------------------------------------------------

      /** Classes added to the importer's defaults (spec 4.3): IFC2X3 door/window types and conversion-based units. */
      export const IMPORTER_EXTRA_CLASSES = ["IFCDOORSTYLE", "IFCWINDOWSTYLE", "IFCCONVERSIONBASEDUNIT", "IFCMEASUREWITHUNIT"];
      /** Spatial structure classes: never rows (IfcSpace only with the option, DEC-13). */
      export const SPATIAL_CLASSES = [
        "IFCPROJECT",
        "IFCSITE",
        "IFCBUILDING",
        "IFCBUILDINGSTOREY",
        "IFCSPACE",
        "IFCSPATIALZONE",
        "IFCEXTERNALSPATIALELEMENT",
        "IFCFACILITY",
        "IFCFACILITYPART",
        "IFCBRIDGE",
        "IFCBRIDGEPART",
        "IFCROAD",
        "IFCROADPART",
        "IFCRAILWAY",
        "IFCRAILWAYPART",
        "IFCMARINEFACILITY",
        "IFCMARINEPART",
      ];
      export const SPACE_CLASS = "IFCSPACE";
      /** ids per getItemsData call (as ref INDEX_CHUNK_SIZE). */
      export const INDEX_CHUNK_SIZE = 2000;

      const REL_ON = { attributes: true, relations: true };
      const REL_OFF = { attributes: false, relations: false };
      /**
       * getItemsData config for element rows (spec 4.3): psets/qtos/type via IsDefinedBy, type psets via
       * HasPropertySets, materials via HasAssociations and their set/layer/profile/constituent chains. Inverse and
       * heavy relations are switched off explicitly; otherwise nested items inherit the parent's config.
       */
      export const ITEM_DATA_CONFIG = {
        attributesDefault: true,
        relationsDefault: REL_OFF,
        relations: {
          IsDefinedBy: REL_ON,
          HasPropertySets: REL_ON,
          HasProperties: REL_ON,
          Quantities: REL_ON,
          HasAssociations: REL_ON,
          ForLayerSet: REL_ON,
          MaterialLayers: REL_ON,
          Material: REL_ON,
          Materials: REL_ON,
          MaterialConstituents: REL_ON,
          ForProfileSet: REL_ON,
          MaterialProfiles: REL_ON,
          DefinesOccurrence: REL_OFF,
          ObjectTypeOf: REL_OFF,
          AssociatedTo: REL_OFF,
          ContainsElements: REL_OFF,
          ContainedInStructure: REL_OFF,
          IsDecomposedBy: REL_OFF,
          Decomposes: REL_OFF,
          IsNestedBy: REL_OFF,
          Nests: REL_OFF,
          ReferencedInStructures: REL_OFF,
          ReferencesElements: REL_OFF,
          RepresentationMaps: REL_OFF,
        },
      };
      /** getItemsData config for IfcUnitAssignment: units, conversion factors and their base units. */
      export const UNIT_DATA_CONFIG = {
        attributesDefault: true,
        relationsDefault: REL_OFF,
        relations: { Units: REL_ON, ConversionFactor: REL_ON, UnitComponent: REL_ON, Dimensions: REL_OFF, Elements: REL_OFF },
      };
      /** getItemsData config for attributes only (storeys). */
      export const ATTRIBUTES_ONLY_CONFIG = { attributesDefault: true, relationsDefault: REL_OFF };

      /** Element classes of the importer that become rows: without spatial structure and type objects. */
      export function rowClasses(elementClasses, includeSpaces) {
        const out = [];
        for (const name of elementClasses) {
          const upper = String(name).toUpperCase();
          if (/(TYPE|STYLE)$/.test(upper)) continue;
          if (SPATIAL_CLASSES.indexOf(upper) !== -1 && !(includeSpaces && upper === SPACE_CLASS)) continue;
          if (out.indexOf(upper) === -1) out.push(upper);
        }
        return out.sort();
      }

      /** One RegExp matching exactly the given category names (for getItemsOfCategories). */
      export function categoryPattern(classes) {
        return new RegExp("^(" + classes.map((c) => c.replace(/[^A-Z0-9_]/gi, "")).join("|") + ")$");
      }

      /** Map upper-case class name -> schema spelling (IfcWallStandardCase), from lists of schema class names. */
      export function classNameMap(nameLists) {
        const map = new Map();
        for (const list of nameLists) for (const name of list) if (/^Ifc/.test(name)) map.set(name.toUpperCase(), name);
        return map;
      }

      const val = (attr) => (attr && !Array.isArray(attr) && attr.value !== undefined ? attr.value : undefined);

      // ---- units (DEC-2) ----
      const SI_PREFIX_EXP = {
        EXA: 18,
        PETA: 15,
        TERA: 12,
        GIGA: 9,
        MEGA: 6,
        KILO: 3,
        HECTO: 2,
        DECA: 1,
        DECI: -1,
        CENTI: -2,
        MILLI: -3,
        MICRO: -6,
        NANO: -9,
        PICO: -12,
        FEMTO: -15,
        ATTO: -18,
      };
      const SI_PREFIX_SYMBOL = {
        EXA: "E",
        PETA: "P",
        TERA: "T",
        GIGA: "G",
        MEGA: "M",
        KILO: "k",
        HECTO: "h",
        DECA: "da",
        DECI: "d",
        CENTI: "c",
        MILLI: "m",
        MICRO: "\u00b5",
        NANO: "n",
        PICO: "p",
        FEMTO: "f",
        ATTO: "a",
      };
      const SI_SYMBOL = {
        METRE: "m",
        SQUARE_METRE: "m\u00b2",
        CUBIC_METRE: "m\u00b3",
        GRAM: "g",
        SECOND: "s",
        AMPERE: "A",
        KELVIN: "K",
        DEGREE_CELSIUS: "\u00b0C",
        MOLE: "mol",
        CANDELA: "cd",
        RADIAN: "rad",
        STERADIAN: "sr",
        HERTZ: "Hz",
        NEWTON: "N",
        PASCAL: "Pa",
        JOULE: "J",
        WATT: "W",
        COULOMB: "C",
        VOLT: "V",
        FARAD: "F",
        OHM: "\u03a9",
        SIEMENS: "S",
        WEBER: "Wb",
        TESLA: "T",
        HENRY: "H",
        LUMEN: "lm",
        LUX: "lx",
        BECQUEREL: "Bq",
        GRAY: "Gy",
        SIEVERT: "Sv",
      };
      const CONVERSION_SYMBOL = {
        FOOT: "ft",
        INCH: "in",
        YARD: "yd",
        MILE: "mi",
        "SQUARE FOOT": "ft\u00b2",
        "SQUARE INCH": "in\u00b2",
        "SQUARE YARD": "yd\u00b2",
        ACRE: "ac",
        "CUBIC FOOT": "ft\u00b3",
        "CUBIC INCH": "in\u00b3",
        "CUBIC YARD": "yd\u00b3",
        GALLON: "gal",
        LITRE: "l",
        POUND: "lb",
        OUNCE: "oz",
        TON: "t",
        DEGREE: "\u00b0",
        MINUTE: "min",
        HOUR: "h",
        DAY: "d",
      };
      const DERIVED_SYMBOL = {
        THERMALTRANSMITTANCEUNIT: "W/(m\u00b2\u00b7K)",
        THERMALCONDUCTANCEUNIT: "W/(m\u00b7K)",
        MASSDENSITYUNIT: "kg/m\u00b3",
        SPECIFICHEATCAPACITYUNIT: "J/(kg\u00b7K)",
        VOLUMETRICFLOWRATEUNIT: "m\u00b3/s",
        LINEARVELOCITYUNIT: "m/s",
        MASSFLOWRATEUNIT: "kg/s",
        HEATFLUXDENSITYUNIT: "W/m\u00b2",
        THERMALRESISTANCEUNIT: "m\u00b2\u00b7K/W",
        MODULUSOFELASTICITYUNIT: "N/m\u00b2",
        MOMENTOFINERTIAUNIT: "m\u2074",
      };

      /** Unit type of each IFC measure type (values of properties and quantities). */
      export const MEASURE_UNIT_TYPE = {
        IFCLENGTHMEASURE: "LENGTHUNIT",
        IFCPOSITIVELENGTHMEASURE: "LENGTHUNIT",
        IFCNONNEGATIVELENGTHMEASURE: "LENGTHUNIT",
        IFCAREAMEASURE: "AREAUNIT",
        IFCVOLUMEMEASURE: "VOLUMEUNIT",
        IFCMASSMEASURE: "MASSUNIT",
        IFCPOSITIVEPLANEANGLEMEASURE: "PLANEANGLEUNIT",
        IFCPLANEANGLEMEASURE: "PLANEANGLEUNIT",
        IFCSOLIDANGLEMEASURE: "SOLIDANGLEUNIT",
        IFCTIMEMEASURE: "TIMEUNIT",
        IFCTHERMODYNAMICTEMPERATUREMEASURE: "THERMODYNAMICTEMPERATUREUNIT",
        IFCMONETARYMEASURE: "MONETARYUNIT",
        IFCELECTRICCURRENTMEASURE: "ELECTRICCURRENTUNIT",
        IFCELECTRICVOLTAGEMEASURE: "ELECTRICVOLTAGEUNIT",
        IFCPOWERMEASURE: "POWERUNIT",
        IFCENERGYMEASURE: "ENERGYUNIT",
        IFCFORCEMEASURE: "FORCEUNIT",
        IFCPRESSUREMEASURE: "PRESSUREUNIT",
        IFCFREQUENCYMEASURE: "FREQUENCYUNIT",
        IFCLUMINOUSFLUXMEASURE: "LUMINOUSFLUXUNIT",
        IFCILLUMINANCEMEASURE: "ILLUMINANCEUNIT",
        IFCTHERMALTRANSMITTANCEMEASURE: "THERMALTRANSMITTANCEUNIT",
        IFCTHERMALCONDUCTIVITYMEASURE: "THERMALCONDUCTANCEUNIT",
        IFCMASSDENSITYMEASURE: "MASSDENSITYUNIT",
        IFCSPECIFICHEATCAPACITYMEASURE: "SPECIFICHEATCAPACITYUNIT",
        IFCVOLUMETRICFLOWRATEMEASURE: "VOLUMETRICFLOWRATEUNIT",
        IFCLINEARVELOCITYMEASURE: "LINEARVELOCITYUNIT",
        IFCMASSFLOWRATEMEASURE: "MASSFLOWRATEUNIT",
        IFCHEATFLUXDENSITYMEASURE: "HEATFLUXDENSITYUNIT",
        IFCTHERMALRESISTANCEMEASURE: "THERMALRESISTANCEUNIT",
        IFCMODULUSOFELASTICITYMEASURE: "MODULUSOFELASTICITYUNIT",
        IFCMOMENTOFINERTIAMEASURE: "MOMENTOFINERTIAUNIT",
      };
      /** Converted unit types and their target unit (DEC-2). */
      export const SI_TARGET = { LENGTHUNIT: "m", AREAUNIT: "m\u00b2", VOLUMEUNIT: "m\u00b3" };

      function siExponent(name) {
        if (/^SQUARE_/.test(name)) return 2;
        if (/^CUBIC_/.test(name)) return 3;
        return 1;
      }

      /** Describes one unit item (IfcSIUnit, IfcConversionBasedUnit, IfcDerivedUnit, IfcMonetaryUnit). */
      export function describeUnit(item) {
        if (!item) return null;
        const category = val(item._category);
        const unitType = val(item.UnitType) || (category === "IFCMONETARYUNIT" ? "MONETARYUNIT" : null);
        if (category === "IFCSIUNIT") {
          const name = String(val(item.Name) || "");
          const prefix = val(item.Prefix) || null;
          const exp = prefix && SI_PREFIX_EXP[prefix] !== undefined ? SI_PREFIX_EXP[prefix] * siExponent(name) : 0;
          return {
            unitType,
            kind: "si",
            exponent: exp,
            factor: Math.pow(10, exp),
            label: (prefix ? SI_PREFIX_SYMBOL[prefix] || "" : "") + (SI_SYMBOL[name] || name.toLowerCase()),
          };
        }
        if (category === "IFCCONVERSIONBASEDUNIT") {
          const name = String(val(item.Name) || "");
          const measure = (item.ConversionFactor || [])[0];
          const component = measure ? val(measure.ValueComponent) : undefined;
          const base = measure ? describeUnit((measure.UnitComponent || [])[0]) : null;
          const factor = typeof component === "number" && base && base.factor !== null ? component * base.factor : null;
          const key = name.toUpperCase().replace(/_/g, " ").trim();
          return { unitType, kind: "conversion", factor, label: CONVERSION_SYMBOL[key] || name.toLowerCase() };
        }
        if (category === "IFCMONETARYUNIT") {
          const currency = val(item.Currency);
          return { unitType, kind: "monetary", factor: null, label: currency ? String(currency) : null };
        }
        if (category === "IFCDERIVEDUNIT") {
          const own = val(item.UserDefinedType);
          return { unitType, kind: "derived", factor: null, label: DERIVED_SYMBOL[unitType] || own || unitType };
        }
        return null;
      }

      /** Project units from the IfcUnitAssignment item(s): unitType -> describeUnit result (first assignment wins). */
      export function parseUnits(unitAssignments) {
        const units = {};
        for (const assignment of unitAssignments || []) {
          for (const item of assignment.Units || []) {
            const unit = describeUnit(item);
            if (unit && unit.unitType && !units[unit.unitType]) units[unit.unitType] = unit;
          }
        }
        return units;
      }

      /**
       * A numeric value of the given measure type in the model's units -> { value, unit }. Length/area/volume become
       * m/m2/m3 (SI prefix or conversion factor); other measures keep the project unit (label or null).
       */
      export function convertUnit(value, measureType, units) {
        const unitType = MEASURE_UNIT_TYPE[String(measureType || "").toUpperCase()];
        if (!unitType) return { value, unit: null };
        const unit = units && units[unitType];
        if (SI_TARGET[unitType]) {
          const target = SI_TARGET[unitType];
          // SI prefixes: divide by the power of ten for negative exponents (9700 mm / 1000 = 9.7 exactly)
          if (unit && unit.kind === "si" && unit.exponent) {
            const scaled = unit.exponent < 0 ? value / Math.pow(10, -unit.exponent) : value * Math.pow(10, unit.exponent);
            return { value: scaled, unit: target };
          }
          const factor = unit && typeof unit.factor === "number" && isFinite(unit.factor) ? unit.factor : 1;
          return { value: factor === 1 ? value : value * factor, unit: target };
        }
        return { value, unit: unit && unit.label ? unit.label : null };
      }

      // ---- spatial structure ----

      /**
       * From the fragments spatial tree: storeyOf (Map localId -> storey localId, nearest IfcBuildingStorey ancestor,
       * also through aggregation) and the storey ids. Tree nodes are { category, localId, children }; a node with a
       * category groups items of that category.
       */
      export function spatialIndex(tree) {
        const storeyOf = new Map();
        const storeyIds = [];
        const stack = tree ? [[tree, null, null]] : [];
        while (stack.length) {
          const [node, inherited, parentStorey] = stack.pop();
          const category = node.category || inherited;
          let storey = parentStorey;
          if (node.localId !== null && node.localId !== undefined) {
            if (category === "IFCBUILDINGSTOREY") {
              storey = node.localId;
              if (storeyIds.indexOf(storey) === -1) storeyIds.push(storey);
            }
            if (storey !== null && storey !== node.localId) storeyOf.set(node.localId, storey);
          }
          const children = node.children || [];
          for (let i = children.length - 1; i >= 0; i--) stack.push([children[i], node.category || null, storey]);
        }
        return { storeyOf, storeyIds };
      }

      /** Map localId -> storey Name from spatialIndex and the storeys' item data. */
      export function storeyNames(index, storeyItems) {
        const names = new Map();
        for (const item of storeyItems || []) names.set(val(item._localId), val(item.Name));
        const out = new Map();
        for (const [id, storey] of index.storeyOf) {
          const name = names.get(storey);
          if (name !== undefined && name !== null && name !== "") out.set(id, String(name));
        }
        return out;
      }

      // ---- materials ----
      const MATERIAL_CHILDREN = [
        "ForLayerSet",
        "MaterialLayers",
        "Material",
        "Materials",
        "MaterialConstituents",
        "ForProfileSet",
        "MaterialProfiles",
      ];

      /** Sorted distinct IfcMaterial names reachable from HasAssociations items (layer/profile/constituent sets, lists). */
      export function materialNames(associations) {
        const found = new Set();
        const seen = new Set();
        const walk = (item) => {
          if (!item || seen.has(item)) return;
          seen.add(item);
          const category = String(val(item._category) || "");
          if (category === "IFCMATERIAL") {
            const name = val(item.Name);
            if (name !== undefined && name !== null && name !== "") found.add(String(name));
            return;
          }
          if (category.indexOf("IFCMATERIAL") !== 0) return; // classification references etc.
          for (const key of MATERIAL_CHILDREN) for (const child of item[key] || []) walk(child);
        };
        for (const item of associations || []) walk(item);
        return [...found].sort();
      }

      // ---- property values ----
      const ATTRIBUTE_KEYS = ["Name", "ObjectType", "Tag", "PredefinedType", "Description"];
      /** Special properties (group Allgemein) in catalogue order, with their kind. */
      export const SPECIAL_PROPERTIES = [
        ["Modell", "text"],
        ["Kategorie", "text"],
        ["Name", "text"],
        ["GlobalId", "text"],
        ["ObjectType", "text"],
        ["Tag", "text"],
        ["PredefinedType", "text"],
        ["Description", "text"],
        ["Typ", "text"],
        ["Geschoss", "text"],
        ["Material", "multi"],
        ["Geometrie", "bool"],
      ];
      export const GROUP_GENERAL = "Allgemein";
      const QUANTITY_VALUE_KEYS = ["LengthValue", "AreaValue", "VolumeValue", "CountValue", "WeightValue", "TimeValue"];

      /**
       * Normalises one IFC value { value, type } -> { value, kind, unit } or null when empty. Numbers stay numbers
       * (converted per DEC-2), booleans become Ja/Nein, text stays text even if it looks numeric (DEC-5).
       */
      export function normaliseValue(attr, units) {
        if (!attr || Array.isArray(attr)) return null;
        const raw = attr.value;
        if (raw === null || raw === undefined) return null;
        if (typeof raw === "boolean") return { value: raw ? "Ja" : "Nein", kind: "bool", unit: null };
        if (typeof raw === "number") {
          if (!isFinite(raw)) return null;
          const converted = convertUnit(raw, attr.type, units);
          return { value: converted.value, kind: "number", unit: converted.unit };
        }
        const text = String(raw);
        if (text === "") return null;
        if (attr.type === "IFCLOGICAL" || attr.type === "IFCBOOLEAN") {
          if (/^(\.?T\.?|TRUE)$/i.test(text)) return { value: "Ja", kind: "bool", unit: null };
          if (/^(\.?F\.?|FALSE)$/i.test(text)) return { value: "Nein", kind: "bool", unit: null };
        }
        return { value: text, kind: "text", unit: null };
      }

      function psetEntries(pset) {
        const out = [];
        const name = val(pset.Name);
        if (name === undefined || name === null) return out;
        for (const p of pset.HasProperties || []) {
          const propName = val(p.Name);
          if (propName === undefined || propName === null) continue;
          out.push([name, String(propName), p.NominalValue]);
        }
        for (const q of pset.Quantities || []) {
          const propName = val(q.Name);
          if (propName === undefined || propName === null) continue;
          let attr;
          for (const k of QUANTITY_VALUE_KEYS) if (q[k] && !Array.isArray(q[k])) attr = q[k];
          if (!attr) for (const k in q) if (/Value$/.test(k) && q[k] && !Array.isArray(q[k])) attr = q[k];
          out.push([name, String(propName), attr]);
        }
        return out;
      }

      const isPset = (category) => category === "IFCPROPERTYSET" || category === "IFCELEMENTQUANTITY";

      /**
       * Creates an extractor for one model. options: { modelId, modelName, units (parseUnits), storeyOf (Map localId
       * -> storey name), withGeometry (Set of localIds), className (upper-case class -> Kategorie) }.
       * add(item) turns one getItemsData item into a row { key, model, localId, guid, geometry, values };
       * result() returns { rows, properties, spaceProperties } where properties maps each pset property key to
       * { pset, name, occurrence, type, kinds, units } (input for buildCatalog). spaceProperties holds the same for
       * IfcSpace rows, kept apart so that spaces hidden by the option do not influence the catalogue (DEC-13).
       */
      export function createExtractor(options) {
        const rows = [];
        const properties = new Map();
        const spaceProperties = new Map();
        const units = options.units || {};
        const className = options.className || ((c) => c);

        function note(target, key, pset, name, normalised, fromType) {
          let meta = target.get(key);
          if (!meta) {
            meta = { pset, name, occurrence: false, type: false, kinds: new Set(), units: new Set() };
            target.set(key, meta);
          }
          if (fromType) meta.type = true;
          else meta.occurrence = true;
          meta.kinds.add(normalised.kind);
          if (normalised.kind === "number") meta.units.add(normalised.unit);
        }

        function addPset(target, values, pset, fromType) {
          for (const [psetName, propName, attr] of psetEntries(pset)) {
            const normalised = normaliseValue(attr, units);
            if (!normalised) continue;
            const key = psetName + "." + propName;
            values[key] = normalised.value; // occurrence psets are applied after type psets: occurrence wins (DEC-1)
            note(target, key, psetName, propName, normalised, fromType);
          }
        }

        function add(item) {
          const localId = val(item._localId);
          const category = String(val(item._category) || "");
          const target = category === SPACE_CLASS ? spaceProperties : properties;
          const values = {};
          values.Modell = options.modelName;
          values.Kategorie = className(category);
          for (const key of ATTRIBUTE_KEYS) {
            const normalised = normaliseValue(item[key], units);
            if (normalised) values[key] = normalised.kind === "number" ? normalised.value : String(normalised.value);
          }
          const guid = val(item._guid);
          if (guid) values.GlobalId = String(guid);

          let type = null;
          const occurrencePsets = [];
          for (const rel of item.IsDefinedBy || []) {
            const relCategory = String(val(rel._category) || "");
            if (isPset(relCategory)) occurrencePsets.push(rel);
            else if (/(TYPE|STYLE)$/.test(relCategory)) type = rel;
          }
          if (type) {
            const typeName = val(type.Name);
            if (typeName !== undefined && typeName !== null && typeName !== "") values.Typ = String(typeName);
            for (const pset of type.HasPropertySets || [])
              if (isPset(String(val(pset._category)))) addPset(target, values, pset, true);
            for (const pset of type.IsDefinedBy || [])
              if (isPset(String(val(pset._category)))) addPset(target, values, pset, true);
          }
          for (const pset of occurrencePsets) addPset(target, values, pset, false);

          const storey = options.storeyOf ? options.storeyOf.get(localId) : undefined;
          if (storey) values.Geschoss = storey;
          let materials = materialNames(item.HasAssociations);
          if (!materials.length && type) materials = materialNames(type.HasAssociations);
          if (materials.length) values.Material = materials;
          const geometry = options.withGeometry ? options.withGeometry.has(localId) : false;
          values.Geometrie = geometry ? "Ja" : "Nein";

          const row = {
            key: options.modelId + ":" + localId,
            model: options.modelId,
            localId,
            guid: guid ? String(guid) : null,
            geometry,
            values,
          };
          rows.push(row);
          return row;
        }

        return {
          add,
          result() {
            return { rows, properties, spaceProperties };
          },
        };
      }

      /** Kategorie of IfcSpace rows (DEC-13). */
      const SPACE_KATEGORIE = "IfcSpace";

      /** Rows shown under the IfcSpace option (DEC-13). */
      export function visibleRows(rows, includeSpaces) {
        return includeSpaces ? rows : rows.filter((row) => row.values.Kategorie !== SPACE_KATEGORIE);
      }

      /** Column header of a catalogue entry: label plus unit for numbers (REQ-002). */
      export function headerLabel(entry) {
        return entry.kind === "number" && entry.unit ? entry.label + " (" + entry.unit + ")" : entry.label;
      }

      const compareText = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

      /**
       * Property catalogue (spec 4.3) over the given rows: Map propertyKey -> { key, label, group, kind, unit, count,
       * header }, ordered Allgemein first (fixed order), then by group and label. models: [{ id, properties,
       * spaceProperties }] with the extractor's properties per model; a numeric property whose unit differs between
       * models is `gemischt`. Only the given (visible) rows decide: a model's spaceProperties count only if IfcSpace
       * rows of that model are among them, so hidden spaces do not change kind, unit or group.
       */
      export function buildCatalog(rows, models) {
        const counts = new Map();
        const present = new Set();
        const spacesPresent = new Set();
        for (const row of rows) {
          present.add(row.model);
          if (row.values.Kategorie === SPACE_KATEGORIE) spacesPresent.add(row.model);
          for (const key in row.values) {
            const value = row.values[key];
            if (value === undefined || value === null || (Array.isArray(value) && !value.length)) continue;
            counts.set(key, (counts.get(key) || 0) + 1);
          }
        }
        const merged = new Map();
        for (const model of models || []) {
          if (!present.has(model.id)) continue;
          const sources = [model.properties];
          if (model.spaceProperties && spacesPresent.has(model.id)) sources.push(model.spaceProperties);
          for (const [key, meta] of sources.flatMap((source) => [...source])) {
            let m = merged.get(key);
            if (!m) {
              m = { pset: meta.pset, name: meta.name, occurrence: false, kinds: new Set(), unitsByModel: [] };
              merged.set(key, m);
            }
            if (meta.occurrence) m.occurrence = true;
            for (const k of meta.kinds) m.kinds.add(k);
            if (meta.kinds.has("number")) m.unitsByModel.push(meta.units);
          }
        }
        const catalog = new Map();
        for (const [key, kind] of SPECIAL_PROPERTIES) {
          const entry = { key, label: key, group: GROUP_GENERAL, kind, unit: null, count: counts.get(key) || 0 };
          entry.header = headerLabel(entry);
          catalog.set(key, entry);
        }
        const rest = [];
        for (const [key, m] of merged) {
          if (!counts.get(key)) continue;
          let kind = "text";
          if (m.kinds.size === 1) kind = [...m.kinds][0];
          let unit = null;
          if (kind === "number") {
            const all = new Set();
            let mixedInModel = false;
            for (const set of m.unitsByModel) {
              if (set.size > 1) mixedInModel = true;
              for (const u of set) all.add(u);
            }
            if (mixedInModel || all.size > 1) unit = "gemischt";
            else unit = all.size ? [...all][0] : null;
          }
          const entry = {
            key,
            label: key,
            group: m.occurrence ? m.pset : "Typ: " + m.pset,
            kind,
            unit,
            count: counts.get(key),
          };
          entry.header = headerLabel(entry);
          rest.push(entry);
        }
        rest.sort((a, b) => compareText(a.group, b.group) || compareText(a.label, b.label));
        for (const entry of rest) catalog.set(entry.key, entry);
        return catalog;
      }

      // ---------------------------------------------------------------------------------------------------------
      // Filter engine (TASK-003; REQ-004, REQ-006 filter/sort logic; spec 4.3 column store, 4.4)
      // ---------------------------------------------------------------------------------------------------------

      /** Label of the empty value in filter sets, checklists and groups (REQ-004); the value itself is null. */
      export const EMPTY_LABEL = "(leer)";

      const COLLATOR = new Intl.Collator("de");

      /** True for "no value": undefined, null, "", [] and non-finite numbers (NaN, +-Infinity; TASK-003 D4). */
      export function isEmptyValue(value) {
        return (
          value === undefined ||
          value === null ||
          value === "" ||
          (typeof value === "number" && !Number.isFinite(value)) ||
          (Array.isArray(value) && value.length === 0)
        );
      }

      /**
       * Order of distinct values (REQ-004): numbers numerically before texts, texts alphabetically (German collation,
       * then code units, so the order is total); null (empty) last.
       */
      export function compareValues(a, b) {
        const ae = a === null || a === undefined || (typeof a === "number" && !Number.isFinite(a));
        const be = b === null || b === undefined || (typeof b === "number" && !Number.isFinite(b));
        if (ae || be) return ae === be ? 0 : ae ? 1 : -1;
        const an = typeof a === "number";
        const bn = typeof b === "number";
        if (an && bn) return a < b ? -1 : a > b ? 1 : 0;
        if (an !== bn) return an ? -1 : 1;
        const sa = String(a);
        const sb = String(b);
        return COLLATOR.compare(sa, sb) || (sa < sb ? -1 : sa > sb ? 1 : 0);
      }

      /** Distinct values in compareValues order; numbers and texts sorted apart (faster than one mixed comparator). */
      function sortDistinct(distinct) {
        const numbers = [];
        const texts = [];
        for (const v of distinct) (typeof v === "number" ? numbers : texts).push(v);
        numbers.sort((a, b) => a - b);
        texts.sort((a, b) => COLLATOR.compare(a, b) || (a < b ? -1 : a > b ? 1 : 0));
        return numbers.concat(texts);
      }

      /** Text shown for a cell value: multi-values joined with ", " (REQ-002), empty as "". */
      export function displayValue(value) {
        if (isEmptyValue(value)) return "";
        return Array.isArray(value) ? value.filter((v) => !isEmptyValue(v)).join(", ") : String(value);
      }

      const wordsFor = (n) => (n + 31) >>> 5;

      /**
       * Builds one dictionary-coded column for a property (spec 4.3): every row has one or more codes into `values`
       * (distinct values sorted by compareValues; the empty value is the last code, emptyCode). Rows are stored as
       * offsets (start, length n + 1) into flat codes; `single` is true when every row has exactly one code, then
       * flat[i] is the code of row i. `index` maps a value to its code; nums holds the number of single-number cells
       * (NaN otherwise) for range filters and numeric sorting.
       */
      function buildColumn(rows, key) {
        const n = rows.length;
        const tempIndex = new Map();
        const distinct = [];
        const start = new Uint32Array(n + 1);
        let flat = new Int32Array(Math.max(n, 1));
        let used = 0;
        let single = true;
        let empties = false;
        const nums = new Float64Array(n);
        const push = (code) => {
          if (used === flat.length) {
            const grown = new Int32Array(flat.length * 2);
            grown.set(flat);
            flat = grown;
          }
          flat[used++] = code;
        };
        const codeOf = (value) => {
          let code = tempIndex.get(value);
          if (code === undefined) {
            code = distinct.length;
            distinct.push(value);
            tempIndex.set(value, code);
          }
          return code;
        };
        for (let i = 0; i < n; i++) {
          start[i] = used;
          const value = rows[i].values[key];
          nums[i] = typeof value === "number" && Number.isFinite(value) ? value : NaN;
          if (isEmptyValue(value)) {
            push(-1);
            empties = true;
          } else if (Array.isArray(value)) {
            const before = used;
            for (const v of value) {
              if (isEmptyValue(v)) continue;
              const code = codeOf(v);
              let seen = false;
              for (let j = before; j < used; j++) if (flat[j] === code) seen = true;
              if (!seen) push(code);
            }
            if (used === before) {
              push(-1);
              empties = true;
            }
            if (used - before !== 1) single = false;
          } else push(codeOf(value));
        }
        start[n] = used;
        const sorted = sortDistinct(distinct);
        const remap = new Int32Array(distinct.length);
        const values = new Array(distinct.length + 1);
        for (let rank = 0; rank < sorted.length; rank++) {
          remap[tempIndex.get(sorted[rank])] = rank;
          values[rank] = sorted[rank];
        }
        const emptyCode = distinct.length;
        values[emptyCode] = null;
        flat = flat.slice(0, used);
        for (let j = 0; j < used; j++) flat[j] = flat[j] < 0 ? emptyCode : remap[flat[j]];
        // value -> code, reusing the first-pass map (no second map over up to n distinct values)
        const index = { get: (value) => (tempIndex.has(value) ? remap[tempIndex.get(value)] : undefined) };
        return { key, n, values, index, emptyCode, empties, start, flat, single, nums, masks: new Map(), sortKey: null };
      }

      const MASK_CACHE_LIMIT = 16;

      /**
       * Lazy column store over the rows (spec 4.3): columns (dictionary codes, numbers) and filter bitsets are built
       * only for properties that are asked for, cached, and dropped by retain(keys) when no longer in use. Create a
       * new store whenever the row set changes (load, remove, IfcSpace option).
       */
      export function createColumnStore(rows) {
        const columns = new Map();
        return {
          rows,
          size: rows.length,
          column(key) {
            let col = columns.get(key);
            if (!col) {
              col = buildColumn(rows, key);
              columns.set(key, col);
            }
            return col;
          },
          has: (key) => columns.has(key),
          keys: () => [...columns.keys()],
          /** Drops every cached column whose key is not in keys (filter sets, column filters, sort, grouping, colour). */
          retain(keys) {
            const keep = new Set(keys);
            for (const key of [...columns.keys()]) if (!keep.has(key)) columns.delete(key);
          },
        };
      }

      const asStore = (source) => (Array.isArray(source) ? createColumnStore(source) : source);

      /** A range bound that restricts nothing: null, undefined, NaN, "" or whitespace only (TASK-003 D1). */
      const noBound = (b) =>
        b === null ||
        b === undefined ||
        (typeof b === "string" && b.trim() === "") ||
        (typeof b === "number" && Number.isNaN(b));

      /** Distinct values of a selection; undefined is the empty value null (TASK-003 D5). */
      function distinctValues(values) {
        const seen = new Set();
        const out = [];
        for (const v of values) {
          const value = v === undefined ? null : v;
          if (seen.has(value)) continue;
          seen.add(value);
          out.push(value);
        }
        return out;
      }

      /**
       * Normalises a filter: { id?, key, type: 'values', values: [...] } (checklist / filter set; OR within; null =
       * empty) or { id?, key, type: 'range', min, max } (inclusive bounds, null or "" = no bound; DEC-17). id
       * defaults to key. Returns null for a filter that does not restrict anything (no value checked, no bound).
       */
      export function normaliseFilter(filter) {
        if (!filter || !filter.key) return null;
        const id = filter.id === undefined ? filter.key : filter.id;
        if (filter.type === "range") {
          const min = noBound(filter.min) ? null : Number(filter.min);
          const max = noBound(filter.max) ? null : Number(filter.max);
          if (min === null && max === null) return null;
          return { id, key: filter.key, type: "range", min, max };
        }
        const values = Array.isArray(filter.values) ? distinctValues(filter.values) : [];
        if (!values.length) return null;
        return { id, key: filter.key, type: "values", values };
      }

      /** The filters that restrict something (none after resetting all filters; REQ-004-AC4). */
      export function activeFilters(filters) {
        return (filters || []).map(normaliseFilter).filter(Boolean);
      }

      /** Bitset (Uint32Array, one bit per row) of the rows passing one normalised filter; cached on its column. */
      function filterMask(store, filter) {
        const col = store.column(filter.key);
        const signature =
          filter.type === "range"
            ? "r" + filter.min + "|" + filter.max
            : "v" + JSON.stringify(filter.values.map((v) => (typeof v === "number" ? [v] : v)));
        const cached = col.masks.get(signature);
        if (cached) return cached;
        const n = col.n;
        const bits = new Uint32Array(wordsFor(n));
        if (filter.type === "range") {
          const lo = filter.min === null ? -Infinity : filter.min;
          const hi = filter.max === null ? Infinity : filter.max;
          for (let i = 0; i < n; i++) {
            const v = col.nums[i];
            if (v >= lo && v <= hi) bits[i >>> 5] |= 1 << (i & 31);
          }
        } else {
          const wanted = new Uint8Array(col.values.length);
          let any = false;
          for (const v of filter.values) {
            const code = v === null || v === undefined ? col.emptyCode : col.index.get(v);
            if (code !== undefined) {
              wanted[code] = 1;
              any = true;
            }
          }
          if (any) {
            const { start, flat } = col;
            for (let i = 0; i < n; i++) {
              for (let j = start[i]; j < start[i + 1]; j++) {
                if (wanted[flat[j]]) {
                  bits[i >>> 5] |= 1 << (i & 31);
                  break;
                }
              }
            }
          }
        }
        if (col.masks.size >= MASK_CACHE_LIMIT) col.masks.clear();
        col.masks.set(signature, bits);
        return bits;
      }

      function allBits(n) {
        const bits = new Uint32Array(wordsFor(n)).fill(0xffffffff);
        if (n & 31) bits[bits.length - 1] = (1 << (n & 31)) - 1;
        return bits;
      }

      function andInto(target, bits) {
        for (let w = 0; w < target.length; w++) target[w] &= bits[w];
        return target;
      }

      /**
       * Evaluates the filters once (REQ-004, REQ-006): `pass` = bitset of rows passing ALL active filters (AND across
       * filters, OR within a filter); `except(id)` = bitset of rows passing all active filters except the one with
       * that id (the base of that filter set's facet counts).
       */
      export function evaluateFilters(source, filters) {
        const store = asStore(source);
        const active = activeFilters(filters);
        const masks = active.map((f) => filterMask(store, f));
        const n = store.size;
        const k = masks.length;
        // prefix[i] = AND of masks[0..i-1], suffix[i] = AND of masks[i..k-1]; except(i) = prefix[i] AND suffix[i+1]
        const prefix = [allBits(n)];
        for (let i = 0; i < k; i++) prefix.push(andInto(prefix[i].slice(), masks[i]));
        const suffix = new Array(k + 1);
        suffix[k] = allBits(n);
        for (let i = k - 1; i >= 0; i--) suffix[i] = andInto(suffix[i + 1].slice(), masks[i]);
        const pass = prefix[k];
        return {
          store,
          filters: active,
          pass,
          except(id) {
            const i = active.findIndex((f) => f.id === id);
            return i === -1 ? pass : andInto(prefix[i].slice(), suffix[i + 1]);
          },
        };
      }

      /** Row indices (ascending) whose bit is set. */
      export function bitsToIndices(bits, n) {
        let count = 0;
        for (let w = 0; w < bits.length; w++) {
          let x = bits[w];
          while (x) {
            x &= x - 1;
            count++;
          }
        }
        const out = new Uint32Array(count);
        let o = 0;
        for (let w = 0; w < bits.length; w++) {
          let x = bits[w];
          while (x) {
            const t = x & -x;
            const i = (w << 5) + (31 - Math.clz32(t));
            if (i < n) out[o++] = i;
            x ^= t;
          }
        }
        return o === count ? out : out.slice(0, o);
      }

      /**
       * Indices (ascending, Uint32Array) of the rows that pass all filters: filter sets and column filters combined
       * with AND, checked values within one filter with OR; a multi-valued cell matches if any of its values is
       * checked (REQ-004, REQ-006, DEC-17). source: a column store or a row array.
       */
      export function filterRows(source, filters) {
        const ev = source && source.pass ? source : evaluateFilters(source, filters);
        return bitsToIndices(ev.pass, ev.store.size);
      }

      /**
       * Values and counts of filter sets (REQ-004, DEC-14). facets: [{ id?, key }] or keys (id defaults to key); each
       * facet counts under all active filters except the filter with its own id, so checking a value never hides the
       * other values of the same set. Returns Map id -> { id, key, total, checkedCount, values: [{ value, count,
       * checked }] } with values in compareValues order (numbers numerically, empty value null last). Values with
       * count 0 are left out, except checked values (count 0, kept so they can be unchecked). A multi-valued cell
       * counts once for each of its distinct values.
       */
      export function facetCounts(source, filters, facets) {
        const ev = source && source.pass ? source : evaluateFilters(source, filters);
        const { store } = ev;
        const out = new Map();
        for (const facet of facets || []) {
          const key = typeof facet === "string" ? facet : facet.key;
          const id = typeof facet === "string" ? facet : facet.id === undefined ? key : facet.id;
          const col = store.column(key);
          const base = ev.except(id);
          const counts = new Int32Array(col.values.length);
          const { start, flat, single } = col;
          let total = 0;
          for (let w = 0; w < base.length; w++) {
            let x = base[w];
            while (x) {
              const t = x & -x;
              const i = (w << 5) + (31 - Math.clz32(t));
              x ^= t;
              total++;
              if (single) counts[flat[i]]++;
              else for (let j = start[i]; j < start[i + 1]; j++) counts[flat[j]]++;
            }
          }
          const own = ev.filters.find((f) => f.id === id && f.type === "values");
          const checked = new Set();
          const extra = [];
          if (own)
            for (const v of own.values) {
              const value = v === undefined ? null : v;
              const code = value === null ? col.emptyCode : col.index.get(value);
              if (code === undefined) extra.push(value);
              else checked.add(code);
            }
          let values = [];
          for (let c = 0; c < counts.length; c++) {
            const isChecked = checked.has(c);
            if (counts[c] > 0 || isChecked) values.push({ value: col.values[c], count: counts[c], checked: isChecked });
          }
          if (extra.length) {
            for (const value of extra)
              if (!values.some((e) => e.value === value)) values.push({ value, count: 0, checked: true });
            values = values.sort((a, b) => compareValues(a.value, b.value));
          }
          out.set(id, { id, key, total, checkedCount: checked.size + extra.length, values });
        }
        return out;
      }

      /**
       * Sort key of a column, built once (REQ-006): numbers for single-number cells, else the rank of the displayed
       * text (a cell's distinct values joined with ", ") among all displayed values; NaN = empty (always last).
       */
      function sortKeyOf(col, rows) {
        if (col.sortKey) return col.sortKey;
        const n = col.n;
        const key = new Float64Array(n);
        if (col.single) {
          for (let i = 0; i < n; i++) key[i] = col.flat[i] === col.emptyCode ? NaN : col.flat[i];
        } else {
          const shown = new Array(n);
          const distinct = new Set();
          for (let i = 0; i < n; i++) {
            const value = rows[i].values[col.key];
            const cell = Array.isArray(value) ? [...new Set(value.filter((v) => !isEmptyValue(v)))] : value;
            shown[i] = isEmptyValue(cell) ? null : Array.isArray(cell) ? displayValue(cell) : cell;
            if (shown[i] !== null) distinct.add(shown[i]);
          }
          const rank = new Map([...distinct].sort(compareValues).map((v, r) => [v, r]));
          for (let i = 0; i < n; i++) key[i] = shown[i] === null ? NaN : rank.get(shown[i]);
        }
        col.sortKey = key;
        return key;
      }

      /**
       * Sorts row indices by one column (REQ-006): sort = { key, dir: 'asc' | 'desc' }; numbers numerically, texts
       * alphabetically (compareValues), empty values last in both directions, ties keep the given order. Returns a
       * new Uint32Array; without sort.key the order is unchanged.
       */
      export function sortRows(source, indices, sort) {
        const store = asStore(source);
        const out = Uint32Array.from(indices);
        if (!sort || !sort.key) return out;
        const key = sortKeyOf(store.column(sort.key), store.rows);
        const sign = sort.dir === "desc" ? -1 : 1;
        const keys = new Float64Array(out.length);
        for (let p = 0; p < out.length; p++) keys[p] = key[out[p]];
        const order = new Uint32Array(out.length).map((_, p) => p);
        order.sort((a, b) => {
          const ka = keys[a];
          const kb = keys[b];
          const ea = Number.isNaN(ka);
          const eb = Number.isNaN(kb);
          if (ea || eb) return ea === eb ? a - b : ea ? 1 : -1;
          return (ka < kb ? -sign : ka > kb ? sign : 0) || a - b;
        });
        return order.map((p) => out[p]);
      }

      /**
       * Sorts any items by a value (e.g. group rows by their sums; REQ-006-AC5): same order rules as sortRows,
       * empty (null, undefined, "", [], non-finite numbers) last in both directions, stable.
       */
      export function sortByValue(items, valueOf, dir) {
        const sign = dir === "desc" ? -1 : 1;
        const isNone = isEmptyValue;
        return items
          .map((item, p) => ({ item, p, v: valueOf(item) }))
          .sort((a, b) => {
            const ea = isNone(a.v);
            const eb = isNone(b.v);
            if (ea || eb) return ea === eb ? a.p - b.p : ea ? 1 : -1;
            const va = Array.isArray(a.v) ? displayValue(a.v) : a.v;
            const vb = Array.isArray(b.v) ? displayValue(b.v) : b.v;
            return sign * compareValues(va, vb) || a.p - b.p;
          })
          .map((e) => e.item);
      }
    </script>

    <!-- DOM: layout, model list, messages, progress and status (builder and viewer file). ASCII only. -->
    <script type="text/plain" id="cv-ui-src">
      import { EMPTY_LABEL, coreInfo } from "calc-core";

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      // Inline SVG icons (constant markup only; values from the model are always set as text, never as HTML).
      const ICON_PATHS = {
        plus: '<path d="M12 5v14M5 12h14"/>',
        close: '<path d="M6 6l12 12M18 6L6 18"/>',
        up: '<path d="M6 15l6-6 6 6"/>',
        down: '<path d="M6 9l6 6 6-6"/>',
        chevron: '<path d="M9 6l6 6-6 6"/>',
        reset: '<path d="M4 4v6h6"/><path d="M5.5 15a7 7 0 1 0 1.6-7.3L4 10"/>',
        grip: '<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
        cube: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
        panelRight: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
      };

      function icon(name) {
        const span = el("span", "cv-icon");
        span.setAttribute("aria-hidden", "true");
        span.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          ICON_PATHS[name] +
          "</svg>";
        return span;
      }

      function iconButton(name, label, className) {
        const button = el("button", "cv-icon-btn" + (className ? " " + className : ""));
        button.type = "button";
        button.title = label;
        button.setAttribute("aria-label", label);
        button.append(icon(name));
        return button;
      }

      const formatCount = (n) => n.toLocaleString("de-DE");

      /** Text of a filter value: numbers in German format, the empty value as "(leer)" (REQ-004). */
      export function valueLabel(value) {
        if (value === null || value === undefined) return EMPTY_LABEL;
        if (typeof value === "number") return value.toLocaleString("de-DE", { maximumFractionDigits: 6 });
        return String(value);
      }

      /**
       * Virtualised list (REQ-004 "render only the visible entries", NFR-001): a scroll box with a spacer of the full
       * height and a small pool of absolutely positioned row nodes that are reused while scrolling. options:
       * { className, rowHeight, maxRows (auto height up to this many rows; 0 = height from CSS), createRow() -> node,
       * updateRow(node, item, index) }. Rows never number more than the visible ones plus an overscan.
       */
      export function createVirtualList(options) {
        const rowHeight = options.rowHeight;
        const overscan = 6;
        const box = el("div", "cv-vlist" + (options.className ? " " + options.className : ""));
        const spacer = el("div", "cv-vspacer");
        box.append(spacer);
        const pool = [];
        let items = [];

        function render() {
          const fallback = (options.maxRows || 12) * rowHeight;
          const viewHeight = box.clientHeight || fallback;
          const top = box.scrollTop;
          const first = Math.max(0, Math.floor(top / rowHeight) - overscan);
          const last = Math.min(items.length, Math.ceil((top + viewHeight) / rowHeight) + overscan);
          while (pool.length < last - first) {
            const node = options.createRow();
            node.classList.add("cv-vrow");
            node.style.height = rowHeight + "px";
            box.append(node);
            pool.push(node);
          }
          for (let p = 0; p < pool.length; p++) {
            const node = pool[p];
            const index = first + p;
            if (index < last) {
              node.hidden = false;
              node.style.top = index * rowHeight + "px";
              node.cvIndex = index;
              options.updateRow(node, items[index], index);
            } else {
              node.hidden = true;
              node.cvIndex = -1;
              delete node.dataset.key;
            }
          }
        }

        box.addEventListener("scroll", render, { passive: true });
        return {
          element: box,
          /** Replaces the items; resetScroll scrolls back to the first entry (e.g. after a new search). */
          setItems(list, resetScroll) {
            items = list;
            spacer.style.height = list.length * rowHeight + "px";
            if (options.maxRows) box.style.height = Math.min(list.length, options.maxRows) * rowHeight + "px";
            if (resetScroll) box.scrollTop = 0;
            render();
          },
          /** The item shown by a row node (or a node inside it), else undefined. */
          itemOf(node) {
            const row = node && node.closest ? node.closest(".cv-vrow") : null;
            return row && row.cvIndex >= 0 ? items[row.cvIndex] : undefined;
          },
          items: () => items,
          render,
        };
      }

      const VALUE_ROW_HEIGHT = 26;
      const VALUE_MAX_ROWS = 10;

      /**
       * One filter set (REQ-003, REQ-004): header (drag handle, collapse, title, checked count, reset, up/down, remove)
       * and body (search field, virtualised value list with checkbox, colour dot placeholder, value, count).
       */
      function createFilterSet(spec, handlers) {
        const id = spec.id;
        let title = spec.title;
        const root = el("section", "cv-fs");
        root.dataset.id = id;
        root.dataset.key = spec.key;
        const head = el("div", "cv-fs-head");
        head.draggable = true;
        head.title = "Ziehen, um die Reihenfolge zu \u00e4ndern";
        const grip = icon("grip");
        grip.classList.add("cv-fs-grip");
        const toggle = iconButton("chevron", "", "cv-fs-toggle");
        const titleNode = el("span", "cv-fs-title");
        const unitNode = el("span", "cv-fs-unit");
        const badge = el("span", "cv-fs-badge");
        const reset = iconButton("reset", "", "cv-fs-reset");
        const up = iconButton("up", "", "cv-fs-up");
        const down = iconButton("down", "", "cv-fs-down");
        const remove = iconButton("close", "", "cv-fs-remove");
        head.append(grip, toggle, titleNode, unitNode, badge, reset, up, down, remove);

        const body = el("div", "cv-fs-body");
        const search = el("label", "cv-search cv-fs-search");
        const searchInput = el("input");
        searchInput.type = "search";
        searchInput.placeholder = "Werte suchen";
        search.append(icon("search"), searchInput);
        const empty = el("p", "cv-hint cv-fs-empty");
        const list = createVirtualList({
          className: "cv-fs-values",
          rowHeight: VALUE_ROW_HEIGHT,
          maxRows: VALUE_MAX_ROWS,
          createRow() {
            const row = el("label", "cv-fs-value");
            const box = el("input");
            box.type = "checkbox";
            const dot = el("span", "cv-dot");
            dot.setAttribute("aria-hidden", "true");
            row.append(box, dot, el("span", "cv-fs-label"), el("span", "cv-fs-count"));
            return row;
          },
          updateRow(row, item) {
            const [box, dot, label, count] = row.children;
            const text = valueLabel(item.value);
            box.checked = item.checked;
            box.setAttribute("aria-label", text);
            row.classList.toggle("cv-checked", item.checked);
            row.classList.toggle("cv-zero", item.count === 0);
            dot.style.background = item.colour || "";
            dot.classList.toggle("cv-dot-on", Boolean(item.colour));
            label.textContent = text;
            label.title = text;
            label.classList.toggle("cv-empty-value", item.value === null);
            count.textContent = formatCount(item.count);
          },
        });
        body.append(search, list.element, empty);
        root.append(head, body);

        let facet = { values: [], checkedCount: 0, total: 0 };
        let query = "";

        function applySearch(resetScroll) {
          let shown = facet.values;
          if (query) {
            shown = [];
