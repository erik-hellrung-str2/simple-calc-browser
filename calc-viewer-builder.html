            const label = el("span", "cv-grp-label");
            cell.replaceChildren(toggle, label);
            parts = { toggle, label, id: null, text: null, expanded: null };
            cell.cvGroup = parts;
            cell.cvText = null;
          }
          if (parts.text !== item.label) {
            parts.text = item.label;
            parts.label.textContent = item.label;
            cell.title = item.label;
          }
          if (parts.id !== item.group.id || parts.expanded !== expanded) {
            parts.id = item.group.id;
            parts.expanded = expanded;
            parts.toggle.dataset.group = item.group.id;
            parts.toggle.setAttribute("aria-expanded", String(expanded));
            const name = (expanded ? "Gruppe zuklappen: " : "Gruppe aufklappen: ") + item.label;
            parts.toggle.setAttribute("aria-label", name);
            parts.toggle.title = name;
          }
        }

        function setCellPad(cell, pad) {
          if (cell.cvPad !== pad) {
            cell.cvPad = pad;
            cell.style.paddingLeft = pad;
          }
        }

        function setCellNum(cell, numeric) {
          if (cell.cvNum !== numeric) {
            cell.cvNum = numeric;
            cell.classList.toggle("cv-num", numeric);
          }
        }

        /** Value of column col in a grouping-view item (group: aggregate; element: the row's value). */
        function itemValue(item, row, key) {
          if (item.type === "group") {
            if (key === COUNT_COLUMN) return item.group.count;
            return item.group.cells[key];
          }
          return key === COUNT_COLUMN ? null : row.values[key];
        }

        /** Total row `Summe` (grouping view): Anzahl and the sums of every column (all cells; one row). */
        function renderTotal() {
          const signature = columns.map((c) => c.key + ":" + c.width).join("|");
          if (foot.cvSignature !== signature) {
            foot.cvSignature = signature;
            foot.replaceChildren();
            foot.cvCells = columns.map((col, c) => {
              const cell = el("div", "cv-td");
              cell.setAttribute("role", "gridcell");
              cell.dataset.col = col.key;
              cell.setAttribute("aria-colindex", String(c + 1));
              cell.style.left = offsets[c] + "px";
              cell.style.width = col.width + "px";
              foot.append(cell);
              return cell;
            });
          }
          foot.style.width = offsets[columns.length] + "px";
          columns.forEach((col, c) => {
            const cell = foot.cvCells[c];
            let text = "";
            let numeric = false;
            if (col.key === GROUP_COLUMN) text = "Summe";
            else if (total) {
              const value = col.key === COUNT_COLUMN ? total.count : total.cells[col.key];
              numeric = typeof value === "number";
              text = numeric ? formatCell(value) : "";
            }
            if (cell.textContent !== text) cell.textContent = text;
            cell.title = text;
            cell.classList.toggle("cv-num", numeric);
          });
        }

        /** Hides an unused cell and drops its column and text, so no hidden cell carries a stale value (D-a). */
        function parkCell(cell) {
          cell.hidden = true;
          delete cell.dataset.col;
          cell.removeAttribute("aria-colindex");
          setCellText(cell, "");
          cell.removeAttribute("title");
        }

        /** Drops the cells beyond the column count of every row (after columns were removed, D-a). */
        function trimCells() {
          for (const node of pool) {
            while (node.cvCells.length > columns.length) node.cvCells.pop().remove();
          }
        }

        /** Renders the rows and columns near the visible window (on scroll, resize and every update). */
        function render() {
          const t0 = performance.now();
          const viewHeight = Math.max(0, (scroll.clientHeight || 300) - TABLE_HEAD_HEIGHT);
          const top = Math.max(0, scroll.scrollTop);
          const first = Math.max(0, Math.floor(top / TABLE_ROW_HEIGHT) - TABLE_OVERSCAN_ROWS);
          const last = Math.min(rowCount, Math.ceil((top + viewHeight) / TABLE_ROW_HEIGHT) + TABLE_OVERSCAN_ROWS);
          const left = scroll.scrollLeft - TABLE_OVERSCAN_PX;
          const right = scroll.scrollLeft + (scroll.clientWidth || 800) + TABLE_OVERSCAN_PX;
          let c0 = 0;
          while (c0 < columns.length && offsets[c0 + 1] < left) c0++;
          let c1 = c0;
          while (c1 < columns.length && offsets[c1] <= right) c1++;
          while (pool.length < last - first) pool.push(createRow());
          for (let p = 0; p < pool.length; p++) {
            const node = pool[p];
            const index = first + p;
            if (index >= last) {
              if (!node.hidden) {
                node.hidden = true;
                node.cvIndex = -1;
                delete node.dataset.key;
              }
              continue;
            }
            const item = grouped ? items[index] : null;
            const row = grouped ? (item.type === "element" ? rows[item.index] : null) : rows[order[index]];
            node.hidden = false;
            node.cvIndex = index;
            node.style.top = index * TABLE_ROW_HEIGHT + "px";
            node.style.width = offsets[columns.length] + "px";
            node.setAttribute("aria-rowindex", String(index + 2));
            node.classList.toggle("cv-odd", index % 2 === 1);
            const kind = item ? item.type : "single";
            const expanded = item && item.type === "group" ? item.expanded : false;
            if (node.cvKind !== kind || (item && item.type === "group" && node.cvLevel !== item.group.level)) {
              node.cvKind = kind;
              node.cvLevel = item && item.type === "group" ? item.group.level : 0;
              node.classList.toggle("cv-grp", kind === "group");
              node.classList.toggle("cv-grp-l1", kind === "group" && node.cvLevel === 1);
              node.classList.toggle("cv-grp-l2", kind === "group" && node.cvLevel === 2);
              node.classList.toggle("cv-tr-el", kind === "element");
              if (kind === "single") {
                node.removeAttribute("aria-level");
                node.removeAttribute("aria-expanded");
              }
            }
            if (row) {
              node.dataset.key = row.key;
              delete node.dataset.group;
              delete node.dataset.level;
            } else {
              delete node.dataset.key;
              node.dataset.group = item.group.id;
              node.dataset.level = String(item.group.level);
            }
            const on = row ? selKeys !== null && selKeys.has(row.key) : selGroup !== null && item.group.id === selGroup;
            if (node.cvSel !== on) {
              node.cvSel = on;
              node.classList.toggle("cv-sel", on);
              if (on) node.setAttribute("aria-selected", "true");
              else node.removeAttribute("aria-selected");
            }
            if (item) {
              const level = item.type === "group" ? item.group.level : item.depth + 1;
              if (node.cvAriaLevel !== level) {
                node.cvAriaLevel = level;
                node.setAttribute("aria-level", String(level));
                node.dataset.depth = String(level - 1);
              }
              if (item.type === "group") node.setAttribute("aria-expanded", String(expanded));
              else node.removeAttribute("aria-expanded");
            } else if (node.cvAriaLevel !== undefined) {
              node.cvAriaLevel = undefined;
              delete node.dataset.depth;
            }
            let q = 0;
            for (let c = c0; c < c1; c++, q++) {
              const col = columns[c];
              const cell = cellAt(node, q);
              cell.hidden = false;
              cell.style.left = offsets[c] + "px";
              cell.style.width = col.width + "px";
              cell.dataset.col = col.key;
              cell.setAttribute("aria-colindex", String(c + 1));
              if (col.key === GROUP_COLUMN && item) {
                // indentation by level: level-1 groups, level-2 groups, element rows below their group (REQ-006-AC3)
                const depth = item.type === "group" ? item.group.level - 1 : item.depth;
                setCellPad(cell, 4 + depth * GROUP_INDENT + "px");
                if (item.type === "group") setCellGroup(cell, item, expanded);
                else setCellText(cell, "");
                cell.classList.toggle("cv-td-el", item.type === "element");
                setCellNum(cell, false);
                continue;
              }
              if (cell.cvPad !== "") setCellPad(cell, "");
              if (cell.classList.contains("cv-td-el")) cell.classList.remove("cv-td-el");
              const value = item ? itemValue(item, row, col.key) : row.values[col.key];
              setCellText(cell, formatCell(value));
              setCellNum(cell, typeof value === "number");
            }
            // cells of columns outside the visible width (or of removed columns, D-a) keep no stale column or text
            for (; q < node.cvCells.length; q++) if (!node.cvCells[q].hidden) parkCell(node.cvCells[q]);
          }
          if (grouped) renderTotal();
          const ms = performance.now() - t0;
          stats.renders++;
          stats.lastMs = ms;
          if (ms > stats.maxMs) stats.maxMs = ms;
        }

        scroll.addEventListener("scroll", render, { passive: true });
        new ResizeObserver(() => render()).observe(scroll);
        body.addEventListener("click", (event) => {
          const toggle = event.target.closest(".cv-grp-toggle");
          if (toggle && toggle.dataset.group !== undefined) {
            event.stopPropagation();
            handlers.toggleGroup(toggle.dataset.group);
            return;
          }
          const node = event.target.closest(".cv-tr");
          if (node && node.dataset.key) handlers.rowClick(node.dataset.key);
          else if (node && node.dataset.group !== undefined && handlers.groupClick) handlers.groupClick(node.dataset.group);
        });

        function setHeights(emptyText) {
          const height = rowCount * TABLE_ROW_HEIGHT;
          const footHeight = grouped ? TABLE_ROW_HEIGHT : 0;
          body.style.height = height + "px";
          inner.style.height = TABLE_HEAD_HEIGHT + height + footHeight + "px";
          scroll.setAttribute("aria-rowcount", String(rowCount + 1 + (grouped ? 1 : 0)));
          foot.setAttribute("aria-rowindex", String(rowCount + 2));
          foot.hidden = !grouped;
          scroll.setAttribute("role", grouped ? "treegrid" : "grid");
          scroll.setAttribute("aria-label", grouped ? "Tabelle gruppiert" : "Tabelle Einzelelemente");
          empty.hidden = rowCount > 0 && columns.length > 0;
          empty.textContent = columns.length ? emptyText : "Keine Spalten. \u00dcber \u201eSpalten\u201c hinzuf\u00fcgen.";
          const maxTop = Math.max(0, inner.offsetHeight - scroll.clientHeight);
          if (scroll.scrollTop > maxTop) scroll.scrollTop = maxTop;
          render();
        }

        return {
          element: scroll,
          /**
           * Columns [{ key, title, kind 'number' | 'text', width, sort 'asc' | 'desc' | null, filtered }] in display
           * order; header cells are rebuilt only when keys or titles change, else updated in place.
           */
          setColumns(specs) {
            const signature = JSON.stringify(specs.map((s) => [s.key, s.title]));
            columns = specs.map((s) => ({ ...s }));
            if (signature !== headSignature) {
              headSignature = signature;
              headCells = columns.map(headCell);
              head.replaceChildren(...headCells);
              scroll.setAttribute("aria-colcount", String(columns.length));
              trimCells();
            }
            columns.forEach((col, c) => setHeadState(headCells[c], col));
            layoutColumns();
            render();
          },
          /** Single-element view: rows (store rows) and the display order (row indices); emptyText when none shown. */
          setRows(rowList, displayOrder, emptyText) {
            rows = rowList;
            order = displayOrder;
            grouped = false;
            items = [];
            total = null;
            rowCount = order.length;
            setHeights(emptyText);
          },
          /**
           * Grouping view (TASK-006b): rows (store rows), display items [{ type: 'group', group, label, expanded } |
           * { type: 'element', index, depth }] and the total { count, cells } of the total row; emptyText when no
           * group is shown.
           */
          setGroups(rowList, displayItems, totalRow, emptyText) {
            rows = rowList;
            items = displayItems;
            total = totalRow;
            grouped = true;
            rowCount = items.length;
            setHeights(emptyText);
          },
          /**
           * Selection (REQ-007): keys (iterable of element row keys) whose rows are marked, and the id of a selected
           * group row (or null); the marks follow the rows through sort, scroll, column and view changes.
           */
          setSelection(keys, groupId) {
            selKeys = keys ? new Set(keys) : null;
            if (selKeys && !selKeys.size) selKeys = null;
            selGroup = groupId === undefined ? null : groupId;
            render();
          },
          /** Scrolls the least needed to show display row index fully between the sticky header and total row. */
          reveal(index) {
            if (!(index >= 0 && index < rowCount)) return;
            const footHeight = grouped ? TABLE_ROW_HEIGHT : 0;
            const view = Math.max(TABLE_ROW_HEIGHT, scroll.clientHeight - TABLE_HEAD_HEIGHT - footHeight);
            const top = index * TABLE_ROW_HEIGHT;
            if (top < scroll.scrollTop) scroll.scrollTop = top;
            else if (top + TABLE_ROW_HEIGHT > scroll.scrollTop + view) scroll.scrollTop = top + TABLE_ROW_HEIGHT - view;
            render();
          },
          /** Back to the first row (view switch `Einzelelemente` / `Gruppiert`, new grouping). */
          scrollToTop() {
            scroll.scrollTop = 0;
            render();
          },
          /** Header cell of a column (anchor of its filter popup). */
          headerCell: (key) => headCells[indexOfKey(key)] || null,
          /** Render statistics (perf tests): { renders, lastMs, maxMs, rowNodes, cellNodes }. */
          stats() {
            let cellNodes = 0;
            for (const node of pool) cellNodes += node.cvCells.length;
            return { ...stats, rowNodes: pool.length, cellNodes };
          },
          rowHeight: TABLE_ROW_HEIGHT,
          headHeight: TABLE_HEAD_HEIGHT,
          render,
        };
      }

      /** Bound shown in a range input: German decimal comma, full precision, no grouping (REQ-006, D2). */
      function boundText(value) {
        return value === null || value === undefined
          ? ""
          : value.toLocaleString("de-DE", { maximumFractionDigits: 20, useGrouping: false });
      }

      /**
       * Column filter popup (REQ-006) anchored under a header cell. spec: { key, title, kind 'number' | 'text', sort,
       * filter ({ values } | { min, max } | null), facet (facetCounts entry, text columns), range ({ min, max } of the
       * column under the other filters, number columns) }. Text columns: value checklist with search (OR within the
       * column); number columns: `von` / `bis` (inclusive, empty = no bound; German decimal comma or point; invalid
       * input shows a hint and is ignored, D2). handlers: { toggle(value, checked), range(min, max) (undefined =
       * unchanged), reset(), sort(dir), remove(), close() }.
       */
      function openColumnFilter(host, anchor, spec, handlers) {
        const popup = el("div", "cv-popup cv-colfilter");
        popup.id = "cv-colfilter";
        popup.dataset.key = spec.key;
        popup.setAttribute("role", "dialog");
        popup.setAttribute("aria-label", "Spaltenfilter: " + spec.title);
        const head = el("div", "cv-popup-head");
        const title = el("div", "cv-popup-title", spec.title);
        title.title = spec.title;
        const close = iconButton("close", "Schlie\u00dfen", "cv-popup-close");
        head.append(title, close);

        const sortRow = el("div", "cv-colfilter-sort");
        const sortButtons = {};
        for (const [dir, text, name] of [
          ["asc", "Aufsteigend", "sortAsc"],
          ["desc", "Absteigend", "sortDesc"],
        ]) {
          const button = el("button", "cv-btn cv-small");
          button.type = "button";
          button.dataset.dir = dir;
          button.append(icon(name), document.createTextNode(text));
          button.setAttribute("aria-label", text + " sortieren");
          button.addEventListener("click", () => handlers.sort(dir));
          sortButtons[dir] = button;
          sortRow.append(button);
        }
        const body = el("div", "cv-popup-body");
        const foot = el("div", "cv-popup-foot");
        const reset = el("button", "cv-link", "Filter zur\u00fccksetzen");
        reset.type = "button";
        reset.addEventListener("click", () => handlers.reset());
        const remove = el("button", "cv-link cv-colfilter-remove", "Spalte entfernen");
        remove.type = "button";
        remove.addEventListener("click", () => handlers.remove());
        foot.append(reset, remove);
        popup.append(head, sortRow, body, foot);

        let current = spec;
        let api = null;
        if (spec.kind === "number") {
          const grid = el("div", "cv-range");
          const inputs = {};
          for (const [name, text] of [
            ["min", "von"],
            ["max", "bis"],
          ]) {
            const label = el("label", "cv-range-field");
            const input = el("input");
            input.type = "text";
            input.inputMode = "decimal";
            input.autocomplete = "off";
            input.spellcheck = false;
            input.dataset.bound = name;
            input.setAttribute("aria-label", text + ": " + spec.title);
            input.placeholder = "keine Grenze";
            label.append(el("span", "cv-range-name", text), input);
            inputs[name] = input;
            grid.append(label);
          }
          const hint = el("p", "cv-range-hint");
          hint.setAttribute("role", "status");
          hint.setAttribute("aria-live", "polite");
          const info = el("p", "cv-hint cv-range-info");
          body.append(grid, hint, info);
          const apply = () => {
            const bad = [];
            const out = {};
            for (const [name, text] of [
              ["min", "von"],
              ["max", "bis"],
            ]) {
              const parsed = parseNumberInput(inputs[name].value);
              inputs[name].setAttribute("aria-invalid", String(!parsed.valid));
              if (parsed.valid) out[name] = parsed.value;
              else bad.push("\u201e" + text + "\u201c");
            }
            hint.textContent = bad.length
              ? "Ung\u00fcltige Zahl in " +
                bad.join(" und ") +
                " \u2013 die Eingabe wird ignoriert. Beispiel: 2,5"
              : "";
            hint.hidden = !bad.length;
            place(); // the hint changes the height
            handlers.range(out.min, out.max);
          };
          for (const input of Object.values(inputs)) {
            input.addEventListener("input", apply);
            input.addEventListener("keydown", (event) => {
              if (event.key === "Enter") apply();
            });
          }
          const fill = (s) => {
            const f = s.filter || {};
            for (const name of ["min", "max"]) {
              const input = inputs[name];
              if (document.activeElement === input) continue; // keep what the user is typing
              const parsed = parseNumberInput(input.value);
              const applied = f[name] === undefined ? null : f[name];
              if (!(parsed.valid && parsed.value === applied)) {
                input.value = boundText(applied);
                input.setAttribute("aria-invalid", "false");
              }
            }
            info.textContent = s.range
              ? "Werte: " + formatCell(s.range.min) + " \u2013 " + formatCell(s.range.max) + ". Grenzen inklusive, leeres Feld = keine Grenze."
              : "Keine Werte.";
          };
          hint.hidden = true;
          fill(spec);
          api = { fill, focus: () => inputs.min.focus() };
        } else {
          const search = el("label", "cv-search");
          const input = el("input");
          input.type = "search";
          input.placeholder = "Werte suchen";
          input.setAttribute("aria-label", "Werte suchen: " + spec.title);
          search.append(icon("search"), input);
          const emptyHint = el("p", "cv-hint");
          const list = createVirtualList({
            className: "cv-fs-values cv-colfilter-values",
            rowHeight: VALUE_ROW_HEIGHT,
            maxRows: VALUE_MAX_ROWS,
            createRow() {
              const row = el("label", "cv-fs-value");
              const box = el("input");
              box.type = "checkbox";
              row.append(box, el("span", "cv-fs-label"), el("span", "cv-fs-count"));
              return row;
            },
            updateRow(row, item) {
              const [box, label, count] = row.children;
              const text = valueLabel(item.value);
              box.checked = item.checked;
              box.setAttribute("aria-label", text);
              row.classList.toggle("cv-checked", item.checked);
              row.classList.toggle("cv-zero", item.count === 0);
              label.textContent = text;
              label.title = text;
              label.classList.toggle("cv-empty-value", item.value === null);
              count.textContent = formatCount(item.count);
            },
          });
          body.append(search, list.element, emptyHint);
          let query = "";
          const fill = (s, resetScroll) => {
            const values = s.facet ? s.facet.values : [];
            let shown = values;
            if (query) shown = values.filter((item) => valueLabel(item.value).toLowerCase().includes(query));
            list.setItems(shown, resetScroll);
            list.element.hidden = !shown.length;
            emptyHint.hidden = shown.length > 0;
            emptyHint.textContent = values.length ? "Keine Treffer." : "Keine Werte.";
          };
          input.addEventListener("input", () => {
            query = input.value.trim().toLowerCase();
            fill(current, true);
          });
          list.element.addEventListener("change", (event) => {
            const item = list.itemOf(event.target);
            if (item) handlers.toggle(item.value, event.target.checked);
          });
          fill(spec, true);
          api = { fill, focus: () => input.focus() };
        }

        function setState(s) {
          current = s;
          for (const [dir, button] of Object.entries(sortButtons)) {
            button.classList.toggle("cv-on", s.sort === dir);
            button.setAttribute("aria-pressed", String(s.sort === dir));
          }
          const active = Boolean(s.filter);
          reset.disabled = !active;
        }
        setState(spec);
        host.append(popup);

        function place() {
          const hostBox = host.getBoundingClientRect();
          const box = anchor.getBoundingClientRect();
          const width = popup.offsetWidth;
          const left = Math.max(8, Math.min(box.right - width, hostBox.width - width - 8));
          let top = box.bottom - hostBox.top + 4;
          const maxTop = hostBox.height - popup.offsetHeight - 8;
          if (top > maxTop) top = Math.max(8, box.top - hostBox.top - popup.offsetHeight - 4);
          popup.style.left = left + "px";
          popup.style.top = top + "px";
        }
        place();
        api.focus();

        let open = true;
        function finish() {
          if (!open) return;
          open = false;
          document.removeEventListener("keydown", onKey, true);
          document.removeEventListener("pointerdown", onDown, true);
          popup.remove();
          handlers.close();
        }
        function onKey(event) {
          if (event.key !== "Escape") return;
          event.preventDefault(); // handled: Escape closes the popup only (not the 3D selection)
          finish();
        }
        function onDown(event) {
          if (popup.contains(event.target)) return;
          if (anchor.contains(event.target)) return; // the filter button toggles itself
          finish();
        }
        document.addEventListener("keydown", onKey, true);
        document.addEventListener("pointerdown", onDown, true);
        close.addEventListener("click", finish);
        return {
          key: spec.key,
          element: popup,
          close: finish,
          /** New state (facet values, filter, sort) after a refresh. */
          update(s) {
            setState(s);
            api.fill(s, false);
          },
          place,
        };
      }

      /**
       * Column chooser `Spalten` (REQ-006): the shown columns (move up/down, remove) above the property catalogue
       * (search, add; the dialog stays open). handlers: { columns() -> [{ key, title }], add(key), remove(key),
       * step(key, delta) }; refresh() re-reads the columns.
       */
      function openColumnChooser(host, entries, handlers) {
        const top = el("div", "cv-chooser");
        const heading = el("div", "cv-chooser-title", "Angezeigte Spalten");
        const list = el("ol", "cv-chooser-list");
        list.id = "cv-chooser-list";
        top.append(heading, list, el("div", "cv-chooser-title", "Spalte hinzuf\u00fcgen"));
        const used = new Set();
        let dialog = null;
        function refresh() {
          const cols = handlers.columns();
          used.clear();
          for (const c of cols) used.add(c.key);
          list.replaceChildren();
          cols.forEach((col, i) => {
            const item = el("li", "cv-chooser-item");
            item.dataset.key = col.key;
            const name = el("span", "cv-chooser-name", col.title);
            name.title = col.title;
            const up = iconButton("up", "Spalte nach links: " + col.title);
            up.disabled = i === 0;
            up.addEventListener("click", () => {
              handlers.step(col.key, -1);
              refresh();
            });
            const down = iconButton("down", "Spalte nach rechts: " + col.title);
            down.disabled = i === cols.length - 1;
            down.addEventListener("click", () => {
              handlers.step(col.key, 1);
              refresh();
            });
            const remove = iconButton("close", "Spalte entfernen: " + col.title);
            remove.addEventListener("click", () => {
              handlers.remove(col.key);
              refresh();
            });
            item.append(name, up, down, remove);
            list.append(item);
          });
          if (!cols.length) list.append(el("li", "cv-hint", "Keine Spalten."));
          if (dialog) dialog.refresh();
        }
        refresh();
        dialog = openCatalogue(
          host,
          entries,
          used,
          (key) => {
            handlers.add(key);
            refresh();
          },
          "Spalten",
          { keepOpen: true, top, usedNote: "angezeigt", usedLabel: "bereits als Spalte", className: "cv-columns-dialog", onClose: handlers.close },
        );
        return { close: dialog.close, refresh, element: dialog.element };
      }

      /** Text of a property value in the details panel: numbers in German format (up to 3 decimals) with unit. */
      function detailText(value, entry) {
        if (Array.isArray(value)) return value.map((v) => detailText(v, entry)).join(", ");
        if (typeof value === "number") {
          const text = value.toLocaleString("de-DE", { maximumFractionDigits: 3 });
          return entry && entry.kind === "number" && entry.unit && entry.unit !== "gemischt" ? text + " " + entry.unit : text;
        }
        if (value === null || value === undefined) return "";
        return String(value);
      }

      /** Rank of a details group: `Allgemein` first, then psets, then type psets (`Typ: ...`; REQ-007). */
      const groupRank = (group) => (group === "Allgemein" ? 0 : group.indexOf("Typ: ") === 0 ? 2 : 1);

      /**
       * Details panel body (REQ-007 `Element-Details`): all properties of one element, grouped (attributes and special
       * properties, then psets, then type psets), groups collapsible (state kept per group name).
       */
      function createDetails(body, onClear) {
        const collapsed = new Set();
        const placeholder = "Klick auf ein Element zeigt seine Eigenschaften.";
        function clear() {
          body.replaceChildren(el("p", "cv-hint", placeholder));
          body.dataset.key = "";
          delete body.dataset.group;
        }
        /**
         * Group selection (REQ-007 "clicking a group row highlights all its elements"): info { id, kicker (grouping
         * properties), title (group path), count, withoutGeometry }.
         */
        function showGroup(info) {
          const head = el("div", "cv-det-head");
          const text = el("div", "cv-det-head-text");
          text.append(el("div", "cv-det-kicker", info.kicker), el("div", "cv-det-title", info.title));
          const close = iconButton("close", "Auswahl aufheben", "cv-det-close");
          close.addEventListener("click", onClear);
          head.append(text, close);
          const count = info.count.toLocaleString("de-DE");
          const parts = [head, el("p", "cv-det-count", (info.count === 1 ? "1 Element" : count + " Elemente") + " ausgew\u00e4hlt")];
          if (info.withoutGeometry) {
            const hint = el("p", "cv-det-nogeo", "Davon ohne 3D-Geometrie: " + info.withoutGeometry.toLocaleString("de-DE"));
            hint.setAttribute("role", "note");
            parts.push(hint);
          }
          body.replaceChildren(...parts);
          body.dataset.key = "";
          body.dataset.group = info.id;
          body.scrollTop = 0;
        }
        /** info: { row (spec 4.3), catalog (Map key -> entry), order (Map key -> catalogue position) }. */
        function show(info) {
          const row = info.row;
          const values = row.values;
          const head = el("div", "cv-det-head");
          const text = el("div", "cv-det-head-text");
          text.append(
            el("div", "cv-det-kicker", values.Kategorie || "Element"),
            el("div", "cv-det-title", values.Name !== undefined ? String(values.Name) : values.Kategorie || ""),
          );
          const close = iconButton("close", "Auswahl aufheben", "cv-det-close");
          close.addEventListener("click", onClear);
          head.append(text, close);
          const parts = [head];
          if (!row.geometry) {
            const hint = el("p", "cv-det-nogeo", "Dieses Element hat keine 3D-Geometrie.");
            hint.setAttribute("role", "note");
            parts.push(hint);
          }
          const groups = new Map();
          for (const key of Object.keys(values)) {
            const value = values[key];
            if (value === undefined || value === null || (Array.isArray(value) && !value.length)) continue;
            const entry = info.catalog.get(key);
            const dot = key.indexOf(".");
            const group = entry ? entry.group : dot > 0 ? key.slice(0, dot) : "Allgemein";
            if (!groups.has(group)) groups.set(group, []);
            groups.get(group).push({ key, value, entry });
          }
          const pos = (key) => (info.order.has(key) ? info.order.get(key) : Infinity);
          const ordered = [...groups.entries()].sort(
            (a, b) =>
              groupRank(a[0]) - groupRank(b[0]) ||
              Math.min(...a[1].map((p) => pos(p.key))) - Math.min(...b[1].map((p) => pos(p.key))) ||
              (a[0] < b[0] ? -1 : 1),
          );
          for (const [group, props] of ordered) {
            props.sort((a, b) => pos(a.key) - pos(b.key) || (a.key < b.key ? -1 : 1));
            const section = el("section", "cv-det-group");
            section.dataset.group = group;
            const toggle = el("button", "cv-det-group-head");
            toggle.type = "button";
            toggle.append(icon("chevron"), el("span", "cv-det-group-name", group), el("span", "cv-det-group-count", String(props.length)));
            const table = el("dl", "cv-det-props");
            for (const prop of props) {
              const pset = group.indexOf("Typ: ") === 0 ? group.slice(5) : group;
              const name = prop.key.indexOf(pset + ".") === 0 ? prop.key.slice(pset.length + 1) : prop.key;
              const dt = el("dt", "cv-det-name", name);
              dt.title = prop.key;
              const dd = el("dd", "cv-det-value", detailText(prop.value, prop.entry));
              dd.title = dd.textContent;
              dd.classList.toggle("cv-num", typeof prop.value === "number");
              table.append(dt, dd);
            }
            const setCollapsed = (on) => {
              section.classList.toggle("cv-collapsed", on);
              table.hidden = on;
              toggle.setAttribute("aria-expanded", String(!on));
              if (on) collapsed.add(group);
              else collapsed.delete(group);
            };
            toggle.addEventListener("click", () => setCollapsed(!section.classList.contains("cv-collapsed")));
            setCollapsed(collapsed.has(group));
            section.append(toggle, table);
            parts.push(section);
          }
          body.replaceChildren(...parts);
          body.dataset.key = row.key;
          delete body.dataset.group;
          body.scrollTop = 0;
        }
        clear();
        return { show, showGroup, clear };
      }

      /** Name shown as title while there is neither a title nor a model (REQ-011 default: first model's Modell). */
      const APP_NAME = "Calc Viewer Builder";

      /**
       * Dialog `Titel, Datum und Logo` (REQ-011, builder). current: { title (set title or null), titleDefault (first
       * model's Modell or ""), date (set date or null), dateDefault (today), logo (data URL or null) }. handlers:
       * { readLogo(file) -> Promise<{ dataUrl } | { error }>, apply({ title, date, logo }) }. An empty title or date
       * field gives null (the default); `Uebernehmen` applies, `Abbrechen` / Escape / the backdrop close unchanged.
       */
      function openHeaderDialog(host, current, handlers) {
        const backdrop = el("div", "cv-backdrop");
        const dialog = el("div", "cv-dialog cv-header-dialog");
        dialog.setAttribute("role", "dialog");
        dialog.setAttribute("aria-modal", "true");
        dialog.setAttribute("aria-labelledby", "cv-header-dialog-title");
        const head = el("div", "cv-dialog-head");
        const heading = el("div", "cv-dialog-title", "Titel, Datum und Logo");
        heading.id = "cv-header-dialog-title";
        const close = iconButton("close", "Schlie\u00dfen", "cv-dialog-close");
        head.append(heading, close);
        const body = el("div", "cv-dialog-body cv-form");

        const titleLabel = el("label", "cv-field");
        const titleInput = el("input");
        titleInput.type = "text";
        titleInput.id = "cv-hdr-title";
        titleInput.maxLength = 200;
        titleInput.value = current.title || "";
        titleInput.placeholder = current.titleDefault || "";
        titleLabel.append(
          el("span", "cv-field-label", "Titel"),
          titleInput,
          el("span", "cv-hint", "Leer: Name des ersten Modells" + (current.titleDefault ? " (" + current.titleDefault + ")" : "") + "."),
        );

        const dateLabel = el("label", "cv-field");
        const dateInput = el("input");
        dateInput.type = "date";
        dateInput.id = "cv-hdr-date";
        dateInput.value = current.date || "";
        dateLabel.append(
          el("span", "cv-field-label", "Datum"),
          dateInput,
          el("span", "cv-hint", "Leer: heute (" + germanDate(current.dateDefault) + ")."),
        );

        const logoField = el("div", "cv-field");
        const preview = el("div", "cv-logo-preview");
        preview.id = "cv-hdr-logo-preview";
        const logoInput = el("input");
        logoInput.type = "file";
        logoInput.id = "cv-hdr-logo";
        logoInput.hidden = true;
        logoInput.accept = ".png,.jpg,.jpeg,.svg,image/png,image/jpeg,image/svg+xml";
        const pick = el("button", "cv-btn cv-small", "Logo w\u00e4hlen");
        pick.type = "button";
        pick.id = "cv-hdr-logo-pick";
        const remove = el("button", "cv-btn cv-small", "Logo entfernen");
        remove.type = "button";
        remove.id = "cv-hdr-logo-remove";
        const logoRow = el("div", "cv-logo-row");
        logoRow.append(preview, pick, remove, logoInput);
        const error = el("p", "cv-field-error");
        error.id = "cv-hdr-error";
        error.setAttribute("role", "alert");
        logoField.append(
          el("span", "cv-field-label", "Logo"),
          logoRow,
          el("span", "cv-hint", "PNG, JPG oder SVG, h\u00f6chstens 1 MB."),
          error,
        );
        body.append(titleLabel, dateLabel, logoField);

        const foot = el("div", "cv-dialog-foot");
        const cancel = el("button", "cv-btn", "Abbrechen");
        cancel.type = "button";
        const ok = el("button", "cv-btn cv-primary", "\u00dcbernehmen");
        ok.type = "button";
        ok.id = "cv-hdr-apply";
        foot.append(cancel, ok);
        dialog.append(head, body, foot);
        backdrop.append(dialog);
        host.append(backdrop);

        let logo = current.logo || null;
        let reading = 0;
        function showLogo() {
          if (logo) {
            const image = el("img", "cv-logo-img");
            image.alt = "Logo";
            image.src = logo;
            preview.replaceChildren(image);
          } else preview.replaceChildren(el("span", "cv-hint", "Kein Logo"));
          remove.disabled = !logo;
        }
        showLogo();

        let open = true;
        function finish() {
          if (!open) return;
          open = false;
          document.removeEventListener("keydown", onKey, true);
          backdrop.remove();
        }
        function onKey(event) {
          if (event.key === "Escape") {
            event.preventDefault(); // handled: Escape closes the dialog only (it does not clear the 3D selection)
            finish();
          } else if (event.key === "Enter" && event.target && event.target.tagName === "INPUT" && !ok.disabled) {
            event.preventDefault();
            ok.click();
          }
        }
        document.addEventListener("keydown", onKey, true);
        backdrop.addEventListener("click", (event) => {
          if (event.target === backdrop) finish();
        });
        close.addEventListener("click", finish);
        cancel.addEventListener("click", finish);
        pick.addEventListener("click", () => logoInput.click());
        remove.addEventListener("click", () => {
          logo = null;
          error.textContent = "";
          showLogo();
        });
        logoInput.addEventListener("change", async () => {
          const file = logoInput.files && logoInput.files[0];
          logoInput.value = "";
          if (!file) return; // cancelled file dialog: nothing changes
          const ticket = ++reading;
          ok.disabled = true;
          error.textContent = "";
          const result = await handlers.readLogo(file);
          if (ticket !== reading || !open) return;
          ok.disabled = false;
          if (result.error) error.textContent = result.error;
          else {
            logo = result.dataUrl;
            showLogo();
          }
        });
        ok.addEventListener("click", () => {
          if (ok.disabled) return;
          const title = titleInput.value.trim();
          finish();
          handlers.apply({ title: title === "" ? null : title, date: dateInput.value || null, logo });
        });
        titleInput.focus();
        return { close: finish, element: dialog };
      }

      /**
       * Builds the one-screen layout of spec 2 User interface into root and returns the parts the app needs: header
       * (logo, title, date, builder buttons), filter area (~280 px), 3D view and table with a splitter (55 / 45 %),
       * details (~320 px, collapsible), status line `X von Y Elementen`.
       */
      export function renderLayout(root, options) {
        const mode = options.mode;
        const handlers = options.filterHandlers;
        const app = el("div", "cv-app");
        app.dataset.core = coreInfo().name;

        const header = el("header", "cv-header");
        const logo = el("div", "cv-logo");
        logo.id = "cv-logo";
        logo.title = "Logo";
        logo.append(icon("cube"));
        const brand = el("div", "cv-brand");
        const title = el("h1", "cv-title", options.title || APP_NAME);
        title.id = "cv-title";
        const date = el("span", "cv-date", new Date().toLocaleDateString("de-DE"));
        date.id = "cv-date";
        brand.append(title, date);
        const actions = el("div", "cv-actions");
        let headerEdit = null;
        if (mode === "builder") {
          // title, date and logo (REQ-011): edited in a dialog
          headerEdit = iconButton("edit", "Titel, Datum und Logo bearbeiten", "cv-header-edit");

    <!-- Engine start and model display. ASCII only. -->
    <script type="text/plain" id="cv-3d-src">
      import * as THREE from "three";
      import * as FRAGS from "@thatopen/fragments";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const VIEW_DIRECTION = new THREE.Vector3(1, 0.75, 1).normalize();
      const FIT_PADDING = 1.2;
      const CLICK_TOLERANCE_PX = 4; // a pointer that moved more than this is an orbit drag, not a pick (ref)
      // Selection highlight (ref HIGHLIGHT_COLOR) and X-ray ghost (ref GHOST_COLOR / GHOST_OPACITY, REQ-005).
      const SELECTION_COLOR = "#d72622";
      const GHOST_COLOR = "#a4a8ac";
      const GHOST_OPACITY = 0.12;
      const COALESCE_MS = 150; // longest wait for other models' refreshes before a changed view is drawn
      /*
       * Longest wait, after the engine calls of a display plan, a selection or the IfcSpace option, until every model
       * that got calls shows them in its tiles (R-4): one complete frame per click instead of one per model. A frame
       * blocks the main thread for its whole GPU time in headless software WebGL (about 600 ms at 30,000 elements),
       * which also delays the other models' tile updates, so a partial first frame made the complete one come a whole
       * frame later.
       */
      const SETTLE_MS = 300;
      const KICK_MS = 16; // a model still waiting for its change refreshes again after this, not after ~100 ms
      const GHOST = "ghost"; // paint of a ghost in the display mirror; colours are "#rrggbb"
      /**
       * Neutral light grey of context geometry (e.g. the IfcSite terrain) while `Faerben nach` is active without a
       * filter (TASK-005 L3): not a legend colour (lighter than `(leer)` #c4c7ca and every scale step is blue), so the
       * terrain is not mistaken for a coloured value.
       */
      export const CONTEXT_COLOR = "#e3e5e7";
      /**
       * Section axes in IFC terms (REQ-005 `Schnitt` X / Y / Z): Fragments shows IFC Z-up models Y-up, so IFC X = three
       * x, IFC Y = -three z, IFC Z = three y. dir: the IFC axis as a three vector.
       */
      const AXES = {
        X: new THREE.Vector3(1, 0, 0),
        Y: new THREE.Vector3(0, 0, -1),
        Z: new THREE.Vector3(0, 1, 0),
      };

      /**
       * Starts three + Fragments in container. workerUrl: Blob URL of the classic Fragments worker (classic, because
       * module workers from Blob URLs fail under file:// and in opaque-origin frames; spec CON-002). options:
       * { onPick(key | null) } is called after a click on the canvas (key of the picked element, null for empty space).
       *
       * Rendering is on demand (TASK-004 verification P1): a frame is drawn only when the camera, the controls, the
       * view (Fragments tiles), visibility, highlight or clipping change, never in an idle loop.
       *
       * Display (spec 4.4, as ref L1180-1265): cv-3d keeps a mirror of the calls it made to the Fragments engine per
       * element (visible, paint = ghost | colour) plus the selection, and state() is derived from that mirror. Only
       * elements of the current row set with geometry are managed; other items (e.g. IfcSpace while the option is off,
       * process-log 2026-11-02) are never shown by display calls.
       */
      export function createEngine(container, workerUrl, options) {
        const onPick = (options && options.onPick) || (() => {});
        const scene = new THREE.Scene();
        scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f94, 2.2));
        const sun = new THREE.DirectionalLight(0xffffff, 1.6);
        sun.position.set(5, 10, 7);
        scene.add(sun);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10000);
        camera.position.set(30, 20, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        container.prepend(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // ---------- render on demand ----------
        let frameRequested = false;
        let frames = 0;
        let lastFrameAt = 0;
        let frameWaiters = [];
        function renderFrame() {
          frameRequested = false;
          controls.update(); // with damping this emits "change" while the camera still moves -> next frame
          renderer.render(scene, camera);
          frames++;
          lastFrameAt = performance.now();
          if (changePending) {
            changePending = false;
            changeFrames.push(lastFrameAt);
            if (changeFrames.length > 64) changeFrames = changeFrames.slice(-32);
            // the next animation frame starts once this frame is on screen (headless: after the compositor has read
            // the canvas back); recorded for the perf tests ("pixels on screen", Q-002)
            requestAnimationFrame(() => {
              shownFrames.push(performance.now());
              if (shownFrames.length > 64) shownFrames = shownFrames.slice(-32);
            });
          }
          const waiters = frameWaiters;
          frameWaiters = [];
          for (const resolve of waiters) resolve(lastFrameAt);
        }
        function requestRender() {
          if (frameRequested) return;
          frameRequested = true;
          requestAnimationFrame(renderFrame);
        }
        /*
         * Fragments refreshes its view on a timer (about every 100 ms, also when idle) and reports each refresh with
         * onViewUpdated, while tile updates (highlight, visibility, LOD) change the tile meshes in place without an
         * own event. So after each refresh the tiles' render-relevant state (visibility, material, draw groups, buffer
         * versions) is compared with the last drawn one, and a frame is drawn only if it changed. New or removed tiles
         * are always drawn. changeFrames: times of frames drawn because the view changed (perf measurements).
         */
        const signatures = new Map(); // model -> signature of its tiles at the last refresh
        let changePending = false;
        let changeFrames = [];
        let shownFrames = []; // performance.now() at the animation frame after each change frame
        function tileSignature(model) {
          let sig = 0;
          const mix = (x) => {
            sig = (Math.imul(sig, 31) + (x | 0)) | 0;
          };
          for (const tile of model.tiles.values()) {
            mix(tile.visible ? 1 : 2);
            const materials = Array.isArray(tile.material) ? tile.material : [tile.material];
            for (const m of materials) mix(m ? m.id : 0);
            const g = tile.geometry;
            if (!g) continue;
            mix(g.drawRange.start);
            mix(g.drawRange.count === Infinity ? -1 : g.drawRange.count);
            for (const group of g.groups) {
              mix(group.start);
              mix(group.count);
              mix(group.materialIndex);
            }
            if (g.index) {
              mix(g.index.version);
              mix(g.index.count);
            }
            for (const name in g.attributes) mix(g.attributes[name].version);
          }
          return sig;
        }
        /*
         * A changed view is drawn once every model has finished its refresh (one complete frame instead of one per
         * model; a frame costs about 280 ms in headless software WebGL), waiting at most COALESCE_MS.
         */
        let coalesceSince = 0;
        let coalesceTimer = 0;
        function drawWhenSettled() {
          coalesceTimer = 0;
          const now = performance.now();
          const busy = [...models.values()].some((m) => m.isBusy);
          const waiting = settling.size > 0 && now - settlingSince < SETTLE_MS;

        }

        colourScheme,
        createColumnStore,
        defaultColumnWidth,
        evaluateFilters,
        facetCounts,
        filterRows,
        groupDisplayRows,
        groupRows,
        groupsOfRow,
        loadErrorMessage,
        modelNameFromFile,
        moveItem,
        normaliseColumns,
        normaliseGrouping,
        numberRange,
        pruneSelection,
        sortRows,
        uniqueModelName,
        visibleRows,
      } from "calc-core";

      /** Filter sets of a new configuration (REQ-003). */
      export const DEFAULT_FILTER_SETS = ["Kategorie", "Geschoss", "Material"];

      /**
       * Test hook (read-only for tests except `test`): phase "starting" | "ready" | "loading" | "error"; error (fatal
       * start error only, else null; load errors are in loadErrors); models [{ id, name (file name), modell, elements,
       * withGeometry (visible rows with 3D geometry), spaceIds (localIds of the IfcSpace items) }]; rows (visible element rows, spec 4.3); catalog (property
       * catalogue entries in order); loadErrors [{ fileName, loadClass, message }]; progress (last { file, step,
       * percent } or null); queued (files dropped during a running action, loaded after it); loads (number of
       * finished load, remove or option actions, for waiting; a batch with queued files counts once); options
       * { includeSpaces }. `test` holds test-only switches read by the
       * builder's conversion (crashNextConversion, neverStartNextConversion, startTimeoutMs).
       * filter (TASK-004): { sets [{ id, key, title, collapsed, selected }] in display order (the configuration part of
       * REQ-003-AC2), active (normalised core filters), count (rows passing all filters), total, keys (row keys passing
       * all filters, ascending row order; the set 3D and table follow), facets ({ id -> { total, checkedCount, values
       * [{ value, count, checked }] } }), updates (number of filter evaluations), lastMs (duration of the last
       * evaluation incl. filter-area update) }. layout: { split (model share in %), detailsCollapsed }. view (TASK-005):
       * { mode 'ghost' | 'hide', colourKey, selected (row key or null), section }; the 3D state itself is
       * window.CalcView.state() (spec 4.4). table (TASK-006a): { columns [{ key, width }] in display order, sort
       * ({ key, dir } | null), filters ([{ key, type 'values', values } | { key, type 'range', min, max }] column
       * filters, ids `col:<key>`), count (rows shown), keys (row keys in display order; built when read), updates,
       * lastMs (filter result -> table rendered) }; columns, sort and filters are the configuration part (REQ-006-AC6,
       * TASK-007) and also returned by start().tableState() / window.CalcTable.state().
       * table.at is the performance.now() time of the last table update (perf tests: input event -> table rendered).
       * Grouping view (TASK-006b) adds to table: view ('single' | 'grouped'), groupBy ([key1, key2?]), groups (number
       * of groups on both levels), display (built when read: the shown rows in order, [{ type 'group', level, id, key,
       * value, label, count, cells { key -> sum | common value | null }, expanded } | { type 'element', key, depth }]),
       * total ({ count, cells } of the total row, or null in the single-element view); in the grouping view count is the
       * number of shown rows (group and element rows, total row excluded) and keys the element rows' keys. view and
       * groupBy are the configuration part (REQ-009, TASK-007): start().groupingState() / window.CalcTable.grouping().
       * header (TASK-007, REQ-011): { title, date, logo } as shown (defaults applied), titleSet / dateSet (false while
       * the default applies). config (TASK-007, REQ-009): { loads (finished `Konfiguration laden` actions, ok or not),
       * saves, last ({ ok, fileName, errorClass, message, ms } | { ok, fileName, notice, skipped, ms }; ms = parse and
       * apply time), lastSaved
       * ({ fileName, text }) }; window.CalcConfig.state() is the configuration a save would write.
       */
      const hook = {
        phase: "starting",
        models: [],
        modelCount: 0,
        elementCount: 0,
        rows: [],
        catalog: [],
        loadErrors: [],
        loads: 0,
        queued: 0,
        progress: null,
        error: null,
        options: { includeSpaces: false },
        filter: { sets: [], active: [], count: 0, total: 0, keys: [], facets: {}, updates: 0, lastMs: 0 },
        table: {
          columns: [],
          sort: null,
          filters: [],
          count: 0,
          keys: [],
          updates: 0,
          lastMs: 0,
          at: 0,
          view: "single",
          groupBy: [],
          groups: 0,
          display: [],
          total: null,
        },
        layout: null,
        view: null,
        header: null,
        config: { loads: 0, saves: 0, last: null, lastSaved: null },
        test: { crashNextConversion: false, neverStartNextConversion: false, startTimeoutMs: null },
      };
      window.__calc = hook;

      /** Classifies any error of the load pipeline (REQ-001): LoadError keeps its class, the rest is unreadable. */
      function toLoadError(error, fileName) {
        if (error instanceof LoadError || (error && error.loadClass)) return error;
        const detail = error && error.message ? error.message : String(error);
        return new LoadError("unreadable", fileName, detail);
      }

      /**
       * options: { mode: "builder" | "viewer", root, workerUrl,
       *   convert(file, onProgress(fraction|null, step?)) -> Promise<{ bytes, elementClasses }> (builder),
       *   extract(model, { modelId, modelName, elementClasses, withGeometry }, onProgress(fraction))
       *     -> Promise<{ rows, properties, spaceProperties, spaceIds }> (builder) }.
       */
      export async function start(options) {
        // Filter state (REQ-003, REQ-004): filter sets in display order; one filter per set, id = property key.
        const filterSets = DEFAULT_FILTER_SETS.map((key) => ({ id: key, key, collapsed: false, selected: [] }));
        let catalog = new Map();
        let store = createColumnStore([]);
        let view = { evaluation: null, indices: new Uint32Array(0), facets: new Map() };
        const filterListeners = [];
        // 3D coupling (TASK-005, REQ-005 / REQ-007): display mode, colouring, section, selection.
        let viewMode = "ghost";
        let colourKey = null;
        let scheme = null; // colourScheme(store, colourKey) for the current row set
        let selectedKey = null;
        // group selection (TASK-006c, REQ-007): { id, keys (row keys inside the filter), kicker, title } or null
        let selectedGroup = null;
        let section = null; // { axis, offset, flipped }
        let rowIndex = new Map(); // row key -> index in store.rows
        let catalogOrder = new Map(); // property key -> catalogue position (details order)
        let inside = new Uint8Array(0); // 1 = row passes all filters
        // Table (TASK-006a, REQ-006): columns [{ key, width }], sort { key, dir } | null, column filters by key
        // ({ type 'values', values } | { type 'range', min, max }; filter id `col:<key>`), open popup / chooser.
        let columns = normaliseColumns(DEFAULT_COLUMNS, null);
        let sort = null;
        const columnFilters = new Map();
        let columnPopup = null; // { key, popup }
        let chooser = null;
        let order = new Uint32Array(0); // row indices in table order (filtered, sorted)
        const rowClickListeners = [];
        // Grouping view (TASK-006b, REQ-006): view, grouping properties (level 1, optional level 2), expanded groups
        // (a group is expanded when expandDefault differs from toggled.has(id); `Alle auf-/zuklappen` set the default)
        let tableView = "single";
        let groupBy = [];
        let expandDefault = false;
        const toggled = new Set();
        let tree = null; // groupRows result of the current filter result
        let displayItems = [];
        const groupClickListeners = [];

        const setById = (id) => filterSets.find((s) => s.id === id);
        const colId = (key) => "col:" + key;
        const coreFilters = () =>
          filterSets
            .map((s) => ({ id: s.id, key: s.key, type: "values", values: s.selected }))
            .concat([...columnFilters].map(([key, f]) => ({ id: colId(key), key, ...f })));

        function setSpecs() {
          return filterSets.map((s) => {
            const entry = catalog.get(s.key);
            const unit = entry && entry.kind === "number" ? entry.unit : null;
            return { id: s.id, key: s.key, title: entry ? entry.label : s.key, unit, collapsed: s.collapsed };
          });
        }

        function publishSets() {
          const specs = setSpecs();
          ui.filters.setSets(specs);
          hook.filter.sets = specs.map((spec, i) => ({
            id: spec.id,
            key: spec.key,
            title: spec.title,
            collapsed: spec.collapsed,
            selected: filterSets[i].selected.slice(),
          }));
        }

        /**
         * Evaluates all filters once (evaluateFilters) and updates the filter sets, the status line and the hook. The
         * row set passing all filters (view.indices) is what 3D (TASK-005) and table (TASK-006a) show.
         */
        function refresh() {
          const t0 = performance.now();
          const filters = coreFilters();
          const evaluation = evaluateFilters(store, filters);
          const indices = filterRows(evaluation);
          const facets = facetCounts(evaluation, null, filterSets.map((s) => ({ id: s.id, key: s.key })));
          view = { evaluation, indices, facets };
          inside = new Uint8Array(store.size);
          for (const i of indices) inside[i] = 1;
          if (scheme) {
            // colour dots in the filter set of the colouring property (REQ-005-AC2)
            for (const set of filterSets) {
              if (set.key !== colourKey || !facets.get(set.id)) continue;
              for (const item of facets.get(set.id).values) item.colour = scheme.valueColour(item.value) || "";
            }
          }
          ui.filters.update(facets, evaluation.filters.length > 0);
          sync3d();
          ui.status(indices.length, store.size, hook.modelCount);
          updateTable(t0);
          updatePopup();
          const rows = store.rows;
          let keys = null;
          let plainFacets = null;
          hook.filter.active = evaluation.filters.map((f) => ({ ...f, values: f.values ? f.values.slice() : undefined }));
          hook.filter.count = indices.length;
          hook.filter.total = store.size;
          // keys and facets are built only when read (tests, later tasks), not on every click
          Object.defineProperty(hook.filter, "keys", {
            configurable: true,
            enumerable: true,
            get() {
              if (!keys) keys = Array.from(indices, (i) => rows[i].key);
              return keys;
            },
          });
          Object.defineProperty(hook.filter, "facets", {
            configurable: true,
            enumerable: true,
            get() {
              if (!plainFacets) {
                plainFacets = {};
                for (const [id, f] of facets)
                  plainFacets[id] = { total: f.total, checkedCount: f.checkedCount, values: f.values };
              }
              return plainFacets;
            },
          });
          hook.filter.updates++;
          hook.filter.lastMs = performance.now() - t0;
          for (const listener of filterListeners) listener(view);
        }

        function changed() {
          publishSets();
          refresh();
        }

        /** Keys of the cached columns still in use: filter sets, colouring, column filters, sort key and grouping. */
        const keysInUse = () =>
          filterSets
            .map((s) => s.key)
            .concat(
              colourKey ? [colourKey] : [],
              [...columnFilters.keys()],
              sort ? [sort.key] : [],
              tableView === "grouped" ? groupBy : [],
            );

        // ---------- table (TASK-006a, REQ-006) ----------

        /** Header specs of the columns for the table component (grouping view: `Gruppe` and `Anzahl` first). */
        function columnSpecs() {
          const fixed =
            tableView === "grouped"
              ? [
                  { key: GROUP_COLUMN, title: "Gruppe", kind: "text", width: 260, sort: null, filtered: false, fixed: true },
                  { key: COUNT_COLUMN, title: "Anzahl", kind: "number", width: 90, sort: null, filtered: false, fixed: true },
                ]
              : [];
          return fixed.concat(columnSpecsOnly());
        }

        function columnSpecsOnly() {
          return columns.map((c) => {
            const entry = catalog.get(c.key);
            return {
              key: c.key,
              title: entry ? entry.header : c.key,
              kind: entry && entry.kind === "number" ? "number" : "text",
              width: c.width,
              sort: sort && sort.key === c.key ? sort.dir : null,
              filtered: columnFilters.has(c.key),
            };
          });
        }

        /** Configuration part of the table (REQ-006-AC6; saved by TASK-007): columns, sort, column filters. */
        function tableState() {
          return {
            columns: columns.map((c) => ({ key: c.key, width: c.width })),
            sort: sort ? { ...sort } : null,
            columnFilters: [...columnFilters].map(([key, f]) =>
              f.type === "range"
                ? { key, type: "range", min: f.min, max: f.max }
                : { key, type: "values", values: f.values.slice() },
            ),
          };
        }

        /** Grouping part of the configuration (REQ-009 "table view, grouping properties"; saved by TASK-007). */
        function groupingState() {
          return { view: tableView, groupBy: groupBy.slice() };
        }

        function groupTitle(key) {
          const entry = catalog.get(key);
          return entry ? entry.header : key;
        }

        function publishTable() {
          const state = tableState();
          hook.table.columns = state.columns;
          hook.table.sort = state.sort;
          hook.table.filters = state.columnFilters;
          hook.table.view = tableView;
          hook.table.groupBy = groupBy.slice();
          ui.setTableView(
            tableView,
            [0, 1].map((i) => (groupBy[i] ? { key: groupBy[i], title: groupTitle(groupBy[i]) } : null)),
          );
          ui.table.setColumns(columnSpecs());
          if (chooser) chooser.refresh();
        }

        /** Aggregation of each column in the grouping view: sums for numbers (not mixed units, DEC-2), else equal text. */
        function groupColumns() {
          return columns.map((c) => {
            const entry = catalog.get(c.key);
            if (entry && entry.kind === "number") return { key: c.key, mode: entry.unit === "gemischt" ? "none" : "sum" };
            return { key: c.key, mode: "same" };
          });
        }

        const isExpanded = (group) => expandDefault !== toggled.has(group.id);

        /** Display rows of the grouping view from the current tree and the expanded state; renders them. */
        function showGroups() {
          const rows = store.rows;
          const list = groupDisplayRows(tree, isExpanded);
          displayItems = list.map((item) =>
            item.type === "group"
              ? { type: "group", group: item.group, label: valueLabel(item.group.value), expanded: isExpanded(item.group) }
              : item,
          );
          ui.table.setGroups(
            rows,
            displayItems,
            tree.total,
            store.size ? "Keine Elemente im Filter." : "Keine Elemente.",
          );
          const items = displayItems;
          let keys = null;
          let display = null;
          hook.table.count = items.length;
          hook.table.groups = allGroups(tree).length;
          hook.table.total = { count: tree.total.count, cells: { ...tree.total.cells } };
          Object.defineProperty(hook.table, "keys", {
            configurable: true,
            enumerable: true,
            get() {
              if (!keys) keys = items.filter((it) => it.type === "element").map((it) => rows[it.index].key);
              return keys;
            },
          });
          Object.defineProperty(hook.table, "display", {
            configurable: true,
            enumerable: true,
            get() {
              if (!display)
                display = items.map((it) =>
                  it.type === "group"
                    ? {
                        type: "group",
                        level: it.group.level,
                        id: it.group.id,
                        key: it.group.key,
                        value: it.group.value,
                        label: it.label,
                        count: it.group.count,
                        cells: { ...it.group.cells },
                        expanded: it.expanded,
                      }
                    : { type: "element", key: rows[it.index].key, depth: it.depth },
                );
              return display;
            },
          });
        }

        /**
         * Table rows = the filter result (view.indices) in sort order; renders the visible part. Grouping view: the
         * groups of the sorted rows (groupRows), their display rows under the expanded state and the total row.
         */
        function updateTable(t0) {
          const start = t0 === undefined ? performance.now() : t0;
          order = sort ? sortRows(store, view.indices, sort) : view.indices;
          const rows = store.rows;
          if (tableView === "grouped") {
            tree = groupRows(store, order, { levels: groupBy, columns: groupColumns(), sort });
            showGroups();
          } else {
            tree = null;
            displayItems = [];
            const shown = order;
            ui.table.setRows(rows, shown, store.size ? "Keine Elemente im Filter." : "Keine Elemente.");
            let keys = null;
            hook.table.count = shown.length;
            hook.table.groups = 0;
            hook.table.total = null;
            Object.defineProperty(hook.table, "display", {
              configurable: true,
              enumerable: true,
              writable: true,
              value: [],
            });
            Object.defineProperty(hook.table, "keys", {
              configurable: true,
              enumerable: true,
              get() {
                if (!keys) keys = Array.from(shown, (i) => rows[i].key);
                return keys;
              },
            });
          }
          hook.table.updates++;
          hook.table.at = performance.now();
          hook.table.lastMs = hook.table.at - start;
        }

        /** Re-renders the grouping view after an expand / collapse (no regrouping). */
        function refreshGroups() {
          if (tableView !== "grouped" || !tree) return;
          const start = performance.now();
          showGroups();
          hook.table.updates++;
          hook.table.at = performance.now();
          hook.table.lastMs = hook.table.at - start;
        }

        /**
         * Applies a grouping state { view, groupBy } (UI switch, group pickers, TASK-007 configuration load). The
         * grouping view needs a level-1 property: without one it groups by `Kategorie`. A new grouping collapses all.
         */
        function setGroupingState(state) {
          const next = normaliseGrouping(state, catalog);
          if (next.view === "grouped" && !next.groupBy.length) next.groupBy = ["Kategorie"];
          const regroup = next.groupBy.join("\u0000") !== groupBy.join("\u0000");
          if (next.view === tableView && !regroup) return;
          tableView = next.view;
          groupBy = next.groupBy;
          if (regroup) {
            expandDefault = false;
            toggled.clear();
          }
          store.retain(keysInUse());
          publishTable();
          // a new view or grouping starts at its first row (TASK-006b follow-up)
          ui.table.scrollToTop();
          markTable();
          updateTable();
        }
        /** Spec of the column filter popup of key under the current filters (values / range under the others). */
        function popupSpec(key) {
          const entry = catalog.get(key);
          const kind = entry && entry.kind === "number" ? "number" : "text";
          const f = columnFilters.get(key) || null;
          const spec = {
            key,
            title: entry ? entry.header : key,
            kind,
            sort: sort && sort.key === key ? sort.dir : null,
            filter: f,
          };
          const evaluation = view.evaluation || evaluateFilters(store, coreFilters());
          if (kind === "number") spec.range = numberRange(store, key, evaluation.except(colId(key)));
          else spec.facet = facetCounts(evaluation, null, [{ id: colId(key), key }]).get(colId(key));
          return spec;
        }

        function updatePopup() {
          if (columnPopup) columnPopup.popup.update(popupSpec(columnPopup.key));
        }

        function setSort(key, dir) {
          sort = key && dir ? { key, dir } : null;
          store.retain(keysInUse());
          publishTable();
          updateTable();
          updatePopup();
        }

        function closePopup() {
          if (columnPopup) columnPopup.popup.close();
        }

        /** Changes the column filter of key (null removes it) and re-evaluates every filter (sets, table, 3D). */
        function setColumnFilter(key, filter) {
          if (filter) columnFilters.set(key, filter);
          else columnFilters.delete(key);
          store.retain(keysInUse());
          publishTable();
          refresh();
        }

        function addColumn(key) {
          if (columns.some((c) => c.key === key)) return;
          columns = columns.concat([{ key, width: defaultColumnWidth(key, catalog.get(key)) }]);
          publishTable();
          if (tableView === "grouped") updateTable(); // the group rows need the sums / common values of the new column
          else ui.table.render();
        }

        function removeColumn(key) {
          if (!columns.some((c) => c.key === key)) return;
          if (columnPopup && columnPopup.key === key) closePopup();
          columns = columns.filter((c) => c.key !== key);
          const hadFilter = columnFilters.delete(key);
          if (sort && sort.key === key) sort = null;
          store.retain(keysInUse());
          publishTable();
          if (hadFilter) refresh();
          else updateTable();
        }

        function moveColumn(key, to) {
          const from = columns.findIndex((c) => c.key === key);
          if (from === -1 || to < 0 || to >= columns.length || from === to) return;
          columns = moveItem(columns, from, to);
          publishTable();
        }

        const tableHandlers = {
          /** Header click: ascending -> descending -> unsorted (REQ-006). */
          sort(key) {
            if (!sort || sort.key !== key) setSort(key, "asc");
            else if (sort.dir === "asc") setSort(key, "desc");
            else setSort(null);
          },
          filter(key, button) {
            const same = columnPopup && columnPopup.key === key;
            closePopup();
            if (same) return; // the filter button toggles its popup
            const spec = popupSpec(key);
            const popup = ui.openColumnFilter(button, spec, {
              toggle(value, checked) {
                const f = columnFilters.get(key);
                const values = f && f.type === "values" ? f.values.slice() : [];
                const at = values.indexOf(value);
                if (checked && at === -1) values.push(value);
                else if (!checked && at !== -1) values.splice(at, 1);
                else return;
                setColumnFilter(key, values.length ? { type: "values", values } : null);
              },
              range(min, max) {
                const f = columnFilters.get(key);
                const next = {
                  min: min === undefined ? (f ? f.min : null) : min,
                  max: max === undefined ? (f ? f.max : null) : max,
                };
                if (f && f.min === next.min && f.max === next.max) return;
                if (!f && next.min === null && next.max === null) return;
                setColumnFilter(key, next.min === null && next.max === null ? null : { type: "range", ...next });
              },
              reset() {
                if (columnFilters.has(key)) setColumnFilter(key, null);
              },
              sort(dir) {
                if (sort && sort.key === key && sort.dir === dir) setSort(null);
                else setSort(key, dir);
              },
              remove() {
                removeColumn(key);
              },
              close() {
                if (columnPopup && columnPopup.popup === popup) columnPopup = null;
              },
            });
            columnPopup = { key, popup };
          },
          move: moveColumn,
          resize(key, width) {
            const c = columns.find((col) => col.key === key);
            if (!c) return;
            const next = clampColumnWidth(width, c.width);
            if (next === c.width) return publishTable();
            columns = columns.map((col) => (col.key === key ? { key, width: next } : col));
            publishTable();
          },
          /**
           * Row click: selects the element (3D highlight, details; REQ-007-AC3); the camera stays. Then the listeners
           * from start().onRowClick.
           */
          rowClick(key) {
            select(key);
            for (const listener of rowClickListeners) listener(key);
          },
          /**
           * Group row click: selects all elements of the group (REQ-007 "clicking a group row highlights all its
           * elements"); then the listeners from start().onGroupClick (id, element keys of the group).
           */
          groupClick(id) {
            const group = allGroups(tree).find((g) => g.id === id);
            if (!group) return;
            const keys = Array.from(group.indices, (i) => store.rows[i].key);
            selectGroup(group, keys);
            for (const listener of groupClickListeners) listener(id, keys);
          },
          /** `Einzelelemente | Gruppiert` (REQ-006). */
          view(next) {
            setGroupingState({ view: next, groupBy });
          },
          /** Chooses the property of grouping level 1 or 2 from the catalogue. */
          pickGroup(level) {
            if (level === 2 && !groupBy[0]) return;
            const other = groupBy[level === 1 ? 1 : 0];
            const used = new Set(other ? [other] : []);
            ui.openCatalogue(
              [...catalog.values()],
              used,
              (key) => {
                const next = groupBy.slice();
                next[level - 1] = key;
                setGroupingState({ view: "grouped", groupBy: next.filter(Boolean) });
              },
              "Gruppieren nach (Ebene " + level + ")",
            );
          },
          clearGroup(level) {
            setGroupingState({ view: tableView, groupBy: groupBy.filter((_, i) => i !== level - 1) });
          },
          /** `Alle aufklappen` (true) / `Alle zuklappen` (false): every group of both levels. */
          expandAll(expanded) {
            expandDefault = Boolean(expanded);
            toggled.clear();
            refreshGroups();
          },
          /** Expands or collapses one group (by id). */
          toggleGroup(id) {
            if (toggled.has(id)) toggled.delete(id);
            else toggled.add(id);
            refreshGroups();
          },
          chooser() {
            if (chooser) return;
            chooser = ui.openColumnChooser([...catalog.values()], {
              columns: () => columnSpecsOnly().map((c) => ({ key: c.key, title: c.title })),
              add: addColumn,
              remove: removeColumn,
              step(key, delta) {
                moveColumn(key, columns.findIndex((c) => c.key === key) + delta);
              },
              close() {
                chooser = null;
              },
            });
          },
        };

        /**
         * Applies a table state (configuration part; TASK-007 loads it): { columns [{ key, width }], sort,
         * columnFilters [{ key, type, values | min, max }] }; filters and sort on keys that are no column are skipped.
         */
        function setTableState(state) {
          closePopup();
          columns = normaliseColumns(state && state.columns ? state.columns : DEFAULT_COLUMNS, catalog);
          const keys = new Set(columns.map((c) => c.key));
          sort = state && state.sort && keys.has(state.sort.key) ? { key: state.sort.key, dir: state.sort.dir === "desc" ? "desc" : "asc" } : null;
          columnFilters.clear();
          for (const f of (state && state.columnFilters) || []) {
            if (!f || !keys.has(f.key)) continue;
            if (f.type === "range") {
              const min = typeof f.min === "number" && Number.isFinite(f.min) ? f.min : null;
              const max = typeof f.max === "number" && Number.isFinite(f.max) ? f.max : null;
              if (min !== null || max !== null) columnFilters.set(f.key, { type: "range", min, max });
            } else if (Array.isArray(f.values) && f.values.length)
              columnFilters.set(f.key, { type: "values", values: f.values.slice() });
          }
