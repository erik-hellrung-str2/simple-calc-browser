          total: { count: list.length, cells: groupCells(store.rows, list, columns, false) },
        };
      }

      /**
       * Rows shown by the grouping view (REQ-006, REQ-008 export order): every level-1 group; under an expanded group
       * its level-2 groups, or its elements when it is the last level. isExpanded(group) decides. Returns
       * [{ type: 'group', group } | { type: 'element', index (row index), depth (1 | 2), parent (group) }].
       */
      export function groupDisplayRows(tree, isExpanded) {
        const out = [];
        const visit = (groups) => {
          for (const group of groups) {
            out.push({ type: "group", group });
            if (!isExpanded(group)) continue;
            if (group.children) visit(group.children);
            else for (const index of group.indices) out.push({ type: "element", index, depth: group.level, parent: group });
          }
        };
        if (tree) visit(tree.groups);
        return out;
      }

      /** Every group of a tree (both levels), depth first. */
      export function allGroups(tree) {
        const out = [];
        const visit = (groups) => {
          for (const g of groups) {
            out.push(g);
            if (g.children) visit(g.children);
          }
        };
        if (tree) visit(tree.groups);
        return out;
      }

      /**
       * Groups of a tree that contain the row with this index (REQ-007-AC2: expand them for a selected element), depth
       * first: each level-1 group with the row, followed by its level-2 groups with the row. A row with several values
       * of a grouping property (DEC-16) is in several groups of a level.
       */
      export function groupsOfRow(tree, rowIndex) {
        const out = [];
        const visit = (groups) => {
          for (const g of groups) {
            if (!g.indices.includes(rowIndex)) continue;
            out.push(g);
            if (g.children) visit(g.children);
          }
        };
        if (tree) visit(tree.groups);
        return out;
      }

      /**
       * Grouping state of the table (configuration part, REQ-009 "table view, grouping properties"; saved by TASK-007):
       * { view: 'single' | 'grouped', groupBy: [key1, key2?] }; duplicate, empty and (with a catalogue) unknown keys are
       * dropped, at most GROUP_LEVELS keys.
       */
      export function normaliseGrouping(state, catalog) {
        const view = state && state.view === "grouped" ? "grouped" : "single";
        const groupBy = [];
        for (const key of (state && Array.isArray(state.groupBy) ? state.groupBy : []).slice()) {
          if (typeof key !== "string" || key === "" || groupBy.includes(key)) continue;
          if (catalog && catalog.size && !catalog.has(key)) continue;
          if (groupBy.length < GROUP_LEVELS) groupBy.push(key);
        }
        return { view, groupBy };
      }

      // ---------------------------------------------------------------------------------------------------------
      // Header and configuration (TASK-007; REQ-011 title / date / logo, REQ-009 save and load, spec 4.3)
      // ---------------------------------------------------------------------------------------------------------

      /** Schema name of a configuration file; the full value is "calc-viewer-config/<version>" (REQ-009). */
      export const CONFIG_SCHEMA = "calc-viewer-config";
      export const CONFIG_VERSION = 1;
      /** Largest configuration file that is read at all (bytes; larger -> too-large, view unchanged). */
      export const CONFIG_MAX_BYTES = 20 * 1024 * 1024;
      /** Largest logo image file (bytes; REQ-011 "embedded": it travels in every configuration and viewer file). */
      export const LOGO_MAX_BYTES = 1024 * 1024;
      /** Longest title kept (characters). */
      export const TITLE_MAX_LENGTH = 200;
      /** At most this many entries per list in the load notice; the rest is counted ("und n weitere"). */
      export const NOTICE_LIST_LIMIT = 20;
      export const CONFIG_ERROR_CLASSES = ["invalid-json", "not-a-config", "unsupported-version", "too-large"];

      /** A configuration load error (REQ-009) with its class and German message. */
      export class ConfigError extends Error {
        constructor(configClass, detail) {
          super(configErrorMessage(configClass, detail));
          this.name = "ConfigError";
          this.configClass = configClass;
          this.detail = detail === undefined ? null : detail;
        }
      }

      /** German message of a configuration load error class (REQ-009); detail: the version for unsupported-version. */
      export function configErrorMessage(configClass, detail) {
        switch (configClass) {
          case "invalid-json":
            return "Die Datei ist kein g\u00fcltiges JSON.";
          case "not-a-config":
            return "Die Datei ist keine Calc-Viewer-Konfiguration.";
          case "unsupported-version":
            return "Konfigurationsversion " + detail + " wird nicht unterst\u00fctzt.";
          case "too-large":
            return (
              "Die Datei ist zu gro\u00df f\u00fcr eine Konfiguration (h\u00f6chstens " +
              formatBytes(CONFIG_MAX_BYTES) +
              ")."
            );
          default:
            return "Die Konfiguration konnte nicht geladen werden.";
        }
      }

      /** File size in German: "512 Bytes", "12 KB", "1,5 MB" (1 KB = 1024 bytes). */
      export function formatBytes(bytes) {
        if (bytes < 1024) return bytes + " Bytes";
        if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
        const mb = bytes / (1024 * 1024);
        return mb.toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " MB";
      }

      const isPlainObject = (x) => x !== null && typeof x === "object" && !Array.isArray(x);

      /**
       * Checks the schema of a parsed configuration (REQ-009): null when it is a supported configuration, else
       * { configClass, detail }. Missing or foreign schema (or no JSON object) -> not-a-config;
       * "calc-viewer-config/<n>" with n other than CONFIG_VERSION -> unsupported-version (n shown, at most 20 chars).
       */
      export function validateConfig(config) {
        if (!isPlainObject(config) || typeof config.schema !== "string") return { configClass: "not-a-config" };
        const prefix = CONFIG_SCHEMA + "/";
        if (config.schema.indexOf(prefix) !== 0 || config.schema.length === prefix.length)
          return { configClass: "not-a-config" };
        const version = config.schema.slice(prefix.length);
        if (version !== String(CONFIG_VERSION))
          return {
            configClass: "unsupported-version",
            detail: version.length > 20 ? version.slice(0, 20) + "\u2026" : version,
          };
        return null;
      }

      /** Parses the text of a configuration file; throws ConfigError (invalid-json, not-a-config, unsupported-version). */
      export function parseConfig(text) {
        let config;
        try {
          config = JSON.parse(String(text).replace(/^\ufeff/, ""));
        } catch {
          throw new ConfigError("invalid-json");
        }
        const problem = validateConfig(config);
        if (problem) throw new ConfigError(problem.configClass, problem.detail);
        return config;
      }

      const DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;

      /** True for an existing calendar date "YYYY-MM-DD" (years 1000..9999). */
      export function isIsoDate(text) {
        const m = typeof text === "string" ? DATE_RE.exec(text) : null;
        if (!m) return false;
        const y = Number(m[1]);
        const mo = Number(m[2]);
        const d = Number(m[3]);
        if (y < 1000 || mo < 1 || mo > 12 || d < 1) return false;
        return d <= new Date(Date.UTC(y, mo, 0)).getUTCDate();
      }

      /** Local calendar date of a Date as "YYYY-MM-DD" (REQ-011 default date: today). */
      export function isoDate(date) {
        const pad = (n) => String(n).padStart(2, "0");
        return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
      }

      /** "YYYY-MM-DD" shown in German as the UI shows dates ("12.8.2026", de-DE); other text unchanged. */
      export function germanDate(iso) {
        if (!isIsoDate(iso)) return String(iso || "");
        const [y, m, d] = iso.split("-").map(Number);
        return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("de-DE", { timeZone: "UTC" });
      }

      /**
       * Export file name (REQ-008, REQ-011): "<title>_<date><suffix>"; the characters \ / : * ? " < > | and control
       * characters of the title become "_", an empty title (after trimming) becomes "Export".
       */
      export function safeFileName(title, date, suffix) {
        // eslint-disable-next-line no-control-regex
        const clean = String(title === null || title === undefined ? "" : title).replace(/[\\/:*?"<>|\u0000-\u001f\u007f]/g, "_");
        const base = clean.trim() === "" ? "Export" : clean;
        return base + "_" + date + (suffix || "");
      }

      const LOGO_MIMES = ["image/png", "image/jpeg", "image/svg+xml"];
      const LOGO_DATA_RE = /^data:(image\/png|image\/jpeg|image\/svg\+xml);base64,([A-Za-z0-9+/]*={0,2})$/;

      /**
       * Checks a logo image file before it is read (REQ-011: PNG, JPG or SVG, embedded; at most LOGO_MAX_BYTES).
       * head: the first bytes of the file (Uint8Array or array of byte values; 4096 are enough for SVG). Returns
       * { mime } or { error } (German). The type is taken from the content (PNG / JPEG signature, or an <svg element
       * for SVG), not from the file name.
       */
      export function classifyLogo(fileName, size, head) {
        const bytes = head || [];
        const starts = (sig) => bytes.length >= sig.length && sig.every((b, i) => bytes[i] === b);
        if (size > LOGO_MAX_BYTES)
          return {
            error:
              "Das Logo " +
              fileName +
              " ist zu gro\u00df (" +
              formatBytes(size) +
              "). Erlaubt sind h\u00f6chstens " +
              formatBytes(LOGO_MAX_BYTES) +
              ".",
          };
        if (size > 0 && starts([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a])) return { mime: "image/png" };
        if (size > 0 && starts([0xff, 0xd8, 0xff])) return { mime: "image/jpeg" };
        let text = "";
        for (let i = 0; i < Math.min(bytes.length, 4096); i++) text += String.fromCharCode(bytes[i]);
        if (size > 0 && /<svg[\s>]/i.test(text)) return { mime: "image/svg+xml" };
        return { error: fileName + " ist kein PNG-, JPG- oder SVG-Bild." };
      }

      /** True for a logo data URL as the builder embeds it: PNG / JPG / SVG, base64, at most LOGO_MAX_BYTES decoded. */
      export function isLogoDataUrl(text) {
        if (typeof text !== "string") return false;
        const m = LOGO_DATA_RE.exec(text);
        if (!m || !LOGO_MIMES.includes(m[1]) || m[2].length === 0 || m[2].length % 4 !== 0) return false;
        const padding = m[2].endsWith("==") ? 2 : m[2].endsWith("=") ? 1 : 0;
        return (m[2].length / 4) * 3 - padding <= LOGO_MAX_BYTES;
      }

      /** A filter value as saved: text or finite number; null is the empty value `(leer)`. */
      const configValue = (v) => v === null || typeof v === "string" || (typeof v === "number" && Number.isFinite(v));

      /** Smallest length of a section-plane normal (DEC-20 field table: length <= 1e-6 is invalid). */
      export const SECTION_NORMAL_MIN = 1e-6;
      const AXIS_INDEX = { X: 0, Y: 1, Z: 2 };

      /**
       * The section plane of a 1.0.0 axis section (DEC-20 `display.section`): { axis 'X' | 'Y' | 'Z', offset, flipped }
       * -> { point, normal } in the scene frame of spec 4.4 (Z up, IFC axes): point = 0 except the axis component =
       * offset; normal = -axis (not flipped: the part with coordinate <= offset is kept) or +axis (flipped). null for
       * anything else.
       */
      export function planeFromAxisSection(section) {
        if (!isPlainObject(section) || !Object.prototype.hasOwnProperty.call(AXIS_INDEX, section.axis)) return null;
        if (typeof section.offset !== "number" || !Number.isFinite(section.offset)) return null;
        const i = AXIS_INDEX[section.axis];
        const point = [0, 0, 0];
        const normal = [0, 0, 0];
        point[i] = section.offset;
        normal[i] = section.flipped === true ? 1 : -1;
        return { point, normal };
      }

      /**
       * A valid section plane (DEC-20 `display.sectionPlane`) { point [x, y, z], normal [x, y, z] } with a unit normal,
       * or null: point and normal must be three finite numbers each and the normal longer than SECTION_NORMAL_MIN. A
       * non-unit normal is normalised; a normal already of unit length (within 1e-12) is kept bit for bit, so saving a
       * loaded plane gives the same JSON (REQ-009-AC1).
       */
      export function normaliseSectionPlane(plane) {
        if (!isPlainObject(plane)) return null;
        const vector = (v) =>
          Array.isArray(v) && v.length === 3 && v.every((x) => typeof x === "number" && Number.isFinite(x));
        if (!vector(plane.point) || !vector(plane.normal)) return null;
        const length = Math.hypot(plane.normal[0], plane.normal[1], plane.normal[2]);
        if (!(length > SECTION_NORMAL_MIN)) return null;
        const unit = Math.abs(length - 1) <= 1e-12;
        return {
          point: plane.point.map((x) => x + 0), // + 0 turns -0 into 0
          normal: plane.normal.map((x) => (unit ? x : x / length) + 0),
        };
      }

      /**
       * The configuration object saved by `Konfiguration speichern` (REQ-009, DEC-20), from the current state:
       * { header { title, date, logo }, filterSets [{ key, collapsed, selected }], filterRules [{ mode, key, op,
       * value }], search, table { view, groupBy, columns [{ key, width }], sort, columnFilters }, display { mode,
       * colourBy, colourMode, scaleColour, sectionPlane } }. Fixed field order, so equal states give equal JSON text.
       * state.filterRules: the rules in order (invalid ones are left out; a `text` rule is written with key null);
       * state.search: the search text; state.display: { mode, colourKey, colourMode, scaleColour, section } where
       * section is a plane { point, normal } or a 1.0.0 axis section { axis, offset, flipped } (converted,
       * planeFromAxisSection). `display.section` and hidden / isolated elements are never written (DEC-20). The
       * expanded state of groups, the selection and the models are not part of it.
       */
      export function buildConfig(state) {
        const header = state.header || {};
        const table = state.table || {};
        const grouping = state.grouping || {};
        const display = state.display || {};
        const section = display.section;
        let plane = null;
        if (section) plane = "axis" in section ? planeFromAxisSection(section) : normaliseSectionPlane(section);
        const rules = [];
        for (const rule of state.filterRules || []) {
          const valid = normaliseRule(rule);
          if (valid) rules.push({ mode: valid.mode, key: valid.key, op: valid.op, value: valid.value });
        }
        return {
          schema: CONFIG_SCHEMA + "/" + CONFIG_VERSION,
          header: {
            title: typeof header.title === "string" ? header.title : "",
            date: header.date,
            logo: header.logo || null,
          },
          filterSets: (state.filterSets || []).map((s) => ({
            key: s.key,
            collapsed: Boolean(s.collapsed),
            selected: (s.selected || []).map((v) => (v === undefined ? null : v)),
          })),
          filterRules: rules,
          search: typeof state.search === "string" ? state.search : "",
          table: {
            view: grouping.view === "grouped" ? "grouped" : "single",
            groupBy: (grouping.groupBy || []).slice(),
            columns: (table.columns || []).map((c) => ({ key: c.key, width: c.width })),
            sort: table.sort ? { key: table.sort.key, dir: table.sort.dir } : null,
            columnFilters: (table.columnFilters || []).map((f) =>
              f.type === "range"
                ? { key: f.key, type: "range", min: f.min, max: f.max }
                : { key: f.key, type: "values", values: f.values.map((v) => (v === undefined ? null : v)) },
            ),
          },
          display: {
            mode: display.mode === "hide" ? "hide" : "ghost",
            colourBy: display.colourKey || null,
            colourMode: display.colourMode === "scale" ? "scale" : DEFAULT_COLOUR_MODE,
            scaleColour: normaliseHexColour(display.scaleColour) || DEFAULT_SCALE_COLOUR,
            sectionPlane: plane,
          },
        };
      }

      // known fields per object; display.section is the 1.0.0 axis section (read and converted, never written)
      const CONFIG_FIELDS = {
        "": ["schema", "header", "filterSets", "filterRules", "search", "table", "display"],
        header: ["title", "date", "logo"],
        table: ["view", "groupBy", "columns", "sort", "columnFilters"],
        display: ["mode", "colourBy", "colourMode", "scaleColour", "sectionPlane", "section"],
      };

      /**
       * Tolerant apply of a parsed, valid configuration to the loaded models (REQ-009, REQ-009-AC2, DEC-20). ctx:
       * { has(key) -> property in the loaded models, hasValue(key, value) -> some element has that value (null = an
       * empty one), columns (current column keys, used when the file has no columns), isNumber(key) (optional: true
       * for a numeric column; a range column filter on another column is reported as invalid and skipped; also decides
       * the colourMode default), hasGeometry() (optional: false while no model with geometry is loaded; a section plane
       * is then skipped and named `Schnitt`) }.
       * Returns { apply, skipped }. apply holds the parts the file defines (a missing part keeps the current state):
       * header { title?, date?, logo? }, filterSets, table { view?, groupBy?, columns?, sort?, columnFilters? },
       * display { mode?, colourBy?, colourMode, scaleColour, sectionPlane? } (display only when the file has one);
       * apply.filterRules ([{ mode, key, op, value }] in file order) and apply.search (text) are always set, since an
       * absent field clears them (DEC-20 field table). skipped lists what is not applied: properties (keys missing
       * from the loaded models), values ([{ key, value }] filter values no element has), invalid (German names of
       * malformed entries, the labels of the DEC-20 field table for the CR-002 fields) and unknown (unknown field
       * names). "" in a saved selection is the empty value null (TASK-003 D3).
       */
      export function applyConfig(config, ctx) {
        const skipped = { properties: [], values: [], invalid: [], unknown: [] };
        // Sets next to the lists keep the apply linear in the file size (CONFIG_MAX_BYTES protects the tab; a list
        // lookup per entry was quadratic: 160,000 missing keys took 17 s, verification INC-1 CODE F2)
        const missingSeen = new Set();
        const invalidSeen = new Set();
        const missing = (key) => {
          if (missingSeen.has(key)) return;
          missingSeen.add(key);
          skipped.properties.push(key);
        };
        const invalid = (what) => {
          if (invalidSeen.has(what)) return;
          invalidSeen.add(what);
          skipped.invalid.push(what);
        };
        const unknownFields = (obj, path) => {
          if (!isPlainObject(obj)) return;
          for (const name of Object.keys(obj))
            if (!CONFIG_FIELDS[path].includes(name)) skipped.unknown.push(path ? path + "." + name : name);
        };
        const has = (key) => typeof key === "string" && key !== "" && ctx.has(key);
        const skippedValues = new Map(); // key -> Set of values already in skipped.values (linear in the values)
        /** The values of a saved selection that the loaded models have; the rest goes to skipped.values. */
        const selection = (key, values, what) => {
          const out = [];
          if (!Array.isArray(values)) {
            if (values !== undefined) invalid(what);
            return out;
          }
          const seen = new Set();
          if (!skippedValues.has(key)) skippedValues.set(key, new Set());
          const skippedOfKey = skippedValues.get(key);
          for (const raw of values) {
            const value = raw === "" ? null : raw;
            if (!configValue(value)) {
              invalid(what);
              continue;
            }
            if (seen.has(value)) continue;
            seen.add(value);
            if (ctx.hasValue(key, value)) out.push(value);
            else if (!skippedOfKey.has(value)) {
              skippedOfKey.add(value);
              skipped.values.push({ key, value });
            }
          }
          return out;
        };
        const apply = {};
        unknownFields(config, "");

        // header (REQ-011)
        if (config.header !== undefined) {
          const header = {};
          if (!isPlainObject(config.header)) invalid("Kopfzeile");
          else {
            unknownFields(config.header, "header");
            const h = config.header;
            if (typeof h.title === "string") header.title = h.title.slice(0, TITLE_MAX_LENGTH);
            else if (h.title !== undefined) invalid("Titel");
            if (isIsoDate(h.date)) header.date = h.date;
            else if (h.date !== undefined) invalid("Datum");
            if (h.logo === null || isLogoDataUrl(h.logo)) header.logo = h.logo;
            else if (h.logo !== undefined) invalid("Logo");
          }
          apply.header = header;
        }

        // filter sets: keys in order, collapsed state, checked values (REQ-003-AC2, REQ-004)
        if (config.filterSets !== undefined) {
          if (!Array.isArray(config.filterSets)) invalid("Filters\u00e4tze");
          else {
            apply.filterSets = [];
            const appliedSets = new Set();
            for (const s of config.filterSets) {
              if (!isPlainObject(s) || typeof s.key !== "string" || s.key === "") {
                invalid("Filters\u00e4tze");
                continue;
              }
              if (appliedSets.has(s.key)) continue;
              if (!has(s.key)) {
                missing(s.key);
                continue;
              }
              if (s.collapsed !== undefined && typeof s.collapsed !== "boolean") invalid("Filtersatz " + s.key);
              appliedSets.add(s.key);
              apply.filterSets.push({
                key: s.key,
                collapsed: s.collapsed === true,
                selected: selection(s.key, s.selected, "Filtersatz " + s.key),
              });
            }
          }
        }

        // filter rules and search text (REQ-012, DEC-20): absent = none, so active ones are cleared
        apply.filterRules = [];
        if (config.filterRules !== undefined) {
          if (!Array.isArray(config.filterRules)) invalid("Filterregeln");
          else
            for (const raw of config.filterRules) {
              const rule = normaliseRule(raw);
              if (!rule) invalid("Filterregel");
              else if (rule.key !== null && !has(rule.key)) missing(rule.key);
              else apply.filterRules.push({ mode: rule.mode, key: rule.key, op: rule.op, value: rule.value });
            }
        }
        apply.search = "";
        if (typeof config.search === "string") apply.search = config.search;
        else if (config.search !== undefined) invalid("Suche");

        // table: view, grouping, columns, sort, column filters (REQ-006-AC6, REQ-009)
        if (config.table !== undefined) {
          const table = {};
          if (!isPlainObject(config.table)) invalid("Tabelle");
          else {
            const t = config.table;
            unknownFields(t, "table");
            if (t.view === "single" || t.view === "grouped") table.view = t.view;
            else if (t.view !== undefined) invalid("Tabellenansicht");
            if (Array.isArray(t.groupBy)) {
              table.groupBy = [];
              for (const key of t.groupBy) {
                if (typeof key !== "string" || key === "") invalid("Gruppierung");
                else if (!has(key)) missing(key);
                else if (table.groupBy.includes(key)) continue;
                else if (table.groupBy.length < GROUP_LEVELS) table.groupBy.push(key);
                else invalid("Gruppierung " + key + " (h\u00f6chstens " + GROUP_LEVELS + " Ebenen)"); // TASK-007 C2
              }
            } else if (t.groupBy !== undefined) invalid("Gruppierung");
            if (Array.isArray(t.columns)) {
              const list = [];
              for (const c of t.columns) {
                const key = typeof c === "string" ? c : isPlainObject(c) ? c.key : undefined;
                if (typeof key !== "string" || key === "") invalid("Spalten");
                else if (!has(key)) missing(key);
                else list.push(c);
              }
              table.columns = normaliseColumns(list, null);
            } else if (t.columns !== undefined) invalid("Spalten");
            const columnKeys = new Set(table.columns ? table.columns.map((c) => c.key) : ctx.columns || []);
            if (t.sort === null) table.sort = null;
            else if (isPlainObject(t.sort) && typeof t.sort.key === "string" && (t.sort.dir === "asc" || t.sort.dir === "desc")) {
              if (!has(t.sort.key)) missing(t.sort.key);
              else if (!columnKeys.has(t.sort.key)) invalid("Sortierung");
              else table.sort = { key: t.sort.key, dir: t.sort.dir };
            } else if (t.sort !== undefined) invalid("Sortierung");
            if (Array.isArray(t.columnFilters)) {
              table.columnFilters = [];
              const appliedFilters = new Set();
              for (const f of t.columnFilters) {
                if (!isPlainObject(f) || typeof f.key !== "string" || f.key === "") {
                  invalid("Spaltenfilter");
                  continue;
                }
                const what = "Spaltenfilter " + f.key;
                if (appliedFilters.has(f.key)) continue;
                if (!has(f.key)) {
                  missing(f.key);
                  continue;
                }
                if (!columnKeys.has(f.key)) {
                  invalid(what);
                  continue;
                }
                if (f.type === "range" && ctx.isNumber && !ctx.isNumber(f.key)) {
                  invalid(what + " (Bereich auf einer Textspalte)"); // TASK-007 C1
                } else if (f.type === "range") {
                  const bound = (b) => (b === null || b === undefined ? null : typeof b === "number" && Number.isFinite(b) ? b : undefined);
                  const min = bound(f.min);
                  const max = bound(f.max);
                  if (min === undefined || max === undefined || (min === null && max === null)) invalid(what);
                  else {
                    appliedFilters.add(f.key);
                    table.columnFilters.push({ key: f.key, type: "range", min, max });
                  }
                } else if (f.type === "values") {
                  const values = selection(f.key, f.values, what);
                  if (values.length) {
                    appliedFilters.add(f.key);
                    table.columnFilters.push({ key: f.key, type: "values", values });
                  }
                } else invalid(what);
              }
            } else if (t.columnFilters !== undefined) invalid("Spaltenfilter");
          }
          apply.table = table;
        }

        // model display: ghost / hide, colouring property, mode and scale colour, section plane (REQ-005, REQ-009,
        // DEC-20 field table)
        if (config.display !== undefined) {
          const display = {};
          if (!isPlainObject(config.display)) invalid("Modelldarstellung");
          else {
            const d = config.display;
            unknownFields(d, "display");
            if (d.mode === "ghost" || d.mode === "hide") display.mode = d.mode;
            else if (d.mode !== undefined) invalid("Elemente au\u00dferhalb des Filters");
            if (d.colourBy === null) display.colourBy = null;
            else if (typeof d.colourBy === "string" && d.colourBy !== "") {
              if (has(d.colourBy)) display.colourBy = d.colourBy;
              else missing(d.colourBy);
            } else if (d.colourBy !== undefined) invalid("F\u00e4rben nach");
            // colouring mode and scale colour; absent (or invalid = treated as absent): the 1.0.0 look, i.e. Farbskala
            // in Blau for a numeric colouring property, else Unterschiedliche Farben
            let colourMode = d.colourMode;
            if (colourMode !== undefined && colourMode !== "distinct" && colourMode !== "scale") {
              invalid("Farbmodus");
              colourMode = undefined;
            }
            let scaleColour = d.scaleColour;
            if (scaleColour !== undefined) {
              scaleColour = normaliseHexColour(scaleColour);
              if (!scaleColour) {
                invalid("Skalenfarbe");
                scaleColour = undefined;
              }
            }
            const numericColour =
              typeof display.colourBy === "string" && Boolean(ctx.isNumber && ctx.isNumber(display.colourBy));
            display.colourMode = colourMode !== undefined ? colourMode : numericColour ? "scale" : "distinct";
            if (scaleColour !== undefined) display.scaleColour = scaleColour;
            else display.scaleColour = colourMode === undefined ? LEGACY_SCALE_COLOUR : DEFAULT_SCALE_COLOUR;
            // section plane; a 1.0.0 axis section is converted and only read when sectionPlane is absent
            let plane; // undefined = keep the current section
            if (d.sectionPlane !== undefined) {
              if (d.sectionPlane === null) plane = null;
              else {
                plane = normaliseSectionPlane(d.sectionPlane);
                if (!plane) {
                  invalid("Schnitt");
                  plane = undefined;
                }
              }
            } else if (d.section !== undefined) {
              const s = d.section;
              if (s === null) plane = null;
              else if (
                isPlainObject(s) &&
                (s.axis === "X" || s.axis === "Y" || s.axis === "Z") &&
                typeof s.offset === "number" &&
                Number.isFinite(s.offset) &&
                (s.flipped === undefined || typeof s.flipped === "boolean")
              )
                plane = planeFromAxisSection(s);
              else invalid("Schnitt");
            } else plane = null;
            if (plane && ctx.hasGeometry && !ctx.hasGeometry()) invalid("Schnitt");
            else if (plane !== undefined) display.sectionPlane = plane;
          }
          apply.display = display;
        }
        return { apply, skipped };
      }

      /** True when applyConfig skipped anything (the notice is shown). */
      export function configSkippedAnything(skipped) {
        return Boolean(
          skipped.properties.length || skipped.values.length || skipped.invalid.length || skipped.unknown.length,
        );
      }

      /**
       * German notice of a tolerant load (REQ-009-AC2): the properties and filter values missing from the loaded
       * models, malformed and unknown entries; each list capped at NOTICE_LIST_LIMIT ("und n weitere").
       * label(key) gives the property label for values (filter set / column title). null when nothing was skipped.
       */
      export function configNotice(skipped, label) {
        if (!configSkippedAnything(skipped)) return null;
        const name = label || ((key) => key);
        const list = (items) => {
          const shown = items.slice(0, NOTICE_LIST_LIMIT).join("; ");
          const more = items.length - NOTICE_LIST_LIMIT;
          return more > 0 ? shown + " und " + more.toLocaleString("de-DE") + " weitere" : shown;
        };
        const valueText = (v) =>
          v === null ? EMPTY_LABEL : typeof v === "number" ? v.toLocaleString("de-DE", { maximumFractionDigits: 3 }) : v;
        const lines = ["Konfiguration geladen. Nicht angewendet:"];
        if (skipped.properties.length)
          lines.push("Eigenschaften, die in den geladenen Modellen fehlen: " + list(skipped.properties) + ".");
        if (skipped.values.length)
          lines.push(
            "Filterwerte, die in den geladenen Modellen fehlen: " +
              list(skipped.values.map((s) => name(s.key) + " = " + valueText(s.value))) +
              ".",
          );
        if (skipped.invalid.length) lines.push("Ung\u00fcltige Angaben: " + list(skipped.invalid) + ".");
        if (skipped.unknown.length) lines.push("Unbekannte Angaben: " + list(skipped.unknown) + ".");
        return lines.join("\n");
      }

      // ---------------------------------------------------------------------------------------------------------
      // Export (TASK-008; REQ-008 CSV and Excel, DEC-6, NFR-004; spec 4.1 own writers, no libraries)
      // ---------------------------------------------------------------------------------------------------------

      /** `Ebene` values of the grouping-view export (REQ-008). */
      export const EXPORT_LEVELS = { element: "Element", total: "Summe" };

      /** Sheet name of the Excel export (REQ-008). */
      export const XLSX_SHEET_NAME = "Tabelle";

      /** Longest text an Excel cell holds (Excel specification); longer texts are cut in the .xlsx only. */
      export const XLSX_MAX_TEXT = 32767;

      /** Column width bounds of the Excel export in characters (fitted to the longest cell text). */
      export const XLSX_WIDTH = { min: 8, max: 80 };

      /** Rows per step of the writers: after each step options.pause(fraction) is awaited (progress, NFR-004). */
      export const EXPORT_STEP_ROWS = 2000;

      /**
       * A number as text without rounding and without exponent notation (REQ-008 "numbers unrounded (shortest
       * round-trip representation), no exponent notation"), decimal point: 1e-7 -> "0.0000001", 2.5e21 ->
       * "2500000000000000000000", -0 -> "0".
       */
      export function plainNumber(n) {
        if (n === 0) return "0";
        const s = String(n);
        const m = /^(-?)(\d)(?:\.(\d+))?e([+-]\d+)$/.exec(s);
        if (!m) return s;
        const sign = m[1];
        const digits = m[2] + (m[3] || "");
        const exp = Number(m[4]);
        if (exp < 0) return sign + "0." + "0".repeat(-exp - 1) + digits;
        const point = exp + 1;
        if (digits.length <= point) return sign + digits + "0".repeat(point - digits.length);
        return sign + digits.slice(0, point) + "." + digits.slice(point);
      }

      /** A number in German notation for the export: plainNumber with a decimal comma, no thousands separator. */
      export function germanPlainNumber(n) {
        return plainNumber(n).replace(".", ",");
      }

      /**
       * Export value of a table cell: a finite number stays a number, multi-values are joined with ", " (numbers in
       * them in German notation, as displayed), other values as text; empty values (isEmptyValue) are null.
       */
      export function exportValue(value) {
        if (isEmptyValue(value)) return null;
        if (typeof value === "number") return value;
        if (Array.isArray(value)) {
          const parts = [];
          for (const v of value) if (!isEmptyValue(v)) parts.push(typeof v === "number" ? germanPlainNumber(v) : String(v));
          return parts.length ? parts.join(", ") : null;
        }
        return String(value);
      }

      /**
       * The rows the table shows, as an export sheet (REQ-008). input: { rows (element rows, spec 4.3), columns
       * [{ key, title }] (visible columns in their order; title = header with unit), view 'single' | 'grouped',
       * order (single view: row indices in table order), items (grouping view: groupDisplayRows result), total
       * (grouping view: groupRows(...).total) }.
       * Returns { headers [title], rows [[cell]] (cell: number | string | null), bold [boolean] (group and total
       * rows), total (true when the last row is the total row) }. The grouping view starts with `Ebene` (`1`, `2`,
       * `Element`, `Summe`), `Gruppe` (group value, "(leer)" for the empty group; empty on element and total rows)
       * and `Anzahl` (empty on element rows), followed by the columns (sums / common values on group rows, sums on the
       * total row, values on element rows); the total row is last.
       */
      export function exportSheet(input) {
        const rows = input.rows || [];
        const columns = input.columns || [];
        const keys = columns.map((c) => c.key);
        const cellsOf = (values) => keys.map((key) => exportValue(values[key]));
        const out = { headers: columns.map((c) => c.title), rows: [], bold: [], total: false };
        if (input.view !== "grouped") {
          for (const i of input.order || []) {
            out.rows.push(cellsOf(rows[i].values));
            out.bold.push(false);
          }
          return out;
        }
        out.headers = ["Ebene", "Gruppe", "Anzahl"].concat(out.headers);
        for (const item of input.items || []) {
          if (item.type === "group") {
            const g = item.group;
            const label = g.value === null || g.value === undefined ? EMPTY_LABEL : exportValue(g.value);
            out.rows.push([String(g.level), label, g.count].concat(cellsOf(g.cells)));
            out.bold.push(true);
          } else {
            out.rows.push([EXPORT_LEVELS.element, null, null].concat(cellsOf(rows[item.index].values)));
            out.bold.push(false);
          }
        }
        const total = input.total || { count: 0, cells: {} };
        out.rows.push([EXPORT_LEVELS.total, null, total.count].concat(cellsOf(total.cells || {})));
        out.bold.push(true);
        out.total = true;
        return out;
      }

      /**
       * One CSV field (REQ-008, RFC 4180, DEC-6): numbers with a decimal comma; a text starting with = + - @ gets a
       * leading "'" (formula injection); a field with ; " CR or LF is quoted, quotes doubled; null is empty.
       */
      export function csvField(value) {
        if (value === null || value === undefined) return "";
        if (typeof value === "number") return germanPlainNumber(value);
        let s = String(value);
        if (/^[=+\-@]/.test(s)) s = "'" + s;
        return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }

      /**
       * CSV text of an export sheet (REQ-008): UTF-8 BOM (as U+FEFF; the download encodes UTF-8), separator ";",
       * CRLF after every record, header row first. options.pause(fraction) is awaited every EXPORT_STEP_ROWS rows.
       */
      export async function toCsv(sheet, options) {
        const pause = options && options.pause;
        const parts = ["\ufeff" + sheet.headers.map(csvField).join(";") + "\r\n"];
        const n = sheet.rows.length;
        for (let start = 0; start < n; start += EXPORT_STEP_ROWS) {
          const end = Math.min(n, start + EXPORT_STEP_ROWS);
          let chunk = "";
          for (let r = start; r < end; r++) {
            const row = sheet.rows[r];
            let line = "";
            for (let c = 0; c < row.length; c++) line += (c ? ";" : "") + csvField(row[c]);
            chunk += line + "\r\n";
          }
          parts.push(chunk);
          if (pause) await pause(end / n);
        }
        return parts.join("");
      }

      /** Spreadsheet column name of a 0-based index: 0 -> A, 25 -> Z, 26 -> AA. */
      export function columnName(index) {
        let name = "";
        for (let n = index + 1; n > 0; n = Math.floor((n - 1) / 26)) name = String.fromCharCode(65 + ((n - 1) % 26)) + name;
        return name;
      }

      /**
       * Text for XML element content of an .xlsx part: & < > escaped, CR kept as a character reference, characters
       * XML 1.0 forbids (controls other than TAB / LF / CR, U+FFFE / U+FFFF) and a literal "_xHHHH_" written in the
       * OOXML escape form _xHHHH_ (Excel reads them back as the original characters).
       */
      export function xmlText(text) {
        return (
          String(text)
            .replace(/_(x[0-9A-Fa-f]{4}_)/g, "_x005F_$1")
            // eslint-disable-next-line no-control-regex
            .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\ufffe\uffff]/g, (c) => "_x" + c.charCodeAt(0).toString(16).toUpperCase().padStart(4, "0") + "_")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\r/g, "&#13;")
        );
      }

      const CRC_TABLE = (() => {
        const table = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          table[n] = c >>> 0;
        }
        return table;
      })();

      /** CRC-32 (ZIP) of bytes, continuing from crc (0 to start). */
      export function crc32(bytes, crc) {
        let c = (crc === undefined ? 0 : crc) ^ 0xffffffff;
        for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
        return (c ^ 0xffffffff) >>> 0;
      }

      /** Raw deflate of byte chunks with CompressionStream('deflate-raw'); null where the runtime has none. */
      async function deflateRaw(chunks) {
        if (typeof CompressionStream !== "function") return null;
        const stream = new Blob(chunks).stream().pipeThrough(new CompressionStream("deflate-raw"));
        return new Uint8Array(await new Response(stream).arrayBuffer());
      }

      /**
       * ZIP archive of entries [{ name, chunks [Uint8Array] }] (spec 4.1: ZIP via CompressionStream('deflate-raw');
       * stored when the runtime has no CompressionStream). Fixed timestamp 1980-01-01 00:00, so equal content gives
       * equal bytes. Returns a Uint8Array.
       */
      export async function zipArchive(entries, pause) {
        const enc = new TextEncoder();
        const parts = [];
        const central = [];
        let offset = 0;
        for (const entry of entries) {
          const name = enc.encode(entry.name);
          let crc = 0;
          let size = 0;
          for (const chunk of entry.chunks) {
            crc = crc32(chunk, crc);
            size += chunk.length;
          }
          if (pause) await pause();
          const deflated = await deflateRaw(entry.chunks);
          const method = deflated ? 8 : 0;
          const data = deflated ? [deflated] : entry.chunks;
          const compressed = deflated ? deflated.length : size;
          const local = new DataView(new ArrayBuffer(30));
          local.setUint32(0, 0x04034b50, true);
          local.setUint16(4, 20, true); // version needed 2.0
          local.setUint16(6, 0x0800, true); // UTF-8 names
          local.setUint16(8, method, true);
          local.setUint16(10, 0, true); // time 00:00
          local.setUint16(12, 0x21, true); // date 1980-01-01
          local.setUint32(14, crc, true);
          local.setUint32(18, compressed, true);
          local.setUint32(22, size, true);
          local.setUint16(26, name.length, true);
          local.setUint16(28, 0, true);
          parts.push(new Uint8Array(local.buffer), name, ...data);
          const dir = new DataView(new ArrayBuffer(46));
          dir.setUint32(0, 0x02014b50, true);
          dir.setUint16(4, 20, true); // made by 2.0 (MS-DOS)
          dir.setUint16(6, 20, true);
          dir.setUint16(8, 0x0800, true);
          dir.setUint16(10, method, true);
          dir.setUint16(12, 0, true);
          dir.setUint16(14, 0x21, true);
          dir.setUint32(16, crc, true);
          dir.setUint32(20, compressed, true);
          dir.setUint32(24, size, true);
          dir.setUint16(28, name.length, true);
          dir.setUint32(42, offset, true);
          central.push(new Uint8Array(dir.buffer), name);
          offset += 30 + name.length + compressed;
        }
        let dirSize = 0;
        for (const c of central) dirSize += c.length;
        const end = new DataView(new ArrayBuffer(22));
        end.setUint32(0, 0x06054b50, true);
        end.setUint16(8, entries.length, true);
        end.setUint16(10, entries.length, true);
        end.setUint32(12, dirSize, true);
        end.setUint32(16, offset, true);
        const all = parts.concat(central, [new Uint8Array(end.buffer)]);
        let length = 0;
        for (const p of all) length += p.length;
        const out = new Uint8Array(length);
        let at = 0;
        for (const p of all) {
          out.set(p, at);
          at += p.length;
        }
        return out;
      }

      const XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
      const NS_MAIN = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
      const NS_REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
      const NS_PKG_REL = "http://schemas.openxmlformats.org/package/2006/relationships";
      const CT = "application/vnd.openxmlformats-officedocument.spreadsheetml.";

      /** Length of a cell text in characters (code points) for the column width. */
      function textWidth(value) {
        if (value === null || value === undefined) return 0;
        const s = typeof value === "number" ? germanPlainNumber(value) : String(value);
        let longest = 0;
        for (const line of s.split("\n")) {
          let n = 0;
          for (let i = 0; i < line.length; i++) {
            const code = line.charCodeAt(i);
            if (code < 0xdc00 || code > 0xdfff) n++;
          }
          if (n > longest) longest = n;
        }
        return longest;
      }

      /**
       * Excel workbook (.xlsx bytes, Uint8Array) of an export sheet (REQ-008, ASM-004): one sheet `Tabelle`, header
       * bold and frozen, autofilter over header and rows (without the total row), numbers as numeric cells, texts as
       * shared strings (a text starting with "=" stays text), column widths fitted, group and total rows bold.
       * options.pause(fraction) is awaited every EXPORT_STEP_ROWS rows and before each compressed part.
       */
      export async function toXlsx(sheet, options) {
        const pause = options && options.pause;
        const enc = new TextEncoder();
        const width = sheet.headers.length;
        const n = sheet.rows.length;
        const strings = new Map();
        const stringList = [];
        const stringIndex = (text) => {
          const s = text.length > XLSX_MAX_TEXT ? text.slice(0, XLSX_MAX_TEXT) : text;
          let i = strings.get(s);
          if (i === undefined) {
            i = stringList.length;
            strings.set(s, i);
            stringList.push(s);
          }
          return i;
        };
        const names = [];
        for (let c = 0; c < width; c++) names.push(columnName(c));
        const widths = sheet.headers.map((h) => textWidth(h) + 3); // bold header and the filter button
        const cell = (ref, value, style) => {
          if (value === null || value === undefined) return "";
          if (typeof value === "number") return '<c r="' + ref + '"' + style + "><v>" + plainNumber(value) + "</v></c>";
          return '<c r="' + ref + '"' + style + ' t="s"><v>' + stringIndex(String(value)) + "</v></c>";
        };
        const rowXml = (r, values, bold) => {
          const style = bold ? ' s="1"' : "";
          let xml = '<row r="' + r + '"' + (bold ? ' s="1" customFormat="1"' : "") + ">";
          for (let c = 0; c < width; c++) {
            const value = values[c];
            xml += cell(names[c] + r, value, style);
            const w = textWidth(value);
            if (w > widths[c]) widths[c] = w;
          }
          return xml + "</row>";
        };
        const body = [];
        body.push(enc.encode(rowXml(1, sheet.headers, true)));
        for (let start = 0; start < n; start += EXPORT_STEP_ROWS) {
          const end = Math.min(n, start + EXPORT_STEP_ROWS);
          let chunk = "";
          for (let r = start; r < end; r++) chunk += rowXml(r + 2, sheet.rows[r], sheet.bold[r]);
          body.push(enc.encode(chunk));
          if (pause) await pause((0.8 * end) / n);
        }
        const last = names.length ? names[width - 1] : "A";
        const filterEnd = Math.max(1, n + 1 - (sheet.total ? 1 : 0));
        const filterRef = "A1:" + last + filterEnd;
        let cols = "";
        if (width) {
          cols = "<cols>";
          for (let c = 0; c < width; c++) {
            const w = Math.min(XLSX_WIDTH.max, Math.max(XLSX_WIDTH.min, widths[c] + 2));
            cols += '<col min="' + (c + 1) + '" max="' + (c + 1) + '" width="' + w + '" customWidth="1"/>';
          }
          cols += "</cols>";
        }
        const sheetHead =
          XML_HEAD +
          '<worksheet xmlns="' + NS_MAIN + '" xmlns:r="' + NS_REL + '">' +
          '<dimension ref="A1' + (width ? ":" + last + (n + 1) : "") + '"/>' +
          '<sheetViews><sheetView tabSelected="1" workbookViewId="0">' +
          '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
          '<selection pane="bottomLeft" activeCell="A2" sqref="A2"/>' +
          "</sheetView></sheetViews>" +
          '<sheetFormatPr defaultRowHeight="15"/>' +
          cols +
          "<sheetData>";
        const sheetTail = "</sheetData>" + (width ? '<autoFilter ref="' + filterRef + '"/>' : "") + "</worksheet>";
        let sst = XML_HEAD + '<sst xmlns="' + NS_MAIN + '" count="' + stringList.length + '" uniqueCount="' + stringList.length + '">';
        const sstParts = [];
        for (let i = 0; i < stringList.length; i++) {
          sst += '<si><t xml:space="preserve">' + xmlText(stringList[i]) + "</t></si>";
          if (sst.length > 1 << 20) {
            sstParts.push(enc.encode(sst));
            sst = "";
          }
        }
        sstParts.push(enc.encode(sst + "</sst>"));
        const sheetName = XLSX_SHEET_NAME;
        const workbook =
          XML_HEAD +
          '<workbook xmlns="' + NS_MAIN + '" xmlns:r="' + NS_REL + '">' +
          '<bookViews><workbookView xWindow="0" yWindow="0" windowWidth="16000" windowHeight="9000"/></bookViews>' +
          '<sheets><sheet name="' + sheetName + '" sheetId="1" r:id="rId1"/></sheets>' +
          (width
            ? '<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">' +
              sheetName + "!$A$1:$" + last + "$" + filterEnd + "</definedName></definedNames>"
            : "") +
          "</workbook>";
        const styles =
          XML_HEAD +
          '<styleSheet xmlns="' + NS_MAIN + '">' +
          '<fonts count="2"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font>' +
          '<font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font></fonts>' +
          '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
          '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
          '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
          '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
          '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>' +
          '<cellStyles count="1"><cellStyle name="Standard" xfId="0" builtinId="0"/></cellStyles>' +
          "</styleSheet>";
        const contentTypes =
          XML_HEAD +
          '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
          '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
          '<Default Extension="xml" ContentType="application/xml"/>' +
          '<Override PartName="/xl/workbook.xml" ContentType="' + CT + 'sheet.main+xml"/>' +
          '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="' + CT + 'worksheet+xml"/>' +
          '<Override PartName="/xl/styles.xml" ContentType="' + CT + 'styles+xml"/>' +
          '<Override PartName="/xl/sharedStrings.xml" ContentType="' + CT + 'sharedStrings+xml"/>' +
          "</Types>";
        const rootRels =
          XML_HEAD +
          '<Relationships xmlns="' + NS_PKG_REL + '">' +
          '<Relationship Id="rId1" Type="' + NS_REL + '/officeDocument" Target="xl/workbook.xml"/>' +
          "</Relationships>";
        const workbookRels =
          XML_HEAD +
          '<Relationships xmlns="' + NS_PKG_REL + '">' +
          '<Relationship Id="rId1" Type="' + NS_REL + '/worksheet" Target="worksheets/sheet1.xml"/>' +
          '<Relationship Id="rId2" Type="' + NS_REL + '/styles" Target="styles.xml"/>' +
          '<Relationship Id="rId3" Type="' + NS_REL + '/sharedStrings" Target="sharedStrings.xml"/>' +
          "</Relationships>";
        const text = (s) => [enc.encode(s)];
        let done = 0;
        const zipPause = pause
          ? () => {
              done++;
              return pause(0.8 + (0.2 * done) / 7);
            }
          : null;
        return zipArchive(
          [
            { name: "[Content_Types].xml", chunks: text(contentTypes) },
            { name: "_rels/.rels", chunks: text(rootRels) },
            { name: "xl/workbook.xml", chunks: text(workbook) },
            { name: "xl/_rels/workbook.xml.rels", chunks: text(workbookRels) },
            { name: "xl/styles.xml", chunks: text(styles) },
            { name: "xl/sharedStrings.xml", chunks: sstParts },
            {
              name: "xl/worksheets/sheet1.xml",
              chunks: [enc.encode(sheetHead)].concat(body, [enc.encode(sheetTail)]),
            },
          ],
          zipPause,
        );
      }

      // ---------------------------------------------------------------------------------------------------------
      // Viewer file (TASK-009; REQ-010, spec 4.2): element table encoding and the fixed HTML skeleton
      // ---------------------------------------------------------------------------------------------------------

      /** Version of the encoded element table (encodeTable / decodeTable). */
      export const TABLE_VERSION = 1;

      // value codes in the flat value list of a row: [key * 4 + code, payload, ...]
      const V_TEXT = 0; // payload: index into strings
      const V_NUMBER = 1; // payload: the number (finite, not -0)
      const V_MULTI = 2; // payload: [indices into strings]
      const V_OTHER = 3; // payload: { v: value } as JSON, or { z: 1 } for -0

      /**
       * Encodes the element table of the loaded models for the viewer file (spec 4.2, 4.4 encodeTable): models
       * [{ id, name, fileName, rows, properties, spaceProperties, spaceIds, contextIds }] (rows as spec 4.3, properties
       * as createExtractor gives them: Map key -> { pset, name, occurrence, type, kinds Set, units Set }). Property keys
       * and text values are stored once (dictionaries in order of first use, so equal input gives equal output); every
       * row is [localId, guid string index or -1, geometry 0 | 1, [key * 4 + code, payload, ...]]. The result is plain
       * JSON data; decodeTable gives the models back with equal rows (row key and model rebuilt from id and localId).
       */
      export function encodeTable(models) {
        const keys = [];
        const keyIndex = new Map();
        const strings = [];
        const stringIndex = new Map();
        const keyOf = (k) => {
          let i = keyIndex.get(k);
          if (i === undefined) {
            i = keys.length;
            keys.push(k);
            keyIndex.set(k, i);
          }
          return i;
        };
        const str = (s) => {
          let i = stringIndex.get(s);
          if (i === undefined) {
            i = strings.length;
            strings.push(s);
            stringIndex.set(s, i);
          }
          return i;
        };
        const encodeProps = (props) =>
          props
            ? [...props].map(([k, m]) => [keyOf(k), m.pset, m.name, Boolean(m.occurrence), Boolean(m.type), [...m.kinds], [...m.units]])
            : [];
        const out = [];
        for (const model of models) {
          const rows = [];
          for (const row of model.rows) {
            const flat = [];
            for (const k in row.values) {
              const v = row.values[k];
              if (v === undefined) continue;
              const base = keyOf(k) * 4;
              if (typeof v === "string") flat.push(base + V_TEXT, str(v));
              else if (typeof v === "number" && Number.isFinite(v) && !Object.is(v, -0)) flat.push(base + V_NUMBER, v);
              else if (Array.isArray(v) && v.every((x) => typeof x === "string")) flat.push(base + V_MULTI, v.map(str));
              else flat.push(base + V_OTHER, Object.is(v, -0) ? { z: 1 } : { v });
            }
            rows.push([row.localId, row.guid === null || row.guid === undefined ? -1 : str(row.guid), row.geometry ? 1 : 0, flat]);
          }
          out.push({
            id: model.id,
            name: model.name,
            fileName: model.fileName,
            spaceIds: Array.from(model.spaceIds || []),
            contextIds: Array.from(model.contextIds || []),
            properties: encodeProps(model.properties),
            spaceProperties: encodeProps(model.spaceProperties),

          });

        return { version: TABLE_VERSION, keys, strings, models: out };

      /** Inverse of encodeTable: [{ id, name, fileName, rows, properties, spaceProperties, spaceIds, contextIds }]. */
      export function decodeTable(table) {
        if (!table || table.version !== TABLE_VERSION) throw new Error("Unbekanntes Tabellenformat der Viewer-Datei.");
        const { keys, strings } = table;
        const decodeProps = (list) =>
          new Map(
            list.map(([k, pset, name, occurrence, type, kinds, units]) => [
              keys[k],
              { pset, name, occurrence, type, kinds: new Set(kinds), units: new Set(units) },
            ]),
          );
        return table.models.map((m) => {
          const rows = new Array(m.rows.length);
          for (let r = 0; r < m.rows.length; r++) {
            const [localId, guid, geometry, flat] = m.rows[r];
            const values = {};
            for (let i = 0; i < flat.length; i += 2) {
              const code = flat[i] % 4;
              const key = keys[(flat[i] - code) / 4];
              const p = flat[i + 1];
              if (code === V_TEXT) values[key] = strings[p];
              else if (code === V_NUMBER) values[key] = p;
              else if (code === V_MULTI) values[key] = p.map((s) => strings[s]);
              else values[key] = p.z ? -0 : p.v;
            }
            rows[r] = {
              key: m.id + ":" + localId,
              model: m.id,
              localId,
              guid: guid === -1 ? null : strings[guid],
              geometry: geometry === 1,
              values,
            };
          }
          return {
            id: m.id,
            name: m.name,
            fileName: m.fileName,
            rows,
            properties: decodeProps(m.properties),
            spaceProperties: decodeProps(m.spaceProperties),
            spaceIds: m.spaceIds.slice(),
            contextIds: m.contextIds.slice(),
          };

      /** Text for HTML element content and attribute values: & < > " ' escaped. */
      export function escapeHtml(text) {

      }

      /** Bytes -> Base64 text (chunked, so large payloads do not exceed the argument limit of fromCharCode). */
      export function bytesToBase64(bytes) {
        const CHUNK = 0x8000 * 3; // a multiple of 3: chunks encode without padding in between
        const parts = [];
        for (let i = 0; i < bytes.length; i += CHUNK) {
          const sub = bytes.subarray(i, i + CHUNK);
          let binary = "";
          for (let j = 0; j < sub.length; j += 0x8000)
            binary += String.fromCharCode.apply(null, sub.subarray(j, j + 0x8000));
          parts.push(btoa(binary));
        }
        return parts.join("");
      }

      /** gzip with the native CompressionStream (deterministic: same bytes in, same bytes out). */
      export async function gzipBytes(bytes) {
        const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
        return new Uint8Array(await new Response(stream).arrayBuffer());
      }

       * helpers (classic script: tovLinkModules), bootstrap (classic script), payloads [{ id, base64 }] }. Title and meta values are HTML-escaped; css and scripts must not contain a closing
       * script / style tag or a comment opener in a script (checked: an Error names the part), payloads are Base64 (gzip) text.
       */
      export function viewerHtmlParts(input) {
        const CLOSE = "<" + "/script>";
        const OPEN = "<" + "script"; // never literal in a script block: it would change how the builder is parsed
        const checks = [
          ["css", input.css, /<\/style/i],
          ["guard", input.guard, /<\/script|<!-{2}/i],
          ["helpers", input.helpers, /<\/script|<!-{2}/i],
          ["bootstrap", input.bootstrap, /<\/script|<!-{2}/i],
        ];
        for (const [name, text] of checks)
          if (typeof text !== "string") throw new Error("Viewer-Datei: " + name + " fehlt.");
        for (const [name, text, re] of checks) if (re.test(text)) throw new Error("Viewer-Datei: " + name + " enth\u00e4lt ein schlie\u00dfendes Tag.");
        for (const p of input.payloads)
          if (!/^[A-Za-z0-9+/=]*$/.test(p.base64)) throw new Error("Viewer-Datei: Nutzdaten " + p.id + " sind kein Base64.");
        const parts = [
          "<!doctype html>\n",
          '<html lang="de">\n<head>\n<meta charset="utf-8">\n',
          '<meta name="viewport" content="width=device-width, initial-scale=1">\n',
          '<meta name="generator" content="' + escapeHtml(input.generator) + '">\n',
          '<meta name="cv-exported" content="' + escapeHtml(input.exported) + '">\n',
          "<title>" + escapeHtml(input.title) + "</title>\n",
          '<style id="cv-css">' + input.css + "</style>\n",
          '</head>\n<body>\n<div id="cv-root">Viewer wird geladen ...</div>\n',
          OPEN + ' id="cv-viewer-guard">' + input.guard + CLOSE + "\n",
        ];
        for (const p of input.payloads) {
          parts.push(OPEN + ' type="application/octet-stream" id="' + escapeHtml(p.id) + '">');
          parts.push(p.base64);
          parts.push(CLOSE + "\n");
        }
        parts.push(OPEN + ' id="cv-viewer-helpers">' + input.helpers + CLOSE + "\n");
        parts.push(OPEN + ' id="cv-viewer-bootstrap">' + input.bootstrap + CLOSE + "\n");
        parts.push("</body>\n</html>\n");
        return parts;
