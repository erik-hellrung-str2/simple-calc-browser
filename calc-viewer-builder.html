            hook.options.includeSpaces = Boolean(data.includeSpaces);
            for (let i = 0; i < data.models.length; i++) {
              const m = data.models[i];
              progress(m.name, "Anzeige", data.models.length > 1 ? i / data.models.length : null);
              await engine.loadModel(data.frags[i], m.id);
              if (!hook.options.includeSpaces && m.spaceIds.length) await engine.setItemsVisible(m.id, m.spaceIds, false);
              models.push({ ...m, fragBytes: null });
            }
            publish();
            if (data.config) {
              const applied = applyConfiguration(data.config);
              if (applied.notice) ui.addMessage(applied.notice, "notice");
            }
            if (data.models.length)
              progress(data.models[data.models.length - 1].name, "Anzeige", data.models.length > 1 ? 1 : null);
            await engine.whenQuiet(VIEWER_QUIET_MAX_MS); // tiles streamed in: the first frame shows them complete
          } finally {
            options.root.classList.remove("cv-starting");
            engine.holdFrames(false);
            settleOverlay();
            if (models.length) ui.tools.startHint();
            hook.progress = null;
            busy = false;
            ui.setBusy(false);
            notifyFree();
          }
        }

        /**
         * Applies a configuration file text (REQ-009): parse and validate (invalid-json, not-a-config,
         * unsupported-version: German message, view unchanged), then the tolerant apply with its notice.
         */
        function loadConfigurationText(text, fileName) {
          const t0 = performance.now();
          let result;
          // the messages of an earlier configuration load are outdated now (verification INC-1 UX minor 1)
          for (const item of configMessages.splice(0)) item.remove();
          const say = (line, kind) => configMessages.push(ui.addMessage(line, kind));
          try {
            const config = parseConfig(text);
            if (!models.length) throw new ConfigError("no-model");
            const applied = applyConfiguration(config);
            result = { ok: true, fileName, notice: applied.notice, skipped: applied.skipped };
            if (applied.notice) say(applied.notice, "notice");
            else say("Konfiguration " + fileName + " geladen.", "ok");
          } catch (error) {
            const configClass = error && error.configClass ? error.configClass : "unreadable";
            const message =
              configClass === "no-model"
                ? "Zum Laden einer Konfiguration zuerst ein IFC-Modell laden."
                : error && error.configClass
                  ? error.message
                  : configErrorMessage("unreadable") + (error && error.message ? " (" + error.message + ")" : "");
            result = { ok: false, fileName, errorClass: configClass, message };
            say(message);
          }
          result.ms = performance.now() - t0;
          hook.config.last = result;
          hook.config.loads++;
          return result;
        }

        /** `Konfiguration laden` with a file: size check (too-large), read as UTF-8, then loadConfigurationText. */
        async function loadConfigurationFile(file) {
          if (file.size > CONFIG_MAX_BYTES) {
            const error = new ConfigError("too-large");
            for (const item of configMessages.splice(0)) item.remove();
            configMessages.push(ui.addMessage(error.message));
            hook.config.last = { ok: false, fileName: file.name, errorClass: error.configClass, message: error.message };
            hook.config.loads++;
            return hook.config.last;
          }
          let text;
          try {
            text = await file.text();
          } catch (error) {
            text = null;
            const message = configErrorMessage("unreadable") + (error && error.message ? " (" + error.message + ")" : "");
            for (const item of configMessages.splice(0)) item.remove();
            configMessages.push(ui.addMessage(message));
            hook.config.last = { ok: false, fileName: file.name, errorClass: "unreadable", message };
            hook.config.loads++;
            return hook.config.last;
          }
          await whenFree(); // never against a half-loaded model set (CODE F3)
          return loadConfigurationText(text, file.name);
        }

        /** Reads a logo image file (REQ-011): type and size check, data URL, must decode as an image. */
        async function readLogo(file) {
          const head = new Uint8Array(await file.slice(0, 4096).arrayBuffer());
          const kind = classifyLogo(file.name, file.size, head);
          if (kind.error) return { error: kind.error };
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(new Blob([file], { type: kind.mime }));
          });
          const decodes = await new Promise((resolve) => {
            const image = new Image();
            image.onload = () => resolve(true);
            image.onerror = () => resolve(false);
            image.src = dataUrl;
          });
          if (!decodes) return { error: file.name + " konnte nicht als Bild gelesen werden." };
          return { dataUrl };
        }

        const headerHandlers = {
          /** Dialog `Titel, Datum und Logo` (builder). */
          edit() {
            ui.openHeaderDialog(
              {
                title: headerState.title,
                titleDefault: models.length ? models[0].name : "",
                date: headerState.date,
                dateDefault: isoDate(new Date()),
                logo: headerState.logo,
              },
              { readLogo, apply: (next) => setHeader(next) },
            );
          },
        };

        /**
         * Search of the filter panel (REQ-012-AC7, DEC-19): the display-text index is built in chunks on first use
         * (status `Eigenschaften werden gelesen ... N %`, as ref L1379-1384), then the filters are evaluated; texts
         * typed meanwhile wait for the same build and the latest text wins (refresh reads searchText).
         */
        let indexing = false;
        async function ensureTextIndex() {
          const target = store;
          if (target.hasTextIndex()) return true;
          indexing = true;
          ui.tools.setIndexing(0);
          try {
            await target.buildTextIndex({
              pause: (fraction) =>
                new Promise((resolve) => {
                  if (target === store) ui.tools.setIndexing(fraction);
                  setTimeout(resolve, 0);
                }),
            });
          } finally {
            indexing = false;
          }
          return target === store;
        }

        /** Opens `Filter bearbeiten` (REQ-012) over the loaded catalogue; apply(rule) after a valid `Anwenden`. */
        function openRuleDialog(rule, opener, apply) {
          ui.openRuleDialog({
            rule,
            entries: [...catalog.values()],
            valuesFor: (key) => (catalog.has(key) ? ruleValueTexts(store, key) : []),
            apply,
            returnFocus: opener || null,
          });
        }

        /**
         * Sets the rule list (REQ-012) and re-evaluates; a `Freie Textsuche` rule needs the display-text index (built
         * with progress first, as the search). Columns of removed rules are dropped (store.retain).
         */
        async function setRules(next) {
          rules = next;
          store.retain(keysInUse());
          if (rules.some((rule) => rule.mode === "text")) await ensureTextIndex();
          refresh();
        }

        async function setSearch(text) {
          const next = String(text);
          if (next === searchText) return;
          searchText = next;
          if (next.trim()) await ensureTextIndex();
          refresh();
        }

        /** Toolbar, filter panel and pill (TASK-015a; REQ-005, REQ-012). */
        const toolHandlers = {
          focus() {
            engine.focus();
          },
          mode(mode) {
            if (mode === viewMode) return;
            viewMode = mode;
            ui.tools.setMode(mode);
            sync3d();
          },
          search(text) {
            setSearch(text);
          },
          /** Panel `Zuruecksetzen`: the rules and the search text only (REQ-012-AC10, DEC-21). */
          resetPanel() {
            ui.tools.setSearch("");
            const hadRules = rules.length > 0;
            rules = [];
            if (hadRules) store.retain(keysInUse());
            if (searchText !== "") setSearch("");
            else if (hadRules) refresh();
          },
          /** `+ Filter hinzufuegen`: dialog `Filter bearbeiten` for a new rule, added at the end (REQ-012-AC2). */
          addRule(opener) {
            openRuleDialog(null, opener, (rule) => setRules(rules.concat([rule])));
          },
          /** Rule row text: the dialog with the rule's values; `Anwenden` replaces it in place (REQ-012-AC10). */
          editRule(index, opener) {
            const rule = rules[index];
            if (!rule) return;
            openRuleDialog(rule, opener, (next) => {
              if (rules[index] !== rule) return; // the list changed meanwhile (reset): nothing to replace
              setRules(rules.map((r, i) => (i === index ? next : r)));
            });
          },
          /** Rule row x `Filter entfernen` (REQ-012-AC10). */
          removeRule(index) {
            if (index < 0 || index >= rules.length) return;
            setRules(rules.filter((_, i) => i !== index));
          },
          /** Pill `Filter entfernen`: the same as `Alle Filter zuruecksetzen` (User answer Q9, CR-002 1a; DEC-21). */
          resetAll() {
            filterHandlers.resetAll();
          },
          /** All rules (x of the filter-area entry `Filterregeln`, REQ-004); the search text stays. */
          removeRules() {
            if (rules.length) setRules([]);
          },
          /** Pills `Isolierung entfernen` / `Ausblendung entfernen` (REQ-013-AC6). */
          clearIsolation() {
            clearTools(false, true);
          },
          clearHidden() {
            clearTools(true, false);
          },
          /** Colouring panel (REQ-005, DEC-15; TASK-016): a property of the list, mode, scale colour, `Entfernen`. */
          colour(key) {
            setColouring(key);
          },
          colourMode(mode) {
            if (mode !== colourMode) setColourOptions(mode, undefined);
          },
          scaleColour(hex) {
            const next = normaliseHexColour(hex);
            if (next && next !== scaleColourHex) setColourOptions(undefined, next);
          },
          clearColour() {
            if (colourKey !== null) setColouring(null);
          },
          panel(name) {
            // the index is built when the filter panel opens (as ref L1435-1449), so the first search is fast
            if (name === "filter" && store.size && !store.hasTextIndex())
              ensureTextIndex().then((current) => {
                if (current) refresh();
              });
          },
        };

        const viewHandlers = {
          section(axis) {
            if (!axis) return setSection(null);
            const range = engine.axisRange(axis);
            if (!range) return;
            setSection({ axis, offset: (range.min + range.max) / 2, flipped: false });
          },
          sectionOffset(offset) {
            if (section) setSection({ ...section, offset });
          },
          flip() {
            if (section) setSection({ ...section, flipped: !section.flipped });
          },
          clearSelection() {
            select(null);
          },
        };

        const filterHandlers = {
          add() {
            const used = new Set(filterSets.map((s) => s.key));
            ui.openCatalogue([...catalog.values()], used, (key) => {
              if (filterSets.some((s) => s.key === key)) return;
              filterSets.push({ id: key, key, collapsed: false, selected: [] });
              changed();
            });
          },
          toggle(id, value, checked) {
            const set = setById(id);
            if (!set) return;
            const at = set.selected.indexOf(value);
            if (checked && at === -1) set.selected.push(value);
            else if (!checked && at !== -1) set.selected.splice(at, 1);
            else return;
            changed();
          },
          resetSet(id) {
            const set = setById(id);
            if (!set || !set.selected.length) return;
            set.selected = [];
            changed();
          },
          /**
           * Clears every filter source (REQ-004-AC4): filter sets, the table's column filters, the rules (all actions),
           * the search text, hidden and isolated elements (DEC-18). Colouring, section, ghost toggle, filter sets
           * themselves and columns stay.
           */
          resetAll() {
            for (const set of filterSets) set.selected = [];
            columnFilters.clear();
            rules = [];
            searchText = "";
            hiddenKeys = new Set();
            isolatedKeys = null;
            ui.tools.setSearch("");
            store.retain(keysInUse());
            publishTable();
            changed();
          },
          move(id, to) {
            const from = filterSets.findIndex((s) => s.id === id);
            if (from === -1 || to < 0 || to >= filterSets.length || from === to) return;
            const [set] = filterSets.splice(from, 1);
            filterSets.splice(to, 0, set);
            publishSets();
          },
          step(id, delta) {
            filterHandlers.move(id, filterSets.findIndex((s) => s.id === id) + delta);
          },
          remove(id) {
            const at = filterSets.findIndex((s) => s.id === id);
            if (at === -1) return;
            filterSets.splice(at, 1);
            store.retain(keysInUse());
            changed();
          },
          collapse(id, collapsed) {
            const set = setById(id);
            if (!set) return;
            set.collapsed = collapsed;
            publishSets();
          },
          /** x of a filter-area source entry (REQ-004-AC6): clears only that source. */
          removeSource(id) {
            if (id === "hidden") clearTools(true, false);
            else if (id === "isolated") clearTools(false, true);
            else if (id === "rules") toolHandlers.removeRules();
            else if (id === "search") {
              ui.tools.setSearch("");
              setSearch("");
            }
          },
          /** Text of the `Filterregeln` / `Suche` entry: opens the in-viewer filter panel (REQ-004, DEC-21). */
          openSource() {
            ui.closeDrawer();
            ui.tools.openPanel("filter");
          },
        };

        // the viewer shows its exported header from the first paint, not the app name (verification INC-1 UX minor 3)
        const viewerHeader =
          options.mode === "viewer" && options.viewer
            ? (() => {
                const h = options.viewer.config && options.viewer.config.header;
                const first = options.viewer.models[0];
                const title = h && typeof h.title === "string" && h.title ? h.title : first ? first.name : "";
                return { title, date: h && isIsoDate(h.date) ? h.date : isoDate(new Date()), logo: null };
              })()
            : null;
        if (viewerHeader) options.root.classList.add("cv-starting");
        const ui = renderLayout(options.root, {
          mode: options.mode,
          title: options.title || (viewerHeader && viewerHeader.title) || undefined,
          filterHandlers,
          viewHandlers,
          toolHandlers,
          tableHandlers,
          headerHandlers,
          // properties panel (REQ-007): `Schliessen` clears the selection; `Farbe nach Wert` colours by the property in
          // the current mode and opens the colouring panel at its legend (REQ-005-AC9, TASK-016); `Ausblenden` /
          // `Isolieren` and `Nach Wert filtern` are inert until TASK-017b wires them (spec 5, TASK-013)
          propsHandlers: {
            clear: () => select(null),
            // `Ausblenden` / `Isolieren` act on the selected element or on all elements of a selected group (REQ-013,
            // DEC-18; TASK-017a wires them, TASK-017b tests the group and no-geometry cases)
            hide: () => hideElements(selectionKeys()),
            isolate: () => isolateElements(selectionKeys()),
            colourByValue(key) {
              if (!catalog.has(key)) return;
              if (key !== colourKey) setColouring(key);
              ui.tools.showColourLegend();
            },
          },
        });
        hook.layout = ui.layout;
        ui.overlay("3D-Ansicht wird gestartet ...");
        // a 3D pick selects the element and shows its table row (REQ-007-AC1/AC2); empty space clears (AC5)
        // the click menu's `Ausblenden` / `Isolieren` act on the clicked element (REQ-013-AC2, AC3)
        const engine = createEngine(ui.viewport, options.workerUrl, {
          onPick: (key) => select(key, true),
          onMenu: (action, key) => (action === "isolate" ? isolateElements([key]) : hideElements([key])),
        });
        ui.tools.setMode(viewMode);
        ui.view.setSection(null, null);
        // Esc clears the selection (REQ-007-AC5); with nothing selected it closes an open toolbar panel and returns the
        // focus to its button (REQ-005 `Esc` order, completed in TASK-017c / TASK-019). An Escape handled by a dialog
        // is marked defaultPrevented.
        document.addEventListener("keydown", (event) => {
          if (event.key !== "Escape" || event.defaultPrevented) return;
          if (selectedKey !== null || selectedGroup !== null) return select(null);
          const open = ui.tools.panel();
          if (!open) return;
          ui.tools.openPanel(null);
          document.getElementById(open === "filter" ? "cv-tool-filter" : "cv-tool-colour").focus();
        });
        /** Test seam (spec 4.4) and selection hook for the table (TASK-006c). */
        window.CalcView = {
          state: () => engine.state(),
          /** Selects an element like a 3D pick (table row shown), null clears. */
          select: (key) => select(key, true),
          /** Selects all elements of a table group by group id (as a group row click); false if the group is not shown. */
          selectGroup: (id) => {
            const group = tree ? allGroups(tree).find((g) => g.id === id) : null;
            if (!group) return false;
            selectGroup(group, Array.from(group.indices, (i) => store.rows[i].key));
            return true;
          },
          camera: () => engine.camera(),
          lastSelectedAt: () => engine.lastSelectedAt(),
          whenIdle: () => engine.whenIdle(),
          liveModels: () => engine.liveModels(),
          frames: () => engine.frames(),
          lastFrameAt: () => engine.lastFrameAt(),
          lastAppliedAt: () => engine.lastAppliedAt(),
          changeFrames: () => engine.changeFrames(),
          shownFrames: () => engine.shownFrames(),
          screenBox: (key) => engine.screenBox(key),
          engineVisible: (modelId, localIds) => engine.engineVisible(modelId, localIds),
          axisRange: (axis) => engine.axisRange(axis),
          contextState: () => engine.contextState(),
        };
        /**
         * Configuration seam (TASK-007): state() = the object `Konfiguration speichern` writes; loadText(text, name)
         * = `Konfiguration laden` with that file text; header() = title, date, logo as shown.
         */
        window.CalcConfig = {
          state: () => configState(),
          // the viewer file offers no configuration loading (REQ-010), not even through the test seam
          loadText:
            options.mode === "builder"
              ? async (text, fileName) => {
                  await whenFree();
                  return loadConfigurationText(text, fileName || "konfiguration.json");
                }
              : undefined,
          header: () => effectiveHeader(),
        };
        /** Table seam (TASK-006a): configuration part (state / setState, TASK-007) and render statistics. */
        window.CalcTable = {
          state: () => tableState(),
          setState: (state) => setTableState(state),
          stats: () => ui.table.stats(),
          grouping: () => groupingState(),
          setGrouping: (state) => setGroupingState(state),
        };
        const models = []; // { id, name, fileName, rows, properties, spaceProperties, spaceIds, contextIds, fragBytes }
        const queued = []; // files dropped while an action runs; loaded right after it
        const configMessages = []; // message nodes of the last configuration load (replaced by the next one)
        let nextId = 1;
        let busy = false;
        const freeWaiters = []; // resolvers of whenFree()

        /**
         * Resolves once no action runs and no dropped file waits in the queue (verification INC-1 CODE F3): a
         * configuration dropped together with IFC files, or while a load runs, is applied to the models loaded then.
         */
        function whenFree() {
          return new Promise((resolve) => {
            freeWaiters.push(resolve);
            notifyFree();
          });
        }
        function notifyFree() {
          if (busy || queued.length) return;
          for (const resolve of freeWaiters.splice(0)) resolve();
        }

        /**
         * Overlay when no action runs: the start hint while the builder has no model, else hidden. A load error
         * shown in the overlay does not stay over the 3D view; its message remains in #cv-messages.
         */
        function settleOverlay() {
          ui.overlay(options.mode === "builder" && !models.length ? "IFC-Datei laden, um zu beginnen." : null);
        }

        function publish() {
          const includeSpaces = hook.options.includeSpaces;
          const rows = [];
          for (const model of models) for (const row of visibleRows(model.rows, includeSpaces)) rows.push(row);
          hook.rows = rows;
          catalog = buildCatalog(rows, models);
          hook.catalog = [...catalog.values()];
          catalogOrder = new Map(hook.catalog.map((entry, i) => [entry.key, i]));
          store = createColumnStore(rows); // new row set: new column store (TASK-003)
          rowIndex = new Map(rows.map((row, i) => [row.key, i]));
          pruneToolKeys(); // REQ-013-AC8: elements of a removed model (or IfcSpace switched off) leave both sets
          // REQ-001-AC3: filters on remaining values stay active; checked values no element has any more are dropped
          for (const set of filterSets) if (set.selected.length) set.selected = pruneSelection(store, set.key, set.selected);
          for (const [key, f] of [...columnFilters]) {
            if (f.type !== "values") continue;
            const values = pruneSelection(store, key, f.values);
            if (values.length) columnFilters.set(key, { type: "values", values });
            else columnFilters.delete(key);
          }
          store.retain(keysInUse());
          // colouring follows the new row set (dropped if its property is gone)
          if (colourKey && !catalog.has(colourKey)) colourKey = null;
          scheme = currentScheme();
          // grouping follows the new row set: properties no element has any more are dropped (level 2 moves up)
          if (catalog.size && groupBy.some((key) => !catalog.has(key))) {
            const kept = normaliseGrouping({ view: tableView, groupBy }, catalog);
            groupBy = tableView === "grouped" && !kept.groupBy.length ? ["Kategorie"] : kept.groupBy;
            expandDefault = false;
            toggled.clear();
            store.retain(keysInUse());
          }
          if (section) ui.view.setSection(section, engine.axisRange(section.axis));
          hook.models = models.map((m) => {
            const visible = visibleRows(m.rows, includeSpaces);
            return {
              id: m.id,
              name: m.fileName,
              modell: m.name,
              elements: visible.length,
              withGeometry: visible.filter((row) => row.geometry).length,
              spaceIds: m.spaceIds.slice(),
            };
          });
          hook.modelCount = engine.modelCount();
          hook.elementCount = rows.length;
          ui.renderModels(
            hook.models.map((m) => ({ id: m.id, name: m.modell, elements: m.elements })),
            options.mode === "builder" ? removeModel : null,
          );
          publishSets();
          publishTable();
          refresh();
          publishHeader(); // the default title follows the first model (REQ-011)
          ui.setConfigLoadable(models.length > 0);
          ui.tools.setLoaded(models.length > 0);
          settleOverlay();
        }

        function progress(file, step, fraction) {
          const percent = ui.progress({ file, step, fraction });
          hook.progress = { file, step, percent };
        }

        async function loadOne(file) {
          const id = "m" + nextId++;
          const name = uniqueModelName(
            modelNameFromFile(file.name),
            models.map((m) => m.name),
          );
          let shown = false;
          try {
            progress(file.name, "Pr\u00fcfung", null);
            const converted = await options.convert(file, (fraction, step) =>
              progress(file.name, step || "Konvertierung", fraction),
            );
            progress(file.name, "Anzeige", null);
            // Fragments transfers the bytes it loads to its worker (detached here): the engine gets a copy, the
            // original stays for `HTML exportieren` (TASK-009)
            const loaded = await engine.loadModel(converted.bytes.slice(), id);
            shown = true;
            progress(file.name, "Extraktion", 0);
            const data = await options.extract(
              loaded.model,
              { modelId: id, modelName: name, elementClasses: converted.elementClasses, withGeometry: loaded.withGeometry },
              (fraction) => progress(file.name, "Extraktion", fraction),
            );
            if (!hook.options.includeSpaces) await engine.setItemsVisible(id, data.spaceIds, false);
            // geometry that is no element row (e.g. the IfcSite terrain): context, shown like elements outside the
            // filter while a filter is active
            const rowIds = new Set(data.rows.map((row) => row.localId));
            const contextIds = Array.from(loaded.withGeometry).filter((localId) => !rowIds.has(localId));
            models.push({
              id,
              name,
              fileName: file.name,
              rows: data.rows,
              properties: data.properties,
              spaceProperties: data.spaceProperties,
              spaceIds: data.spaceIds,
              contextIds,
              fragBytes: converted.bytes,
            });
            // "load a model first" is outdated once a model is loaded
            if (hook.config.last && hook.config.last.errorClass === "no-model")
              for (const item of configMessages.splice(0)) item.remove();
            publish();
            return true;
          } catch (error) {
            if (shown) await engine.removeModel(id).catch(() => {});
            const classified = toLoadError(error, file.name);
            const message = classified.message || loadErrorMessage(classified.loadClass, file.name, classified.detail);
            hook.loadErrors.push({ fileName: file.name, loadClass: classified.loadClass, message });
            ui.addMessage(message);
            ui.overlay(message, true);
            return false;
          }
        }

        /** Ends a busy action; files dropped meanwhile start loading at once (phase stays "loading"). */
        function finishAction() {
          settleOverlay();
          if (models.length) ui.tools.startHint(); // REQ-005-AC10: from the first shown model
          hook.progress = null;
          busy = false;
          ui.setBusy(false);
          hook.phase = "ready";
          hook.loads++;
          if (queued.length) loadFiles([]);
          notifyFree();
        }

        /**
         * Loads files one after another. While another action runs, the files are queued and loaded right after
         * it (a drop is never lost); files queued during this batch are loaded in the same batch.
         */
        async function loadFiles(files) {
          if (busy) {
            queued.push(...files);
            hook.queued = queued.length;
            return;
          }
          let batch = [...queued.splice(0), ...files];
          hook.queued = 0;
          if (!batch.length) return;
          busy = true;
          ui.setBusy(true);
          hook.phase = "loading";
          try {
            while (batch.length) {
              for (const file of batch) await loadOne(file);
              batch = queued.splice(0);
              hook.queued = 0;
            }
          } finally {
            finishAction();
          }
        }

        async function removeModel(id) {
          const index = models.findIndex((m) => m.id === id);
          if (busy || index === -1) return;
          busy = true;
          ui.setBusy(true);
          hook.phase = "loading";
          try {
            models.splice(index, 1);
            await engine.removeModel(id);
            publish();
          } finally {
            finishAction();
          }
        }

        async function setIncludeSpaces(include) {
          if (busy) return;
          busy = true;
          ui.setBusy(true);
          hook.phase = "loading";
          try {
            hook.options.includeSpaces = Boolean(include);
            for (const model of models) await engine.setItemsVisible(model.id, model.spaceIds, hook.options.includeSpaces);
            publish();
          } finally {
            finishAction();
          }
        }

        if (options.mode === "builder") {
          ui.fileInput.addEventListener("change", () => {
            const files = Array.from(ui.fileInput.files || []);
            ui.fileInput.value = "";
            loadFiles(files);
          });
          // a dropped .json is a configuration, the rest IFC. The configuration is applied once the IFC files of the
          // same drop (and every action running or queued at the drop) are done: loadConfigurationFile waits for
          // whenFree(), also when loadFiles only queued the files because a load was running (CODE F3).
          ui.onDropFiles(async (files) => {
            const isJson = (f) => /\.json$/i.test(f.name);
            const configFile = files.filter(isJson).pop();
            const ifcFiles = files.filter((f) => !isJson(f));
            if (ifcFiles.length) await loadFiles(ifcFiles);
            if (configFile) await loadConfigurationFile(configFile);
          });
          ui.spacesToggle.addEventListener("change", () => setIncludeSpaces(ui.spacesToggle.checked));
          ui.loadButton.disabled = false;
          ui.saveButton.addEventListener("click", () => saveConfiguration());
          ui.configInput.addEventListener("change", () => {
            const file = ui.configInput.files && ui.configInput.files[0];
            ui.configInput.value = "";
            if (file) loadConfigurationFile(file); // a cancelled dialog changes nothing
          });
          ui.htmlButton.addEventListener("click", () => exportViewerFile());
        }
        publish();
        if (options.mode === "viewer" && options.viewer) {
          await openViewer(options.viewer);
          hook.viewer = { startMs: performance.now() };
        }
        hook.phase = "ready";
        return {
          loadFiles,
          removeModel,
          setIncludeSpaces,
          /** Current filter result: { evaluation, indices (rows passing all filters), facets }. */
          filterView: () => view,
          /** Calls listener(view) after every filter evaluation (3D coupling and table, TASK-005 / TASK-006a). */
          onFilterChange(listener) {
            filterListeners.push(listener);
          },
          /** Selects an element by row key like a 3D pick (its table row is shown), null clears (REQ-007). */
          select: (key) => select(key, true),
          /** Key of the selected element or null. */
          selected: () => selectedKey,
          /** Table configuration part (REQ-006-AC6): { columns, sort, columnFilters }; setTableState applies one. */
          tableState,
          setTableState,
          /** Calls listener(rowKey) when a table row is clicked (hook for the table -> 3D selection, TASK-006c). */
          onRowClick(listener) {
            rowClickListeners.push(listener);
          },
          /** Grouping part of the configuration (REQ-009): { view, groupBy }; setGroupingState applies one. */
          groupingState,
          setGroupingState,
          /** Calls listener(groupId, elementKeys) when a group row is clicked (group selection, TASK-006c). */
          onGroupClick(listener) {
            groupClickListeners.push(listener);
          },
          /** Configuration (REQ-009): the object a save writes; apply a parsed one (viewer file start, TASK-009). */
          configState,
          applyConfiguration,
          loadConfigurationText,
          /** Header (REQ-011): { title, date, logo } as shown; setHeader({ title?, date?, logo? }). */
          header: effectiveHeader,
          setHeader,
          /** `Export CSV` / `Export Excel` of the shown table rows (REQ-008): exportTable('csv' | 'xlsx'). */
          exportTable,
          /** The export sheet of the shown table rows (exportSheet; for the viewer file and tests). */
          exportSheet: exportSheetNow,
          /** `HTML exportieren` (REQ-010, builder): the offline viewer file as a download. */
          exportViewerFile,
        };
      }

      /** Shows a fatal start error (library loading, drift guard) in root. */
      export function fail(root, message) {
        hook.phase = "error";
        hook.error = message;
        root.textContent = message;
      }
    </script>

    <!-- Start guard of the viewer file (TASK-010): runs before the payloads. ASCII only. -->
    <script type="text/plain" id="cv-viewer-guard">
      // Viewer file start guard (TASK-010, follow-ups V1/V2 of TASK-009). Placed right after #cv-root, before the
      // payloads, so it runs even when the file is cut off. Shows a German error instead of loading forever:
      //   - the document is parsed completely but the bootstrap never ran (truncated or damaged file);
      //   - the viewer is not ready within START_TIMEOUT_MS (a start that hangs).
      // window.__cvViewerGuard = { fail(message), failed }: the bootstrap reports its own errors through it and stops
      // when the guard has already failed. Test hook (set before the page loads): window.__cvViewerTest =
      // { startTimeoutMs, holdStart } (holdStart makes the bootstrap wait forever before the app starts).
      (function () {
        "use strict";
        var START_TIMEOUT_MS = 120000;
        var test = window.__cvViewerTest || {};
        var guard = { failed: false };
        function settled() {
          var hook = window.__calc;
          return Boolean(hook && (hook.phase === "ready" || hook.phase === "error"));
        }
        guard.fail = function (message) {
          if (guard.failed || settled()) return;
          guard.failed = true;
          var text = "Die Viewer-Datei konnte nicht gestartet werden: " + message;
          window.__calc = window.__calc || { models: [], modelCount: 0, elementCount: 0 };
          window.__calc.phase = "error";
          window.__calc.error = text;
          var root = document.getElementById("cv-root");
          root.textContent = text;
          root.setAttribute("role", "alert");
          root.style.padding = "24px";
          root.style.color = "#D72622";
          document.documentElement.dataset.cvReady = "viewer";
        };
        window.__cvViewerGuard = guard;
        document.addEventListener("DOMContentLoaded", function () {
          if (!window.__cvViewerBootstrap)
            guard.fail(
              "Die Datei ist unvollst\u00e4ndig oder besch\u00e4digt. Bitte die Viewer-Datei erneut exportieren oder vollst\u00e4ndig kopieren.",
            );
        });
        var timeout = test.startTimeoutMs || START_TIMEOUT_MS;
        setTimeout(function () {
          guard.fail(
            "keine Antwort nach " +
              Math.round(timeout / 1000) +
              " s. Die Datei ist m\u00f6glicherweise besch\u00e4digt oder zu gro\u00df f\u00fcr den Arbeitsspeicher des Browsers.",
          );
        }, timeout);
      })();
    </script>

    <!-- Classic bootstrap of the viewer file (reads payloads, links, starts): TASK-009. ASCII only. -->
    <script type="text/plain" id="cv-viewer-bootstrap">
      // Viewer file start (TASK-009, spec 4.2). Runs after the helpers script (tovLinkModules). Reads the embedded
      // gzip + Base64 payloads, links the runtime modules to Blob URLs and calls start({ mode: "viewer" }). Makes no
      // network request: every module, the Fragments worker, the models and the data are in this file (NFR-005).
      /* global tovLinkModules -- defined by the helpers script before this one in the viewer file */
      (function () {
        "use strict";
        window.__cvViewerBootstrap = true; // the start guard (cv-viewer-guard) knows the file is complete
        var root = document.getElementById("cv-root");
        var guard = window.__cvViewerGuard || { failed: false, fail: null };
        var test = window.__cvViewerTest || {};
        var DAMAGED = "Die Datei ist besch\u00e4digt (eingebettete Daten \u201e";

        function fail(error) {
          var message = error && error.message ? error.message : String(error);
          if (guard.fail) return guard.fail(message);
          window.__calc = window.__calc || { models: [], modelCount: 0, elementCount: 0 };
          window.__calc.phase = "error";
          window.__calc.error = message;
          root.textContent = "Die Viewer-Datei konnte nicht gestartet werden: " + message;
          root.style.padding = "24px";
          root.style.color = "#D72622";
          document.documentElement.dataset.cvReady = "viewer";
        }

        /** A German error for a damaged payload; the browser's (English) text is not shown (TASK-010 V2). */
        function damaged(id) {
          return new Error(DAMAGED + id + "\u201c nicht lesbar). Bitte die Viewer-Datei erneut exportieren.");
        }

        /** Stops the start once the guard has shown an error (timeout): nothing is drawn over the message. */
        function checkGuard() {
          if (guard.failed) throw new Error("abgebrochen");
        }

        function base64Bytes(id) {
          var node = document.getElementById(id);
          if (!node) throw damaged(id);
          var binary;
          try {
            binary = atob(node.textContent.trim());
          } catch {
            throw damaged(id);
          }
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          node.textContent = ""; // the decoded copy is enough; frees the text
          return bytes;
        }

        async function payload(id) {
          var bytes = base64Bytes(id);
          try {
            var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
            return new Uint8Array(await new Response(stream).arrayBuffer());
          } catch {
            throw damaged(id);
          }
        }

        async function json(id) {
          var bytes = await payload(id);
          try {
            return JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
          } catch {
            throw damaged(id);
          }
        }

        async function run() {
          if (typeof DecompressionStream === "undefined")
            throw new Error("Dieser Browser wird nicht unterst\u00fctzt. Bitte einen aktuellen Browser verwenden.");
          root.textContent = "Viewer wird vorbereitet ...";
          var runtime = await json("cv-payload-runtime");
          checkGuard();
          var resolve = tovLinkModules(runtime.sources, runtime.aliases);
          var workerUrl = URL.createObjectURL(new Blob([runtime.worker], { type: "text/javascript" }));
          var table = await json("cv-payload-table");
          var config = await json("cv-payload-config");
          var frags = [];
          for (var i = 0; i < table.models.length; i++) frags.push(await payload("cv-payload-model-" + i));
          checkGuard();
          if (test.holdStart) await new Promise(function () {}); // test hook: a start that hangs
          var app = await import(resolve("cv-app"));
          var core = await import(resolve("calc-core"));
          var models;
          try {
            models = core.decodeTable(table);
          } catch {
            throw damaged("cv-payload-table");
          }
          checkGuard();
          try {
            await app.start({
              mode: "viewer",
              root: root,
              workerUrl: workerUrl,
              viewer: {
                models: models,
                frags: frags,
                config: config.config,
                includeSpaces: Boolean(config.includeSpaces),
              },
            });
            window.__calc.versions = runtime.versions;
          } catch (error) {
            app.fail(
              root,
              "Die Viewer-Datei konnte nicht gestartet werden: " + (error && error.message ? error.message : String(error)),
            );
          }
          document.documentElement.dataset.cvReady = "viewer";
        }

        run().catch(function (error) {
          if (!guard.failed) fail(error);
        });
      })();
    </script>

    <script type="module" id="cv-builder">
      // Builder-only logic (spec \u00a74.2). Library versions are pinned; jsDelivr "+esm" resolves the dependency graph.
      const FRAGMENTS_VERSION = "3.4.7";
      const CDN = "https://cdn.jsdelivr.net";
      const FRAGMENTS_KEY = `/npm/@thatopen/fragments@${FRAGMENTS_VERSION}/+esm`;
      const WORKER_URL = `${CDN}/npm/@thatopen/fragments@${FRAGMENTS_VERSION}/dist/Worker/worker.min.mjs`;
      const NPM_IMPORT_RE = /(?:\bfrom\s*|\bimport\s*\(?\s*)["'](\/npm\/[^"']+)["']/g;
      const SOURCE_MAP_RE = /^\s*\/\/# sourceMappingURL=.*$/gm;

      /**
       * Links ES module sources (key -> source text) into Blob URLs without a server or bundler (ref L163-192).
       * Import specifiers are rewritten to the Blob URL of the dependency; a specifier resolves if it is a key of
       * `sources` or of `aliases` (alias -> key). Unknown "/npm/..." specifiers fail fast. Self-contained: its source
       * text is also prepended to the conversion worker (and later to the viewer file).
       */
      function tovLinkModules(sources, aliases) {
        const SPECIFIER_RE = /(\bfrom\s*|\bimport\s*\(?\s*)(["'])([^"'\n]+)\2/g;
        const has = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
        const urls = {};
        function toKey(specifier) {
          if (has(sources, specifier)) return specifier;
          if (has(aliases, specifier)) return aliases[specifier];
          return null;
        }
        function link(key, chain) {
          if (has(urls, key)) return urls[key];
          if (chain.indexOf(key) !== -1) throw new Error("Circular module import: " + chain.concat(key).join(" -> "));
          if (typeof sources[key] !== "string") throw new Error("Module source missing: " + key);
          const code = sources[key].replace(SPECIFIER_RE, function (match, prefix, quote, specifier) {
            const depKey = toKey(specifier);
            if (depKey) return prefix + quote + link(depKey, chain.concat(key)) + quote;
            if (specifier.indexOf("/npm/") === 0)
              throw new Error("Module " + key + " imports unknown module " + specifier);
            return match;
          });
          urls[key] = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
          return urls[key];
        }
        return function resolve(keyOrAlias) {
          const key = toKey(keyOrAlias);
          if (!key) throw new Error("Unknown module: " + keyOrAlias);
          return link(key, []);
        };
      }

      /**
       * Body of the classic IFC conversion worker (ref L1940-1981). Runs after tovLinkModules (prepended).
       * Input { sources, aliases, fragmentsKey, webIfcKey, wasmPath, file, extraClasses, simulateCrash, simulateHang };
       * output { type: "phase" | "progress" | "done" | "error", ... }; "done" carries the .frag bytes and the names of
       * the importer's element classes (the candidates for rows, spec 4.3).
       */
      function convertWorkerMain() {
        self.onmessage = async (event) => {
          const job = event.data;
          try {
            self.postMessage({ type: "phase", phase: "load" });
            if (job.simulateCrash) {
              // Test hook (REQ-001-AC2 `too-large`): an uncaught exception raises an `error` event on the Worker.
              setTimeout(() => {
                throw new Error("simulierter Absturz des Konverters (Testhaken)");
              }, 0);
              return;
            }
            // Test hook (TASK-010, T7): a worker that started and then hangs (no further message).
            if (job.simulateHang) return;
            const resolve = tovLinkModules(job.sources, job.aliases);
            const FRAGS = await import(resolve(job.fragmentsKey));
            const WEBIFC = await import(resolve(job.webIfcKey));
            self.postMessage({ type: "phase", phase: "read" });
            let bytes = new Uint8Array(await job.file.arrayBuffer());
            self.postMessage({ type: "phase", phase: "parse" });
            const importer = new FRAGS.IfcImporter();
            importer.wasm = { absolute: true, path: job.wasmPath };
            for (const name of job.extraClasses) {
              if (typeof WEBIFC[name] !== "number") throw new Error("Unbekannte IFC-Klasse " + name);
              importer.classes.abstract.add(WEBIFC[name]);
            }
            // IfcSpace is always converted (transparent); the option only shows/hides it (DEC-13).
            importer.geometryProcessSettings.forceTransparentSpaces = true;
            const codeNames = new Map();
            for (const key of Object.keys(WEBIFC)) {
              if (/^IFC[A-Z0-9]+$/.test(key) && typeof WEBIFC[key] === "number") codeNames.set(WEBIFC[key], key);
            }
            const elementClasses = [];
            for (const code of importer.classes.elements)
              if (codeNames.has(code)) elementClasses.push(codeNames.get(code));
            let lastSent = 0;
            const result = await importer.process({
              bytes,
              progressCallback(progress, data) {
                const now = Date.now();
                if (now - lastSent < 250) return;
                lastSent = now;
                self.postMessage({ type: "progress", progress, process: data && data.process });
              },
            });
            bytes = null;
            let output = result instanceof Uint8Array ? result : new Uint8Array(result);
            if (output.byteLength !== output.buffer.byteLength) output = output.slice();
            self.postMessage({ type: "done", bytes: output, elementClasses }, [output.buffer]);
          } catch (error) {
            self.postMessage({ type: "error", message: error && error.message ? error.message : String(error) });
          }
        };
      }

      async function fetchText(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Download fehlgeschlagen (${response.status}): ${url}`);
        return response.text();
      }

      /** Downloads the jsDelivr "+esm" module graph starting at rootKeys into `sources` (ref L2042-2053). */
      async function crawlModules(rootKeys, sources) {
        const queue = [...rootKeys];
        while (queue.length) {
          const batch = queue.splice(0).filter((key, i, all) => !(key in sources) && all.indexOf(key) === i);
          const texts = await Promise.all(batch.map((key) => fetchText(CDN + key)));
          batch.forEach((key, i) => {
            sources[key] = texts[i].replace(SOURCE_MAP_RE, "");
            for (const match of sources[key].matchAll(NPM_IMPORT_RE)) if (!(match[1] in sources)) queue.push(match[1]);
          });
        }
      }

      /** Turns the Fragments worker (ESM) into a classic worker script by removing its trailing export (ref L2055-2068). */
      function toClassicWorkerSource(moduleSource) {
        const TRAILING_EXPORT_RE = /export\s*\{[^}]*\}\s*;?\s*$/;
        const withoutMap = moduleSource.replace(SOURCE_MAP_RE, "").trimEnd();
        if (!TRAILING_EXPORT_RE.test(withoutMap)) throw new Error("Unerwartetes Format des Fragments-Workers.");
        const classic = withoutMap.replace(TRAILING_EXPORT_RE, "");
        if (/(^|[;}\s])(export|import)\s*[{*]/.test(classic))
          throw new Error("Der Fragments-Worker enth\u00e4lt noch ESM-Anweisungen.");
        return classic;
      }

      /**
       * Tiny replacement for web-ifc (3.5 MB) in the viewer file (ref L2070-2084, DEC-7): Fragments imports web-ifc
       * statically, but only the IfcImporter (never used by the viewer) needs it. Constants keep their values;
       * functions and classes throw when called.
       */
      function makeWebIfcStub(webIfcNamespace) {
        const lines = [
          'const missing = () => { throw new Error("web-ifc ist in der Viewer-Datei nicht enthalten"); };',
        ];
        for (const name of Object.keys(webIfcNamespace).sort()) {
          if (!/^[A-Za-z_$][\w$]*$/.test(name)) continue;
          const value = webIfcNamespace[name];
          let expression = "{}";
          if (value === null || ["number", "string", "boolean"].includes(typeof value))
            expression = JSON.stringify(value);
          else if (typeof value === "function") expression = "class { constructor() { missing(); } }";
          lines.push(name === "default" ? `export default ${expression};` : `export const ${name} = ${expression};`);
        }
        return lines.join("\n");
      }

      /**
       * Library source for the viewer file without unused external URLs (NFR-005, TASK-010 follow-up V3):
       *   - the jsDelivr banner line "Do NOT use SRI ... https://www.jsdelivr.com/..." (a comment) is removed;
       *   - Fragments' fallback worker URL on unpkg.com (FragmentsModels.getWorker, used only when no worker URL is
       *     given; the viewer always passes its embedded classic worker) becomes "about:blank", which can never reach
       *     the network.
       * Kept on purpose (they cannot cause a request): the XHTML namespace "http://www.w3.org/1999/xhtml" (an
       * identifier for document.createElementNS), the Office Open XML namespaces the .xlsx writer of cv-core writes
       * into its files, a paper link in a GLSL comment of three, the pako licence comment.
       * test/e2e/viewer-robustness.spec.mjs lists every URL left in the runtime and fails on a new one.
       */
      function offlineSource(text) {
        return text
          .replace(/^ \* Do NOT use SRI with dynamically generated files!.*\n/gm, "")
          .replace(/(["'`])https?:\/\/unpkg\.com\/[^"'`\s]*\1/g, '"about:blank"');
      }
      const offlineSources = (sources) =>
        Object.fromEntries(Object.entries(sources).map(([key, text]) => [key, offlineSource(text)]));

      const blobUrl = (text) => URL.createObjectURL(new Blob([text], { type: "text/javascript" }));
      const block = (id) => document.getElementById(id).textContent;

      /** Crawls the library graph, applies the drift guard and links library + app modules (ref L2075-2113). */
      async function loadLibraries() {
        const libSources = {};
        await crawlModules([FRAGMENTS_KEY], libSources);
        const sources = {
          ...libSources,
          "cv-core": block("cv-core-src"),
          "cv-ui": block("cv-ui-src"),
          "cv-3d": block("cv-3d-src"),
          "cv-app": block("cv-app-src"),
        };
        const aliases = {
          "calc-core": "cv-core",
          "calc-ui": "cv-ui",
          "calc-3d": "cv-3d",
          "@thatopen/fragments": FRAGMENTS_KEY,
        };
        const resolve = tovLinkModules(sources, aliases);
        const core = await import(resolve("calc-core"));

        let versions = core.checkLibraryVersions(Object.keys(libSources));
        const orbitKey = `/npm/three@${versions.three}/examples/jsm/controls/OrbitControls.js/+esm`;
        await crawlModules([orbitKey], libSources);
        Object.assign(sources, libSources);
        versions = core.checkLibraryVersions(Object.keys(libSources)); // OrbitControls must not pull in another three
        aliases.three = `/npm/three@${versions.three}/+esm`;
        aliases["three/addons/controls/OrbitControls.js"] = orbitKey;
        const webIfcKey = `/npm/web-ifc@${versions.webIfc}/+esm`;

        // Kategorie spelling (IfcWallStandardCase) from the schema class names web-ifc exports.
        const webIfc = await import(resolve(webIfcKey));
        const classNames = core.classNameMap(
          ["IFC2X3", "IFC4", "IFC4X3"].map((schema) => Object.keys(webIfc[schema] || {})),
        );

        const worker = toClassicWorkerSource(await fetchText(WORKER_URL));
        const convertSource = tovLinkModules.toString() + "\n(" + convertWorkerMain.toString() + ")();";
        // runtime of the viewer file (TASK-009): every library module except web-ifc (stub), the app modules, all
        // aliases and the classic Fragments worker; built on the first `HTML exportieren`
        const viewerRuntime = () => ({
          sources: { ...offlineSources(sources), [webIfcKey]: makeWebIfcStub(webIfc) },
          aliases: { ...aliases },
          worker: offlineSource(worker),
          versions: { fragments: FRAGMENTS_VERSION, ...versions },
        });
        return {
          resolve,
          core,
          classNames,
          libSources,
          webIfcKey,
          viewerRuntime,
          aliases: { "@thatopen/fragments": FRAGMENTS_KEY, three: aliases.three },
          versions: { fragments: FRAGMENTS_VERSION, ...versions },
          fragmentsWorkerUrl: blobUrl(worker),
          convertWorkerUrl: blobUrl(convertSource),
          neverStartingWorkerUrl: blobUrl("/* test hook: a worker that never answers */"),
          wasmPath: `${CDN}/npm/web-ifc@${versions.webIfc}/`,
        };
      }

      const PHASES = { load: "Konverter wird geladen", read: "Datei wird gelesen", parse: "Konvertierung" };
      /** No message from the conversion worker within this time: it never started (e.g. blocked worker) -> unreadable. */
      const WORKER_START_TIMEOUT_MS = 30000;
      /**
       * No further message from a started conversion worker within this time: it hangs -> unreadable (TASK-010). The
       * longest silence measured in a normal conversion (151.8 MB synthetic IFC, the largest test file) is recorded in
       * window.__calc.conversion.maxSilenceMs and in docs/tasks/TASK-010.md; this limit is far above it.
       */
      const WORKER_STALL_TIMEOUT_MS = 180000;

      /** Reads the first and last bytes of a file and classifies it before conversion (REQ-001). */
      async function checkFile(lib, file) {
        const core = lib.core;
        const decode = async (blob) => new TextDecoder("latin1").decode(await blob.arrayBuffer());
        const head = file.size ? await decode(file.slice(0, core.HEADER_PROBE_BYTES)) : "";
        const readTail = (bytes) => decode(file.slice(Math.max(0, file.size - bytes)));
        let tail = file.size ? await readTail(core.TRAILER_PROBE_BYTES) : "";
        // A valid file may end with more blank space or comments than the short probe holds: read up to 64 KiB.
        if (file.size > core.TRAILER_PROBE_BYTES && !core.trailerComplete(tail))
          tail = await readTail(core.TRAILER_PROBE_MAX_BYTES);
        const problem = core.classifyIfcFile(file.size, head, tail);
        if (problem) throw new core.LoadError(problem.loadClass, file.name, problem.detail);
      }

      /**
       * Converts one IFC file to .frag bytes in its own classic Blob worker, terminated afterwards (ref L2186-2205).
       * A worker `error` event (crash, e.g. out of memory) -> too-large; an `error` message (parsing/conversion
       * failed) -> unreadable; no message within the start timeout, or no further message within the stall timeout
       * (a worker that hangs mid-conversion, TASK-010) -> unreadable. Records window.__calc.conversion.
       */
      function convertIfc(lib, file, onProgress) {
        const core = lib.core;
        const test = window.__calc.test || {};
        const neverStart = Boolean(test.neverStartNextConversion);
        const simulateCrash = Boolean(test.crashNextConversion);
        const simulateHang = Boolean(test.hangNextConversion);
        test.neverStartNextConversion = false;
        test.crashNextConversion = false;
        test.hangNextConversion = false;
        const startTimeout = test.startTimeoutMs || WORKER_START_TIMEOUT_MS;
        const stallTimeout = test.stallTimeoutMs || WORKER_STALL_TIMEOUT_MS;
        const seconds = (ms) => Math.round(ms / 1000);
        return new Promise((resolve, reject) => {
          const worker = new Worker(neverStart ? lib.neverStartingWorkerUrl : lib.convertWorkerUrl);
          const startedAt = performance.now();
          let lastMessageAt = startedAt;
          let maxSilence = 0;
          let timer = null;
          // watchdog: before the first message the start timeout, afterwards the stall timeout (reset per message)
          const watch = (started) => {
            if (timer) clearTimeout(timer);
            const ms = started ? stallTimeout : startTimeout;
            const detail = started
              ? `der Konverter antwortet nicht mehr (keine R\u00fcckmeldung seit ${seconds(ms)} s)`
              : `der Konverter ist nicht gestartet (keine Antwort nach ${seconds(ms)} s)`;
            timer = setTimeout(() => {
              timer = null;
              finish(reject, new core.LoadError("unreadable", file.name, detail));
            }, ms);
          };
          const finish = (callback, value) => {
            if (timer) clearTimeout(timer);
            timer = null;
            worker.terminate();
            window.__calc.conversion = {
              fileName: file.name,
              ms: Math.round(performance.now() - startedAt),
              maxSilenceMs: Math.round(maxSilence),
            };
            callback(value);
          };
          watch(false);
          onProgress(null, "Konverter wird gestartet");
          worker.onmessage = (event) => {
            const now = performance.now();
            maxSilence = Math.max(maxSilence, now - lastMessageAt);
            lastMessageAt = now;
            const m = event.data;
            if (m.type === "phase") onProgress(m.phase === "parse" ? 0 : null, PHASES[m.phase]);
            else if (m.type === "progress") onProgress(m.progress, "Konvertierung");
            else if (m.type === "done") return finish(resolve, { bytes: m.bytes, elementClasses: m.elementClasses });
            else if (m.type === "error") return finish(reject, new core.LoadError("unreadable", file.name, m.message));
            watch(true);
          };
          worker.onerror = (event) => {
            event.preventDefault();
            const error = new core.LoadError("too-large", file.name, event.message || null);
            finish(reject, error);
          };
          worker.postMessage({
            sources: lib.libSources,
            aliases: lib.aliases,
            fragmentsKey: FRAGMENTS_KEY,
            webIfcKey: lib.webIfcKey,
            wasmPath: lib.wasmPath,
            file,
            extraClasses: core.IMPORTER_EXTRA_CLASSES,
            simulateCrash,
            simulateHang,
          });
        });
      }

      const nextTask = () => new Promise((resolve) => setTimeout(resolve, 0));

      /**
       * Extraction (spec 4.3, REQ-002): element ids via getItemsOfCategories over the importer's element classes minus
       * spatial and type classes (IfcSpace kept; the option filters it), storeys via getSpatialStructure, units via
       * IfcUnitAssignment, then getItemsData in chunks of INDEX_CHUNK_SIZE ids with progress and yielding.
       */
      async function extractModel(lib, model, info, onProgress) {
        const core = lib.core;
        const classes = core.rowClasses(info.elementClasses, true);
        const [byCategory, tree, unitCategories] = await Promise.all([
          model.getItemsOfCategories([core.categoryPattern(classes)]),
          model.getSpatialStructure(),
          model.getItemsOfCategories([/^IFCUNITASSIGNMENT$/]),
        ]);
        const ids = [];
        const spaceIds = [];
        for (const [category, list] of Object.entries(byCategory)) {
          for (const id of list) ids.push(id);
          if (category === core.SPACE_CLASS) for (const id of list) spaceIds.push(id);
        }
        ids.sort((a, b) => a - b);
        const spatial = core.spatialIndex(tree);
        const storeyItems = spatial.storeyIds.length
          ? await model.getItemsData(spatial.storeyIds, core.ATTRIBUTES_ONLY_CONFIG)
          : [];
        const unitIds = Object.values(unitCategories).flat();
        const unitItems = unitIds.length ? await model.getItemsData(unitIds, core.UNIT_DATA_CONFIG) : [];
        const extractor = core.createExtractor({
          modelId: info.modelId,
          modelName: info.modelName,
          units: core.parseUnits(unitItems),
          storeyOf: core.storeyNames(spatial, storeyItems),
          withGeometry: new Set(info.withGeometry),
          className: (upper) => lib.classNames.get(upper) || upper,
        });
        for (let start = 0; start < ids.length; start += core.INDEX_CHUNK_SIZE) {
          const items = await model.getItemsData(
            ids.slice(start, start + core.INDEX_CHUNK_SIZE),
            core.ITEM_DATA_CONFIG,
          );
          for (const item of items) if (item && item._localId) extractor.add(item);
          onProgress(Math.min(1, (start + core.INDEX_CHUNK_SIZE) / ids.length));
          await nextTask();
        }
        const result = extractor.result();
        return { rows: result.rows, properties: result.properties, spaceProperties: result.spaceProperties, spaceIds };
      }

      /**
       * `HTML exportieren` (REQ-010, spec 4.2): assembles the viewer file from the fixed skeleton (cv-css, the
       * tovLinkModules helper, cv-viewer-bootstrap) and gzip + Base64 payloads: runtime, element table (encodeTable),
       * configuration and one .frag per model. Returns the file as text parts (Blob parts). data: { title, models,
       * config, includeSpaces }; pause(fraction) shows progress and yields.
       */
      let runtimePayload = null; // Base64 of the runtime: the same for every export of this session
      async function buildViewer(lib, data, pause) {
        const core = lib.core;
        const pack = async (bytes) => core.bytesToBase64(await core.gzipBytes(bytes));
        const packJson = (value) => pack(new TextEncoder().encode(JSON.stringify(value)));
        if (!runtimePayload) runtimePayload = await packJson(lib.viewerRuntime());
        await pause(0.2);
        const missing = data.models.find((m) => !m.fragBytes || !m.fragBytes.byteLength);
        if (missing) throw new Error("Modelldaten fehlen: " + missing.fileName);
        const table = await packJson(core.encodeTable(data.models));
        await pause(0.4);
        const config = await packJson({ config: data.config, includeSpaces: Boolean(data.includeSpaces) });
        const payloads = [
          { id: core.VIEWER_PAYLOAD.runtime, base64: runtimePayload },
          { id: core.VIEWER_PAYLOAD.table, base64: table },
          { id: core.VIEWER_PAYLOAD.config, base64: config },
        ];
        for (let i = 0; i < data.models.length; i++) {
          payloads.push({ id: core.VIEWER_PAYLOAD.model(i), base64: await pack(data.models[i].fragBytes) });
          await pause(0.4 + (0.5 * (i + 1)) / data.models.length);
        }
        const v = lib.versions;
        return core.viewerHtmlParts({
          title: data.title || "Calc Viewer",
          generator: `Calc Viewer Builder (That Open Fragments ${v.fragments}, three ${v.three}, web-ifc ${v.webIfc})`,
          exported: new Date().toISOString(),
          css: document.getElementById("cv-css").textContent,
          helpers: '"use strict";\n' + tovLinkModules.toString() + "\n",
          guard: block("cv-viewer-guard"),
          bootstrap: block("cv-viewer-bootstrap"),
          payloads,
        });
      }

      const root = document.getElementById("cv-root");
      root.textContent = "Bibliotheken werden geladen ...";
      try {
        const lib = await loadLibraries();
        const app = await import(lib.resolve("cv-app"));
        try {
          await app.start({
            mode: "builder",
            root,
            workerUrl: lib.fragmentsWorkerUrl,
            convert: async (file, onProgress) => {
              await checkFile(lib, file);
              return convertIfc(lib, file, onProgress);
            },
            extract: (model, info, onProgress) => extractModel(lib, model, info, onProgress),
            buildViewer: (data, pause) => buildViewer(lib, data, pause),
          });
          window.__calc.versions = lib.versions;
        } catch (error) {
          app.fail(root, error && error.message ? error.message : String(error));
        }
      } catch (error) {
        // Before cv-app is linked (CDN unreachable, drift guard): plain message, hook for tests.
        const message = error && error.message ? error.message : String(error);
        window.__calc = { phase: "error", error: message, models: [], modelCount: 0, elementCount: 0 };
        root.textContent = message;
        root.style.padding = "24px";
        root.style.color = "#D72622";
      }
      document.documentElement.dataset.cvReady = "builder";
    </script>
  </body>
</html>
