          const min = col.values[0];
          const max = col.values[n - 1];
          const steps = max > min ? COLOUR_SCALE_STEPS : 1;
          const width = (max - min) / steps;
          for (let b = 0; b < steps; b++) {
            const lo = min + b * width;
            const hi = b === steps - 1 ? max : min + (b + 1) * width;
            entries.push({
              kind: "range",
              min: lo,
              max: hi,
              colour: scaleColour(steps === 1 ? COLOUR_SCALE_STEPS - 1 : b),
              label: steps === 1 ? formatNumber(lo) : formatNumber(lo) + " \u2013 " + formatNumber(hi),
            });
          }
          for (let c = 0; c < n; c++)
            codeEntry[c] = width > 0 ? Math.min(steps - 1, Math.floor((col.values[c] - min) / width)) : 0;
        } else {
          const own = Math.min(n, COLOUR_DISTINCT_COUNT);
          for (let c = 0; c < own; c++) {
            const value = col.values[c];
            entries.push({
              kind: "value",
              value,
              colour: distinctColour(c),
              label: typeof value === "number" ? formatNumber(value) : String(value),
            });
            codeEntry[c] = c;
          }
          if (n > own) {
            const other = entries.length;
            entries.push({ kind: "other", label: OTHER_LABEL, colour: COLOUR_OTHER });
            for (let c = own; c < n; c++) codeEntry[c] = other;
          }
        }
        const multi = entries.length;
        entries.push({ kind: "multi", label: MULTI_LABEL, colour: COLOUR_MULTI });
        const empty = entries.length;
        entries.push({ kind: "empty", label: EMPTY_LABEL, colour: COLOUR_EMPTY });
        const rowEntry = (i) => {
          const s = col.start[i];
          if (col.start[i + 1] - s > 1) return multi;
          const code = col.flat[s];
          return code === col.emptyCode ? empty : codeEntry[code];
        };
        return {
          key,
          numeric,
          entries,
          rowEntry,
          rowColour: (i) => entries[rowEntry(i)].colour,
          /** Colour of one value as listed in a filter set (null = "(leer)"); undefined for an unknown value. */
          valueColour(value) {
            if (value === null || value === undefined) return COLOUR_EMPTY;
            const code = col.index.get(value);
            return code === undefined || code === col.emptyCode ? undefined : entries[codeEntry[code]].colour;
          },
        };
      }

      /**
       * Legend of a colour scheme over the rows at indices (the elements inside the filter, REQ-005): the entries that
       * occur, in scheme order (`mehrere Werte` and `(leer)` last), each with its element count.
       */
      export function colourLegend(scheme, indices) {
        const counts = new Uint32Array(scheme.entries.length);
        for (const i of indices) counts[scheme.rowEntry(i)]++;
        const out = [];
        scheme.entries.forEach((entry, e) => {
          if (counts[e]) out.push({ ...entry, count: counts[e] });
        });
        return out;
      }

      // ---------------------------------------------------------------------------------------------------------
      // Table (TASK-006a; REQ-006 single-element view: columns, cell text, column filters)
      // ---------------------------------------------------------------------------------------------------------

      /** Default columns of a new configuration (REQ-006). */
      export const DEFAULT_COLUMNS = ["Modell", "Kategorie", "Name", "Geschoss"];
      /** Column width limits and defaults in px (REQ-006 "column width adjustable"). */
      export const COLUMN_WIDTH = { min: 60, max: 800, text: 160, number: 150, name: 240 };

      /** Default width of a new column for its catalogue entry (numbers narrower, Name wider). */
      export function defaultColumnWidth(key, entry) {
        if (key === "Name") return COLUMN_WIDTH.name;
        return entry && entry.kind === "number" ? COLUMN_WIDTH.number : COLUMN_WIDTH.text;
      }

      /** A width clamped to COLUMN_WIDTH.min .. max (rounded px); NaN / missing -> fallback. */
      export function clampColumnWidth(width, fallback) {
        const w = Number(width);
        if (!Number.isFinite(w)) return fallback === undefined ? COLUMN_WIDTH.text : fallback;
        return Math.round(Math.min(COLUMN_WIDTH.max, Math.max(COLUMN_WIDTH.min, w)));
      }

      /**
       * Column list of the table (part of the configuration, REQ-006-AC6 / REQ-009): [{ key, width }] in display
       * order; duplicate or empty keys are dropped, widths clamped (missing width -> defaultColumnWidth).
       */
      export function normaliseColumns(list, catalog) {
        const seen = new Set();
        const out = [];
        for (const item of list || []) {
          const key = typeof item === "string" ? item : item && item.key;
          if (typeof key !== "string" || key === "" || seen.has(key)) continue;
          seen.add(key);
          const entry = catalog && catalog.get ? catalog.get(key) : undefined;
          const width = typeof item === "object" && item ? item.width : undefined;
          out.push({ key, width: clampColumnWidth(width, defaultColumnWidth(key, entry)) });
        }
        return out;
      }

      /** Moves the item at index from to index to (both clamped); returns a new array. */
      export function moveItem(list, from, to) {
        const out = list.slice();
        if (from < 0 || from >= out.length) return out;
        const [item] = out.splice(from, 1);
        out.splice(Math.max(0, Math.min(out.length, to)), 0, item);
        return out;
      }

      const CELL_FORMAT = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 3 });

      /**
       * Text of a table cell (REQ-006): numbers in German format (thousands ".", decimal ",", up to 3 decimals),
       * multi-values joined with ", " (REQ-002), empty values as "" (empty cells stay empty).
       */
      export function formatCell(value) {
        if (isEmptyValue(value)) return "";
        if (typeof value === "number") return CELL_FORMAT.format(value);
        if (Array.isArray(value)) {
          const parts = [];
          for (const v of value) if (!isEmptyValue(v)) parts.push(typeof v === "number" ? CELL_FORMAT.format(v) : String(v));
          return parts.join(", ");
        }
        return String(value);
      }

      /**
       * Parses a range bound typed by the user (REQ-006 numeric column filter, TASK-003 D2): German decimal comma
       * ("2,5", "-0,75", "1.234,5" with thousands dots) or a decimal point ("2.5"); surrounding blanks are ignored.
       * Returns { value: number | null, valid }: empty text is { value: null, valid: true } (no bound), text that is
       * no number is { value: null, valid: false }.
       */
      export function parseNumberInput(text) {
        const s = text === null || text === undefined ? "" : String(text).trim();
        if (s === "") return { value: null, valid: true };
        let normal = null;
        if (/^[+-]?\d{1,3}(\.\d{3})+,\d*$/.test(s)) normal = s.replace(/\./g, "").replace(",", ".");
        else if (/^[+-]?(\d+([.,]\d*)?|[.,]\d+)$/.test(s)) normal = s.replace(",", ".");
        if (normal === null) return { value: null, valid: false };
        const value = Number(normal.replace(/\.$/, ""));
        return Number.isFinite(value) ? { value, valid: true } : { value: null, valid: false };
      }

      /**
       * The values of a selection that still occur in the column of key (REQ-001-AC3: after a model is removed,
       * filters on remaining values stay active, values that no element has any more are dropped); null (the empty
       * value) stays while some row is empty.
       */
      export function pruneSelection(source, key, values) {
        const col = asStore(source).column(key);
        const out = [];
        for (const v of values || []) {
          const value = v === undefined ? null : v;
          if (value === null ? col.empties : col.index.get(value) !== undefined) out.push(value);
        }
        return out;
      }

      /**
       * Smallest and largest number of a numeric column among the rows of a bitset (rows passing the other filters),
       * or null (shown as a hint next to the range inputs of a numeric column filter).
       */
      export function numberRange(source, key, bits) {
        const col = asStore(source).column(key);
        let min = Infinity;
        let max = -Infinity;
        for (let i = 0; i < col.n; i++) {
          if (bits && !(bits[i >>> 5] & (1 << (i & 31)))) continue;
          const v = col.nums[i];
          if (v < min) min = v;
          if (v > max) max = v;
        }
        return min <= max ? { min, max } : null;
      }

      // ---------------------------------------------------------------------------------------------------------
      // Grouping view (TASK-006b; REQ-006 grouping view, DEC-16, ASM-008)
      // ---------------------------------------------------------------------------------------------------------

      /** Grouping levels at most (spec 3: more than two levels are out of scope). */
      export const GROUP_LEVELS = 2;

      /** Identity token of a group value: numbers and texts never collide; null (empty) has its own token. */
      function groupToken(value) {
        if (value === null || value === undefined) return "~";
        return (typeof value === "number" ? "#" : "$") + String(value);
      }

      /** Comparable token of a cell for "same value in every element" (multi-values as displayed, empty = ""). */
      function sameToken(value) {
        if (isEmptyValue(value)) return "";
        if (typeof value === "number") return "#" + value;
        if (Array.isArray(value)) {
          const parts = [];
          for (const v of value) if (!isEmptyValue(v)) parts.push(typeof v === "number" ? "#" + v : "$" + v);
          return parts.length ? "[" + parts.join("\u0001") : "";
        }
        return "$" + value;
      }

      /** Sum of the numbers of key over the rows (Neumaier summation); null if no row has a number. */
      function sumOf(rows, list, key) {
        let sum = 0;
        let comp = 0;
        let any = false;
        for (let p = 0; p < list.length; p++) {
          const v = rows[list[p]].values[key];
          if (typeof v !== "number" || !Number.isFinite(v)) continue;
          any = true;
          const t = sum + v;
          comp += Math.abs(sum) >= Math.abs(v) ? sum - t + v : v - t + sum;
          sum = t;
        }
        return any ? sum + comp : null;
      }

      /** The value of key if every row has the same one (multi-values compared as displayed), else null. */
      function sameOf(rows, list, key) {
        if (!list.length) return null;
        const first = rows[list[0]].values[key];
        const token = sameToken(first);
        if (token === "") return null;
        for (let p = 1; p < list.length; p++) if (sameToken(rows[list[p]].values[key]) !== token) return null;
        return first;
      }

      /** Aggregated cells of a list of rows: { key -> sum (mode 'sum') | common value (mode 'same') | null }. */
      function groupCells(rows, list, columns, textToo) {
        const cells = {};
        for (const c of columns) {
          if (c.mode === "sum") cells[c.key] = sumOf(rows, list, c.key);
          else if (c.mode === "same" && textToo) cells[c.key] = sameOf(rows, list, c.key);
          else cells[c.key] = null;
        }
        return cells;
      }

      /** Splits list (row indices, kept in their order) by the values of col: [{ code, indices }] in code order. */
      function bucketBy(col, list) {
        const buckets = new Map();
        const { start, flat } = col;
        for (let p = 0; p < list.length; p++) {
          const i = list[p];
          for (let j = start[i]; j < start[i + 1]; j++) {
            const code = flat[j];
            let bucket = buckets.get(code);
            if (!bucket) {
              bucket = [];
              buckets.set(code, bucket);
            }
            bucket.push(i);
          }
        }
        return [...buckets.keys()].sort((a, b) => a - b).map((code) => ({ code, indices: buckets.get(code) }));
      }

      function buildGroups(store, list, levels, depth, parentId, columns, sort) {
        const col = store.column(levels[depth]);
        const rows = store.rows;
        let groups = bucketBy(col, list).map(({ code, indices }) => {
          const value = col.values[code];
          const id = (parentId === null ? "" : parentId + "\u001f") + groupToken(value);
          const group = {
            id,
            level: depth + 1,
            key: levels[depth],
            value,
            count: indices.length,
            cells: groupCells(rows, indices, columns, true),
            indices: Uint32Array.from(indices),
            children: null,
          };
          if (depth + 1 < levels.length)
            group.children = buildGroups(store, group.indices, levels, depth + 1, id, columns, sort);
          return group;
        });
        if (sort && sort.key) {
          // groups by their cell of the sort column (sums, common text); "(leer)" stays last (REQ-006-AC5)
          const empty = groups.filter((g) => g.value === null);
          const named = groups.filter((g) => g.value !== null);
          groups = sortByValue(named, (g) => g.cells[sort.key], sort.dir).concat(empty);
        }
        return groups;
      }

      /**
       * Grouping view of the table (REQ-006, DEC-16, ASM-008). source: column store (or rows); indices: the rows
       * passing all filters in table order (sortRows); options: { levels: [key1, key2?] (one or two grouping
       * properties), columns: [{ key, mode: 'sum' | 'same' | 'none' }] (numeric columns sum, text columns show a value
       * equal in every element of the group, else null; 'none' e.g. numbers with mixed units), sort: { key, dir } |
       * null }.
       * Returns { levels, groups, total }: groups [{ id, level (1 | 2), key, value (null = "(leer)"), count, cells
       * { key -> value | null }, indices (rows of the group in table order), children (level-2 groups) | null }];
       * groups are in value order ("(leer)" last) or, with a sort, ordered by their cell of the sort column (empty
       * last, "(leer)" still last). An element with several values of a grouping property is in each of its groups
       * and counted and summed there; total { count, cells } counts and sums every element once (sums only).
       */
      export function groupRows(source, indices, options) {
        const store = asStore(source);
        const opts = options || {};
        const levels = (opts.levels || []).filter((k) => typeof k === "string" && k !== "").slice(0, GROUP_LEVELS);
        const columns = opts.columns || [];
        const list = indices || new Uint32Array(0);
        const groups = levels.length ? buildGroups(store, list, levels, 0, null, columns, opts.sort || null) : [];
        return {
          levels,
          groups,
          total: { count: list.length, cells: groupCells(store.rows, list, columns, false) },
        };
      }

      /**
       * Rows shown by the grouping view (REQ-006, REQ-008 export order): every level-1 group; under an expanded group
       * its level-2 groups, or its elements when it is the last level. isExpanded(group) decides. Returns
       * [{ type: 'group', group } | { type: 'element', index (row index), depth (1 | 2), parent (group) }].
       */
      export function groupDisplayRows(tree, isExpanded) {
        const out = [];
        const visit = (groups) => {
          for (const group of groups) {
            out.push({ type: "group", group });
            if (!isExpanded(group)) continue;
            if (group.children) visit(group.children);
            else for (const index of group.indices) out.push({ type: "element", index, depth: group.level, parent: group });
          }
        };
        if (tree) visit(tree.groups);
        return out;
      }

      /** Every group of a tree (both levels), depth first. */
      export function allGroups(tree) {
        const out = [];
        const visit = (groups) => {
          for (const g of groups) {
            out.push(g);
            if (g.children) visit(g.children);
          }
        };
        if (tree) visit(tree.groups);
        return out;
      }

      /**
       * Groups of a tree that contain the row with this index (REQ-007-AC2: expand them for a selected element), depth
       * first: each level-1 group with the row, followed by its level-2 groups with the row. A row with several values
       * of a grouping property (DEC-16) is in several groups of a level.
       */
      export function groupsOfRow(tree, rowIndex) {
        const out = [];
        const visit = (groups) => {
          for (const g of groups) {
            if (!g.indices.includes(rowIndex)) continue;
            out.push(g);
            if (g.children) visit(g.children);
          }
        };
        if (tree) visit(tree.groups);
        return out;
      }

      /**
       * Grouping state of the table (configuration part, REQ-009 "table view, grouping properties"; saved by TASK-007):
       * { view: 'single' | 'grouped', groupBy: [key1, key2?] }; duplicate, empty and (with a catalogue) unknown keys are
       * dropped, at most GROUP_LEVELS keys.
       */
      export function normaliseGrouping(state, catalog) {
        const view = state && state.view === "grouped" ? "grouped" : "single";
        const groupBy = [];
        for (const key of (state && Array.isArray(state.groupBy) ? state.groupBy : []).slice()) {
          if (typeof key !== "string" || key === "" || groupBy.includes(key)) continue;
          if (catalog && catalog.size && !catalog.has(key)) continue;
          if (groupBy.length < GROUP_LEVELS) groupBy.push(key);
        }
        return { view, groupBy };
      }

      // ---------------------------------------------------------------------------------------------------------
      // Header and configuration (TASK-007; REQ-011 title / date / logo, REQ-009 save and load, spec 4.3)
      // ---------------------------------------------------------------------------------------------------------

      /** Schema name of a configuration file; the full value is "calc-viewer-config/<version>" (REQ-009). */
      export const CONFIG_SCHEMA = "calc-viewer-config";
      export const CONFIG_VERSION = 1;
      /** Largest configuration file that is read at all (bytes; larger -> too-large, view unchanged). */
      export const CONFIG_MAX_BYTES = 20 * 1024 * 1024;
      /** Largest logo image file (bytes; REQ-011 "embedded": it travels in every configuration and viewer file). */
      export const LOGO_MAX_BYTES = 1024 * 1024;
      /** Longest title kept (characters). */
      export const TITLE_MAX_LENGTH = 200;
      /** At most this many entries per list in the load notice; the rest is counted ("und n weitere"). */
      export const NOTICE_LIST_LIMIT = 20;
      export const CONFIG_ERROR_CLASSES = ["invalid-json", "not-a-config", "unsupported-version", "too-large"];

      /** A configuration load error (REQ-009) with its class and German message. */
      export class ConfigError extends Error {
        constructor(configClass, detail) {
          super(configErrorMessage(configClass, detail));
          this.name = "ConfigError";
          this.configClass = configClass;
          this.detail = detail === undefined ? null : detail;
        }
      }

      /** German message of a configuration load error class (REQ-009); detail: the version for unsupported-version. */
      export function configErrorMessage(configClass, detail) {
        switch (configClass) {
          case "invalid-json":
            return "Die Datei ist kein g\u00fcltiges JSON.";
          case "not-a-config":
            return "Die Datei ist keine Calc-Viewer-Konfiguration.";
          case "unsupported-version":
            return "Konfigurationsversion " + detail + " wird nicht unterst\u00fctzt.";
          case "too-large":
            return (
              "Die Datei ist zu gro\u00df f\u00fcr eine Konfiguration (h\u00f6chstens " +
              formatBytes(CONFIG_MAX_BYTES) +
              ")."
            );
          default:
            return "Die Konfiguration konnte nicht geladen werden.";
        }
      }

      /** File size in German: "512 Bytes", "12 KB", "1,5 MB" (1 KB = 1024 bytes). */
      export function formatBytes(bytes) {
        if (bytes < 1024) return bytes + " Bytes";
        if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
        const mb = bytes / (1024 * 1024);
        return mb.toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " MB";
      }

      const isPlainObject = (x) => x !== null && typeof x === "object" && !Array.isArray(x);

      /**
       * Checks the schema of a parsed configuration (REQ-009): null when it is a supported configuration, else
       * { configClass, detail }. Missing or foreign schema (or no JSON object) -> not-a-config;
       * "calc-viewer-config/<n>" with n other than CONFIG_VERSION -> unsupported-version (n shown, at most 20 chars).
       */
      export function validateConfig(config) {
        if (!isPlainObject(config) || typeof config.schema !== "string") return { configClass: "not-a-config" };
        const prefix = CONFIG_SCHEMA + "/";
        if (config.schema.indexOf(prefix) !== 0 || config.schema.length === prefix.length)
          return { configClass: "not-a-config" };
        const version = config.schema.slice(prefix.length);
        if (version !== String(CONFIG_VERSION))
          return {
            configClass: "unsupported-version",
            detail: version.length > 20 ? version.slice(0, 20) + "\u2026" : version,
          };
        return null;
      }

      /** Parses the text of a configuration file; throws ConfigError (invalid-json, not-a-config, unsupported-version). */
      export function parseConfig(text) {
        let config;
        try {
          config = JSON.parse(String(text).replace(/^\ufeff/, ""));
        } catch {
          throw new ConfigError("invalid-json");
        }
        const problem = validateConfig(config);
        if (problem) throw new ConfigError(problem.configClass, problem.detail);
        return config;
      }

      const DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;

      /** True for an existing calendar date "YYYY-MM-DD" (years 1000..9999). */
      export function isIsoDate(text) {
        const m = typeof text === "string" ? DATE_RE.exec(text) : null;
        if (!m) return false;
        const y = Number(m[1]);
        const mo = Number(m[2]);
        const d = Number(m[3]);
        if (y < 1000 || mo < 1 || mo > 12 || d < 1) return false;
        return d <= new Date(Date.UTC(y, mo, 0)).getUTCDate();
      }

      /** Local calendar date of a Date as "YYYY-MM-DD" (REQ-011 default date: today). */
      export function isoDate(date) {
        const pad = (n) => String(n).padStart(2, "0");
        return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
      }

      /** "YYYY-MM-DD" shown in German as the UI shows dates ("12.8.2026", de-DE); other text unchanged. */
      export function germanDate(iso) {
        if (!isIsoDate(iso)) return String(iso || "");
        const [y, m, d] = iso.split("-").map(Number);
        return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("de-DE", { timeZone: "UTC" });
      }

      /**
       * Export file name (REQ-008, REQ-011): "<title>_<date><suffix>"; the characters \ / : * ? " < > | and control
       * characters of the title become "_", an empty title (after trimming) becomes "Export".
       */
      export function safeFileName(title, date, suffix) {
        // eslint-disable-next-line no-control-regex
        const clean = String(title === null || title === undefined ? "" : title).replace(/[\\/:*?"<>|\u0000-\u001f\u007f]/g, "_");
        const base = clean.trim() === "" ? "Export" : clean;
        return base + "_" + date + (suffix || "");
      }

      const LOGO_MIMES = ["image/png", "image/jpeg", "image/svg+xml"];
      const LOGO_DATA_RE = /^data:(image\/png|image\/jpeg|image\/svg\+xml);base64,([A-Za-z0-9+/]*={0,2})$/;

      /**
       * Checks a logo image file before it is read (REQ-011: PNG, JPG or SVG, embedded; at most LOGO_MAX_BYTES).
       * head: the first bytes of the file (Uint8Array or array of byte values; 4096 are enough for SVG). Returns
       * { mime } or { error } (German). The type is taken from the content (PNG / JPEG signature, or an <svg element
       * for SVG), not from the file name.
       */
      export function classifyLogo(fileName, size, head) {
        const bytes = head || [];
        const starts = (sig) => bytes.length >= sig.length && sig.every((b, i) => bytes[i] === b);
        if (size > LOGO_MAX_BYTES)
          return {
            error:
              "Das Logo " +
              fileName +
              " ist zu gro\u00df (" +
              formatBytes(size) +
              "). Erlaubt sind h\u00f6chstens " +
              formatBytes(LOGO_MAX_BYTES) +
              ".",
          };
        if (size > 0 && starts([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a])) return { mime: "image/png" };
        if (size > 0 && starts([0xff, 0xd8, 0xff])) return { mime: "image/jpeg" };
        let text = "";
        for (let i = 0; i < Math.min(bytes.length, 4096); i++) text += String.fromCharCode(bytes[i]);
        if (size > 0 && /<svg[\s>]/i.test(text)) return { mime: "image/svg+xml" };
        return { error: fileName + " ist kein PNG-, JPG- oder SVG-Bild." };
      }

      /** True for a logo data URL as the builder embeds it: PNG / JPG / SVG, base64, at most LOGO_MAX_BYTES decoded. */
      export function isLogoDataUrl(text) {
        if (typeof text !== "string") return false;
        const m = LOGO_DATA_RE.exec(text);
        if (!m || !LOGO_MIMES.includes(m[1]) || m[2].length === 0 || m[2].length % 4 !== 0) return false;
        const padding = m[2].endsWith("==") ? 2 : m[2].endsWith("=") ? 1 : 0;
        return (m[2].length / 4) * 3 - padding <= LOGO_MAX_BYTES;
      }

      /** A filter value as saved: text or finite number; null is the empty value `(leer)`. */
      const configValue = (v) => v === null || typeof v === "string" || (typeof v === "number" && Number.isFinite(v));

      /**
       * The configuration object saved by `Konfiguration speichern` (REQ-009), from the current state:
       * { header { title, date, logo }, filterSets [{ key, collapsed, selected }], table { view, groupBy, columns
       * [{ key, width }], sort, columnFilters }, display { mode, colourBy, section } }. Fixed field order, so equal
       * states give equal JSON text. The expanded state of groups, the selection and the models are not part of it.
       */
      export function buildConfig(state) {
        const header = state.header || {};
        const table = state.table || {};
        const grouping = state.grouping || {};
        const display = state.display || {};
        const section = display.section;
        return {
          schema: CONFIG_SCHEMA + "/" + CONFIG_VERSION,
          header: {
            title: typeof header.title === "string" ? header.title : "",
            date: header.date,
            logo: header.logo || null,

          filterSets: (state.filterSets || []).map((s) => ({
            key: s.key,
            collapsed: Boolean(s.collapsed),
            selected: (s.selected || []).map((v) => (v === undefined ? null : v)),

            groupBy: (grouping.groupBy || []).slice(),
            columns: (table.columns || []).map((c) => ({ key: c.key, width: c.width })),
            sort: table.sort ? { key: table.sort.key, dir: table.sort.dir } : null,
            columnFilters: (table.columnFilters || []).map((f) =>

      const CONFIG_FIELDS = {

        display: ["mode", "colourBy", "section"],

      /**
       * Tolerant apply of a parsed, valid configuration to the loaded models (REQ-009, REQ-009-AC2). ctx:
       * { has(key) -> property in the loaded models, hasValue(key, value) -> some element has that value (null = an
       * empty one), columns (current column keys, used when the file has no columns) }.
       * Returns { apply, skipped }. apply holds only the parts the file defines (a missing part keeps the current
       * state): header { title?, date?, logo? }, filterSets, table { view?, groupBy?, columns?, sort?, columnFilters? },
       * display { mode?, colourBy?, section? }. skipped lists what is not applied: properties (keys missing from the
       * loaded models), values ([{ key, value }] filter values no element has), invalid (German names of malformed
       * entries) and unknown (unknown field names). "" in a saved selection is the empty value null (TASK-003 D3).
       */
      export function applyConfig(config, ctx) {
        const skipped = { properties: [], values: [], invalid: [], unknown: [] };
        const missing = (key) => {
          if (!skipped.properties.includes(key)) skipped.properties.push(key);
        };
        const invalid = (what) => {
          if (!skipped.invalid.includes(what)) skipped.invalid.push(what);
        };
        const unknownFields = (obj, path) => {
          if (!isPlainObject(obj)) return;
          for (const name of Object.keys(obj))
            if (!CONFIG_FIELDS[path].includes(name)) skipped.unknown.push(path ? path + "." + name : name);
        };
        const has = (key) => typeof key === "string" && key !== "" && ctx.has(key);
        const skippedValues = new Map(); // key -> Set of values already in skipped.values (linear in the values)
        /** The values of a saved selection that the loaded models have; the rest goes to skipped.values. */
        const selection = (key, values, what) => {
          const out = [];
          if (!Array.isArray(values)) {
            if (values !== undefined) invalid(what);
            return out;
          }
          const seen = new Set();
          if (!skippedValues.has(key)) skippedValues.set(key, new Set());
          const skippedOfKey = skippedValues.get(key);
          for (const raw of values) {
            const value = raw === "" ? null : raw;
            if (!configValue(value)) {
              invalid(what);
              continue;
            }
            if (seen.has(value)) continue;
            seen.add(value);
            if (ctx.hasValue(key, value)) out.push(value);
            else if (!skippedOfKey.has(value)) {

              skipped.values.push({ key, value });
            }
          }

        };
        const apply = {};
        unknownFields(config, "");

        // header (REQ-011)
        if (config.header !== undefined) {
          const header = {};
          if (!isPlainObject(config.header)) invalid("Kopfzeile");
          else {
            unknownFields(config.header, "header");
            const h = config.header;
            if (typeof h.title === "string") header.title = h.title.slice(0, TITLE_MAX_LENGTH);
            else if (h.title !== undefined) invalid("Titel");
            if (isIsoDate(h.date)) header.date = h.date;
            else if (h.date !== undefined) invalid("Datum");
            if (h.logo === null || isLogoDataUrl(h.logo)) header.logo = h.logo;
            else if (h.logo !== undefined) invalid("Logo");

          apply.header = header;
        }

        // filter sets: keys in order, collapsed state, checked values (REQ-003-AC2, REQ-004)
        if (config.filterSets !== undefined) {
          if (!Array.isArray(config.filterSets)) invalid("Filters\u00e4tze");
          else {
            apply.filterSets = [];
            for (const s of config.filterSets) {
              if (!isPlainObject(s) || typeof s.key !== "string" || s.key === "") {
                invalid("Filters\u00e4tze");
                continue;
              }
              if (apply.filterSets.some((x) => x.key === s.key)) continue;
              if (!has(s.key)) {
                missing(s.key);
                continue;
              }
              if (s.collapsed !== undefined && typeof s.collapsed !== "boolean") invalid("Filtersatz " + s.key);
              apply.filterSets.push({
                key: s.key,
                collapsed: s.collapsed === true,
                selected: selection(s.key, s.selected, "Filtersatz " + s.key),
              });
            }
          }
        }

        // table: view, grouping, columns, sort, column filters (REQ-006-AC6, REQ-009)
        if (config.table !== undefined) {
          const table = {};
          if (!isPlainObject(config.table)) invalid("Tabelle");
          else {
            const t = config.table;
            unknownFields(t, "table");
            if (t.view === "single" || t.view === "grouped") table.view = t.view;
            else if (t.view !== undefined) invalid("Tabellenansicht");
            if (Array.isArray(t.groupBy)) {
              table.groupBy = [];
              for (const key of t.groupBy) {
                if (typeof key !== "string" || key === "") invalid("Gruppierung");
                else if (!has(key)) missing(key);
                else if (!table.groupBy.includes(key) && table.groupBy.length < GROUP_LEVELS) table.groupBy.push(key);
              }
            } else if (t.groupBy !== undefined) invalid("Gruppierung");
            if (Array.isArray(t.columns)) {
              const list = [];
              for (const c of t.columns) {
                const key = typeof c === "string" ? c : isPlainObject(c) ? c.key : undefined;
                if (typeof key !== "string" || key === "") invalid("Spalten");
                else if (!has(key)) missing(key);
                else list.push(c);
              }
              table.columns = normaliseColumns(list, null);
            } else if (t.columns !== undefined) invalid("Spalten");
            const columnKeys = new Set(table.columns ? table.columns.map((c) => c.key) : ctx.columns || []);
            if (t.sort === null) table.sort = null;
            else if (isPlainObject(t.sort) && typeof t.sort.key === "string" && (t.sort.dir === "asc" || t.sort.dir === "desc")) {
              if (!has(t.sort.key)) missing(t.sort.key);
              else if (!columnKeys.has(t.sort.key)) invalid("Sortierung");
              else table.sort = { key: t.sort.key, dir: t.sort.dir };
            } else if (t.sort !== undefined) invalid("Sortierung");
            if (Array.isArray(t.columnFilters)) {
              table.columnFilters = [];
              for (const f of t.columnFilters) {
                if (!isPlainObject(f) || typeof f.key !== "string" || f.key === "") {
                  invalid("Spaltenfilter");
                  continue;
                }
                const what = "Spaltenfilter " + f.key;
                if (table.columnFilters.some((x) => x.key === f.key)) continue;
                if (!has(f.key)) {
                  missing(f.key);
                  continue;
                }
                if (!columnKeys.has(f.key)) {
                  invalid(what);
                  continue;
                }
                if (f.type === "range") {
                  const bound = (b) => (b === null || b === undefined ? null : typeof b === "number" && Number.isFinite(b) ? b : undefined);
                  const min = bound(f.min);
                  const max = bound(f.max);
                  if (min === undefined || max === undefined || (min === null && max === null)) invalid(what);
                  else table.columnFilters.push({ key: f.key, type: "range", min, max });
                } else if (f.type === "values") {
                  const values = selection(f.key, f.values, what);
                  if (values.length) table.columnFilters.push({ key: f.key, type: "values", values });
                } else invalid(what);
              }
            } else if (t.columnFilters !== undefined) invalid("Spaltenfilter");
          }
          apply.table = table;
        }

        // model display: ghost / hide, colouring property, section (REQ-005, REQ-009)
        if (config.display !== undefined) {
          const display = {};
          if (!isPlainObject(config.display)) invalid("Modelldarstellung");
          else {
            const d = config.display;
            unknownFields(d, "display");
            if (d.mode === "ghost" || d.mode === "hide") display.mode = d.mode;
            else if (d.mode !== undefined) invalid("Elemente au\u00dferhalb des Filters");
            if (d.colourBy === null) display.colourBy = null;
            else if (typeof d.colourBy === "string" && d.colourBy !== "") {
              if (has(d.colourBy)) display.colourBy = d.colourBy;
              else missing(d.colourBy);
            } else if (d.colourBy !== undefined) invalid("F\u00e4rben nach");
            const s = d.section;
            if (s === null) display.section = null;
            else if (
              isPlainObject(s) &&
              (s.axis === "X" || s.axis === "Y" || s.axis === "Z") &&
              typeof s.offset === "number" &&
              Number.isFinite(s.offset) &&
              (s.flipped === undefined || typeof s.flipped === "boolean")
            )
              display.section = { axis: s.axis, offset: s.offset, flipped: s.flipped === true };
            else if (s !== undefined) invalid("Schnitt");
          }
          apply.display = display;
        }
        return { apply, skipped };
      }

      /** True when applyConfig skipped anything (the notice is shown). */
      export function configSkippedAnything(skipped) {
        return Boolean(
          skipped.properties.length || skipped.values.length || skipped.invalid.length || skipped.unknown.length,
        );
      }

      /**
       * German notice of a tolerant load (REQ-009-AC2): the properties and filter values missing from the loaded
       * models, malformed and unknown entries; each list capped at NOTICE_LIST_LIMIT ("und n weitere").
       * label(key) gives the property label for values (filter set / column title). null when nothing was skipped.
       */
      export function configNotice(skipped, label) {
        if (!configSkippedAnything(skipped)) return null;
        const name = label || ((key) => key);
        const list = (items) => {
          const shown = items.slice(0, NOTICE_LIST_LIMIT).join("; ");
          const more = items.length - NOTICE_LIST_LIMIT;
          return more > 0 ? shown + " und " + more.toLocaleString("de-DE") + " weitere" : shown;
        };
        const valueText = (v) =>
          v === null ? EMPTY_LABEL : typeof v === "number" ? v.toLocaleString("de-DE", { maximumFractionDigits: 6 }) : v;
        const lines = ["Konfiguration geladen. Nicht angewendet:"];
        if (skipped.properties.length)
          lines.push("Eigenschaften, die in den geladenen Modellen fehlen: " + list(skipped.properties) + ".");
        if (skipped.values.length)
          lines.push(
            "Filterwerte, die in den geladenen Modellen fehlen: " +
              list(skipped.values.map((s) => name(s.key) + " = " + valueText(s.value))) +
              ".",
          );
        if (skipped.invalid.length) lines.push("Ung\u00fcltige Angaben: " + list(skipped.invalid) + ".");
        if (skipped.unknown.length) lines.push("Unbekannte Angaben: " + list(skipped.unknown) + ".");
        return lines.join("\n");
      }
    </script>

    <!-- DOM: layout, model list, messages, progress and status (builder and viewer file). ASCII only. -->
    <script type="text/plain" id="cv-ui-src">

      // Inline SVG icons (constant markup only; values from the model are always set as text, never as HTML).

      /**
       * Virtualised list (REQ-004 "render only the visible entries", NFR-001): a scroll box with a spacer of the full

       * { className, rowHeight, maxRows (auto height up to this many rows; 0 = height from CSS), createRow() -> node,

        const spacer = el("div", "cv-vspacer");

        const down = iconButton("down", "", "cv-fs-down");
        const remove = iconButton("close", "", "cv-fs-remove");
        head.append(grip, toggle, titleNode, unitNode, badge, reset, up, down, remove);

        const body = el("div", "cv-fs-body");
        const search = el("label", "cv-search cv-fs-search");
        const searchInput = el("input");
        searchInput.type = "search";
        searchInput.placeholder = "Werte suchen";
        search.append(icon("search"), searchInput);
        const empty = el("p", "cv-hint cv-fs-empty");
        const list = createVirtualList({
          className: "cv-fs-values",
          rowHeight: VALUE_ROW_HEIGHT,
          maxRows: VALUE_MAX_ROWS,
          createRow() {
            const row = el("label", "cv-fs-value");
            const box = el("input");
            box.type = "checkbox";
            const dot = el("span", "cv-dot");
            dot.setAttribute("aria-hidden", "true");
            row.append(box, dot, el("span", "cv-fs-label"), el("span", "cv-fs-count"));
            return row;
          },
          updateRow(row, item) {
            const [box, dot, label, count] = row.children;
            const text = valueLabel(item.value);
            box.checked = item.checked;
            box.setAttribute("aria-label", text);
            row.classList.toggle("cv-checked", item.checked);
            row.classList.toggle("cv-zero", item.count === 0);
            dot.style.background = item.colour || "";
            dot.classList.toggle("cv-dot-on", Boolean(item.colour));
            label.textContent = text;
            label.title = text;
            label.classList.toggle("cv-empty-value", item.value === null);
            count.textContent = formatCount(item.count);
          },
        });
        body.append(search, list.element, empty);
        root.append(head, body);

        let facet = { values: [], checkedCount: 0, total: 0 };
        let query = "";

        function applySearch(resetScroll) {
          let shown = facet.values;
          if (query) {
            shown = [];
            for (const item of facet.values) if (valueLabel(item.value).toLowerCase().includes(query)) shown.push(item);
          }
          list.setItems(shown, resetScroll);
          empty.hidden = shown.length > 0;
          empty.textContent = facet.values.length ? "Keine Treffer." : "Keine Werte.";
          list.element.hidden = shown.length === 0;
        }

        function setTitle(text, unit) {
          title = text;
          titleNode.textContent = text;
          titleNode.title = text;
          unitNode.textContent = unit ? "(" + unit + ")" : "";
          const set = (button, label) => {
            button.title = label;
            button.setAttribute("aria-label", label + ": " + text);
          };
          set(reset, "Auswahl zur\u00fccksetzen");
          set(up, "Filtersatz nach oben");
          set(down, "Filtersatz nach unten");
          set(remove, "Filtersatz entfernen");
          searchInput.setAttribute("aria-label", "Werte suchen: " + text);
          setCollapsed(root.classList.contains("cv-collapsed"));
        }

        function setCollapsed(collapsed) {
          root.classList.toggle("cv-collapsed", collapsed);
          body.hidden = collapsed;
          toggle.setAttribute("aria-expanded", String(!collapsed));
          const label = collapsed ? "Filtersatz ausklappen" : "Filtersatz einklappen";
          toggle.title = label;
          toggle.setAttribute("aria-label", label + ": " + title);
          if (!collapsed) list.render();
        }

        list.element.addEventListener("change", (event) => {
          const item = list.itemOf(event.target);
          if (item) handlers.toggle(id, item.value, event.target.checked);
        });
        searchInput.addEventListener("input", () => {
          query = searchInput.value.trim().toLowerCase();
          applySearch(true);
        });
        toggle.addEventListener("click", () => handlers.collapse(id, !root.classList.contains("cv-collapsed")));
        reset.addEventListener("click", () => handlers.resetSet(id));
        up.addEventListener("click", () => handlers.step(id, -1));
        down.addEventListener("click", () => handlers.step(id, 1));
        remove.addEventListener("click", () => handlers.remove(id));

        setTitle(spec.title, spec.unit);
        setCollapsed(Boolean(spec.collapsed));

        return {
          id,
          root,
          head,
          setTitle,
          setCollapsed,
          setPosition(index, count) {
            up.disabled = index === 0;
            down.disabled = index === count - 1;
          },
          /** New values and counts of this set (facetCounts entry); keeps the search and the scroll position. */
          update(next) {
            facet = next || { values: [], checkedCount: 0, total: 0 };
            badge.textContent = facet.checkedCount ? String(facet.checkedCount) : "";
            badge.hidden = !facet.checkedCount;
            badge.title = facet.checkedCount + " ausgew\u00e4hlt";
            reset.disabled = !facet.checkedCount;
            applySearch(false);
          },
        };
      }

      /**
       * Filter area (REQ-003, REQ-004): "+ Filtersatz", "Alle Filter zuruecksetzen" and the filter sets in order.
       * handlers: { add(), toggle(id, value, checked), resetSet(id), resetAll(), move(id, toIndex), step(id, delta),
       * remove(id), collapse(id, collapsed) }.
       */
      function createFilterArea(container, handlers) {
        const head = el("div", "cv-fa-head");
        const heading = el("h2", "", "Filter");
        const add = el("button", "cv-link cv-fa-add");
        add.type = "button";
        add.id = "cv-add-filterset";
        add.append(icon("plus"), document.createTextNode("Filtersatz"));
        add.setAttribute("aria-label", "+ Filtersatz");
        add.title = "Filtersatz hinzuf\u00fcgen";
        head.append(heading, add);
        const resetAll = el("button", "cv-link cv-fa-reset", "Alle Filter zur\u00fccksetzen");
        resetAll.type = "button";
        resetAll.id = "cv-reset-all";
        resetAll.disabled = true;
        const list = el("div", "cv-fa-sets");
        list.id = "cv-filtersets";
        container.append(head, resetAll, list);
        add.addEventListener("click", () => handlers.add());
        resetAll.addEventListener("click", () => handlers.resetAll());

        const sets = new Map(); // id -> component
        let order = [];
        let dragId = null;
        const DRAG_TYPE = "application/x-cv-filterset";

        function clearDropMarks() {
          for (const set of sets.values()) set.root.classList.remove("cv-drop-before", "cv-drop-after", "cv-dragging");
        }

        /*
         * Auto-scroll while a set is dragged: the pointer within EDGE px of the top/bottom edge of the scrolling
         * panel scrolls it (faster closer to the edge), so a target scrolled out of view can be reached. Driven by
         * dragover (fired repeatedly during a drag); stops on dragend/drop or when dragover events stop.
         */
        const EDGE = 48;
        const MAX_STEP = 18; // px per frame at the very edge
        const auto = { scroller: null, step: 0, last: 0, frame: 0 };
        function scrollerOf(node) {
          for (let n = node.parentElement; n; n = n.parentElement) {
            const style = getComputedStyle(n);
            if (/(auto|scroll)/.test(style.overflowY) && n.scrollHeight > n.clientHeight) return n;
          }
          return null;
        }
        function autoTick() {
          auto.frame = 0;
          if (dragId === null || !auto.scroller || auto.step === 0 || performance.now() - auto.last > 400) return;
          auto.scroller.scrollTop += auto.step;
          auto.frame = requestAnimationFrame(autoTick);
        }
        function autoScroll(event) {
          if (dragId === null || !auto.scroller) return;
          const box = auto.scroller.getBoundingClientRect();
          const top = event.clientY - box.top;
          const bottom = box.bottom - event.clientY;
          let step = 0;
          if (top >= 0 && top < EDGE) step = -Math.ceil(((EDGE - top) / EDGE) * MAX_STEP);
          else if (bottom >= 0 && bottom < EDGE) step = Math.ceil(((EDGE - bottom) / EDGE) * MAX_STEP);
          auto.step = step;
          auto.last = performance.now();
          if (step !== 0 && !auto.frame) auto.frame = requestAnimationFrame(autoTick);
        }
        function stopAutoScroll() {
          if (auto.frame) cancelAnimationFrame(auto.frame);
          if (auto.scroller) auto.scroller.removeEventListener("dragover", autoScroll);
          auto.scroller = null;
          auto.step = 0;
          auto.frame = 0;
        }

        function wireDrag(set) {
          set.head.addEventListener("dragstart", (event) => {
            dragId = set.id;
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData(DRAG_TYPE, set.id);
            event.dataTransfer.setData("text/plain", set.id);
            set.root.classList.add("cv-dragging");
            stopAutoScroll();
            auto.scroller = scrollerOf(container);
            if (auto.scroller) auto.scroller.addEventListener("dragover", autoScroll);
          });
          set.head.addEventListener("dragend", () => {
            dragId = null;
            stopAutoScroll();
            clearDropMarks();
          });
          set.root.addEventListener("dragover", (event) => {
            if (dragId === null) return;
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
            const box = set.root.getBoundingClientRect();
            const before = event.clientY < box.top + box.height / 2;
            set.root.classList.toggle("cv-drop-before", before);
            set.root.classList.toggle("cv-drop-after", !before);
          });
          set.root.addEventListener("dragleave", (event) => {
            if (!set.root.contains(event.relatedTarget)) set.root.classList.remove("cv-drop-before", "cv-drop-after");
          });
          set.root.addEventListener("drop", (event) => {
            if (dragId === null) return;
            event.preventDefault();
            const box = set.root.getBoundingClientRect();
            const before = event.clientY < box.top + box.height / 2;
            const source = dragId;
            dragId = null;
            stopAutoScroll();
            clearDropMarks();
            if (source === set.id) return;
            const from = order.indexOf(source);
            let to = order.indexOf(set.id) + (before ? 0 : 1);
            if (from < to) to--;
            if (from !== to) handlers.move(source, to);
          });
        }

        return {
          /** Shows the sets [{ id, key, title, unit, collapsed }] in this order (components are kept, not rebuilt). */
          setSets(specs) {
            const keep = new Set(specs.map((s) => s.id));
            for (const [id, set] of sets)
              if (!keep.has(id)) {
                set.root.remove();
                sets.delete(id);
              }
            order = specs.map((s) => s.id);
            specs.forEach((spec, index) => {
              let set = sets.get(spec.id);
              if (!set) {
                set = createFilterSet(spec, handlers);
                wireDrag(set);
                sets.set(spec.id, set);
              } else {
                set.setTitle(spec.title, spec.unit);
                set.setCollapsed(Boolean(spec.collapsed));
              }
              set.setPosition(index, specs.length);
              if (list.children[index] !== set.root) list.insertBefore(set.root, list.children[index] || null);
            });
          },
          /** Values and counts per set (Map id -> facetCounts entry); anyActive enables the reset-all button. */
          update(facets, anyActive) {
            for (const [id, set] of sets) set.update(facets.get(id));
            resetAll.disabled = !anyActive;
          },
        };
      }

      const CATALOG_ROW_HEIGHT = 32;

      /** Name of a catalogue entry inside its group (the pset prefix is shown by the group header). */
      function entryName(entry) {
        const pset = entry.group.indexOf("Typ: ") === 0 ? entry.group.slice(5) : entry.group;
        return entry.label.indexOf(pset + ".") === 0 ? entry.label.slice(pset.length + 1) : entry.label;
      }

      /**
       * Property catalogue dialog (REQ-003): search, entries grouped (`Allgemein` first, then pset names, as the
       * catalogue orders them) with their element counts, virtualised for thousands of entries. entries: catalogue
       * entries in order; used: Set of keys that already have a filter set; onPick(key). extra (optional): { keepOpen
       * (picking an entry keeps the dialog open and refreshes the list, e.g. to add several columns), top (node shown
       * above the search field), usedNote (label of used entries), usedLabel (accessible suffix of used entries),
       * className, onClose() }.
       */
      function openCatalogue(host, entries, used, onPick, titleText, extra) {
        const opts = extra || {};
        const backdrop = el("div", "cv-backdrop");
        const dialog = el("div", "cv-dialog cv-catalogue" + (opts.className ? " " + opts.className : ""));
        dialog.setAttribute("role", "dialog");
        dialog.setAttribute("aria-modal", "true");
        dialog.setAttribute("aria-labelledby", "cv-catalogue-title");
        const head = el("div", "cv-dialog-head");
        const title = el("div", "cv-dialog-title", titleText || "Filtersatz hinzuf\u00fcgen");
        title.id = "cv-catalogue-title";
        const close = iconButton("close", "Schlie\u00dfen", "cv-dialog-close");
        head.append(title, close);
        const body = el("div", "cv-dialog-body");
        const search = el("label", "cv-search");
        const input = el("input");
        input.type = "search";
        input.placeholder = "Eigenschaft suchen";
        input.setAttribute("aria-label", "Eigenschaft suchen");
        search.append(icon("search"), input);
        const list = createVirtualList({
          className: "cv-cat-list",
          rowHeight: CATALOG_ROW_HEIGHT,
          maxRows: 0,
          createRow() {
            const row = el("button", "cv-cat-row");
            row.type = "button";
            row.append(el("span", "cv-cat-name"), el("span", "cv-cat-note"), el("span", "cv-cat-count"));
            return row;
          },
          updateRow(row, item) {
            const [name, note, count] = row.children;
            if (item.group !== undefined) {
              row.className = "cv-cat-row cv-cat-group cv-vrow";
              row.disabled = true;
              row.tabIndex = -1;
              delete row.dataset.key;
              row.removeAttribute("aria-label");
              row.removeAttribute("title");
              name.textContent = item.group;
              note.textContent = "";
              count.textContent = "";
              return;
            }
            const entry = item.entry;
            const isUsed = used.has(entry.key);
            row.className = "cv-cat-row cv-cat-entry cv-vrow" + (isUsed ? " cv-used" : "");
            row.disabled = isUsed;
            row.tabIndex = 0;
            row.dataset.key = entry.key;
            row.title = entry.header;
            row.setAttribute(
              "aria-label",
              entry.label +
                ", " +
                formatCount(entry.count) +
                " Elemente" +
                (isUsed ? ", " + (opts.usedLabel || "bereits als Filtersatz") : ""),
            );
            name.textContent = entryName(entry);
            note.textContent = isUsed ? opts.usedNote || "vorhanden" : "";
            count.textContent = formatCount(entry.count);
          },
        });
        const info = el("p", "cv-hint cv-cat-info");
        if (opts.top) body.append(opts.top);
        body.append(search, list.element, info);
        dialog.append(head, body);
        backdrop.append(dialog);
        host.append(backdrop);

        function build() {
          const query = input.value.trim().toLowerCase();
          const items = [];
          let group = null;
          let matches = 0;
          for (const entry of entries) {
            if (
              query &&
              entry.label.toLowerCase().indexOf(query) === -1 &&
              entry.group.toLowerCase().indexOf(query) === -1
            )
              continue;
            if (entry.group !== group) {
              group = entry.group;
              items.push({ group });
            }
            items.push({ entry });
            matches++;
          }
          list.setItems(items, !opts.keepOpen);
          if (!entries.length) info.textContent = "Keine Eigenschaften. Zuerst ein IFC-Modell laden.";
          else if (!matches) info.textContent = "Keine Treffer.";
          else info.textContent = formatCount(matches) + " von " + formatCount(entries.length) + " Eigenschaften";
        }

        function onKey(event) {
          if (event.key !== "Escape") return;
          event.preventDefault(); // handled: Escape closes the dialog only (it does not clear the 3D selection)
          finish();
        }
        let open = true;
        function finish() {
          if (!open) return;
          open = false;
          document.removeEventListener("keydown", onKey, true);
          backdrop.remove();
          if (opts.onClose) opts.onClose();
        }
        document.addEventListener("keydown", onKey, true);
        backdrop.addEventListener("click", (event) => {
          if (event.target === backdrop) finish();
        });
        close.addEventListener("click", finish);
        input.addEventListener("input", build);
        list.element.addEventListener("click", (event) => {
          const row = event.target.closest(".cv-cat-entry");
          if (!row || row.disabled) return;
          const key = row.dataset.key;
          if (opts.keepOpen) {
            onPick(key);
            build();
            return;
          }
          finish();
          onPick(key);
        });
        build();
        input.focus();
        return { close: finish, element: dialog, refresh: build };
      }

      /**
       * 3D view controls (REQ-005; top right of the model): `Elemente ausserhalb des Filters: Geist | Ausblenden`,
       * `Faerben nach`, `Schnitt` (axis X / Y / Z; while a section is active a panel under it holds slider, flip and
       * remove, so the bar stays one row at 1280 px, TASK-005 L4) and `Ansicht einpassen`. The legend is placed in
       * legendHost under the canvas (spec "legend under the model"; it never covers geometry, TASK-005 L1).
       * handlers: { mode(m), pickColour(), clearColour(), section(axis | null), sectionOffset(value), flip(), fit() }.
       */
      function createViewControls(viewport, legendHost, handlers) {
        const bar = el("div", "cv-view-bar");
        bar.id = "cv-view-bar";

        const modeBox = el("div", "cv-view-group");
        const modeLabel = el("span", "cv-view-label", "Elemente au\u00dferhalb des Filters:");
        modeLabel.id = "cv-mode-label";
        const seg = el("div", "cv-seg");
        seg.setAttribute("role", "radiogroup");
        seg.setAttribute("aria-labelledby", "cv-mode-label");
        const modeButtons = {};
        for (const [value, text] of [
          ["ghost", "Geist"],
          ["hide", "Ausblenden"],
        ]) {
          const button = el("button", "cv-seg-btn", text);
          button.type = "button";
          button.dataset.mode = value;
          button.setAttribute("role", "radio");
          button.addEventListener("click", () => handlers.mode(value));
          modeButtons[value] = button;
          seg.append(button);
        }
        modeBox.append(modeLabel, seg);

        const colourBox = el("div", "cv-view-group");
        const colourButton = el("button", "cv-colour-btn");
        colourButton.type = "button";
        colourButton.id = "cv-colour";
        const colourText = el("span", "cv-colour-text");
        colourButton.append(icon("palette"), colourText);
        colourButton.addEventListener("click", () => handlers.pickColour());
        const colourClear = iconButton("close", "F\u00e4rbung entfernen", "cv-colour-clear");
        colourClear.id = "cv-colour-clear";
        colourClear.addEventListener("click", () => handlers.clearColour());
        colourBox.append(colourButton, colourClear);

        const sectionBox = el("div", "cv-view-group cv-section");
        const sectionLabel = el("span", "cv-view-label cv-section-label", "Schnitt");
        sectionLabel.id = "cv-section-label";
        sectionLabel.prepend(icon("scissors"));
        const axisSeg = el("div", "cv-seg");
        axisSeg.setAttribute("role", "radiogroup");
        axisSeg.setAttribute("aria-labelledby", "cv-section-label");
        const axisButtons = {};
        for (const axis of ["X", "Y", "Z"]) {
          const button = el("button", "cv-seg-btn", axis);
          button.type = "button";
          button.setAttribute("role", "radio");
          button.setAttribute("aria-label", "Schnitt " + axis);
          button.addEventListener("click", () => handlers.section(axis));
          axisButtons[axis] = button;
          axisSeg.append(button);
        }
        const slider = el("input", "cv-section-slider");
        slider.type = "range";
        slider.id = "cv-section-slider";
        slider.setAttribute("aria-label", "Schnittposition");
        slider.addEventListener("input", () => handlers.sectionOffset(Number(slider.value)));
        const flip = iconButton("flip", "Schnitt umkehren", "cv-section-flip");
        flip.id = "cv-section-flip";
        flip.addEventListener("click", () => handlers.flip());
        const sectionOff = iconButton("close", "Schnitt entfernen", "cv-section-off");
        sectionOff.id = "cv-section-off";
        sectionOff.addEventListener("click", () => handlers.section(null));
        const sectionPanel = el("div", "cv-section-panel");
        sectionPanel.id = "cv-section-panel";
        sectionPanel.append(slider, flip, sectionOff);
        sectionBox.append(sectionLabel, axisSeg, sectionPanel);

        const fit = el("button", "cv-view-btn cv-fit");
        fit.type = "button";
        fit.id = "cv-fit";
        fit.title = "Ansicht einpassen";
        fit.append(icon("fit"), el("span", "cv-fit-text", "Ansicht einpassen"));
        fit.addEventListener("click", () => handlers.fit());

        bar.append(modeBox, colourBox, sectionBox, fit);

        const legend = el("div", "cv-legend");
        legend.id = "cv-legend";
        legend.hidden = true;
        const legendTitle = el("div", "cv-legend-title");
        const legendList = el("ul", "cv-legend-list");
        legend.append(legendTitle, legendList);
        let legendKey = null; // title of the colouring the legend's kept height belongs to
        viewport.append(bar);
        legendHost.append(legend);

        return {
          element: bar,
          setMode(mode) {
            for (const [value, button] of Object.entries(modeButtons)) {
              button.setAttribute("aria-checked", String(value === mode));
              button.classList.toggle("cv-on", value === mode);
            }
          },
          /** Label of the colouring property, or null (no colouring). */
          setColouring(label) {
            const text = label ? "F\u00e4rben nach: " + label : "F\u00e4rben nach";
            // active: small `Faerben nach` over the property (two short lines keep the bar one row, L4)
            if (label) colourText.replaceChildren(el("span", "cv-colour-kicker", "F\u00e4rben nach"), el("span", "cv-colour-value", label));
            else colourText.replaceChildren(document.createTextNode(text));
            colourButton.title = text;
            colourButton.setAttribute("aria-label", text);
            colourBox.classList.toggle("cv-on", Boolean(label));
            colourClear.hidden = !label;
          },
          /** Section { axis, offset, flipped } | null with the slider range { min, max } of the axis. */
          setSection(section, range) {
            for (const [axis, button] of Object.entries(axisButtons)) {
              const on = Boolean(section) && section.axis === axis;
              button.setAttribute("aria-checked", String(on));
              button.classList.toggle("cv-on", on);
            }
            sectionBox.classList.toggle("cv-on", Boolean(section));
            sectionPanel.hidden = !section;
            if (section && range) {
              slider.min = String(range.min);
              slider.max = String(range.max);
              slider.step = String((range.max - range.min) / 1000 || 0.001);
              slider.value = String(section.offset);
              flip.setAttribute("aria-pressed", String(section.flipped));
              flip.classList.toggle("cv-on", section.flipped);
            }
          },
          /**
           * Legend under the model: { title, entries [{ label, colour, count, kind }] } or null. Values are text
           * (labels from the model are set with textContent).
           */
          setLegend(data) {
            legend.hidden = !data;
            legendList.replaceChildren();
            if (!data || data.title !== legendKey) {
              // a new colouring starts with its own height
              legend.style.minHeight = "";
              legendKey = data ? data.title : null;
            }
            if (!data) return;
            legendTitle.textContent = data.title;
            for (const entry of data.entries) {
              const item = el("li", "cv-legend-item");
              item.dataset.colour = entry.colour;
              item.dataset.kind = entry.kind;
              const dot = el("span", "cv-dot cv-dot-on");
              dot.style.background = entry.colour;
              dot.setAttribute("aria-hidden", "true");
              const label = el("span", "cv-legend-label", entry.label);
              label.title = entry.label;
              label.classList.toggle("cv-empty-value", entry.kind === "empty" || entry.kind === "multi");
              item.append(dot, label, el("span", "cv-legend-count", formatCount(entry.count)));
              legendList.append(item);
            }
            if (!data.entries.length) legendList.append(el("li", "cv-hint", "Keine Elemente im Filter."));
            /*
             * The legend strip is part of the model area: a shorter legend would resize the 3D canvas, and a canvas
             * resize redraws the whole view (about 280 ms in software WebGL) on every filter click. So during one
             * colouring the legend keeps the largest height it had (NFR-001).
             */
            const height = legend.offsetHeight;
            if (height > (parseFloat(legend.style.minHeight) || 0)) legend.style.minHeight = height + "px";
          },
        };
      }

      const TABLE_ROW_HEIGHT = 28;
      const TABLE_HEAD_HEIGHT = 34;
      const TABLE_OVERSCAN_ROWS = 8;
      const TABLE_OVERSCAN_PX = 240; // columns rendered beyond the visible width on each side
      const RESIZE_STEP = 16; // px per arrow key on a column's resize handle

      /** Pseudo columns of the grouping view (TASK-006b): the group value and the element count. */
      export const GROUP_COLUMN = "@gruppe";
      export const COUNT_COLUMN = "@anzahl";
      const GROUP_INDENT = 18; // px per level in the `Gruppe` column (REQ-006-AC3)

      /**
       * Table (REQ-006): a header row (sticky) and virtualised body rows. Only the rows near the visible window exist
       * (pool, as createVirtualList), and within a row only the cells of the columns near the visible width (many
       * columns stay cheap). Header cell: label (click = sort asc -> desc -> none), sort indicator, column filter
       * button, drag to move (HTML5 drag and drop), resize handle (pointer drag or arrow keys); `fixed` columns (the
       * grouping view's `Gruppe` and `Anzahl`) have a plain label only. Single-element view: setRows; grouping view
       * (TASK-006b): setGroups with group rows (toggle, indentation by level), element rows indented under their
       * group and a sticky total row `Summe` at the bottom.
       * handlers: { sort(key), filter(key, button), move(key, toIndex), resize(key, width), rowClick(key),
       * toggleGroup(id), groupClick(id) }. Selection (TASK-006c, REQ-007): setSelection marks the rows of the selected
       * element keys and the selected group row (`cv-sel`, aria-selected); reveal scrolls a display row into view.
       */
      function createTable(container, handlers) {
        const scroll = el("div", "cv-tbl-scroll");
        scroll.id = "cv-tbl-scroll";
        scroll.setAttribute("role", "grid");
        scroll.setAttribute("aria-label", "Tabelle Einzelelemente");
        scroll.tabIndex = 0;
        const inner = el("div", "cv-tbl-inner");
        const head = el("div", "cv-tbl-head");
        head.setAttribute("role", "row");
        head.setAttribute("aria-rowindex", "1");
        head.style.height = TABLE_HEAD_HEIGHT + "px";
        const body = el("div", "cv-tbl-body");
        body.setAttribute("role", "rowgroup");
        const foot = el("div", "cv-tbl-foot");
        foot.id = "cv-tbl-total";
        foot.setAttribute("role", "row");
        foot.style.height = TABLE_ROW_HEIGHT + "px";
        foot.hidden = true;
        const empty = el("p", "cv-hint cv-tbl-empty");
        empty.id = "cv-tbl-empty";
        empty.style.top = TABLE_HEAD_HEIGHT + "px";
        inner.append(head, body, foot);
        scroll.append(inner, empty);
        container.append(scroll);

        let columns = []; // [{ key, title, kind, width, sort, filtered }]
        let offsets = [0]; // left edge of each column; offsets[columns.length] = total width
        let headCells = [];
        let headSignature = "";
        let rows = [];
        let order = new Uint32Array(0);
        let grouped = false; // grouping view: items instead of order
        let items = []; // [{ type: 'group', group, label } | { type: 'element', index, depth }]
        let total = null; // { count, cells } of the total row
        let rowCount = 0;
        const pool = [];
        const stats = { renders: 0, lastMs: 0, maxMs: 0 };
        let dragKey = null;
        let resizing = false;
        let selKeys = null; // Set of selected element keys (REQ-007) or null
        let selGroup = null; // id of the selected group row or null

        function layoutColumns() {
          offsets = [0];
          for (const col of columns) offsets.push(offsets[offsets.length - 1] + col.width);
          const total = offsets[columns.length];
          inner.style.width = total + "px";
          head.style.width = total + "px";
          for (let c = 0; c < headCells.length; c++) {
            headCells[c].style.left = offsets[c] + "px";
            headCells[c].style.width = columns[c].width + "px";
          }
        }

        function setHeadState(cell, col) {
          cell.classList.toggle("cv-num", col.kind === "number");
          if (col.fixed) return;
          const sortIcon = cell.cvSort;
          cell.setAttribute("aria-sort", col.sort === "asc" ? "ascending" : col.sort === "desc" ? "descending" : "none");
          cell.classList.toggle("cv-sorted", Boolean(col.sort));
          sortIcon.replaceChildren();
          if (col.sort) sortIcon.append(icon(col.sort === "asc" ? "sortAsc" : "sortDesc"));
          cell.cvFilter.classList.toggle("cv-on", col.filtered);
          cell.cvFilter.setAttribute("aria-pressed", String(col.filtered));
          cell.cvResize.setAttribute("aria-valuenow", String(col.width));
        }

        function headCell(col) {
          const cell = el("div", "cv-th");
          cell.setAttribute("role", "columnheader");
          cell.dataset.key = col.key;
          if (col.fixed) {
            cell.classList.add("cv-th-fixed");
            const text = el("span", "cv-th-text", col.title);
            cell.title = col.title;
            cell.append(text);
            return cell;
          }
          cell.draggable = true;
          const label = el("button", "cv-th-label");
          label.type = "button";
          const text = el("span", "cv-th-text", col.title);
          label.append(text);
          label.title = col.title + " \u2013 klicken zum Sortieren, ziehen zum Verschieben";
          label.setAttribute("aria-label", "Sortieren nach " + col.title);
          const sortIcon = el("span", "cv-th-sort");
          sortIcon.setAttribute("aria-hidden", "true");
          const filter = iconButton("filter", "Spaltenfilter: " + col.title, "cv-th-filter");
          filter.setAttribute("aria-haspopup", "dialog");
          const resize = el("div", "cv-th-resize");
          resize.setAttribute("role", "separator");
          resize.setAttribute("aria-orientation", "vertical");
          resize.setAttribute("aria-label", "Spaltenbreite: " + col.title);
          resize.setAttribute("aria-valuemin", "60");
          resize.setAttribute("aria-valuemax", "800");
          resize.tabIndex = 0;
          cell.append(label, sortIcon, filter, resize);
          cell.cvSort = sortIcon;
          cell.cvFilter = filter;
          cell.cvResize = resize;
          label.addEventListener("click", () => handlers.sort(col.key));
          filter.addEventListener("click", () => handlers.filter(col.key, filter));
          wireResize(cell, resize);
          wireDrag(cell);
          return cell;
        }

        function indexOfKey(key) {
          return columns.findIndex((c) => c.key === key);
        }

        /** Position of a column among the movable (non-fixed) columns: the index of the app's column list. */
        function movableIndex(key) {
          return columns.filter((c) => !c.fixed).findIndex((c) => c.key === key);
        }

        function wireResize(cell, handle) {
          let startX = 0;
          let startWidth = 0;
          let key = null;
          handle.addEventListener("pointerdown", (event) => {
            if (event.button !== 0) return;
            event.preventDefault();
            event.stopPropagation();
            key = cell.dataset.key;
            const c = indexOfKey(key);
            if (c === -1) return;
            resizing = true;
            startX = event.clientX;
            startWidth = columns[c].width;
            handle.setPointerCapture(event.pointerId);
            cell.classList.add("cv-resizing");
          });
          handle.addEventListener("pointermove", (event) => {
            if (!resizing || !handle.hasPointerCapture(event.pointerId)) return;
            const c = indexOfKey(key);
            if (c === -1) return;
            columns[c].width = Math.round(Math.min(800, Math.max(60, startWidth + event.clientX - startX)));
            layoutColumns();
            render();
          });
          const end = (event) => {
            if (!resizing) return;
            resizing = false;
            if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
            cell.classList.remove("cv-resizing");
            const c = indexOfKey(key);
            if (c !== -1) handlers.resize(key, columns[c].width);
          };
          handle.addEventListener("pointerup", end);
          handle.addEventListener("pointercancel", end);
          handle.addEventListener("click", (event) => event.stopPropagation());
          handle.addEventListener("keydown", (event) => {
            const c = indexOfKey(cell.dataset.key);
            if (c === -1) return;
            let delta = 0;
            if (event.key === "ArrowRight") delta = RESIZE_STEP;
            else if (event.key === "ArrowLeft") delta = -RESIZE_STEP;
            else return;
            event.preventDefault();
            handlers.resize(cell.dataset.key, columns[c].width + delta);
          });
        }

        function clearDropMarks() {
          for (const cell of headCells) cell.classList.remove("cv-drop-before", "cv-drop-after", "cv-dragging");
        }

        function wireDrag(cell) {
          cell.addEventListener("dragstart", (event) => {
            if (resizing || event.target !== cell) {
              if (resizing) event.preventDefault();
              if (resizing || !cell.contains(event.target)) return;
            }
            dragKey = cell.dataset.key;
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("application/x-cv-column", dragKey);
            event.dataTransfer.setData("text/plain", dragKey);
            cell.classList.add("cv-dragging");
          });
          cell.addEventListener("dragend", () => {
            dragKey = null;
            clearDropMarks();
          });
          cell.addEventListener("dragover", (event) => {
            if (dragKey === null) return;
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
            const box = cell.getBoundingClientRect();
            const before = event.clientX < box.left + box.width / 2;
            cell.classList.toggle("cv-drop-before", before);
            cell.classList.toggle("cv-drop-after", !before);
          });
          cell.addEventListener("dragleave", (event) => {
            if (!cell.contains(event.relatedTarget)) cell.classList.remove("cv-drop-before", "cv-drop-after");
          });
          cell.addEventListener("drop", (event) => {
            if (dragKey === null) return;
            event.preventDefault();
            const box = cell.getBoundingClientRect();
            const before = event.clientX < box.left + box.width / 2;
            const source = dragKey;
            dragKey = null;
            clearDropMarks();
            if (source === cell.dataset.key) return;
            const from = movableIndex(source);
            let to = movableIndex(cell.dataset.key) + (before ? 0 : 1);
            if (from < to) to--;
            if (from !== -1 && from !== to) handlers.move(source, to);
          });
        }

        function createRow() {
          const node = el("div", "cv-tr");
          node.setAttribute("role", "row");
          node.style.height = TABLE_ROW_HEIGHT + "px";
          node.cvCells = [];
          node.cvIndex = -1;
          body.append(node);
          return node;
        }

        function cellAt(node, p) {
          let cell = node.cvCells[p];
          if (!cell) {
            cell = el("div", "cv-td");
            cell.setAttribute("role", "gridcell");
            cell.cvText = null;
            cell.cvGroup = null;
            cell.cvPad = "";
            node.cvCells[p] = cell;
            node.append(cell);
          }
          return cell;
        }

        /** Plain text cell (a former group cell loses its toggle). */
        function setCellText(cell, text) {
          if (cell.cvGroup !== null) {
            cell.cvGroup = null;
            cell.cvText = null;
            cell.replaceChildren();
          }
          if (cell.cvText !== text) {
            cell.cvText = text;
            cell.textContent = text;
            cell.title = text;
          }
        }

        /** `Gruppe` cell of a group row: expand toggle and the group value. */
        function setCellGroup(cell, item, expanded) {
          let parts = cell.cvGroup;
          if (parts === null) {
            const toggle = el("button", "cv-grp-toggle");
            toggle.type = "button";
            toggle.append(icon("chevron"));
