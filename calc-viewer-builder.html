          store.retain(keysInUse());
          publishTable();
          refresh();
        }

        /**
         * Sends the display plan for the current filter result to cv-3d (ghost / hide, colours) and updates the legend;
         * a selected element that left the filter (or the row set) is deselected.
         */
        function sync3d() {
          engine.display({
            rows: store.rows,
            inside,
            mode: viewMode,
            colourOf: scheme ? (i) => scheme.rowColour(i) : null,
            context: models.map((m) => ({ model: m.id, ids: m.contextIds })),
            filterActive: view.evaluation !== null && view.evaluation.filters.length > 0,
          });
          const entry = colourKey ? catalog.get(colourKey) : null;
          ui.view.setLegend(
            scheme
              ? { title: entry ? entry.header : colourKey, entries: colourLegend(scheme, view.indices) }
              : null,
          );
          if (selectedKey !== null) {
            const at = rowIndex.get(selectedKey);
            if (at === undefined || !inside[at]) select(null);
          }
          if (selectedGroup !== null) {
            // group selection: elements that left the filter (or the row set) leave the selection (as TASK-005)
            const keys = selectedGroup.keys.filter((k) => {
              const at = rowIndex.get(k);
              return at !== undefined && inside[at] === 1;
            });
            if (!keys.length) select(null);
            else if (keys.length !== selectedGroup.keys.length) applyGroupSelection({ ...selectedGroup, keys });
          }
          publishView();
        }

        function publishView() {
          hook.view = {
            mode: viewMode,
            colourKey,
            selected: selectedKey,
            selectedGroup: selectedGroup ? selectedGroup.id : null,
            selectedKeys: selectedGroup ? selectedGroup.keys.slice() : selectedKey !== null ? [selectedKey] : [],
            section: section ? { ...section } : null,
          };
        }

        /** Display position of the first table row of element row index at (or -1 when not shown). */
        function displayIndexOf(at) {
          if (tableView === "grouped") return displayItems.findIndex((it) => it.type === "element" && it.index === at);
          return order.indexOf(at);
        }

        /**
         * Shows the row of a selected element in the table (REQ-007-AC2): in the grouping view the groups containing it
         * are expanded first (several with a multi-valued grouping property, DEC-16); then it is scrolled into view.
         */
        function revealRow(at) {
          if (tableView === "grouped" && tree) {
            let opened = false;
            for (const group of groupsOfRow(tree, at)) {
              if (isExpanded(group)) continue;
              if (toggled.has(group.id)) toggled.delete(group.id);
              else toggled.add(group.id);
              opened = true;
            }
            if (opened) refreshGroups();
          }
          const index = displayIndexOf(at);
          if (index !== -1) ui.table.reveal(index);
        }

        /**
         * Selects one element by row key (REQ-007) or clears the selection (null, also a group selection): selection
         * highlight in 3D (elements with geometry), the marked table row(s) and the details panel. reveal (3D pick,
         * API): the table shows its row (groups expanded, scrolled); a table row click does not move the table. The
         * camera never moves (as the reference app).
         */
        function select(key, reveal) {
          const at = key === null || key === undefined ? undefined : rowIndex.get(key);
          if (at === undefined) {
            if (selectedKey === null && selectedGroup === null) return;
            selectedKey = null;
            selectedGroup = null;
            engine.select([]);
            ui.details.clear();
            ui.table.setSelection(null, null);
          } else {
            const row = store.rows[at];
            selectedKey = row.key;
            selectedGroup = null;
            engine.select(row.geometry ? [row.key] : []);
            ui.details.show({ row, catalog, order: catalogOrder });
            ui.table.setSelection([row.key], null);
            if (reveal) revealRow(at);
          }
          publishView();
        }

        /** Group path label of a group (level 2: parent value / value). */
        function groupPath(group) {
          if (group.level === 1) return valueLabel(group.value);
          const parent = tree ? tree.groups.find((g) => group.id.indexOf(g.id + "\u001f") === 0) : null;
          return (parent ? valueLabel(parent.value) + " / " : "") + valueLabel(group.value);
        }

        /** Selects all elements of a group (keys: its rows inside the filter); the group row is marked. */
        function selectGroup(group, keys) {
          if (!keys.length) return select(null);
          const kicker = "Gruppe: " + groupBy.slice(0, group.level).map(groupTitle).join(" / ");
          selectedKey = null;
          applyGroupSelection({ id: group.id, grouping: groupBy.join("\u0000"), keys, kicker, title: groupPath(group) });
          publishView();
        }

        /**
         * Marks the selection in the table: the selected element rows, and the selected group row while the table
         * still shows that grouping (a group id means the same group only under the same grouping properties).
         */
        function markTable() {
          if (selectedGroup) {
            const same = tableView === "grouped" && selectedGroup.grouping === groupBy.join("\u0000");
            ui.table.setSelection(selectedGroup.keys, same ? selectedGroup.id : null);
          } else ui.table.setSelection(selectedKey !== null ? [selectedKey] : null, null);
        }

        function applyGroupSelection(next) {
          selectedGroup = next;
          const withGeometry = [];
          for (const k of next.keys) if (store.rows[rowIndex.get(k)].geometry) withGeometry.push(k);
          engine.select(withGeometry);
          ui.details.showGroup({
            id: next.id,
            kicker: next.kicker,
            title: next.title,
            count: next.keys.length,
            withoutGeometry: next.keys.length - withGeometry.length,
          });
          markTable();
        }

        function setColouring(key) {
          colourKey = key && catalog.has(key) ? key : null;
          scheme = colourKey ? colourScheme(store, colourKey) : null;
          const entry = colourKey ? catalog.get(colourKey) : null;
          ui.view.setColouring(entry ? entry.header : null);
          store.retain(keysInUse());
          refresh();
        }

        function setSection(next) {
          section = next;
          ui.view.setSection(section, section ? engine.axisRange(section.axis) : null);
          engine.setSection(section);
          publishView();
        }

        // ---------- header and configuration (TASK-007, REQ-011 / REQ-009) ----------

        // title / date set by the user or a configuration; null = default (first model's Modell / today)
        const headerState = { title: null, date: null, logo: null };

        /** Header as shown and saved: defaults applied (REQ-011). */
        function effectiveHeader() {
          return {
            title: headerState.title !== null ? headerState.title : models.length ? models[0].name : "",
            date: headerState.date !== null ? headerState.date : isoDate(new Date()),
            logo: headerState.logo,
          };
        }

        function publishHeader() {
          const header = effectiveHeader();
          ui.setHeader(header);
          hook.header = { ...header, titleSet: headerState.title !== null, dateSet: headerState.date !== null };
        }

        /** Sets title, date and logo ({ title?, date?, logo? }; null title / date = default). */
        function setHeader(next) {
          if (next.title !== undefined) headerState.title = next.title === null ? null : String(next.title);
          if (next.date !== undefined) headerState.date = isIsoDate(next.date) ? next.date : null;
          if (next.logo !== undefined) headerState.logo = next.logo || null;
          publishHeader();
        }

        /** The configuration a save writes now (REQ-009; buildConfig). */
        function configState() {
          return buildConfig({
            header: effectiveHeader(),
            filterSets: filterSets.map((s) => ({ key: s.key, collapsed: s.collapsed, selected: s.selected })),
            table: tableState(),
            grouping: groupingState(),
            display: { mode: viewMode, colourKey, section },
          });
        }

        /**
         * Applies a parsed, valid configuration to the loaded models (REQ-009, tolerant: applyConfig). Parts the file
         * does not define keep their current state. Returns { notice (German text or null), skipped }.
         */
        function applyConfiguration(config) {
          const { apply, skipped } = applyConfig(config, {
            has: (key) => catalog.has(key),
            hasValue(key, value) {
              const col = store.column(key);
              return value === null ? col.empties : col.index.get(value) !== undefined;
            },
            columns: columns.map((c) => c.key),
          });
          closePopup();
          if (apply.header) setHeader(apply.header);
          if (apply.filterSets) {
            const sets = apply.filterSets.map((s) => ({
              id: s.key,
              key: s.key,
              collapsed: s.collapsed,
              selected: s.selected.slice(),
            }));
            filterSets.splice(0, filterSets.length, ...sets);
          }
          const t = apply.table || {};
          if (t.columns) columns = normaliseColumns(t.columns, catalog);
          const columnKeys = new Set(columns.map((c) => c.key));
          if (t.sort !== undefined) sort = t.sort && columnKeys.has(t.sort.key) ? { ...t.sort } : null;
          else if (sort && !columnKeys.has(sort.key)) sort = null;
          if (t.columnFilters) {
            columnFilters.clear();
            for (const f of t.columnFilters)
              columnFilters.set(
                f.key,
                f.type === "range"
                  ? { type: "range", min: f.min, max: f.max }
                  : { type: "values", values: f.values.slice() },
              );
          }
          for (const key of [...columnFilters.keys()]) if (!columnKeys.has(key)) columnFilters.delete(key);
          if (t.view !== undefined || t.groupBy !== undefined) {
            const next = normaliseGrouping(
              { view: t.view !== undefined ? t.view : tableView, groupBy: t.groupBy !== undefined ? t.groupBy : groupBy },
              catalog,
            );
            if (next.view === "grouped" && !next.groupBy.length) next.groupBy = ["Kategorie"];
            if (next.groupBy.join("\u0000") !== groupBy.join("\u0000")) {
              expandDefault = false;
              toggled.clear();
            }
            tableView = next.view;
            groupBy = next.groupBy;
          }
          const d = apply.display || {};
          if (d.mode !== undefined) {
            viewMode = d.mode;
            ui.view.setMode(viewMode);
          }
          if (d.colourBy !== undefined) {
            colourKey = d.colourBy;
            scheme = colourKey ? colourScheme(store, colourKey) : null;
            const entry = colourKey ? catalog.get(colourKey) : null;
            ui.view.setColouring(entry ? entry.header : null);
          }
          if (d.section !== undefined) {
            // a section needs 3D geometry on its axis (no model with geometry: not applied)
            if (d.section && !engine.axisRange(d.section.axis)) skipped.invalid.push("Schnitt");
            else setSection(d.section);
          }
          store.retain(keysInUse());
          publishSets();
          publishTable();
          ui.table.scrollToTop();
          markTable();
          refresh();
          const notice = configNotice(skipped, (key) => {
            const entry = catalog.get(key);
            return entry ? entry.label : key;
          });
          return { notice, skipped };
        }

        /** Offers text as a file download (builder; works from file:// as well). */
        function download(text, fileName, type) {
          const url = URL.createObjectURL(new Blob([text], { type }));
          const link = document.createElement("a");
          link.href = url;
          link.download = fileName;
          link.hidden = true;
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        }

        /** `Konfiguration speichern` (REQ-009): JSON file `<Titel>_<YYYY-MM-DD>_Konfiguration.json`. */
        function saveConfiguration() {
          const config = configState();
          const text = JSON.stringify(config, null, 2) + "\n";
          const fileName = safeFileName(config.header.title, config.header.date, "_Konfiguration.json");
          download(text, fileName, "application/json");
          hook.config.saves++;
          hook.config.lastSaved = { fileName, text };
          return { fileName, text };
        }

        /**
         * Applies a configuration file text (REQ-009): parse and validate (invalid-json, not-a-config,
         * unsupported-version: German message, view unchanged), then the tolerant apply with its notice.
         */
        function loadConfigurationText(text, fileName) {
          const t0 = performance.now();
          let result;
          try {
            const config = parseConfig(text);
            if (!models.length) throw new ConfigError("no-model");
            const applied = applyConfiguration(config);
            result = { ok: true, fileName, notice: applied.notice, skipped: applied.skipped };
            if (applied.notice) ui.addMessage(applied.notice, "notice");
          } catch (error) {
            const configClass = error && error.configClass ? error.configClass : "unreadable";
            const message =
              configClass === "no-model"
                ? "Zum Laden einer Konfiguration zuerst ein IFC-Modell laden."
                : error && error.configClass
                  ? error.message
                  : configErrorMessage("unreadable") + (error && error.message ? " (" + error.message + ")" : "");
            result = { ok: false, fileName, errorClass: configClass, message };
            ui.addMessage(message);
          }
          result.ms = performance.now() - t0;
          hook.config.last = result;
          hook.config.loads++;
          return result;
        }

        /** `Konfiguration laden` with a file: size check (too-large), read as UTF-8, then loadConfigurationText. */
        async function loadConfigurationFile(file) {
          if (file.size > CONFIG_MAX_BYTES) {
            const error = new ConfigError("too-large");
            ui.addMessage(error.message);
            hook.config.last = { ok: false, fileName: file.name, errorClass: error.configClass, message: error.message };
            hook.config.loads++;
            return hook.config.last;
          }
          let text;
          try {
            text = await file.text();
          } catch (error) {
            text = null;
            const message = configErrorMessage("unreadable") + (error && error.message ? " (" + error.message + ")" : "");
            ui.addMessage(message);
            hook.config.last = { ok: false, fileName: file.name, errorClass: "unreadable", message };
            hook.config.loads++;
            return hook.config.last;
          }
          return loadConfigurationText(text, file.name);
        }

        /** Reads a logo image file (REQ-011): type and size check, data URL, must decode as an image. */
        async function readLogo(file) {
          const head = new Uint8Array(await file.slice(0, 4096).arrayBuffer());
          const kind = classifyLogo(file.name, file.size, head);
          if (kind.error) return { error: kind.error };
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(new Blob([file], { type: kind.mime }));
          });
          const decodes = await new Promise((resolve) => {
            const image = new Image();
            image.onload = () => resolve(true);
            image.onerror = () => resolve(false);
            image.src = dataUrl;
          });
          if (!decodes) return { error: file.name + " konnte nicht als Bild gelesen werden." };
          return { dataUrl };
        }

        const headerHandlers = {
          /** Dialog `Titel, Datum und Logo` (builder). */
          edit() {
            ui.openHeaderDialog(
              {
                title: headerState.title,
                titleDefault: models.length ? models[0].name : "",
                date: headerState.date,
                dateDefault: isoDate(new Date()),
                logo: headerState.logo,
              },
              { readLogo, apply: (next) => setHeader(next) },
            );
          },
        };

        const viewHandlers = {
          mode(mode) {
            if (mode === viewMode) return;
            viewMode = mode;
            ui.view.setMode(mode);
            sync3d();
          },
          pickColour() {
            ui.openCatalogue([...catalog.values()], new Set(), (key) => setColouring(key), "F\u00e4rben nach");
          },
          clearColour() {
            setColouring(null);
          },
          section(axis) {
            if (!axis) return setSection(null);
            const range = engine.axisRange(axis);
            if (!range) return;
            setSection({ axis, offset: (range.min + range.max) / 2, flipped: false });
          },
          sectionOffset(offset) {
            if (section) setSection({ ...section, offset });
          },
          flip() {
            if (section) setSection({ ...section, flipped: !section.flipped });
          },
          fit() {
            engine.fit();
          },
          clearSelection() {
            select(null);
          },
        };

        const filterHandlers = {
          add() {
            const used = new Set(filterSets.map((s) => s.key));
            ui.openCatalogue([...catalog.values()], used, (key) => {
              if (filterSets.some((s) => s.key === key)) return;
              filterSets.push({ id: key, key, collapsed: false, selected: [] });
              changed();
            });
          },
          toggle(id, value, checked) {
            const set = setById(id);
            if (!set) return;
            const at = set.selected.indexOf(value);
            if (checked && at === -1) set.selected.push(value);
            else if (!checked && at !== -1) set.selected.splice(at, 1);
            else return;
            changed();
          },
          resetSet(id) {
            const set = setById(id);
            if (!set || !set.selected.length) return;
            set.selected = [];
            changed();
          },
          /** Clears every filter: filter sets and the table's column filters (REQ-004-AC4). */
          resetAll() {
            for (const set of filterSets) set.selected = [];
            columnFilters.clear();
            store.retain(keysInUse());
            publishTable();
            changed();
          },
          move(id, to) {
            const from = filterSets.findIndex((s) => s.id === id);
            if (from === -1 || to < 0 || to >= filterSets.length || from === to) return;
            const [set] = filterSets.splice(from, 1);
            filterSets.splice(to, 0, set);
            publishSets();
          },
          step(id, delta) {
            filterHandlers.move(id, filterSets.findIndex((s) => s.id === id) + delta);
          },
          remove(id) {
            const at = filterSets.findIndex((s) => s.id === id);
            if (at === -1) return;
            filterSets.splice(at, 1);
            store.retain(keysInUse());
            changed();
          },
          collapse(id, collapsed) {
            const set = setById(id);
            if (!set) return;
            set.collapsed = collapsed;
            publishSets();
          },
        };

        const ui = renderLayout(options.root, {
          mode: options.mode,
          title: options.title,
          filterHandlers,
          viewHandlers,
          tableHandlers,
          headerHandlers,
        });
        hook.layout = ui.layout;
        ui.overlay("3D-Ansicht wird gestartet ...");
        // a 3D pick selects the element and shows its table row (REQ-007-AC1/AC2); empty space clears (AC5)
        const engine = createEngine(ui.viewport, options.workerUrl, { onPick: (key) => select(key, true) });
        ui.view.setMode(viewMode);
        ui.view.setColouring(null);
        ui.view.setSection(null, null);
        // Esc clears the selection (REQ-007-AC5); an Escape handled by a dialog is marked defaultPrevented.
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !event.defaultPrevented) select(null);
        });
        /** Test seam (spec 4.4) and selection hook for the table (TASK-006c). */
        window.CalcView = {
          state: () => engine.state(),
          /** Selects an element like a 3D pick (table row shown), null clears. */
          select: (key) => select(key, true),
          /** Selects all elements of a table group by group id (as a group row click); false if the group is not shown. */
          selectGroup: (id) => {
            const group = tree ? allGroups(tree).find((g) => g.id === id) : null;
            if (!group) return false;
            selectGroup(group, Array.from(group.indices, (i) => store.rows[i].key));
            return true;
          },
          camera: () => engine.camera(),
          lastSelectedAt: () => engine.lastSelectedAt(),
          whenIdle: () => engine.whenIdle(),
          frames: () => engine.frames(),
          lastFrameAt: () => engine.lastFrameAt(),
          lastAppliedAt: () => engine.lastAppliedAt(),
          changeFrames: () => engine.changeFrames(),
          shownFrames: () => engine.shownFrames(),
          screenBox: (key) => engine.screenBox(key),
          engineVisible: (modelId, localIds) => engine.engineVisible(modelId, localIds),
          axisRange: (axis) => engine.axisRange(axis),
          contextState: () => engine.contextState(),
        };
        /**
         * Configuration seam (TASK-007): state() = the object `Konfiguration speichern` writes; loadText(text, name)
         * = `Konfiguration laden` with that file text; header() = title, date, logo as shown.
         */
        window.CalcConfig = {
          state: () => configState(),
          loadText: (text, fileName) => loadConfigurationText(text, fileName || "konfiguration.json"),
          header: () => effectiveHeader(),
        };
        /** Table seam (TASK-006a): configuration part (state / setState, TASK-007) and render statistics. */
        window.CalcTable = {
          state: () => tableState(),
          setState: (state) => setTableState(state),
          stats: () => ui.table.stats(),
          grouping: () => groupingState(),
          setGrouping: (state) => setGroupingState(state),
        };
        const models = []; // { id, name, fileName, rows, properties, spaceProperties, spaceIds, contextIds, fragBytes }
        const queued = []; // files dropped while an action runs; loaded right after it
        let nextId = 1;
        let busy = false;

        /**
         * Overlay when no action runs: the start hint while the builder has no model, else hidden. A load error
         * shown in the overlay does not stay over the 3D view; its message remains in #cv-messages.
         */
        function settleOverlay() {
          ui.overlay(options.mode === "builder" && !models.length ? "IFC-Datei laden, um zu beginnen." : null);
        }

        function publish() {
          const includeSpaces = hook.options.includeSpaces;
          const rows = [];
          for (const model of models) for (const row of visibleRows(model.rows, includeSpaces)) rows.push(row);
          hook.rows = rows;
          catalog = buildCatalog(rows, models);
          hook.catalog = [...catalog.values()];
          catalogOrder = new Map(hook.catalog.map((entry, i) => [entry.key, i]));
          store = createColumnStore(rows); // new row set: new column store (TASK-003)
          rowIndex = new Map(rows.map((row, i) => [row.key, i]));
          // REQ-001-AC3: filters on remaining values stay active; checked values no element has any more are dropped
          for (const set of filterSets) if (set.selected.length) set.selected = pruneSelection(store, set.key, set.selected);
          for (const [key, f] of [...columnFilters]) {
            if (f.type !== "values") continue;
            const values = pruneSelection(store, key, f.values);
            if (values.length) columnFilters.set(key, { type: "values", values });
            else columnFilters.delete(key);
          }
          store.retain(keysInUse());
          // colouring follows the new row set (dropped if its property is gone)
          if (colourKey && !catalog.has(colourKey)) {
            colourKey = null;
            ui.view.setColouring(null);
          }
          scheme = colourKey ? colourScheme(store, colourKey) : null;
          // grouping follows the new row set: properties no element has any more are dropped (level 2 moves up)
          if (catalog.size && groupBy.some((key) => !catalog.has(key))) {
            const kept = normaliseGrouping({ view: tableView, groupBy }, catalog);
            groupBy = tableView === "grouped" && !kept.groupBy.length ? ["Kategorie"] : kept.groupBy;
            expandDefault = false;
            toggled.clear();
            store.retain(keysInUse());
          }
          if (section) ui.view.setSection(section, engine.axisRange(section.axis));
          hook.models = models.map((m) => {
            const visible = visibleRows(m.rows, includeSpaces);
            return {
              id: m.id,
              name: m.fileName,
              modell: m.name,
              elements: visible.length,
              withGeometry: visible.filter((row) => row.geometry).length,
              spaceIds: m.spaceIds.slice(),
            };
          });
          hook.modelCount = engine.modelCount();
          hook.elementCount = rows.length;
          ui.renderModels(
            hook.models.map((m) => ({ id: m.id, name: m.modell, elements: m.elements })),
            options.mode === "builder" ? removeModel : null,
          );
          publishSets();
          publishTable();
          refresh();
          publishHeader(); // the default title follows the first model (REQ-011)
          ui.setConfigLoadable(models.length > 0);
          settleOverlay();
        }

        function progress(file, step, fraction) {
          const percent = ui.progress({ file, step, fraction });
          hook.progress = { file, step, percent };
        }

        async function loadOne(file) {
          const id = "m" + nextId++;
          const name = uniqueModelName(
            modelNameFromFile(file.name),
            models.map((m) => m.name),
          );
          let shown = false;
          try {
            progress(file.name, "Pr\u00fcfung", null);
            const converted = await options.convert(file, (fraction, step) =>
              progress(file.name, step || "Konvertierung", fraction),
            );
            progress(file.name, "Anzeige", null);
            const loaded = await engine.loadModel(converted.bytes, id);
            shown = true;
            progress(file.name, "Extraktion", 0);
            const data = await options.extract(
              loaded.model,
              { modelId: id, modelName: name, elementClasses: converted.elementClasses, withGeometry: loaded.withGeometry },
              (fraction) => progress(file.name, "Extraktion", fraction),
            );
            if (!hook.options.includeSpaces) await engine.setItemsVisible(id, data.spaceIds, false);
            // geometry that is no element row (e.g. the IfcSite terrain): context, shown like elements outside the
            // filter while a filter is active
            const rowIds = new Set(data.rows.map((row) => row.localId));
            const contextIds = Array.from(loaded.withGeometry).filter((localId) => !rowIds.has(localId));
            models.push({
              id,
              name,
              fileName: file.name,
              rows: data.rows,
              properties: data.properties,
              spaceProperties: data.spaceProperties,
              spaceIds: data.spaceIds,
              contextIds,
              fragBytes: converted.bytes,
            });
            publish();
            return true;
          } catch (error) {
            if (shown) await engine.removeModel(id).catch(() => {});
            const classified = toLoadError(error, file.name);
            const message = classified.message || loadErrorMessage(classified.loadClass, file.name, classified.detail);
            hook.loadErrors.push({ fileName: file.name, loadClass: classified.loadClass, message });
            ui.addMessage(message);
            ui.overlay(message, true);
            return false;
          }
        }

        /** Ends a busy action; files dropped meanwhile start loading at once (phase stays "loading"). */
        function finishAction() {
          settleOverlay();
          hook.progress = null;
          busy = false;
          ui.setBusy(false);
          hook.phase = "ready";
          hook.loads++;
          if (queued.length) loadFiles([]);
        }

        /**
         * Loads files one after another. While another action runs, the files are queued and loaded right after
         * it (a drop is never lost); files queued during this batch are loaded in the same batch.
         */
        async function loadFiles(files) {
          if (busy) {
            queued.push(...files);
            hook.queued = queued.length;
            return;
          }
          let batch = [...queued.splice(0), ...files];
          hook.queued = 0;
          if (!batch.length) return;
          busy = true;
          ui.setBusy(true);
          hook.phase = "loading";
          try {
            while (batch.length) {
              for (const file of batch) await loadOne(file);
              batch = queued.splice(0);
              hook.queued = 0;
            }
          } finally {
            finishAction();
          }
        }

        async function removeModel(id) {
          const index = models.findIndex((m) => m.id === id);
          if (busy || index === -1) return;
          busy = true;
          ui.setBusy(true);
          hook.phase = "loading";
          try {
            models.splice(index, 1);
            await engine.removeModel(id);
            publish();
          } finally {
            finishAction();
          }
        }

        async function setIncludeSpaces(include) {
          if (busy) return;
          busy = true;
          ui.setBusy(true);
          hook.phase = "loading";
          try {
            hook.options.includeSpaces = Boolean(include);
            for (const model of models) await engine.setItemsVisible(model.id, model.spaceIds, hook.options.includeSpaces);
            publish();
          } finally {
            finishAction();
          }
        }

        if (options.mode === "builder") {
          ui.fileInput.addEventListener("change", () => {
            const files = Array.from(ui.fileInput.files || []);
            ui.fileInput.value = "";
            loadFiles(files);
          });
          // a dropped .json is a configuration (applied after the IFC files of the same drop), the rest IFC
          ui.onDropFiles(async (files) => {
            const isJson = (f) => /\.json$/i.test(f.name);
            const configFile = files.filter(isJson).pop();
            const ifcFiles = files.filter((f) => !isJson(f));
            if (ifcFiles.length) await loadFiles(ifcFiles);
            if (configFile) await loadConfigurationFile(configFile);
          });
          ui.spacesToggle.addEventListener("change", () => setIncludeSpaces(ui.spacesToggle.checked));
          ui.loadButton.disabled = false;
          ui.saveButton.disabled = false;
          ui.saveButton.addEventListener("click", () => saveConfiguration());
          ui.configInput.addEventListener("change", () => {
            const file = ui.configInput.files && ui.configInput.files[0];
            ui.configInput.value = "";
            if (file) loadConfigurationFile(file); // a cancelled dialog changes nothing
          });
        }
        publish();
        hook.phase = "ready";
        return {
          loadFiles,
          removeModel,
          setIncludeSpaces,
          /** Current filter result: { evaluation, indices (rows passing all filters), facets }. */
          filterView: () => view,
          /** Calls listener(view) after every filter evaluation (3D coupling and table, TASK-005 / TASK-006a). */
          onFilterChange(listener) {
            filterListeners.push(listener);
          },
          /** Selects an element by row key like a 3D pick (its table row is shown), null clears (REQ-007). */
          select: (key) => select(key, true),
          /** Key of the selected element or null. */
          selected: () => selectedKey,
          /** Table configuration part (REQ-006-AC6): { columns, sort, columnFilters }; setTableState applies one. */
          tableState,
          setTableState,
          /** Calls listener(rowKey) when a table row is clicked (hook for the table -> 3D selection, TASK-006c). */
          onRowClick(listener) {
            rowClickListeners.push(listener);
          },
          /** Grouping part of the configuration (REQ-009): { view, groupBy }; setGroupingState applies one. */
          groupingState,
          setGroupingState,
          /** Calls listener(groupId, elementKeys) when a group row is clicked (group selection, TASK-006c). */
          onGroupClick(listener) {
            groupClickListeners.push(listener);
          },
          /** Configuration (REQ-009): the object a save writes; apply a parsed one (viewer file start, TASK-009). */
          configState,
          applyConfiguration,
          loadConfigurationText,
          /** Header (REQ-011): { title, date, logo } as shown; setHeader({ title?, date?, logo? }). */
          header: effectiveHeader,
          setHeader,
        };
      }

      /** Shows a fatal start error (library loading, drift guard) in root. */
      export function fail(root, message) {
        hook.phase = "error";
        hook.error = message;
        root.textContent = message;
      }
    </script>

    <!-- Classic bootstrap of the viewer file (reads payloads, links, starts): TASK-009. ASCII only. -->
    <script type="text/plain" id="cv-viewer-bootstrap"></script>

    <script type="module" id="cv-builder">
      // Builder-only logic (spec \u00a74.2). Library versions are pinned; jsDelivr "+esm" resolves the dependency graph.
      const FRAGMENTS_VERSION = "3.4.7";
      const CDN = "https://cdn.jsdelivr.net";
      const FRAGMENTS_KEY = `/npm/@thatopen/fragments@${FRAGMENTS_VERSION}/+esm`;
      const WORKER_URL = `${CDN}/npm/@thatopen/fragments@${FRAGMENTS_VERSION}/dist/Worker/worker.min.mjs`;
      const NPM_IMPORT_RE = /(?:\bfrom\s*|\bimport\s*\(?\s*)["'](\/npm\/[^"']+)["']/g;
      const SOURCE_MAP_RE = /^\s*\/\/# sourceMappingURL=.*$/gm;

      /**
       * Links ES module sources (key -> source text) into Blob URLs without a server or bundler (ref L163-192).
       * Import specifiers are rewritten to the Blob URL of the dependency; a specifier resolves if it is a key of
       * `sources` or of `aliases` (alias -> key). Unknown "/npm/..." specifiers fail fast. Self-contained: its source
       * text is also prepended to the conversion worker (and later to the viewer file).
       */
      function tovLinkModules(sources, aliases) {
        const SPECIFIER_RE = /(\bfrom\s*|\bimport\s*\(?\s*)(["'])([^"'\n]+)\2/g;
        const has = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
        const urls = {};
        function toKey(specifier) {
          if (has(sources, specifier)) return specifier;
          if (has(aliases, specifier)) return aliases[specifier];
          return null;
        }
        function link(key, chain) {
          if (has(urls, key)) return urls[key];
          if (chain.indexOf(key) !== -1) throw new Error("Circular module import: " + chain.concat(key).join(" -> "));
          if (typeof sources[key] !== "string") throw new Error("Module source missing: " + key);
          const code = sources[key].replace(SPECIFIER_RE, function (match, prefix, quote, specifier) {
            const depKey = toKey(specifier);
            if (depKey) return prefix + quote + link(depKey, chain.concat(key)) + quote;
            if (specifier.indexOf("/npm/") === 0)
              throw new Error("Module " + key + " imports unknown module " + specifier);
            return match;
          });
          urls[key] = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
          return urls[key];
        }
        return function resolve(keyOrAlias) {
          const key = toKey(keyOrAlias);
          if (!key) throw new Error("Unknown module: " + keyOrAlias);
          return link(key, []);
        };
      }

      /**
       * Body of the classic IFC conversion worker (ref L1940-1981). Runs after tovLinkModules (prepended).
       * Input { sources, aliases, fragmentsKey, webIfcKey, wasmPath, file, extraClasses, simulateCrash };
       * output { type: "phase" | "progress" | "done" | "error", ... }; "done" carries the .frag bytes and the names of
       * the importer's element classes (the candidates for rows, spec 4.3).
       */
      function convertWorkerMain() {
        self.onmessage = async (event) => {
          const job = event.data;
          try {
            self.postMessage({ type: "phase", phase: "load" });
            if (job.simulateCrash) {
              // Test hook (REQ-001-AC2 `too-large`): an uncaught exception raises an `error` event on the Worker.
              setTimeout(() => {
                throw new Error("simulierter Absturz des Konverters (Testhaken)");
              }, 0);
              return;
            }
            const resolve = tovLinkModules(job.sources, job.aliases);
            const FRAGS = await import(resolve(job.fragmentsKey));
            const WEBIFC = await import(resolve(job.webIfcKey));
            self.postMessage({ type: "phase", phase: "read" });
            let bytes = new Uint8Array(await job.file.arrayBuffer());
            self.postMessage({ type: "phase", phase: "parse" });
            const importer = new FRAGS.IfcImporter();
            importer.wasm = { absolute: true, path: job.wasmPath };
            for (const name of job.extraClasses) {
              if (typeof WEBIFC[name] !== "number") throw new Error("Unbekannte IFC-Klasse " + name);
              importer.classes.abstract.add(WEBIFC[name]);
            }
            // IfcSpace is always converted (transparent); the option only shows/hides it (DEC-13).
            importer.geometryProcessSettings.forceTransparentSpaces = true;
            const codeNames = new Map();
            for (const key of Object.keys(WEBIFC)) {
              if (/^IFC[A-Z0-9]+$/.test(key) && typeof WEBIFC[key] === "number") codeNames.set(WEBIFC[key], key);
            }
            const elementClasses = [];
            for (const code of importer.classes.elements)
              if (codeNames.has(code)) elementClasses.push(codeNames.get(code));
            let lastSent = 0;
            const result = await importer.process({
              bytes,
              progressCallback(progress, data) {
                const now = Date.now();
                if (now - lastSent < 250) return;
                lastSent = now;
                self.postMessage({ type: "progress", progress, process: data && data.process });
              },
            });
            bytes = null;
            let output = result instanceof Uint8Array ? result : new Uint8Array(result);
            if (output.byteLength !== output.buffer.byteLength) output = output.slice();
            self.postMessage({ type: "done", bytes: output, elementClasses }, [output.buffer]);
          } catch (error) {
            self.postMessage({ type: "error", message: error && error.message ? error.message : String(error) });
          }
        };
      }

      async function fetchText(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Download fehlgeschlagen (${response.status}): ${url}`);
        return response.text();
      }

      /** Downloads the jsDelivr "+esm" module graph starting at rootKeys into `sources` (ref L2042-2053). */
      async function crawlModules(rootKeys, sources) {
        const queue = [...rootKeys];
        while (queue.length) {
          const batch = queue.splice(0).filter((key, i, all) => !(key in sources) && all.indexOf(key) === i);
          const texts = await Promise.all(batch.map((key) => fetchText(CDN + key)));
          batch.forEach((key, i) => {
            sources[key] = texts[i].replace(SOURCE_MAP_RE, "");
            for (const match of sources[key].matchAll(NPM_IMPORT_RE)) if (!(match[1] in sources)) queue.push(match[1]);
          });
        }
      }

      /** Turns the Fragments worker (ESM) into a classic worker script by removing its trailing export (ref L2055-2068). */
      function toClassicWorkerSource(moduleSource) {
        const TRAILING_EXPORT_RE = /export\s*\{[^}]*\}\s*;?\s*$/;
        const withoutMap = moduleSource.replace(SOURCE_MAP_RE, "").trimEnd();
        if (!TRAILING_EXPORT_RE.test(withoutMap)) throw new Error("Unerwartetes Format des Fragments-Workers.");
        const classic = withoutMap.replace(TRAILING_EXPORT_RE, "");
        if (/(^|[;}\s])(export|import)\s*[{*]/.test(classic))
          throw new Error("Der Fragments-Worker enth\u00e4lt noch ESM-Anweisungen.");
        return classic;
      }

      const blobUrl = (text) => URL.createObjectURL(new Blob([text], { type: "text/javascript" }));
      const block = (id) => document.getElementById(id).textContent;

      /** Crawls the library graph, applies the drift guard and links library + app modules (ref L2075-2113). */
      async function loadLibraries() {
        const libSources = {};
        await crawlModules([FRAGMENTS_KEY], libSources);
        const sources = {
          ...libSources,
          "cv-core": block("cv-core-src"),
          "cv-ui": block("cv-ui-src"),
          "cv-3d": block("cv-3d-src"),
          "cv-app": block("cv-app-src"),
        };
        const aliases = {
          "calc-core": "cv-core",
          "calc-ui": "cv-ui",
          "calc-3d": "cv-3d",
          "@thatopen/fragments": FRAGMENTS_KEY,
        };
        const resolve = tovLinkModules(sources, aliases);
        const core = await import(resolve("calc-core"));

        let versions = core.checkLibraryVersions(Object.keys(libSources));
        const orbitKey = `/npm/three@${versions.three}/examples/jsm/controls/OrbitControls.js/+esm`;
        await crawlModules([orbitKey], libSources);
        Object.assign(sources, libSources);
        versions = core.checkLibraryVersions(Object.keys(libSources)); // OrbitControls must not pull in another three
        aliases.three = `/npm/three@${versions.three}/+esm`;
        aliases["three/addons/controls/OrbitControls.js"] = orbitKey;
        const webIfcKey = `/npm/web-ifc@${versions.webIfc}/+esm`;

        // Kategorie spelling (IfcWallStandardCase) from the schema class names web-ifc exports.
        const webIfc = await import(resolve(webIfcKey));
        const classNames = core.classNameMap(
          ["IFC2X3", "IFC4", "IFC4X3"].map((schema) => Object.keys(webIfc[schema] || {})),
        );

        const worker = toClassicWorkerSource(await fetchText(WORKER_URL));
        const convertSource = tovLinkModules.toString() + "\n(" + convertWorkerMain.toString() + ")();";
        return {
          resolve,
          core,
          classNames,
          libSources,
          webIfcKey,
          aliases: { "@thatopen/fragments": FRAGMENTS_KEY, three: aliases.three },
          versions: { fragments: FRAGMENTS_VERSION, ...versions },
          fragmentsWorkerUrl: blobUrl(worker),
          convertWorkerUrl: blobUrl(convertSource),
          neverStartingWorkerUrl: blobUrl("/* test hook: a worker that never answers */"),
          wasmPath: `${CDN}/npm/web-ifc@${versions.webIfc}/`,
        };
      }

      const PHASES = { load: "Konverter wird geladen", read: "Datei wird gelesen", parse: "Konvertierung" };
      /** No message from the conversion worker within this time: it never started (e.g. blocked worker) -> unreadable. */
      const WORKER_START_TIMEOUT_MS = 30000;

      /** Reads the first and last bytes of a file and classifies it before conversion (REQ-001). */
      async function checkFile(lib, file) {
        const core = lib.core;
        const decode = async (blob) => new TextDecoder("latin1").decode(await blob.arrayBuffer());
        const head = file.size ? await decode(file.slice(0, core.HEADER_PROBE_BYTES)) : "";
        const readTail = (bytes) => decode(file.slice(Math.max(0, file.size - bytes)));
        let tail = file.size ? await readTail(core.TRAILER_PROBE_BYTES) : "";
        // A valid file may end with more blank space or comments than the short probe holds: read up to 64 KiB.
        if (file.size > core.TRAILER_PROBE_BYTES && !core.trailerComplete(tail))
          tail = await readTail(core.TRAILER_PROBE_MAX_BYTES);
        const problem = core.classifyIfcFile(file.size, head, tail);
        if (problem) throw new core.LoadError(problem.loadClass, file.name, problem.detail);
      }

      /**
       * Converts one IFC file to .frag bytes in its own classic Blob worker, terminated afterwards (ref L2186-2205).
       * A worker `error` event (crash, e.g. out of memory) -> too-large; an `error` message (parsing/conversion
       * failed) -> unreadable; no message within the start timeout -> unreadable.
       */
      function convertIfc(lib, file, onProgress) {
        const core = lib.core;
        const test = window.__calc.test || {};
        const neverStart = Boolean(test.neverStartNextConversion);
        const simulateCrash = Boolean(test.crashNextConversion);
        test.neverStartNextConversion = false;
        test.crashNextConversion = false;
        const startTimeout = test.startTimeoutMs || WORKER_START_TIMEOUT_MS;
        return new Promise((resolve, reject) => {
          const worker = new Worker(neverStart ? lib.neverStartingWorkerUrl : lib.convertWorkerUrl);
          let timer = setTimeout(() => {
            timer = null;
            finish(
              reject,
              new core.LoadError(
                "unreadable",
                file.name,
                `der Konverter ist nicht gestartet (keine Antwort nach ${Math.round(startTimeout / 1000)} s)`,
              ),
            );
          }, startTimeout);
          const finish = (callback, value) => {
            if (timer) clearTimeout(timer);
            timer = null;
            worker.terminate();
            callback(value);
          };
          onProgress(null, "Konverter wird gestartet");
          worker.onmessage = (event) => {
            if (timer) clearTimeout(timer);
            timer = null;
            const m = event.data;
            if (m.type === "phase") onProgress(m.phase === "parse" ? 0 : null, PHASES[m.phase]);
            else if (m.type === "progress") onProgress(m.progress, "Konvertierung");
            else if (m.type === "done") finish(resolve, { bytes: m.bytes, elementClasses: m.elementClasses });
            else if (m.type === "error") finish(reject, new core.LoadError("unreadable", file.name, m.message));
          };
          worker.onerror = (event) => {
            event.preventDefault();
            const error = new core.LoadError("too-large", file.name, event.message || null);
            finish(reject, error);
          };
          worker.postMessage({
            sources: lib.libSources,
            aliases: lib.aliases,
            fragmentsKey: FRAGMENTS_KEY,
            webIfcKey: lib.webIfcKey,
            wasmPath: lib.wasmPath,
            file,
            extraClasses: core.IMPORTER_EXTRA_CLASSES,
            simulateCrash,
          });
        });
      }

      const nextTask = () => new Promise((resolve) => setTimeout(resolve, 0));

      /**
       * Extraction (spec 4.3, REQ-002): element ids via getItemsOfCategories over the importer's element classes minus
       * spatial and type classes (IfcSpace kept; the option filters it), storeys via getSpatialStructure, units via
       * IfcUnitAssignment, then getItemsData in chunks of INDEX_CHUNK_SIZE ids with progress and yielding.
       */
      async function extractModel(lib, model, info, onProgress) {
        const core = lib.core;
        const classes = core.rowClasses(info.elementClasses, true);
        const [byCategory, tree, unitCategories] = await Promise.all([
          model.getItemsOfCategories([core.categoryPattern(classes)]),
          model.getSpatialStructure(),
          model.getItemsOfCategories([/^IFCUNITASSIGNMENT$/]),
        ]);
        const ids = [];
        const spaceIds = [];
        for (const [category, list] of Object.entries(byCategory)) {
          for (const id of list) ids.push(id);
          if (category === core.SPACE_CLASS) for (const id of list) spaceIds.push(id);
        }
        ids.sort((a, b) => a - b);
        const spatial = core.spatialIndex(tree);
        const storeyItems = spatial.storeyIds.length
          ? await model.getItemsData(spatial.storeyIds, core.ATTRIBUTES_ONLY_CONFIG)
          : [];
        const unitIds = Object.values(unitCategories).flat();
        const unitItems = unitIds.length ? await model.getItemsData(unitIds, core.UNIT_DATA_CONFIG) : [];
        const extractor = core.createExtractor({
          modelId: info.modelId,
          modelName: info.modelName,
          units: core.parseUnits(unitItems),
          storeyOf: core.storeyNames(spatial, storeyItems),
          withGeometry: new Set(info.withGeometry),
          className: (upper) => lib.classNames.get(upper) || upper,
        });
        for (let start = 0; start < ids.length; start += core.INDEX_CHUNK_SIZE) {
          const items = await model.getItemsData(
            ids.slice(start, start + core.INDEX_CHUNK_SIZE),
            core.ITEM_DATA_CONFIG,
          );
          for (const item of items) if (item && item._localId) extractor.add(item);
          onProgress(Math.min(1, (start + core.INDEX_CHUNK_SIZE) / ids.length));
          await nextTask();
        }
        const result = extractor.result();
        return { rows: result.rows, properties: result.properties, spaceProperties: result.spaceProperties, spaceIds };
      }

      const root = document.getElementById("cv-root");
      root.textContent = "Bibliotheken werden geladen ...";
      try {
        const lib = await loadLibraries();
        const app = await import(lib.resolve("cv-app"));
        try {
          await app.start({
            mode: "builder",
            root,
            workerUrl: lib.fragmentsWorkerUrl,
            convert: async (file, onProgress) => {
              await checkFile(lib, file);
              return convertIfc(lib, file, onProgress);
            },
            extract: (model, info, onProgress) => extractModel(lib, model, info, onProgress),
          });
          window.__calc.versions = lib.versions;
        } catch (error) {
          app.fail(root, error && error.message ? error.message : String(error));
        }
      } catch (error) {
        // Before cv-app is linked (CDN unreachable, drift guard): plain message, hook for tests.
        const message = error && error.message ? error.message : String(error);
        window.__calc = { phase: "error", error: message, models: [], modelCount: 0, elementCount: 0 };
        root.textContent = message;
        root.style.padding = "24px";
        root.style.color = "#D72622";
      }
      document.documentElement.dataset.cvReady = "builder";
    </script>
  </body>
