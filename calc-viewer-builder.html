        IFCPOSITIVEPLANEANGLEMEASURE: "PLANEANGLEUNIT",
        IFCPLANEANGLEMEASURE: "PLANEANGLEUNIT",
        IFCSOLIDANGLEMEASURE: "SOLIDANGLEUNIT",
        IFCTIMEMEASURE: "TIMEUNIT",
        IFCTHERMODYNAMICTEMPERATUREMEASURE: "THERMODYNAMICTEMPERATUREUNIT",
        IFCMONETARYMEASURE: "MONETARYUNIT",
        IFCELECTRICCURRENTMEASURE: "ELECTRICCURRENTUNIT",
        IFCELECTRICVOLTAGEMEASURE: "ELECTRICVOLTAGEUNIT",
        IFCPOWERMEASURE: "POWERUNIT",
        IFCENERGYMEASURE: "ENERGYUNIT",
        IFCFORCEMEASURE: "FORCEUNIT",
        IFCPRESSUREMEASURE: "PRESSUREUNIT",
        IFCFREQUENCYMEASURE: "FREQUENCYUNIT",
        IFCLUMINOUSFLUXMEASURE: "LUMINOUSFLUXUNIT",
        IFCILLUMINANCEMEASURE: "ILLUMINANCEUNIT",
        IFCTHERMALTRANSMITTANCEMEASURE: "THERMALTRANSMITTANCEUNIT",
        IFCTHERMALCONDUCTIVITYMEASURE: "THERMALCONDUCTANCEUNIT",
        IFCMASSDENSITYMEASURE: "MASSDENSITYUNIT",
        IFCSPECIFICHEATCAPACITYMEASURE: "SPECIFICHEATCAPACITYUNIT",
        IFCVOLUMETRICFLOWRATEMEASURE: "VOLUMETRICFLOWRATEUNIT",
        IFCLINEARVELOCITYMEASURE: "LINEARVELOCITYUNIT",
        IFCMASSFLOWRATEMEASURE: "MASSFLOWRATEUNIT",
        IFCHEATFLUXDENSITYMEASURE: "HEATFLUXDENSITYUNIT",
        IFCTHERMALRESISTANCEMEASURE: "THERMALRESISTANCEUNIT",
        IFCMODULUSOFELASTICITYMEASURE: "MODULUSOFELASTICITYUNIT",
        IFCMOMENTOFINERTIAMEASURE: "MOMENTOFINERTIAUNIT",
      };
      /** Converted unit types and their target unit (DEC-2). */
      export const SI_TARGET = { LENGTHUNIT: "m", AREAUNIT: "m\u00b2", VOLUMEUNIT: "m\u00b3" };

      function siExponent(name) {
        if (/^SQUARE_/.test(name)) return 2;
        if (/^CUBIC_/.test(name)) return 3;
        return 1;
      }

      /** Describes one unit item (IfcSIUnit, IfcConversionBasedUnit, IfcDerivedUnit, IfcMonetaryUnit). */
      export function describeUnit(item) {
        if (!item) return null;
        const category = val(item._category);
        const unitType = val(item.UnitType) || (category === "IFCMONETARYUNIT" ? "MONETARYUNIT" : null);
        if (category === "IFCSIUNIT") {
          const name = String(val(item.Name) || "");
          const prefix = val(item.Prefix) || null;
          const exp = prefix && SI_PREFIX_EXP[prefix] !== undefined ? SI_PREFIX_EXP[prefix] * siExponent(name) : 0;
          return {
            unitType,
            kind: "si",
            exponent: exp,
            factor: Math.pow(10, exp),
            label: (prefix ? SI_PREFIX_SYMBOL[prefix] || "" : "") + (SI_SYMBOL[name] || name.toLowerCase()),
          };
        }
        if (category === "IFCCONVERSIONBASEDUNIT") {
          const name = String(val(item.Name) || "");
          const measure = (item.ConversionFactor || [])[0];
          const component = measure ? val(measure.ValueComponent) : undefined;
          const base = measure ? describeUnit((measure.UnitComponent || [])[0]) : null;
          const factor = typeof component === "number" && base && base.factor !== null ? component * base.factor : null;
          const key = name.toUpperCase().replace(/_/g, " ").trim();
          return { unitType, kind: "conversion", factor, label: CONVERSION_SYMBOL[key] || name.toLowerCase() };
        }
        if (category === "IFCMONETARYUNIT") {
          const currency = val(item.Currency);
          return { unitType, kind: "monetary", factor: null, label: currency ? String(currency) : null };
        }
        if (category === "IFCDERIVEDUNIT") {
          const own = val(item.UserDefinedType);
          return { unitType, kind: "derived", factor: null, label: DERIVED_SYMBOL[unitType] || own || unitType };
        }
        return null;
      }

      /** Project units from the IfcUnitAssignment item(s): unitType -> describeUnit result (first assignment wins). */
      export function parseUnits(unitAssignments) {
        const units = {};
        for (const assignment of unitAssignments || []) {
          for (const item of assignment.Units || []) {
            const unit = describeUnit(item);
            if (unit && unit.unitType && !units[unit.unitType]) units[unit.unitType] = unit;
          }
        }
        return units;
      }

      /**
       * A numeric value of the given measure type in the model's units -> { value, unit }. Length/area/volume become
       * m/m2/m3 (SI prefix or conversion factor); other measures keep the project unit (label or null).
       */
      export function convertUnit(value, measureType, units) {
        const unitType = MEASURE_UNIT_TYPE[String(measureType || "").toUpperCase()];
        if (!unitType) return { value, unit: null };
        const unit = units && units[unitType];
        if (SI_TARGET[unitType]) {
          const target = SI_TARGET[unitType];
          // SI prefixes: divide by the power of ten for negative exponents (9700 mm / 1000 = 9.7 exactly)
          if (unit && unit.kind === "si" && unit.exponent) {
            const scaled = unit.exponent < 0 ? value / Math.pow(10, -unit.exponent) : value * Math.pow(10, unit.exponent);
            return { value: scaled, unit: target };
          }
          const factor = unit && typeof unit.factor === "number" && isFinite(unit.factor) ? unit.factor : 1;
          return { value: factor === 1 ? value : value * factor, unit: target };
        }
        return { value, unit: unit && unit.label ? unit.label : null };
      }

      // ---- spatial structure ----

      /**
       * From the fragments spatial tree: storeyOf (Map localId -> storey localId, nearest IfcBuildingStorey ancestor,
       * also through aggregation) and the storey ids. Tree nodes are { category, localId, children }; a node with a
       * category groups items of that category.
       */
      export function spatialIndex(tree) {
        const storeyOf = new Map();
        const storeyIds = [];
        const stack = tree ? [[tree, null, null]] : [];
        while (stack.length) {
          const [node, inherited, parentStorey] = stack.pop();
          const category = node.category || inherited;
          let storey = parentStorey;
          if (node.localId !== null && node.localId !== undefined) {
            if (category === "IFCBUILDINGSTOREY") {
              storey = node.localId;
              if (storeyIds.indexOf(storey) === -1) storeyIds.push(storey);
            }
            if (storey !== null && storey !== node.localId) storeyOf.set(node.localId, storey);
          }
          const children = node.children || [];
          for (let i = children.length - 1; i >= 0; i--) stack.push([children[i], node.category || null, storey]);
        }
        return { storeyOf, storeyIds };
      }

      /** Map localId -> storey Name from spatialIndex and the storeys' item data. */
      export function storeyNames(index, storeyItems) {
        const names = new Map();
        for (const item of storeyItems || []) names.set(val(item._localId), val(item.Name));
        const out = new Map();
        for (const [id, storey] of index.storeyOf) {
          const name = names.get(storey);
          if (name !== undefined && name !== null && name !== "") out.set(id, String(name));
        }
        return out;
      }

      // ---- materials ----
      const MATERIAL_CHILDREN = [
        "ForLayerSet",
        "MaterialLayers",
        "Material",
        "Materials",
        "MaterialConstituents",
        "ForProfileSet",
        "MaterialProfiles",
      ];

      /** Sorted distinct IfcMaterial names reachable from HasAssociations items (layer/profile/constituent sets, lists). */
      export function materialNames(associations) {
        const found = new Set();
        const seen = new Set();
        const walk = (item) => {
          if (!item || seen.has(item)) return;
          seen.add(item);
          const category = String(val(item._category) || "");
          if (category === "IFCMATERIAL") {
            const name = val(item.Name);
            if (name !== undefined && name !== null && name !== "") found.add(String(name));
            return;
          }
          if (category.indexOf("IFCMATERIAL") !== 0) return; // classification references etc.
          for (const key of MATERIAL_CHILDREN) for (const child of item[key] || []) walk(child);
        };
        for (const item of associations || []) walk(item);
        return [...found].sort();
      }

      // ---- property values ----
      const ATTRIBUTE_KEYS = ["Name", "ObjectType", "Tag", "PredefinedType", "Description"];
      /** Special properties (group Allgemein) in catalogue order, with their kind. */
      export const SPECIAL_PROPERTIES = [
        ["Modell", "text"],
        ["Kategorie", "text"],
        ["Name", "text"],
        ["GlobalId", "text"],
        ["ObjectType", "text"],
        ["Tag", "text"],
        ["PredefinedType", "text"],
        ["Description", "text"],
        ["Typ", "text"],
        ["Geschoss", "text"],
        ["Material", "multi"],
        ["Geometrie", "bool"],
      ];
      export const GROUP_GENERAL = "Allgemein";
      const QUANTITY_VALUE_KEYS = ["LengthValue", "AreaValue", "VolumeValue", "CountValue", "WeightValue", "TimeValue"];

      /**
       * Normalises one IFC value { value, type } -> { value, kind, unit } or null when empty. Numbers stay numbers
       * (converted per DEC-2), booleans become Ja/Nein, text stays text even if it looks numeric (DEC-5).
       */
      export function normaliseValue(attr, units) {
        if (!attr || Array.isArray(attr)) return null;
        const raw = attr.value;
        if (raw === null || raw === undefined) return null;
        if (typeof raw === "boolean") return { value: raw ? "Ja" : "Nein", kind: "bool", unit: null };
        if (typeof raw === "number") {
          if (!isFinite(raw)) return null;
          const converted = convertUnit(raw, attr.type, units);
          return { value: converted.value, kind: "number", unit: converted.unit };
        }
        const text = String(raw);
        if (text === "") return null;
        if (attr.type === "IFCLOGICAL" || attr.type === "IFCBOOLEAN") {
          if (/^(\.?T\.?|TRUE)$/i.test(text)) return { value: "Ja", kind: "bool", unit: null };
          if (/^(\.?F\.?|FALSE)$/i.test(text)) return { value: "Nein", kind: "bool", unit: null };
        }
        return { value: text, kind: "text", unit: null };
      }

      function psetEntries(pset) {
        const out = [];
        const name = val(pset.Name);
        if (name === undefined || name === null) return out;
        for (const p of pset.HasProperties || []) {
          const propName = val(p.Name);
          if (propName === undefined || propName === null) continue;
          out.push([name, String(propName), p.NominalValue]);
        }
        for (const q of pset.Quantities || []) {
          const propName = val(q.Name);
          if (propName === undefined || propName === null) continue;
          let attr;
          for (const k of QUANTITY_VALUE_KEYS) if (q[k] && !Array.isArray(q[k])) attr = q[k];
          if (!attr) for (const k in q) if (/Value$/.test(k) && q[k] && !Array.isArray(q[k])) attr = q[k];
          out.push([name, String(propName), attr]);
        }
        return out;
      }

      const isPset = (category) => category === "IFCPROPERTYSET" || category === "IFCELEMENTQUANTITY";

      /**
       * Creates an extractor for one model. options: { modelId, modelName, units (parseUnits), storeyOf (Map localId
       * -> storey name), withGeometry (Set of localIds), className (upper-case class -> Kategorie) }.
       * add(item) turns one getItemsData item into a row { key, model, localId, guid, geometry, values };
       * result() returns { rows, properties, spaceProperties } where properties maps each pset property key to
       * { pset, name, occurrence, type, kinds, units } (input for buildCatalog). spaceProperties holds the same for
       * IfcSpace rows, kept apart so that spaces hidden by the option do not influence the catalogue (DEC-13).
       */
      export function createExtractor(options) {
        const rows = [];
        const properties = new Map();
        const spaceProperties = new Map();
        const units = options.units || {};
        const className = options.className || ((c) => c);

        function note(target, key, pset, name, normalised, fromType) {
          let meta = target.get(key);
          if (!meta) {
            meta = { pset, name, occurrence: false, type: false, kinds: new Set(), units: new Set() };
            target.set(key, meta);
          }
          if (fromType) meta.type = true;
          else meta.occurrence = true;
          meta.kinds.add(normalised.kind);
          if (normalised.kind === "number") meta.units.add(normalised.unit);
        }

        function addPset(target, values, pset, fromType) {
          for (const [psetName, propName, attr] of psetEntries(pset)) {
            const normalised = normaliseValue(attr, units);
            if (!normalised) continue;
            const key = psetName + "." + propName;
            values[key] = normalised.value; // occurrence psets are applied after type psets: occurrence wins (DEC-1)
            note(target, key, psetName, propName, normalised, fromType);
          }
        }

        function add(item) {
          const localId = val(item._localId);
          const category = String(val(item._category) || "");
          const target = category === SPACE_CLASS ? spaceProperties : properties;
          const values = {};
          values.Modell = options.modelName;
          values.Kategorie = className(category);
          for (const key of ATTRIBUTE_KEYS) {
            const normalised = normaliseValue(item[key], units);
            if (normalised) values[key] = normalised.kind === "number" ? normalised.value : String(normalised.value);
          }
          const guid = val(item._guid);
          if (guid) values.GlobalId = String(guid);

          let type = null;
          const occurrencePsets = [];
          for (const rel of item.IsDefinedBy || []) {
            const relCategory = String(val(rel._category) || "");
            if (isPset(relCategory)) occurrencePsets.push(rel);
            else if (/(TYPE|STYLE)$/.test(relCategory)) type = rel;
          }
          if (type) {
            const typeName = val(type.Name);
            if (typeName !== undefined && typeName !== null && typeName !== "") values.Typ = String(typeName);
            for (const pset of type.HasPropertySets || [])
              if (isPset(String(val(pset._category)))) addPset(target, values, pset, true);
            for (const pset of type.IsDefinedBy || [])
              if (isPset(String(val(pset._category)))) addPset(target, values, pset, true);
          }
          for (const pset of occurrencePsets) addPset(target, values, pset, false);

          const storey = options.storeyOf ? options.storeyOf.get(localId) : undefined;
          if (storey) values.Geschoss = storey;
          let materials = materialNames(item.HasAssociations);
          if (!materials.length && type) materials = materialNames(type.HasAssociations);
          if (materials.length) values.Material = materials;
          const geometry = options.withGeometry ? options.withGeometry.has(localId) : false;
          values.Geometrie = geometry ? "Ja" : "Nein";

          const row = {
            key: options.modelId + ":" + localId,
            model: options.modelId,
            localId,
            guid: guid ? String(guid) : null,
            geometry,
            values,
          };
          rows.push(row);
          return row;
        }

        return {
          add,
          result() {
            return { rows, properties, spaceProperties };
          },
        };
      }

      /** Kategorie of IfcSpace rows (DEC-13). */
      const SPACE_KATEGORIE = "IfcSpace";

      /** Rows shown under the IfcSpace option (DEC-13). */
      export function visibleRows(rows, includeSpaces) {
        return includeSpaces ? rows : rows.filter((row) => row.values.Kategorie !== SPACE_KATEGORIE);
      }

      /** Column header of a catalogue entry: label plus unit for numbers (REQ-002). */
      export function headerLabel(entry) {
        return entry.kind === "number" && entry.unit ? entry.label + " (" + entry.unit + ")" : entry.label;
      }

      const compareText = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

      /**
       * Property catalogue (spec 4.3) over the given rows: Map propertyKey -> { key, label, group, kind, unit, count,
       * header }, ordered Allgemein first (fixed order), then by group and label. models: [{ id, properties,
       * spaceProperties }] with the extractor's properties per model; a numeric property whose unit differs between
       * models is `gemischt`. Only the given (visible) rows decide: a model's spaceProperties count only if IfcSpace
       * rows of that model are among them, so hidden spaces do not change kind, unit or group.
       */
      export function buildCatalog(rows, models) {
        const counts = new Map();
        const present = new Set();
        const spacesPresent = new Set();
        for (const row of rows) {
          present.add(row.model);
          if (row.values.Kategorie === SPACE_KATEGORIE) spacesPresent.add(row.model);
          for (const key in row.values) {
            const value = row.values[key];
            if (value === undefined || value === null || (Array.isArray(value) && !value.length)) continue;
            counts.set(key, (counts.get(key) || 0) + 1);
          }
        }
        const merged = new Map();
        for (const model of models || []) {
          if (!present.has(model.id)) continue;
          const sources = [model.properties];
          if (model.spaceProperties && spacesPresent.has(model.id)) sources.push(model.spaceProperties);
          for (const [key, meta] of sources.flatMap((source) => [...source])) {
            let m = merged.get(key);
            if (!m) {
              m = { pset: meta.pset, name: meta.name, occurrence: false, kinds: new Set(), unitsByModel: [] };
              merged.set(key, m);
            }
            if (meta.occurrence) m.occurrence = true;
            for (const k of meta.kinds) m.kinds.add(k);
            if (meta.kinds.has("number")) m.unitsByModel.push(meta.units);
          }
        }
        const catalog = new Map();
        for (const [key, kind] of SPECIAL_PROPERTIES) {
          const entry = { key, label: key, group: GROUP_GENERAL, kind, unit: null, count: counts.get(key) || 0 };
          entry.header = headerLabel(entry);
          catalog.set(key, entry);
        }
        const rest = [];
        for (const [key, m] of merged) {
          if (!counts.get(key)) continue;
          let kind = "text";
          if (m.kinds.size === 1) kind = [...m.kinds][0];
          let unit = null;
          if (kind === "number") {
            const all = new Set();
            let mixedInModel = false;
            for (const set of m.unitsByModel) {
              if (set.size > 1) mixedInModel = true;
              for (const u of set) all.add(u);
            }
            if (mixedInModel || all.size > 1) unit = "gemischt";
            else unit = all.size ? [...all][0] : null;
          }
          const entry = {
            key,
            label: key,
            group: m.occurrence ? m.pset : "Typ: " + m.pset,
            kind,
            unit,
            count: counts.get(key),
          };
          entry.header = headerLabel(entry);
          rest.push(entry);
        }
        rest.sort((a, b) => compareText(a.group, b.group) || compareText(a.label, b.label));
        for (const entry of rest) catalog.set(entry.key, entry);
        return catalog;
      }

      // ---------------------------------------------------------------------------------------------------------
      // Filter engine (TASK-003; REQ-004, REQ-006 filter/sort logic; spec 4.3 column store, 4.4)
      // ---------------------------------------------------------------------------------------------------------

      /** Label of the empty value in filter sets, checklists and groups (REQ-004); the value itself is null. */
      export const EMPTY_LABEL = "(leer)";

      const COLLATOR = new Intl.Collator("de");

      /** True for "no value": undefined, null, "", [] and non-finite numbers (NaN, +-Infinity; TASK-003 D4). */
      export function isEmptyValue(value) {
        return (
          value === undefined ||
          value === null ||
          value === "" ||
          (typeof value === "number" && !Number.isFinite(value)) ||
          (Array.isArray(value) && value.length === 0)
        );
      }

      /**
       * Order of distinct values (REQ-004): numbers numerically before texts, texts alphabetically (German collation,
       * then code units, so the order is total); null (empty) last.
       */
      export function compareValues(a, b) {
        const ae = a === null || a === undefined || (typeof a === "number" && !Number.isFinite(a));
        const be = b === null || b === undefined || (typeof b === "number" && !Number.isFinite(b));
        if (ae || be) return ae === be ? 0 : ae ? 1 : -1;
        const an = typeof a === "number";
        const bn = typeof b === "number";
        if (an && bn) return a < b ? -1 : a > b ? 1 : 0;
        if (an !== bn) return an ? -1 : 1;
        const sa = String(a);
        const sb = String(b);
        return COLLATOR.compare(sa, sb) || (sa < sb ? -1 : sa > sb ? 1 : 0);
      }

      /** Distinct values in compareValues order; numbers and texts sorted apart (faster than one mixed comparator). */
      function sortDistinct(distinct) {
        const numbers = [];
        const texts = [];
        for (const v of distinct) (typeof v === "number" ? numbers : texts).push(v);
        numbers.sort((a, b) => a - b);
        texts.sort((a, b) => COLLATOR.compare(a, b) || (a < b ? -1 : a > b ? 1 : 0));
        return numbers.concat(texts);
      }

      /** Text shown for a cell value: multi-values joined with ", " (REQ-002), empty as "". */
      export function displayValue(value) {
        if (isEmptyValue(value)) return "";
        return Array.isArray(value) ? value.filter((v) => !isEmptyValue(v)).join(", ") : String(value);
      }

      const wordsFor = (n) => (n + 31) >>> 5;

      /**
       * Builds one dictionary-coded column for a property (spec 4.3): every row has one or more codes into `values`
       * (distinct values sorted by compareValues; the empty value is the last code, emptyCode). Rows are stored as
       * offsets (start, length n + 1) into flat codes; `single` is true when every row has exactly one code, then
       * flat[i] is the code of row i. `index` maps a value to its code; nums holds the number of single-number cells
       * (NaN otherwise) for range filters and numeric sorting.
       */
      function buildColumn(rows, key) {
        const n = rows.length;
        const tempIndex = new Map();
        const distinct = [];
        const start = new Uint32Array(n + 1);
        let flat = new Int32Array(Math.max(n, 1));
        let used = 0;
        let single = true;
        let empties = false;
        const nums = new Float64Array(n);
        const push = (code) => {
          if (used === flat.length) {
            const grown = new Int32Array(flat.length * 2);
            grown.set(flat);
            flat = grown;
          }
          flat[used++] = code;
        };
        const codeOf = (value) => {
          let code = tempIndex.get(value);
          if (code === undefined) {
            code = distinct.length;
            distinct.push(value);
            tempIndex.set(value, code);
          }
          return code;
        };
        for (let i = 0; i < n; i++) {
          start[i] = used;
          const value = rows[i].values[key];
          nums[i] = typeof value === "number" && Number.isFinite(value) ? value : NaN;
          if (isEmptyValue(value)) {
            push(-1);
            empties = true;
          } else if (Array.isArray(value)) {
            const before = used;
            for (const v of value) {
              if (isEmptyValue(v)) continue;
              const code = codeOf(v);
              let seen = false;
              for (let j = before; j < used; j++) if (flat[j] === code) seen = true;
              if (!seen) push(code);
            }
            if (used === before) {
              push(-1);
              empties = true;
            }
            if (used - before !== 1) single = false;
          } else push(codeOf(value));
        }
        start[n] = used;
        const sorted = sortDistinct(distinct);
        const remap = new Int32Array(distinct.length);
        const values = new Array(distinct.length + 1);
        for (let rank = 0; rank < sorted.length; rank++) {
          remap[tempIndex.get(sorted[rank])] = rank;
          values[rank] = sorted[rank];
        }
        const emptyCode = distinct.length;
        values[emptyCode] = null;
        flat = flat.slice(0, used);
        for (let j = 0; j < used; j++) flat[j] = flat[j] < 0 ? emptyCode : remap[flat[j]];
        // value -> code, reusing the first-pass map (no second map over up to n distinct values)
        const index = { get: (value) => (tempIndex.has(value) ? remap[tempIndex.get(value)] : undefined) };
        return { key, n, values, index, emptyCode, empties, start, flat, single, nums, masks: new Map(), sortKey: null };
      }

      const MASK_CACHE_LIMIT = 16;

      /**
       * Lazy column store over the rows (spec 4.3): columns (dictionary codes, numbers) and filter bitsets are built
       * only for properties that are asked for, cached, and dropped by retain(keys) when no longer in use. Create a
       * new store whenever the row set changes (load, remove, IfcSpace option).
       */
      export function createColumnStore(rows) {
        const columns = new Map();
        let textIndex = null; // display-text index (TASK-011, spec 4.3): one string per row, built lazily
        let building = null; // promise of a chunked build in progress
        let rowIndex = null; // element key -> row index, built on the first key-set filter
        return {
          rows,
          size: rows.length,
          column(key) {
            let col = columns.get(key);
            if (!col) {
              col = buildColumn(rows, key);
              columns.set(key, col);
            }
            return col;
          },
          has: (key) => columns.has(key),
          keys: () => [...columns.keys()],
          /** Drops every cached column whose key is not in keys (filter sets, column filters, sort, grouping, colour). */
          retain(keys) {
            const keep = new Set(keys);
            for (const key of [...columns.keys()]) if (!keep.has(key)) columns.delete(key);
          },
          /** Bitsets of `text` rules and the search, cached per needle (dropped with the store). */
          textMasks: new Map(),
          /** True once the display-text index exists (no build needed before a text rule or search). */
          hasTextIndex: () => textIndex !== null,
          /** The display-text index; built at once (synchronously) if it does not exist yet. */
          textIndex() {
            if (!textIndex) textIndex = rows.map((row) => rowText(row.values));
            return textIndex;
          },
          /**
           * Builds the display-text index in chunks of options.chunkRows rows (default TEXT_INDEX_CHUNK_ROWS), awaiting
           * options.pause(fraction) after each chunk (progress overlay, yielding). Concurrent calls share one build;
           * resolves to the index. A store is created per row set, so the index is dropped with it when a model is
           * added or removed or the IfcSpace option changes (spec 4.3).
           */
          buildTextIndex(options) {
            if (textIndex) return Promise.resolve(textIndex);
            if (building) return building;
            const chunk = Math.max(1, (options && options.chunkRows) || TEXT_INDEX_CHUNK_ROWS);
            const pause = options && options.pause;
            building = (async () => {
              const out = new Array(rows.length);
              for (let first = 0; first < rows.length; first += chunk) {
                const end = Math.min(rows.length, first + chunk);
                for (let i = first; i < end; i++) out[i] = rowText(rows[i].values);
                if (pause && !textIndex) await pause(end / rows.length);
                if (textIndex) break; // built synchronously meanwhile
              }
              if (!textIndex) textIndex = out;
              return textIndex;
            })().finally(() => {
              building = null;
            });
            return building;
          },
          /** Row index of an element key (`<modelId>:<localId>`), or undefined. */
          rowOf(key) {
            if (!rowIndex) {
              rowIndex = new Map();
              for (let i = 0; i < rows.length; i++) rowIndex.set(rows[i].key, i);
            }
            return rowIndex.get(key);
          },
        };
      }

      const asStore = (source) => (Array.isArray(source) ? createColumnStore(source) : source);

      /** A range bound that restricts nothing: null, undefined, NaN, "" or whitespace only (TASK-003 D1). */
      const noBound = (b) =>
        b === null ||
        b === undefined ||
        (typeof b === "string" && b.trim() === "") ||
        (typeof b === "number" && Number.isNaN(b));

      /** Distinct values of a selection; undefined is the empty value null (TASK-003 D5). */
      function distinctValues(values) {
        const seen = new Set();
        const out = [];
        for (const v of values) {
          const value = v === undefined ? null : v;
          if (seen.has(value)) continue;
          seen.add(value);
          out.push(value);
        }
        return out;
      }

      /**
       * Normalises a filter: { id?, key, type: 'values', values: [...] } (checklist / filter set; OR within; null =
       * empty) or { id?, key, type: 'range', min, max } (inclusive bounds, null or "" = no bound; DEC-17). id
       * defaults to key. Returns null for a filter that does not restrict anything (no value checked, no bound).
       * CR-002 filter sources (TASK-011, spec 4.3): { type: 'rule', id?, mode, key, op, value } (normaliseRule; a
       * `mark` rule is no filter source), { type: 'search', id?, text } and { type: 'keys', id?, mode: 'include' |
       * 'exclude', keys } - see normaliseRuleFilter, normaliseSearchFilter, normaliseKeysFilter. Each is one row mask
       * in evaluateFilters, so facet counts are computed under them (DEC-14, DEC-18).
       */
      export function normaliseFilter(filter) {
        if (filter && filter.type === "rule") return normaliseRuleFilter(filter);
        if (filter && filter.type === "search") return normaliseSearchFilter(filter);
        if (filter && filter.type === "keys") return normaliseKeysFilter(filter);
        if (!filter || !filter.key) return null;
        const id = filter.id === undefined ? filter.key : filter.id;
        if (filter.type === "range") {
          const min = noBound(filter.min) ? null : Number(filter.min);
          const max = noBound(filter.max) ? null : Number(filter.max);
          if (min === null && max === null) return null;
          return { id, key: filter.key, type: "range", min, max };
        }
        const values = Array.isArray(filter.values) ? distinctValues(filter.values) : [];
        if (!values.length) return null;
        return { id, key: filter.key, type: "values", values };
      }

      /** The filters that restrict something (none after resetting all filters; REQ-004-AC4). */
      export function activeFilters(filters) {
        return (filters || []).map(normaliseFilter).filter(Boolean);
      }

      /** Bitset (Uint32Array, one bit per row) of the rows passing one normalised filter; cached on its column. */
      function filterMask(store, filter) {
        if (filter.type === "rule") return ruleFilterMask(store, filter);
        if (filter.type === "search") return textNeedleMask(store, "contains", filter.needle);
        if (filter.type === "keys") return keysMask(store, filter);
        const col = store.column(filter.key);
        const signature =
          filter.type === "range"
            ? "r" + filter.min + "|" + filter.max
            : "v" + JSON.stringify(filter.values.map((v) => (typeof v === "number" ? [v] : v)));
        const cached = col.masks.get(signature);
        if (cached) return cached;
        const n = col.n;
        const bits = new Uint32Array(wordsFor(n));
        if (filter.type === "range") {
          const lo = filter.min === null ? -Infinity : filter.min;
          const hi = filter.max === null ? Infinity : filter.max;
          for (let i = 0; i < n; i++) {
            const v = col.nums[i];
            if (v >= lo && v <= hi) bits[i >>> 5] |= 1 << (i & 31);
          }
        } else {
          const wanted = new Uint8Array(col.values.length);
          let any = false;
          for (const v of filter.values) {
            const code = v === null || v === undefined ? col.emptyCode : col.index.get(v);
            if (code !== undefined) {
              wanted[code] = 1;
              any = true;
            }
          }
          if (any) {
            const { start, flat } = col;
            for (let i = 0; i < n; i++) {
              for (let j = start[i]; j < start[i + 1]; j++) {
                if (wanted[flat[j]]) {
                  bits[i >>> 5] |= 1 << (i & 31);
                  break;
                }
              }
            }
          }
        }
        if (col.masks.size >= MASK_CACHE_LIMIT) col.masks.clear();
        col.masks.set(signature, bits);
        return bits;
      }

      function allBits(n) {
        const bits = new Uint32Array(wordsFor(n)).fill(0xffffffff);
        if (n & 31) bits[bits.length - 1] = (1 << (n & 31)) - 1;
        return bits;
      }

      function andInto(target, bits) {
        for (let w = 0; w < target.length; w++) target[w] &= bits[w];
        return target;
      }

      /**
       * Evaluates the filters once (REQ-004, REQ-006): `pass` = bitset of rows passing ALL active filters (AND across
       * filters, OR within a filter); `except(id)` = bitset of rows passing all active filters except the one with
       * that id (the base of that filter set's facet counts).
       */
      export function evaluateFilters(source, filters) {
        const store = asStore(source);
        const active = activeFilters(filters);
        const masks = active.map((f) => filterMask(store, f));
        const n = store.size;
        const k = masks.length;
        // prefix[i] = AND of masks[0..i-1], suffix[i] = AND of masks[i..k-1]; except(i) = prefix[i] AND suffix[i+1]
        const prefix = [allBits(n)];
        for (let i = 0; i < k; i++) prefix.push(andInto(prefix[i].slice(), masks[i]));
        const suffix = new Array(k + 1);
        suffix[k] = allBits(n);
        for (let i = k - 1; i >= 0; i--) suffix[i] = andInto(suffix[i + 1].slice(), masks[i]);
        const pass = prefix[k];
        return {
          store,
          filters: active,
          pass,
          except(id) {
            const i = active.findIndex((f) => f.id === id);
            return i === -1 ? pass : andInto(prefix[i].slice(), suffix[i + 1]);
          },
        };
      }

      /** Row indices (ascending) whose bit is set. */
      export function bitsToIndices(bits, n) {
        let count = 0;
        for (let w = 0; w < bits.length; w++) {
          let x = bits[w];
          while (x) {
            x &= x - 1;
            count++;
          }
        }
        const out = new Uint32Array(count);
        let o = 0;
        for (let w = 0; w < bits.length; w++) {
          let x = bits[w];
          while (x) {
            const t = x & -x;
            const i = (w << 5) + (31 - Math.clz32(t));
            if (i < n) out[o++] = i;
            x ^= t;
          }
        }
        return o === count ? out : out.slice(0, o);
      }

      /**
       * Indices (ascending, Uint32Array) of the rows that pass all filters: filter sets and column filters combined
       * with AND, checked values within one filter with OR; a multi-valued cell matches if any of its values is
       * checked (REQ-004, REQ-006, DEC-17). source: a column store or a row array.
       */
      export function filterRows(source, filters) {
        const ev = source && source.pass ? source : evaluateFilters(source, filters);
        return bitsToIndices(ev.pass, ev.store.size);
      }

      /**
       * Values and counts of filter sets (REQ-004, DEC-14). facets: [{ id?, key }] or keys (id defaults to key); each
       * facet counts under all active filters except the filter with its own id, so checking a value never hides the
       * other values of the same set. Returns Map id -> { id, key, total, checkedCount, values: [{ value, count,
       * checked }] } with values in compareValues order (numbers numerically, empty value null last). Values with
       * count 0 are left out, except checked values (count 0, kept so they can be unchecked). A multi-valued cell
       * counts once for each of its distinct values.
       */
      export function facetCounts(source, filters, facets) {
        const ev = source && source.pass ? source : evaluateFilters(source, filters);
        const { store } = ev;
        const out = new Map();
        for (const facet of facets || []) {
          const key = typeof facet === "string" ? facet : facet.key;
          const id = typeof facet === "string" ? facet : facet.id === undefined ? key : facet.id;
          const col = store.column(key);
          const base = ev.except(id);
          const counts = new Int32Array(col.values.length);
          const { start, flat, single } = col;
          let total = 0;
          for (let w = 0; w < base.length; w++) {
            let x = base[w];
            while (x) {
              const t = x & -x;
              const i = (w << 5) + (31 - Math.clz32(t));
              x ^= t;
              total++;
              if (single) counts[flat[i]]++;
              else for (let j = start[i]; j < start[i + 1]; j++) counts[flat[j]]++;
            }
          }
          const own = ev.filters.find((f) => f.id === id && f.type === "values");
          const checked = new Set();
          const extra = [];
          if (own)
            for (const v of own.values) {
              const value = v === undefined ? null : v;
              const code = value === null ? col.emptyCode : col.index.get(value);
              if (code === undefined) extra.push(value);
              else checked.add(code);
            }
          let values = [];
          for (let c = 0; c < counts.length; c++) {
            const isChecked = checked.has(c);
            if (counts[c] > 0 || isChecked) values.push({ value: col.values[c], count: counts[c], checked: isChecked });
          }
          if (extra.length) {
            for (const value of extra)
              if (!values.some((e) => e.value === value)) values.push({ value, count: 0, checked: true });
            values = values.sort((a, b) => compareValues(a.value, b.value));
          }
          out.set(id, { id, key, total, checkedCount: checked.size + extra.length, values });
        }
        return out;
      }

      /**
       * Sort key of a column, built once (REQ-006): numbers for single-number cells, else the rank of the displayed
       * text (a cell's distinct values joined with ", ") among all displayed values; NaN = empty (always last).
       */
      function sortKeyOf(col, rows) {
        if (col.sortKey) return col.sortKey;
        const n = col.n;
        const key = new Float64Array(n);
        if (col.single) {
          for (let i = 0; i < n; i++) key[i] = col.flat[i] === col.emptyCode ? NaN : col.flat[i];
        } else {
          const shown = new Array(n);
          const distinct = new Set();
          for (let i = 0; i < n; i++) {
            const value = rows[i].values[col.key];
            const cell = Array.isArray(value) ? [...new Set(value.filter((v) => !isEmptyValue(v)))] : value;
            shown[i] = isEmptyValue(cell) ? null : Array.isArray(cell) ? displayValue(cell) : cell;
            if (shown[i] !== null) distinct.add(shown[i]);
          }
          const rank = new Map([...distinct].sort(compareValues).map((v, r) => [v, r]));
          for (let i = 0; i < n; i++) key[i] = shown[i] === null ? NaN : rank.get(shown[i]);
        }
        col.sortKey = key;
        return key;
      }

      /**
       * Sorts row indices by one column (REQ-006): sort = { key, dir: 'asc' | 'desc' }; numbers numerically, texts
       * alphabetically (compareValues), empty values last in both directions, ties keep the given order. Returns a
       * new Uint32Array; without sort.key the order is unchanged.
       */
      export function sortRows(source, indices, sort) {
        const store = asStore(source);
        const out = Uint32Array.from(indices);
        if (!sort || !sort.key) return out;
        const key = sortKeyOf(store.column(sort.key), store.rows);
        const sign = sort.dir === "desc" ? -1 : 1;
        const keys = new Float64Array(out.length);
        for (let p = 0; p < out.length; p++) keys[p] = key[out[p]];
        const order = new Uint32Array(out.length).map((_, p) => p);
        order.sort((a, b) => {
          const ka = keys[a];
          const kb = keys[b];
          const ea = Number.isNaN(ka);
          const eb = Number.isNaN(kb);
          if (ea || eb) return ea === eb ? a - b : ea ? 1 : -1;
          return (ka < kb ? -sign : ka > kb ? sign : 0) || a - b;
        });
        return order.map((p) => out[p]);
      }

      /**
       * Sorts any items by a value (e.g. group rows by their sums; REQ-006-AC5): same order rules as sortRows,
       * empty (null, undefined, "", [], non-finite numbers) last in both directions, stable.
       */
      export function sortByValue(items, valueOf, dir) {
        const sign = dir === "desc" ? -1 : 1;
        const isNone = isEmptyValue;
        return items
          .map((item, p) => ({ item, p, v: valueOf(item) }))
          .sort((a, b) => {
            const ea = isNone(a.v);
            const eb = isNone(b.v);
            if (ea || eb) return ea === eb ? a.p - b.p : ea ? 1 : -1;
            const va = Array.isArray(a.v) ? displayValue(a.v) : a.v;
            const vb = Array.isArray(b.v) ? displayValue(b.v) : b.v;
            return sign * compareValues(va, vb) || a.p - b.p;
          })
          .map((e) => e.item);
      }

      // ---------------------------------------------------------------------------------------------------------
      // Rules, search and key sets (TASK-011; CR-002: REQ-012, REQ-013, DEC-18, DEC-19, spec 4.3 filter sources)
      // ---------------------------------------------------------------------------------------------------------

      /** Actions of a rule with their German labels (REQ-012 `Aktion`; ref FILTER_MODES, `select` is `mark` here). */
      export const RULE_MODES = [
        ["isolate", "Isolieren"],
        ["hide", "Ausblenden"],
        ["mark", "Markieren"],
        ["text", "Freie Textsuche"],
      ];
      /** Comparisons of a rule with their German labels (REQ-012 `Vergleich`; ref FILTER_OPERATORS). */
      export const RULE_OPS = [
        ["eq", "Gleich"],
        ["starts", "Beginnt mit"],
        ["ends", "Endet mit"],
        ["contains", "Enth\u00e4lt"],
      ];
      /** Property text of a `Freie Textsuche` rule row (REQ-012). */
      export const RULE_ANY_PROPERTY = "Beliebige Eigenschaft";
      /** Paint of shown elements matching a `Markieren` rule (REQ-012, DEC-19). */
      export const MARK_COLOUR = "#f08a87";
      /** Rows per chunk of the chunked display-text index build (as INDEX_CHUNK_SIZE of the extraction). */
      export const TEXT_INDEX_CHUNK_ROWS = 2000;
      /** Separator between the display texts of one row in the display-text index (spec 4.3). */
      export const TEXT_SEPARATOR = "\u0001";

      const RULE_MODE_IDS = new Set(RULE_MODES.map(([id]) => id));
      const RULE_OP_IDS = new Set(RULE_OPS.map(([id]) => id));
      // C0 and C1 control characters (everything outside " ".."~" and U+00A0..U+FFFF), replaced by a space (spec 4.3)
      const CONTROL_RE = /[^ -~\u00a0-\uffff]/g;

      /** Text as rules compare it (DEC-19): lower case (toLowerCase), control characters replaced by a space. */
      export function matchText(text) {
        return String(text).toLowerCase().replace(CONTROL_RE, " ");
      }

      /** Display text of one non-empty scalar value: as the table shows it (formatCell), booleans as Ja / Nein. */
      function scalarText(v) {
        if (typeof v === "number") return CELL_FORMAT.format(v);
        if (typeof v === "boolean") return v ? "Ja" : "Nein";
        return String(v);
      }

      /**
       * The text rules compare (DEC-19; spec 4.4 displayText): the value as the table shows it - German numbers with
       * "." thousands and "," decimals, up to 3 decimals, already in the converted unit and without unit text;
       * booleans `Ja` / `Nein`; text as stored; multi-values joined with ", "; empty values "". entry (the catalogue
       * entry of the property) is accepted for the documented signature; units are converted at extraction, so it
       * changes nothing.
       */
      // eslint-disable-next-line no-unused-vars
      export function displayText(value, entry) {
        if (isEmptyValue(value)) return "";
        if (!Array.isArray(value)) return scalarText(value);
        return valueTexts(value).join(", ");
      }

      /** Display texts of the non-empty values of a cell, one per value (a rule matches if any of them matches). */
      export function valueTexts(value) {
        if (isEmptyValue(value)) return [];
        if (!Array.isArray(value)) return [scalarText(value)];
        const out = [];
        for (const v of value) if (!isEmptyValue(v)) out.push(scalarText(v));
        return out;
      }

      /**
       * One row of the display-text index (spec 4.3): the match texts (matchText) of every non-empty value of every
       * property, each multi-value on its own, joined with and enclosed by TEXT_SEPARATOR. Property names are not part
       * of it (DEC-19: the search does not search names).
       */
      function rowText(values) {
        const parts = [];
        for (const key in values) {
          const value = values[key];
          if (isEmptyValue(value)) continue;
          if (Array.isArray(value)) {
            for (const v of value) if (!isEmptyValue(v)) parts.push(scalarText(v).replace(CONTROL_RE, " "));
          } else parts.push(scalarText(value).replace(CONTROL_RE, " "));
        }
        // one toLowerCase over the joined text equals one per part: the separator is no letter
        return (TEXT_SEPARATOR + parts.join(TEXT_SEPARATOR) + TEXT_SEPARATOR).toLowerCase();
      }

      /** True when the match text `text` satisfies op against the match text `needle` (ref textMatches). */
      export function textMatches(text, op, needle) {
        if (op === "eq") return text === needle;
        if (op === "starts") return text.startsWith(needle);
        if (op === "ends") return text.endsWith(needle);
        return text.includes(needle);
      }

      /**
       * A valid rule {mode, key, op, value} (spec 4.3, DEC-20 rule validity) or null: mode isolate / hide / mark /
       * text, op eq / starts / ends / contains, value a non-empty string, key a non-empty string except for `text`
       * (whose key is null). The value is kept as typed (the dialog trims it).
       */
      export function normaliseRule(rule) {
        if (!rule || typeof rule !== "object") return null;
        const { mode, op, value } = rule;
        if (!RULE_MODE_IDS.has(mode) || !RULE_OP_IDS.has(op)) return null;
        if (typeof value !== "string" || value === "") return null;
        if (mode === "text") return { mode, key: null, op, value };
        if (typeof rule.key !== "string" || rule.key === "") return null;
        return { mode, key: rule.key, op, value };
      }

      /**
       * Filter of one rule ({ type: 'rule', id?, mode, key, op, value }): isolate and text keep the matching rows,
       * hide removes them; a mark rule is no filter source (null; see markRows), nor is an invalid rule.
       */
      function normaliseRuleFilter(filter) {
        const rule = normaliseRule(filter);
        if (!rule || rule.mode === "mark") return null;
        const id =
          filter.id === undefined ? ["rule", rule.mode, rule.op, rule.key, rule.value].join(TEXT_SEPARATOR) : filter.id;
        return { id, type: "rule", ...rule, needle: matchText(rule.value) };
      }

      /** Filter of the search field ({ type: 'search', id?, text }); blank text (after trim, as ref) is no filter. */
      function normaliseSearchFilter(filter) {
        const text = typeof filter.text === "string" ? filter.text.trim() : "";
        if (!text) return null;
        return { id: filter.id === undefined ? "search" : filter.id, type: "search", text, needle: matchText(text) };
      }

      /**
       * Filter of a key set ({ type: 'keys', id?, mode: 'include' | 'exclude', keys }; DEC-18): include keeps only the
       * rows whose key is in keys (isolated set; keys null = no isolation, an empty set keeps nothing - cv-app ends an
       * isolation that becomes empty), exclude removes them (hidden set; empty = no filter).
       */
      function normaliseKeysFilter(filter) {
        if (filter.mode !== "include" && filter.mode !== "exclude") return null;
        if (filter.keys === null || filter.keys === undefined) return null;
        const keys = new Set(filter.keys);
        if (filter.mode === "exclude" && keys.size === 0) return null;
        return { id: filter.id === undefined ? "keys:" + filter.mode : filter.id, type: "keys", mode: filter.mode, keys };
      }

      function invertBits(bits, n) {
        const out = allBits(n);
        for (let w = 0; w < out.length; w++) out[w] &= ~bits[w];
        return out;
      }

      function cacheMask(cache, signature, bits) {
        if (cache.size >= MASK_CACHE_LIMIT) cache.clear();
        cache.set(signature, bits);
        return bits;
      }

      /**
       * Rows with some value of column key matching (op, needle) (DEC-19): evaluated once per distinct value of the
       * column (dictionary codes), then mapped to the rows; the empty value never matches. Cached on the column.
       */
      function columnMatchMask(store, key, op, needle) {
        const col = store.column(key);
        const signature = "t" + op + TEXT_SEPARATOR + needle;
        const cached = col.masks.get(signature);
        if (cached) return cached;
        if (!col.matchTexts) {
          col.matchTexts = new Array(col.emptyCode);
          for (let c = 0; c < col.emptyCode; c++) col.matchTexts[c] = matchText(scalarText(col.values[c]));
        }
        const wanted = new Uint8Array(col.values.length);
        let any = false;
        for (let c = 0; c < col.emptyCode; c++) {
          if (textMatches(col.matchTexts[c], op, needle)) {
            wanted[c] = 1;
            any = true;
          }
        }
        const n = col.n;
        const bits = new Uint32Array(wordsFor(n));
        if (any) {
          const { start, flat } = col;
          for (let i = 0; i < n; i++) {
            for (let j = start[i]; j < start[i + 1]; j++) {
              if (wanted[flat[j]]) {
                bits[i >>> 5] |= 1 << (i & 31);
                break;
              }
            }
          }
        }
        return cacheMask(col.masks, signature, bits);
      }

      /**
       * Rows with some value of some property matching (op, needle), on the display-text index (spec 4.3): contains =
       * includes(v), eq = includes(SEP v SEP), starts = includes(SEP v), ends = includes(v SEP). Builds the index
       * synchronously if it does not exist yet (cv-app awaits store.buildTextIndex first, with progress).
       */
      function textNeedleMask(store, op, needle) {
        const signature = op + TEXT_SEPARATOR + needle;
        const cached = store.textMasks.get(signature);
        if (cached) return cached;
        const S = TEXT_SEPARATOR;
        const pattern = op === "eq" ? S + needle + S : op === "starts" ? S + needle : op === "ends" ? needle + S : needle;
        const index = store.textIndex();
        const n = store.size;
        const bits = new Uint32Array(wordsFor(n));
        for (let i = 0; i < n; i++) if (index[i].includes(pattern)) bits[i >>> 5] |= 1 << (i & 31);
        return cacheMask(store.textMasks, signature, bits);
      }

      /** Rows matching a normalised rule ({mode, key, op, needle}), regardless of its action. */
      function ruleMatchMask(store, rule) {
        return rule.mode === "text"
          ? textNeedleMask(store, rule.op, rule.needle)
          : columnMatchMask(store, rule.key, rule.op, rule.needle);
      }

      function ruleFilterMask(store, filter) {
        const match = ruleMatchMask(store, filter);
        return filter.mode === "hide" ? invertBits(match, store.size) : match;
      }

      function keysMask(store, filter) {
        const n = store.size;
        const bits = new Uint32Array(wordsFor(n));
        for (const key of filter.keys) {
          const i = store.rowOf(key);
          if (i !== undefined) bits[i >>> 5] |= 1 << (i & 31);
        }
        return filter.mode === "exclude" ? invertBits(bits, n) : bits;
      }

      /**
       * Mark mask (REQ-012 `Markieren`, DEC-19): bitset of the rows matching ANY `mark` rule of rules (rules or rule
       * filters; other actions and invalid rules are ignored), restricted to `within` (e.g. the shown rows,
       * evaluateFilters(...).pass) when given. Marking never removes a row: it is not a filter source.
       */
      export function markRows(source, rules, within) {
        const store = asStore(source);
        const n = store.size;
        const bits = new Uint32Array(wordsFor(n));
        for (const r of rules || []) {
          const rule = normaliseRule(r);
          if (!rule || rule.mode !== "mark") continue;
          const match = ruleMatchMask(store, { ...rule, needle: matchText(rule.value) });
          for (let w = 0; w < bits.length; w++) bits[w] |= match[w];
        }
        if (within) andInto(bits, within);
        return bits;
      }

      /**
       * Row text of a rule (REQ-012): { mode: action label, text: `<Eigenschaft> <vergleich> \u201e<Wert>\u201c` } with the
       * comparison in lower case and `Beliebige Eigenschaft` for `Freie Textsuche`; the property label comes from the
       * catalogue (the key when the property is not loaded). The UI renders both as text only.
       */
      export function describeRule(rule, catalog) {
        const modeEntry = RULE_MODES.find(([id]) => id === rule.mode);
        const opEntry = RULE_OPS.find(([id]) => id === rule.op);
        const entry = rule.mode === "text" ? null : catalog && catalog.get(rule.key);
        const property = rule.mode === "text" ? RULE_ANY_PROPERTY : entry ? entry.label : String(rule.key);
        const op = (opEntry ? opEntry[1] : String(rule.op)).toLowerCase();
        return {
          mode: modeEntry ? modeEntry[1] : String(rule.mode),
          text: property + " " + op + " \u201e" + rule.value + "\u201c",
        };
      }

      /** Entries of the `Eigenschaft` suggestion list of `Filter bearbeiten` before `+<n> mehr` (REQ-012, ref L220). */
      export const RULE_PROPERTY_LIMIT = 50;
      /** `Wert` suggestions of `Filter bearbeiten`: distinct display texts of the chosen property (REQ-012, ref L221). */
      export const RULE_VALUE_LIMIT = 200;

      /**
       * `Eigenschaft` suggestions of `Filter bearbeiten` (REQ-012, TASK-015b; ref L694-709): the catalogue entries
       * (in catalogue order: `Allgemein` first, then by group and label) whose label or group contains the query in
       * any letter case (an empty query lists all), at most limit of them. Returns { items, more } (more = matches
       * left out).
       */
      export function ruleProperties(entries, query, limit = RULE_PROPERTY_LIMIT) {
        const q = String(query || "")
          .trim()
          .toLowerCase();
        const matches = [];
        for (const entry of entries || []) {
          if (!q || entry.label.toLowerCase().includes(q) || String(entry.group || "").toLowerCase().includes(q))
            matches.push(entry);
        }
        return { items: matches.slice(0, limit), more: Math.max(0, matches.length - limit) };
      }

      /**
       * The catalogue entry whose label equals the typed text (REQ-012: "a typed text that equals a property label
       * exactly is accepted"; trimmed; the exact spelling first, else ignoring letter case as ref L728-732), or null.
       */
      export function findRuleProperty(entries, typed) {
        const text = String(typed || "").trim();
        if (!text) return null;
        const list = [...(entries || [])];
        const exact = list.find((entry) => entry.label === text);
        if (exact) return exact;
        const lower = text.toLowerCase();
        return list.find((entry) => entry.label.toLowerCase() === lower) || null;
      }

      /**
       * `Wert` suggestions of `Filter bearbeiten` (REQ-012, DEC-19): the distinct display texts (displayText; what a
       * rule compares, so a picked suggestion always matches) of the values of property key over the rows, in value
       * order (compareValues: numbers ascending, then texts), at most limit; the empty value is left out.
       */
      export function ruleValueTexts(source, key, limit = RULE_VALUE_LIMIT) {
        if (!key) return [];
        const col = asStore(source).column(key);
        const seen = new Set();
        const out = [];
        for (let c = 0; c < col.emptyCode && out.length < limit; c++) {
          const text = scalarText(col.values[c]);
          if (text === "" || seen.has(text)) continue;
          seen.add(text);
          out.push(text);
        }
        return out;
      }

      // ---------------------------------------------------------------------------------------------------------
      // Colouring (TASK-005, changed TASK-012 for CR-002; REQ-005 `Faerben`, DEC-15; ref computeColoring /
      // distinctHex / scaleHex L465-521)
      // ---------------------------------------------------------------------------------------------------------

      /** Values with an own colour in `Unterschiedliche Farben`; further values repeat the colours (ref). */
      export const COLOUR_DISTINCT_COUNT = 120;
      /** Steps of the colour scale (as ref SCALE_STEPS): position t is rounded to round(t * 24) / 24. */
      export const COLOUR_SCALE_STEPS = 24;
      const COLOUR_SCALE_MIN_STRENGTH = 0.12; // smallest value: 12 % of the scale colour on white (ref)
      /** Colouring modes with their German labels (REQ-005 colouring panel, DEC-15; ref L1574-1582). */
      export const COLOUR_MODES = [
        ["distinct", "Unterschiedliche Farben"],
        ["scale", "Farbskala"],
      ];
      /** Swatches of `Farbskala` with their German labels (DEC-15; ref SCALE_COLORS L233), lower-case hex. */
      export const SCALE_COLOURS = [
        ["#d72622", "Rot"],
        ["#1f6fd1", "Blau"],
        ["#2e9b4f", "Gr\u00fcn"],
        ["#e8890c", "Orange"],
        ["#7b3fb5", "Violett"],
        ["#4e5355", "Grau"],
      ];
      /** Mode and scale colour before the user chose any (DEC-15 "start: Unterschiedliche Farben, Rot"; ref L1533). */
      export const DEFAULT_COLOUR_MODE = "distinct";
      export const DEFAULT_SCALE_COLOUR = "#d72622";
      /** Scale colour of the 1.0.0 look (DEC-20: a configuration without colourMode and scaleColour). */
      export const LEGACY_SCALE_COLOUR = "#1f6fd1";
      /** Rows of the legend in the colouring panel before `+<n> weitere Werte` (REQ-005). */
      export const COLOUR_LEGEND_LIMIT = 200;
      /** Note of `Unterschiedliche Farben` with more than COLOUR_DISTINCT_COUNT values (REQ-005, DEC-15). */
      export const COLOUR_REPEAT_NOTE = "Mehr als 120 Werte: Farben wiederholen sich.";
      /** Grey of the empty value "(leer)" (both modes). */
      export const COLOUR_EMPTY = "#c4c7ca";
      /** Neutral colour of elements with several values ("mehrere Werte", both modes). */
      export const COLOUR_MULTI = "#6e6259";
      export const MULTI_LABEL = "mehrere Werte";

      const hex2 = (x) =>
        Math.round(Math.min(255, Math.max(0, x)))
          .toString(16)
          .padStart(2, "0");

      const HEX_COLOUR_RE = /^#[0-9a-fA-F]{6}$/;

      /** "#rrggbb" in lower case for a colour "#" + 6 hex digits (either case), else null (DEC-20 `scaleColour`). */
      export function normaliseHexColour(text) {
        return typeof text === "string" && HEX_COLOUR_RE.test(text) ? text.toLowerCase() : null;
      }

      /** sRGB hex of HSL (h, s, l in 0..1). */
      function hslHex(h, s, l) {
        const q = l < 0.5 ? l * (1 + s) : l + s - l * s;
        const p = 2 * l - q;
        const channel = (t) => {
          let x = t;
          if (x < 0) x += 1;
          if (x > 1) x -= 1;
          if (x < 1 / 6) return p + (q - p) * 6 * x;
          if (x < 1 / 2) return q;
          if (x < 2 / 3) return p + (q - p) * 6 * (2 / 3 - x);
          return p;
        };
        return "#" + hex2(channel(h + 1 / 3) * 255) + hex2(channel(h) * 255) + hex2(channel(h - 1 / 3) * 255);
      }

      /** Distinct colour of value number index: golden-angle hues, alternating lightness; repeats after 120 (ref). */
      export function distinctColour(index) {
        const i = index % COLOUR_DISTINCT_COUNT;
        return hslHex(((i * 137.508) % 360) / 360, 0.65, i % 2 ? 0.42 : 0.58);
      }

      /**
       * Scale colour for position t in [0, 1] (DEC-15, ref scaleHex): each channel = round(255 + (c - 255) * a) with
       * a = 0.12 + 0.88 * round(t * 24) / 24, so t = 0 is the 12 % tint of base on white and t = 1 is base itself.
       * base: "#rrggbb" (either case; anything else uses DEFAULT_SCALE_COLOUR).
       */
      export function scaleColour(base, t) {
        const hex = normaliseHexColour(base) || DEFAULT_SCALE_COLOUR;
        const position = Number.isFinite(t) ? Math.min(1, Math.max(0, t)) : 1;
        const amount =
          COLOUR_SCALE_MIN_STRENGTH +
          (1 - COLOUR_SCALE_MIN_STRENGTH) * (Math.round(position * COLOUR_SCALE_STEPS) / COLOUR_SCALE_STEPS);
        const n = parseInt(hex.slice(1), 16);
        return "#" + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((c) => hex2(255 + (c - 255) * amount)).join("");
      }

      /**
       * Colour scheme of property key over all rows of the store (REQ-005, DEC-15), stable while the row set is the
       * same (colours do not change when the filter changes, so legend and filter-set dots always agree). options:
       * { mode: 'distinct' | 'scale' (default DEFAULT_COLOUR_MODE), colour: scale colour "#rrggbb" (default
       * DEFAULT_SCALE_COLOUR) }. One entry per distinct non-empty value, in value order (compareValues, as the filter
       * sets): `distinct` gives value number i the golden-angle colour i (repeating after 120 values); `scale` places
       * numbers by value (t = (v - min) / (max - min); one value: t = 1) and other values (text, or text and numbers
       * mixed) by rank (t = rank / (n - 1)) on scaleColour(colour, t). A row with several distinct values gets
       * `mehrere Werte`, an empty row `(leer)`, in both modes. Returns { key, mode, colour, numeric, count (distinct
       * values), repeats (distinct mode with more than 120 values), gradient ({ from, to, first, last } in scale mode
       * with values, else null), entries [{ kind: 'value' | 'multi' | 'empty', label, colour, value? }], rowEntry(i),
       * rowColour(i), valueColour(value) }.
       */
      export function colourScheme(source, key, options) {
        const opts = options || {};
        const mode = opts.mode === "scale" ? "scale" : DEFAULT_COLOUR_MODE;
        const colour = normaliseHexColour(opts.colour) || DEFAULT_SCALE_COLOUR;
        const store = asStore(source);
        const col = store.column(key);
        const n = col.emptyCode; // distinct non-empty values, in compareValues order
        let numeric = n > 0;
        for (let c = 0; c < n && numeric; c++) if (typeof col.values[c] !== "number") numeric = false;
        const min = numeric ? col.values[0] : 0;
        const max = numeric ? col.values[n - 1] : 0;
        const position = (c) => {
          if (numeric) return max > min ? (col.values[c] - min) / (max - min) : 1;
          return n > 1 ? c / (n - 1) : 1;
        };
        const entries = [];
        for (let c = 0; c < n; c++) {
          const value = col.values[c];
          entries.push({
            kind: "value",
            value,
            colour: mode === "scale" ? scaleColour(colour, position(c)) : distinctColour(c),
            label: displayText(value),
          });
        }
        const multi = entries.length;
        entries.push({ kind: "multi", label: MULTI_LABEL, colour: COLOUR_MULTI });
        const empty = entries.length;
        entries.push({ kind: "empty", label: EMPTY_LABEL, colour: COLOUR_EMPTY });
        const rowEntry = (i) => {
          const s = col.start[i];
          if (col.start[i + 1] - s > 1) return multi;
          const code = col.flat[s];
          return code === col.emptyCode ? empty : code;
        };
        return {
          key,
          mode,
          colour,
          numeric,
          count: n,
          repeats: mode === "distinct" && n > COLOUR_DISTINCT_COUNT,
          gradient:
            mode === "scale" && n > 0
              ? {
                  from: scaleColour(colour, 0),
                  to: scaleColour(colour, 1),
                  first: entries[0].label,
                  last: entries[n - 1].label,
                }
              : null,
          entries,
          rowEntry,
          rowColour: (i) => entries[rowEntry(i)].colour,
          /** Colour of one value as listed in a filter set (null = "(leer)"); undefined for an unknown value. */
          valueColour(value) {
            if (value === null || value === undefined) return COLOUR_EMPTY;
            const code = col.index.get(value);
            return code === undefined || code === col.emptyCode ? undefined : entries[code].colour;
          },
        };
      }

      /**
       * Legend of a colour scheme over the rows at indices (the shown elements, REQ-005, DEC-15): the entries that
       * occur, in scheme order (`mehrere Werte` and `(leer)` last), each with its element count.
       */
      export function colourLegend(scheme, indices) {
        const counts = new Uint32Array(scheme.entries.length);
        for (const i of indices) counts[scheme.rowEntry(i)]++;
        const out = [];
        scheme.entries.forEach((entry, e) => {
          if (counts[e]) out.push({ ...entry, count: counts[e] });
        });
        return out;
      }

      /**
       * The legend rows the colouring panel lists (REQ-005): the first `limit` (COLOUR_LEGEND_LIMIT) entries and the
       * number of further entries for `+<n> weitere Werte` (0 = none).
       */
      export function legendRows(legend, limit) {
        const max = limit === undefined ? COLOUR_LEGEND_LIMIT : limit;
        return { rows: legend.slice(0, max), more: Math.max(0, legend.length - max) };
      }

      // ---------------------------------------------------------------------------------------------------------
      // Table (TASK-006a; REQ-006 single-element view: columns, cell text, column filters)
      // ---------------------------------------------------------------------------------------------------------

      /** Default columns of a new configuration (REQ-006). */
      export const DEFAULT_COLUMNS = ["Modell", "Kategorie", "Name", "Geschoss"];
      /** Column width limits and defaults in px (REQ-006 "column width adjustable"). */
      export const COLUMN_WIDTH = { min: 60, max: 800, text: 160, number: 150, name: 240 };

      /** Default width of a new column for its catalogue entry (numbers narrower, Name wider). */
      export function defaultColumnWidth(key, entry) {
        if (key === "Name") return COLUMN_WIDTH.name;
        return entry && entry.kind === "number" ? COLUMN_WIDTH.number : COLUMN_WIDTH.text;
      }

      /** A width clamped to COLUMN_WIDTH.min .. max (rounded px); NaN / missing -> fallback. */
      export function clampColumnWidth(width, fallback) {
        const w = Number(width);
        if (!Number.isFinite(w)) return fallback === undefined ? COLUMN_WIDTH.text : fallback;
        return Math.round(Math.min(COLUMN_WIDTH.max, Math.max(COLUMN_WIDTH.min, w)));
      }

      /**
       * Column list of the table (part of the configuration, REQ-006-AC6 / REQ-009): [{ key, width }] in display
       * order; duplicate or empty keys are dropped, widths clamped (missing width -> defaultColumnWidth).
       */
      export function normaliseColumns(list, catalog) {
        const seen = new Set();
        const out = [];
        for (const item of list || []) {
          const key = typeof item === "string" ? item : item && item.key;
          if (typeof key !== "string" || key === "" || seen.has(key)) continue;
          seen.add(key);
          const entry = catalog && catalog.get ? catalog.get(key) : undefined;
          const width = typeof item === "object" && item ? item.width : undefined;
          out.push({ key, width: clampColumnWidth(width, defaultColumnWidth(key, entry)) });
        }
        return out;
      }

      /** Moves the item at index from to index to (both clamped); returns a new array. */
      export function moveItem(list, from, to) {
        const out = list.slice();
        if (from < 0 || from >= out.length) return out;
        const [item] = out.splice(from, 1);
        out.splice(Math.max(0, Math.min(out.length, to)), 0, item);
        return out;
      }

      const CELL_FORMAT = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 3 });

      /**
       * Text of a table cell (REQ-006): numbers in German format (thousands ".", decimal ",", up to 3 decimals),
       * multi-values joined with ", " (REQ-002), empty values as "" (empty cells stay empty).
       */
      export function formatCell(value) {
        if (isEmptyValue(value)) return "";
        if (typeof value === "number") return CELL_FORMAT.format(value);
        if (Array.isArray(value)) {
          const parts = [];
          for (const v of value) if (!isEmptyValue(v)) parts.push(typeof v === "number" ? CELL_FORMAT.format(v) : String(v));
          return parts.join(", ");
        }
        return String(value);
      }

      /**
       * Parses a range bound typed by the user (REQ-006 numeric column filter, TASK-003 D2): German decimal comma
       * ("2,5", "-0,75", "1.234,5" with thousands dots) or a decimal point ("2.5"); surrounding blanks are ignored.
       * Returns { value: number | null, valid }: empty text is { value: null, valid: true } (no bound), text that is
       * no number is { value: null, valid: false }.
       */
      export function parseNumberInput(text) {
        const s = text === null || text === undefined ? "" : String(text).trim();
        if (s === "") return { value: null, valid: true };
        let normal = null;
        if (/^[+-]?\d{1,3}(\.\d{3})+,\d*$/.test(s)) normal = s.replace(/\./g, "").replace(",", ".");
        else if (/^[+-]?(\d+([.,]\d*)?|[.,]\d+)$/.test(s)) normal = s.replace(",", ".");
        if (normal === null) return { value: null, valid: false };
        const value = Number(normal.replace(/\.$/, ""));
        return Number.isFinite(value) ? { value, valid: true } : { value: null, valid: false };
      }

      /**
       * The values of a selection that still occur in the column of key (REQ-001-AC3: after a model is removed,
       * filters on remaining values stay active, values that no element has any more are dropped); null (the empty
       * value) stays while some row is empty.
       */
      export function pruneSelection(source, key, values) {
        const col = asStore(source).column(key);
        const out = [];
        for (const v of values || []) {
          const value = v === undefined ? null : v;
          if (value === null ? col.empties : col.index.get(value) !== undefined) out.push(value);
        }
        return out;
      }

      /**
       * Smallest and largest number of a numeric column among the rows of a bitset (rows passing the other filters),
       * or null (shown as a hint next to the range inputs of a numeric column filter).
       */
      export function numberRange(source, key, bits) {
        const col = asStore(source).column(key);
        let min = Infinity;
        let max = -Infinity;
        for (let i = 0; i < col.n; i++) {
          if (bits && !(bits[i >>> 5] & (1 << (i & 31)))) continue;
          const v = col.nums[i];
          if (v < min) min = v;
          if (v > max) max = v;
        }
        return min <= max ? { min, max } : null;
      }

      // ---------------------------------------------------------------------------------------------------------
      // Grouping view (TASK-006b; REQ-006 grouping view, DEC-16, ASM-008)
      // ---------------------------------------------------------------------------------------------------------

      /** Grouping levels at most (spec 3: more than two levels are out of scope). */
      export const GROUP_LEVELS = 2;

      /** Identity token of a group value: numbers and texts never collide; null (empty) has its own token. */
      function groupToken(value) {
        if (value === null || value === undefined) return "~";
        return (typeof value === "number" ? "#" : "$") + String(value);
      }

      /** Comparable token of a cell for "same value in every element" (multi-values as displayed, empty = ""). */
      function sameToken(value) {
        if (isEmptyValue(value)) return "";
        if (typeof value === "number") return "#" + value;
        if (Array.isArray(value)) {
          const parts = [];
          for (const v of value) if (!isEmptyValue(v)) parts.push(typeof v === "number" ? "#" + v : "$" + v);
          return parts.length ? "[" + parts.join("\u0001") : "";
        }
        return "$" + value;
      }

      /** Sum of the numbers of key over the rows (Neumaier summation); null if no row has a number. */
      function sumOf(rows, list, key) {
        let sum = 0;
        let comp = 0;
        let any = false;
        for (let p = 0; p < list.length; p++) {
          const v = rows[list[p]].values[key];
          if (typeof v !== "number" || !Number.isFinite(v)) continue;
          any = true;
          const t = sum + v;
          comp += Math.abs(sum) >= Math.abs(v) ? sum - t + v : v - t + sum;
          sum = t;
        }
        return any ? sum + comp : null;
      }

      /** The value of key if every row has the same one (multi-values compared as displayed), else null. */
      function sameOf(rows, list, key) {
        if (!list.length) return null;
        const first = rows[list[0]].values[key];
        const token = sameToken(first);
        if (token === "") return null;
        for (let p = 1; p < list.length; p++) if (sameToken(rows[list[p]].values[key]) !== token) return null;
        return first;
      }

      /** Aggregated cells of a list of rows: { key -> sum (mode 'sum') | common value (mode 'same') | null }. */
      function groupCells(rows, list, columns, textToo) {
        const cells = {};
        for (const c of columns) {
          if (c.mode === "sum") cells[c.key] = sumOf(rows, list, c.key);
          else if (c.mode === "same" && textToo) cells[c.key] = sameOf(rows, list, c.key);
          else cells[c.key] = null;
        }
        return cells;
      }

      /** Splits list (row indices, kept in their order) by the values of col: [{ code, indices }] in code order. */
      function bucketBy(col, list) {
        const buckets = new Map();
        const { start, flat } = col;
        for (let p = 0; p < list.length; p++) {
          const i = list[p];
          for (let j = start[i]; j < start[i + 1]; j++) {
            const code = flat[j];
            let bucket = buckets.get(code);
            if (!bucket) {
              bucket = [];
              buckets.set(code, bucket);
            }
            bucket.push(i);
          }
        }
        return [...buckets.keys()].sort((a, b) => a - b).map((code) => ({ code, indices: buckets.get(code) }));
      }

      function buildGroups(store, list, levels, depth, parentId, columns, sort) {
        const col = store.column(levels[depth]);
        const rows = store.rows;
        let groups = bucketBy(col, list).map(({ code, indices }) => {
          const value = col.values[code];
          const id = (parentId === null ? "" : parentId + "\u001f") + groupToken(value);
          const group = {
            id,
            level: depth + 1,
            key: levels[depth],
            value,
            count: indices.length,
            cells: groupCells(rows, indices, columns, true),
            indices: Uint32Array.from(indices),
            children: null,
          };
          if (depth + 1 < levels.length)
            group.children = buildGroups(store, group.indices, levels, depth + 1, id, columns, sort);
          return group;
        });
        if (sort && sort.key) {
          // groups by their cell of the sort column (sums, common text); "(leer)" stays last (REQ-006-AC5)
          const empty = groups.filter((g) => g.value === null);
          const named = groups.filter((g) => g.value !== null);
          groups = sortByValue(named, (g) => g.cells[sort.key], sort.dir).concat(empty);
        }
        return groups;
      }

      /**
       * Grouping view of the table (REQ-006, DEC-16, ASM-008). source: column store (or rows); indices: the rows
       * passing all filters in table order (sortRows); options: { levels: [key1, key2?] (one or two grouping
       * properties), columns: [{ key, mode: 'sum' | 'same' | 'none' }] (numeric columns sum, text columns show a value
       * equal in every element of the group, else null; 'none' e.g. numbers with mixed units), sort: { key, dir } |
       * null }.
       * Returns { levels, groups, total }: groups [{ id, level (1 | 2), key, value (null = "(leer)"), count, cells
       * { key -> value | null }, indices (rows of the group in table order), children (level-2 groups) | null }];
       * groups are in value order ("(leer)" last) or, with a sort, ordered by their cell of the sort column (empty
       * last, "(leer)" still last). An element with several values of a grouping property is in each of its groups
       * and counted and summed there; total { count, cells } counts and sums every element once (sums only).
       */
      export function groupRows(source, indices, options) {
        const store = asStore(source);
        const opts = options || {};
        const levels = (opts.levels || []).filter((k) => typeof k === "string" && k !== "").slice(0, GROUP_LEVELS);
        const columns = opts.columns || [];
        const list = indices || new Uint32Array(0);
        const groups = levels.length ? buildGroups(store, list, levels, 0, null, columns, opts.sort || null) : [];
        return {
          levels,
          groups,
